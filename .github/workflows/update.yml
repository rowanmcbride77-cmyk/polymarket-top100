
name: Update Polymarket Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "update.mjs"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: polymarket-scanner-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scanner update
        run: node update.mjs

      - name: Validate JSON and file sizes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";

          for (const file of ["week.json", "month.json"]) {
            const stat = await fs.stat(file);
            if (stat.size > 5 * 1024 * 1024) {
              throw new Error(`${file} exceeds 5 MB`);
            }

            JSON.parse(await fs.readFile(file, "utf8"));
            console.log(`${file}: ${(stat.size / 1024 / 1024).toFixed(2)} MB; valid JSON`);
          }
          NODE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add week.json month.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Polymarket scanner data"

            # Another workflow or website edit may have pushed to main
            # while this run was generating data. Rebase this data commit
            # onto the latest main; if the JSON files conflict, keep the
            # freshly generated scanner output from this run.
            git fetch origin main
            if ! git rebase origin/main; then
              if git status --porcelain | grep -Eq 'week\\.json|month\\.json'; then
                git checkout --theirs -- week.json month.json
                git add week.json month.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi

            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
