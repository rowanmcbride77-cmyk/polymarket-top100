
name: Update Polymarket Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "update.mjs"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: polymarket-scanner-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scanner update
        run: node update.mjs

      - name: Validate JSON and file sizes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";

          for (const file of ["week.json", "month.json"]) {
            const stat = await fs.stat(file);
            if (stat.size > 5 * 1024 * 1024) {
              throw new Error(`${file} exceeds 5 MB`);
            }

            JSON.parse(await fs.readFile(file, "utf8"));
            console.log(`${file}: ${(stat.size / 1024 / 1024).toFixed(2)} MB; valid JSON`);
          }
          NODE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's generated files, sync to latest main, then
          # apply only the generated data files on top of the current branch.
          cp week.json /tmp/scanner-week.json
          cp month.json /tmp/scanner-month.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/scanner-week.json week.json
          cp /tmp/scanner-month.json month.json

          git add week.json month.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Polymarket scanner data"
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
