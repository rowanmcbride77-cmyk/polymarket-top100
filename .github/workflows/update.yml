name: Update Polymarket Scanner
# Keep full scans running long enough to finish the 20k-wallet discovery pass.
# Queue later updates rather than cancelling an in-progress data build.

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update.mjs"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: polymarket-scanner-update-v12
  # Never cancel an active 20k-wallet scan when a newer commit is pushed; run the latest validated patch next.
  # GitHub queues the latest update and publishes only after validation.
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The previous 35-minute limit was shorter than the observed ~55-minute
    # scan and was directly causing GitHub to cancel valid runs.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check scanner JavaScript syntax
        run: node --check update.mjs

      - name: Check dashboard JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const html = await fs.readFile("index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("index.html has no script block");
          for (const match of scripts) new Function(match[1]);
          console.log(`Checked ${scripts.length} dashboard script block(s).`);
          NODE

      - name: Run scanner update
        run: node update.mjs

      - name: Stamp data with actual publication time
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const files = ["week.json", "month.json", "consensus-week.json", "consensus-month.json"];
          const generatedAt = new Date().toISOString();
          for (const file of files) {
            const data = JSON.parse(await fs.readFile(file, "utf8"));
            data.scanStartedAt = data.generatedAt || null;
            data.generatedAt = generatedAt;
            await fs.writeFile(file, JSON.stringify(data) + "\n");
          }
          console.log(`Stamped all four datasets with completion time ${generatedAt}.`);
          NODE

      - name: Validate JSON and file sizes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const generatedAtValues = new Set();

          for (const file of ["week.json", "month.json", "consensus-week.json", "consensus-month.json"]) {
            const stat = await fs.stat(file);
            if (stat.size === 0) throw new Error(`${file} is empty`);
            if (stat.size > 20 * 1024 * 1024) throw new Error(`${file} exceeds 20 MB`);
            const parsed = JSON.parse(await fs.readFile(file, "utf8"));
            if (!parsed || typeof parsed !== "object" || !parsed.generatedAt || !Number.isFinite(Date.parse(parsed.generatedAt))) {
              throw new Error(`${file} has missing or invalid generatedAt metadata`);
            }
            generatedAtValues.add(parsed.generatedAt);
            if (file === "week.json" || file === "month.json") {
              const leaders = Array.isArray(parsed.leaders) ? parsed.leaders : [];
              if (leaders.length > 100) throw new Error(`${file} exceeds the 100-leader publication cap`);
              const wallets = new Set(leaders.map(row => String(row.wallet || "").toLowerCase()).filter(Boolean));
              if (wallets.size !== leaders.length) throw new Error(`${file} has duplicate or missing wallets`);
              const invalid = leaders.filter(row => {
                if (!row.wallet || row.pnl === null || row.pnl === undefined || !Number.isFinite(Number(row.pnl))) return true;
                const wins = Number(row.wins), losses = Number(row.losses);
                const resolved = Number(row.resolvedMarkets), rate = Number(row.winRate);
                const verified = row.settlementRecordComplete === true && row.recordComplete === true && row.recordVerified === true;
                const leakedProxyFields = ["sportsWins", "sportsLosses", "sportsWinRate", "sportsResolvedMarkets",
                  "periodWins", "periodLosses", "periodResolvedMarkets", "periodWinRate"]
                  .some(key => row[key] !== null && row[key] !== undefined);
                if (leakedProxyFields) return true;
                if (!verified) {
                  return row.wins !== null || row.losses !== null || row.winRate !== null || row.resolvedMarkets !== null;
                }
                return !Number.isFinite(wins) || wins < 0 || !Number.isFinite(losses) || losses < 0 ||
                  !Number.isFinite(resolved) || resolved !== wins + losses || resolved <= 0 ||
                  !Number.isFinite(rate) || Math.abs(rate - wins / resolved * 100) > 1e-6 ||
                  Number(row.settlementPositionsUnclassified) !== 0 ||
                  !String(row.recordBasis || "").toLowerCase().includes("settlement");
              });
              if (leaders.length === 0) throw new Error(`${file}: Top 100 leaderboard is empty; refusing to publish an empty trader table`);
              if (invalid.length) throw new Error(`${file}: ${invalid.length} leaderboard rows have invalid P&L or expose unverified settlement stats`);
              console.log(`${file}: ${leaders.length} selected-period leaderboard traders`);
              const discoveryRows = [
                ...(Array.isArray(parsed.sportsLeaders) ? parsed.sportsLeaders : []),
                ...(Array.isArray(parsed.comboCandidates) ? parsed.comboCandidates : [])
              ];
              const proxyFields = ["wins", "losses", "winRate", "resolvedMarkets", "sportsWins", "sportsLosses", "sportsWinRate", "sportsResolvedMarkets"];
              const leaked = discoveryRows.filter(row => proxyFields.some(key => row[key] !== null && row[key] !== undefined));
              if (leaked.length) throw new Error(`${file} exposes close-profitability proxies in sports/combo discovery W/L fields (${leaked.length} rows)`);
              const unlabeledRealizedPnl = discoveryRows.filter(row =>
                row.realizedPnlTotal !== null && row.realizedPnlTotal !== undefined &&
                !String(row.realizedPnlBasis || "").toLowerCase().includes("includes early exits")
              );
              if (unlabeledRealizedPnl.length) throw new Error(`${file} exposes realized close P&L without an early-exit disclosure (${unlabeledRealizedPnl.length} rows)`);
            }
            if (file === "consensus-week.json" || file === "consensus-month.json") {
              const groups = Array.isArray(parsed.consensus) ? parsed.consensus : [];
              if (groups.length === 0) throw new Error(`${file}: consensus is empty; refusing to replace the last known-good signals`);
              const seenConditions = new Set();
              const invalid = groups.filter(group => {
                const traders = Array.isArray(group.traders) ? group.traders : [];
                const wallets = new Set(traders.map(row => String(row.wallet || "").toLowerCase()).filter(Boolean));
                const tier = String(group.signalTier || "");
                const strong = tier === "Strong Signals";
                const validTier = strong;
                const condition = String(group.conditionId || "").trim().toLowerCase();
                const side = String(group.side || "").trim().toLowerCase();
                const duplicateCondition = !condition || seenConditions.has(condition);
                const mixedSide = traders.some(row => String(row.side || "").trim().toLowerCase() !== side);
                if (condition) seenConditions.add(condition);
                const invalidTrader = traders.some(row => {
                  const value = Number(row.currentValue);
                  if (!Number.isFinite(value) || value <= 0) return true;
                  if (tier !== "Watchlist" && value < 3) return true;
                  if (!strong) return false;
                  const wins = Number(row.wins), losses = Number(row.losses), resolved = Number(row.resolvedMarkets);
                  const rate = Number(row.winRate), shares = Number(row.shares ?? row.size);
                  const checked = Number(row.settlementPositionsChecked), unclassified = Number(row.settlementPositionsUnclassified);
                  const realizedPnl = Number(row.realizedPnlTotal);
                  const realizedBasis = String(row.realizedPnlBasis || "").toLowerCase();
                  const leakedPeriodProxy = ["periodWins", "periodLosses", "periodResolvedMarkets", "periodWinRate"]
                    .some(key => row[key] !== null && row[key] !== undefined);
                  return row.qualified !== true || row.recordComplete !== true || row.settlementRecordComplete !== true ||
                    !Number.isFinite(checked) || checked <= 0 || !Number.isFinite(unclassified) || unclassified !== 0 ||
                    !Number.isFinite(wins) || wins < 0 || !Number.isFinite(losses) || losses < 0 ||
                    !Number.isFinite(resolved) || resolved !== wins + losses || resolved < 20 ||
                    !Number.isFinite(rate) || rate < 90 || Math.abs(rate - wins / resolved * 100) > 1e-6 ||
                    !Number.isFinite(realizedPnl) || realizedPnl <= 0 ||
                    !realizedBasis.includes("may include early exits") ||
                    !realizedBasis.includes("separate") ||
                    !realizedBasis.includes("never settlement accuracy") ||
                    leakedPeriodProxy ||
                    !String(row.recordBasis || "").toLowerCase().includes("settlement-only") ||
                    String(row.side || "").trim().toLowerCase() !== side ||
                    !Number.isFinite(Number(row.avgPrice)) || Number(row.avgPrice) <= 0 || Number(row.avgPrice) > 1 ||
                    !Number.isFinite(shares) || shares <= 0 ||
                    !Number.isFinite(Number(row.entryValue)) || Number(row.entryValue) < 10 || value < 10;
                });
                const end = group.endDate ?? group.end_date ?? null;
                let endMs = end ? Date.parse(String(end)) : NaN;
                if (typeof end === "string" && /^\d{4}-\d{2}-\d{2}$/.test(end)) endMs = Date.parse(end + "T23:59:59.999Z");
                const hasEnd = end !== null && end !== undefined && String(end).trim() !== "";
                return duplicateCondition || !side || !validTier || group.marketMetadataVerified !== true || group.marketClosed !== false ||
                  !hasEnd || !Number.isFinite(endMs) || wallets.size < 2 || wallets.size !== traders.length ||
                  !Number.isFinite(Number(group.sameSide)) || Number(group.sameSide) !== traders.length || mixedSide || invalidTrader;
              });
              if (invalid.length) throw new Error(`${file} contains ${invalid.length} invalid consensus groups`);
              console.log(`${file}: ${groups.length} validated consensus groups`);
            }
            console.log(`${file}: ${(stat.size / 1024 / 1024).toFixed(2)} MB; valid JSON`);
          }
          if (generatedAtValues.size !== 1) throw new Error(`The four generated JSON files have mismatched generatedAt values: ${[...generatedAtValues].join(", ")}`);
          const generatedAtMs = Date.parse([...generatedAtValues][0]);
          if (Date.now() - generatedAtMs > 4 * 60 * 60 * 1000 || generatedAtMs > Date.now() + 5 * 60 * 1000) {
            throw new Error(`Generated JSON is stale or future-dated: ${new Date(generatedAtMs).toISOString()}`);
          }
          console.log(`All four JSON files share fresh generatedAt ${new Date(generatedAtMs).toISOString()}.`);
          NODE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp week.json /tmp/scanner-week.json
          cp month.json /tmp/scanner-month.json
          cp consensus-week.json /tmp/scanner-consensus-week.json
          cp consensus-month.json /tmp/scanner-consensus-month.json
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const files = ["week.json", "month.json", "consensus-week.json", "consensus-month.json"];
          const docs = await Promise.all(files.map(async file => JSON.parse(await fs.readFile(file, "utf8"))));
          const stamps = docs.map(doc => doc.generatedAt);
          if (!stamps.every(value => value === stamps[0])) throw new Error("Cannot publish status: generatedAt values differ");
          const status = {startedAt: stamps[0], finishedAt: new Date().toISOString(), ok: true, errors: [], weekLeaders: docs[0].leaders?.length ?? 0, monthLeaders: docs[1].leaders?.length ?? 0, consensusMarkets: docs[2].consensus?.length ?? 0, recordBasis: "Settlement-only: positions exited before actual market resolution are excluded from wins, losses, win rates, and qualification. Incomplete settlement histories are withheld."};
          await fs.writeFile("status.json", JSON.stringify(status, null, 2) + "\n");
          NODE
          cp status.json /tmp/scanner-status.json
          git fetch origin main
          # Other workflows may update forward-test.json while this scan runs.
          # The generatedAt comparison below is the authoritative stale-scan guard;
          # unrelated commits must not prevent fresh scanner data from publishing.
          FRESHNESS="$(node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          const generated = JSON.parse(await fs.readFile("/tmp/scanner-consensus-week.json", "utf8"));
          const published = JSON.parse(execFileSync("git", ["show", "origin/main:consensus-week.json"], {encoding:"utf8", maxBuffer:64*1024*1024}));
          const a = Date.parse(generated.generatedAt || ""), b = Date.parse(published.generatedAt || "");
          if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error("Invalid publication timestamps");
          console.log(b >= a ? "stale" : "fresh");
          NODE
          )"
          if [ "$FRESHNESS" = "stale" ]; then
            echo "Skipping stale scan; newer data is already published."
            exit 0
          fi
          if [ "$FRESHNESS" != "fresh" ]; then exit 1; fi
          git reset --hard origin/main
          cp /tmp/scanner-week.json week.json
          cp /tmp/scanner-month.json month.json
          cp /tmp/scanner-consensus-week.json consensus-week.json
          cp /tmp/scanner-consensus-month.json consensus-month.json
          cp /tmp/scanner-status.json status.json
          git add week.json month.json consensus-week.json consensus-month.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Polymarket scanner data"
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
