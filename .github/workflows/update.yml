name: Update Polymarket Scanner
# Keep full scans running long enough to finish the 20k-wallet discovery pass.
# Queue later updates rather than cancelling an in-progress data build.

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update.mjs"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: polymarket-scanner-update-v9
  # A new push or scheduled trigger must not kill a scan halfway through.
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The previous 35-minute limit was shorter than the observed ~55-minute
    # scan and was directly causing GitHub to cancel valid runs.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check scanner JavaScript syntax
        run: node --check update.mjs

      - name: Check dashboard JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const html = await fs.readFile("index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("index.html has no script block");
          for (const match of scripts) new Function(match[1]);
          console.log(`Checked ${scripts.length} dashboard script block(s).`);
          NODE

      - name: Run scanner update
        run: node update.mjs

      - name: Validate JSON and file sizes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";

          for (const file of ["week.json", "month.json", "consensus-week.json", "consensus-month.json"]) {
            const stat = await fs.stat(file);
            if (stat.size === 0) throw new Error(`${file} is empty`);
            if (stat.size > 20 * 1024 * 1024) throw new Error(`${file} exceeds 20 MB`);
            const parsed = JSON.parse(await fs.readFile(file, "utf8"));
            if (!parsed || typeof parsed !== "object" || !parsed.generatedAt || !Number.isFinite(Date.parse(parsed.generatedAt))) {
              throw new Error(`${file} has missing or invalid generatedAt metadata`);
            }
            if (file === "week.json" || file === "month.json") {
              const leaders = Array.isArray(parsed.leaders) ? parsed.leaders : [];
              if (leaders.length > 1000) throw new Error(`${file} exceeds 1,000 leaders`);
              const wallets = new Set(leaders.map(row => String(row.wallet || "").toLowerCase()).filter(Boolean));
              if (wallets.size !== leaders.length) throw new Error(`${file} has duplicate or missing wallets`);
              const invalid = leaders.filter(row =>
                !row.wallet || !Number.isFinite(Number(row.pnl)) ||
                row.recordComplete !== true ||
                !Number.isFinite(Number(row.resolvedMarkets)) || Number(row.resolvedMarkets) < 20 ||
                !Number.isFinite(Number(row.winRate)) || Number(row.winRate) < 90 ||
                !Number.isFinite(Number(row.realizedPnlTotal)) || Number(row.realizedPnlTotal) <= 0
              );
              if (!leaders.length || invalid.length) throw new Error(`${file}: ${invalid.length} rows fail the complete 30-day / 20+ / 90%+ / positive-P&L gate`);
              console.log(`${file}: ${leaders.length} qualified leaders`);
            }
            if (file === "consensus-week.json" || file === "consensus-month.json") {
              const groups = Array.isArray(parsed.consensus) ? parsed.consensus : [];
              const invalid = groups.filter(group => {
                const traders = Array.isArray(group.traders) ? group.traders : [];
                const wallets = new Set(traders.map(row => String(row.wallet || "").toLowerCase()).filter(Boolean));
                const tier = String(group.signalTier || "");
                const strong = tier === "Strong Signals";
                const validTier = ["Strong Signals", "Developing Signals", "Watchlist"].includes(tier);
                const invalidTrader = traders.some(row => {
                  const value = Number(row.currentValue);
                  if (!Number.isFinite(value) || value <= 0) return true;
                  if (tier !== "Watchlist" && value < 3) return true;
                  if (!strong) return false;
                  const wins = Number(row.wins), losses = Number(row.losses), resolved = Number(row.resolvedMarkets);
                  const rate = Number(row.winRate), shares = Number(row.shares ?? row.size);
                  return row.qualified !== true || row.recordComplete !== true ||
                    !Number.isFinite(wins) || !Number.isFinite(losses) ||
                    !Number.isFinite(resolved) || resolved !== wins + losses || resolved < 20 ||
                    !Number.isFinite(rate) || rate < 90 ||
                    !Number.isFinite(Number(row.avgPrice)) || Number(row.avgPrice) <= 0 || Number(row.avgPrice) > 1 ||
                    !Number.isFinite(shares) || shares <= 0 ||
                    !Number.isFinite(Number(row.entryValue)) || Number(row.entryValue) < 10 || value < 10;
                });
                const end = group.endDate ?? group.end_date ?? null;
                let endMs = end ? Date.parse(String(end)) : NaN;
                if (typeof end === "string" && /^\d{4}-\d{2}-\d{2}$/.test(end)) endMs = Date.parse(end + "T23:59:59.999Z");
                const hasEnd = end !== null && end !== undefined && String(end).trim() !== "";
                return !validTier || group.marketMetadataVerified !== true || group.marketClosed !== false ||
                  (hasEnd && !Number.isFinite(endMs)) || wallets.size < 2 || wallets.size !== traders.length ||
                  !Number.isFinite(Number(group.sameSide)) || Number(group.sameSide) < traders.length || invalidTrader;
              });
              if (invalid.length) throw new Error(`${file} contains ${invalid.length} invalid consensus groups`);
              console.log(`${file}: ${groups.length} validated consensus groups`);
            }
            console.log(`${file}: ${(stat.size / 1024 / 1024).toFixed(2)} MB; valid JSON`);
          }
          NODE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp week.json /tmp/scanner-week.json
          cp month.json /tmp/scanner-month.json
          cp consensus-week.json /tmp/scanner-consensus-week.json
          cp consensus-month.json /tmp/scanner-consensus-month.json
          git fetch origin main
          FRESHNESS="$(node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          const generated = JSON.parse(await fs.readFile("/tmp/scanner-consensus-week.json", "utf8"));
          const published = JSON.parse(execFileSync("git", ["show", "origin/main:consensus-week.json"], {encoding:"utf8", maxBuffer:64*1024*1024}));
          const a = Date.parse(generated.generatedAt || ""), b = Date.parse(published.generatedAt || "");
          if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error("Invalid publication timestamps");
          console.log(b >= a ? "stale" : "fresh");
          NODE
          )"
          if [ "$FRESHNESS" = "stale" ]; then
            echo "Skipping stale scan; newer data is already published."
            exit 0
          fi
          if [ "$FRESHNESS" != "fresh" ]; then exit 1; fi
          git reset --hard origin/main
          cp /tmp/scanner-week.json week.json
          cp /tmp/scanner-month.json month.json
          cp /tmp/scanner-consensus-week.json consensus-week.json
          cp /tmp/scanner-consensus-month.json consensus-month.json
          git add week.json month.json consensus-week.json consensus-month.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Polymarket scanner data"
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
