
name: Update Polymarket tracker data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: polymarket-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run updater
        run: node update.mjs

      - name: Validate JSON output
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          for (const file of ["week.json", "month.json"]) {
            if (!fs.existsSync(file)) throw new Error(`${file} is missing`);

            const size = fs.statSync(file).size;
            console.log(`${file}: ${(size / 1024 / 1024).toFixed(2)} MB`);

            if (size > 5 * 1024 * 1024) {
              throw new Error(`${file} exceeds 5 MB`);
            }

            const data = JSON.parse(fs.readFileSync(file, "utf8"));

            for (const key of ["leaders", "consensus", "traderActiveTrades"]) {
              if (!data[key] || typeof data[key] !== "object") {
                throw new Error(`${file} is missing ${key}`);
              }
            }
          }
          NODE

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add week.json month.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Polymarket tracker data"
          git push origin HEAD:main
