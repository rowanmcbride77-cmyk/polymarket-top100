name: Scanner branch validation

on:
  pull_request:
    branches: [main]
    paths:
      - "update.mjs"
      - "forward-test.mjs"
      - ".github/workflows/forward-test.yml"
      - ".github/workflows/scanner-branch-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check update.mjs
          node --check forward-test.mjs
      - name: Smoke-test Gamma sports metadata and league tags
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://gamma-api.polymarket.com/sports");
          if (!response.ok) throw new Error("Gamma /sports returned HTTP " + response.status);
          const rows = await response.json();
          if (!Array.isArray(rows) || !rows.length) throw new Error("Gamma /sports returned no metadata");
          const wanted = [
            ["NFL", /^(nfl|american.?football|football)(?:\b|$)/i],
            ["NBA", /^(nba|basketball)(?:\b|$)/i],
            ["MLB", /^(mlb|baseball)(?:\b|$)/i],
            ["NHL", /^(nhl|hockey|ice.?hockey)(?:\b|$)/i]
          ];
          const found = [];
          for (const [label, pattern] of wanted) {
            const row = rows.find(item => pattern.test(String(item.sport || item.league || item.name || "")));
            if (!row) continue;
            const tags = (Array.isArray(row.tags) ? row.tags : String(row.tags || "").split(","))
              .map(value => String(typeof value === "object" ? (value.id ?? value.tag_id ?? "") : value).trim())
              .filter(value => /^\\d+$/.test(value));
            if (!tags.length) continue;
            const q = new URLSearchParams({tag_id: tags[0], active: "true", closed: "false", limit: "10"});
            const marketResponse = await fetch("https://gamma-api.polymarket.com/markets?" + q);
            if (!marketResponse.ok) throw new Error(label + " tag query returned HTTP " + marketResponse.status);
            const markets = await marketResponse.json();
            if (!Array.isArray(markets)) throw new Error(label + " tag query returned a non-array payload");
            found.push({sport: label, tag: tags[0], sampleMarkets: markets.length});
          }
          if (found.length < 2) throw new Error("Expected at least two major sport families with usable tag IDs; found " + found.length);
          console.log("Gamma sports tag smoke test:", JSON.stringify(found));
          NODE
      - name: Check critical scanner safeguards
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const scanner = await fs.readFile("update.mjs", "utf8");
          const paper = await fs.readFile("forward-test.mjs", "utf8");
          const requiredScanner = [
            "getDirectSportsConsensusGroups",
            "${GAMMA_API}/sports",
            "MIN_CONSENSUS_WIN_RATE = 90",
            "MIN_CONSENSUS_CLOSED_MARKETS = 10"
          ];
          for (const item of requiredScanner) {
            if (!scanner.includes(item)) throw new Error("Missing scanner safeguard: " + item);
          }
          if (scanner.includes("getDirectNbaConsensusGroups")) {
            throw new Error("NBA-only market discovery remains in scanner");
          }
          if (!paper.includes("const recentWallets = wallets")) {
            throw new Error("Forward-test recentWallets regression");
          }
          if (!paper.includes('g.signalTier !== "Strong Signals"')) {
            throw new Error("Forward test is not restricted to Strong Signals");
          }
          console.log("Cross-sport discovery, strict 90%/10-close gate, and paper-test wallet checks passed.");
          NODE
