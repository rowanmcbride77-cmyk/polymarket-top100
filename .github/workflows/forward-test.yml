name: Forward-test consensus signals

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "forward-test.mjs"
      - ".github/workflows/forward-test.yml"

permissions:
  contents: write

concurrency:
  group: polymarket-forward-test
  cancel-in-progress: false

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run forward test
        run: node forward-test.mjs
      - name: Validate and commit tracker
        run: |
          set -e
          node -e 'const d=require("./forward-test.json"); if(!d.generatedAt||!Array.isArray(d.signals)||!d.metrics) process.exit(1); console.log(JSON.stringify(d.metrics))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward-test.json
          if git diff --cached --quiet; then echo "No forward-test changes."; exit 0; fi
          git commit -m "Update consensus forward paper test"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            fi
            git rebase --abort || true
            git reset --hard origin/main
            node forward-test.mjs
            node -e 'const d=require("./forward-test.json"); if(!d.generatedAt||!Array.isArray(d.signals)||!d.metrics) process.exit(1); console.log(JSON.stringify(d.metrics))'
            git add forward-test.json
            git commit -m "Update consensus forward paper test (retry $attempt)"
          done
          echo "Could not push forward-test data after three attempts."
          exit 1
