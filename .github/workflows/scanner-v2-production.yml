name: Scanner v3 production scan

on:
  push:
    branches: [main]
    paths:
      - "scanner-v2/**"
      - ".github/workflows/scanner-v2-production.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: polymarket-scanner-v3
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run scanner unit tests
        run: node --test scanner-v2/*.test.js
      - name: Run scanner v3
        env:
          DISCOVERY_LIMIT: "20000"
          DISCOVERY_MAX_PAGES: "1000"
          QUALIFICATION_AUDIT_LIMIT: "1000"
          AUDIT_CONCURRENCY: "4"
        run: node scanner-v2/run.js
      - name: Validate generated JSON
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const files = ["week.json", "month.json", "consensus-week.json", "consensus-month.json"];
          const docs = Object.fromEntries(await Promise.all(files.map(async file => [file, JSON.parse(await fs.readFile(file, "utf8"))])));
          const status = JSON.parse(await fs.readFile("status.json", "utf8"));
          if (status.ok !== true || status.scannerVersion !== "v3") throw new Error("Scanner status is not successful v3 output.");
          const stamps = new Set(files.map(file => docs[file].generatedAt));
          if (stamps.size !== 1 || !Number.isFinite(Date.parse([...stamps][0]))) throw new Error("Output timestamps do not match.");
          for (const file of ["week.json", "month.json"]) {
            const leaders = docs[file].leaders;
            if (!Array.isArray(leaders) || leaders.length === 0 || leaders.length > 100) throw new Error(file + " must contain 1-100 qualified leaders.");
            const wallets = new Set();
            for (const row of leaders) {
              const wallet = String(row.wallet || "").toLowerCase();
              const wins = Number(row.wins), losses = Number(row.losses), resolved = Number(row.resolvedMarkets), rate = Number(row.winRate);
              if (!wallet || wallets.has(wallet)) throw new Error(file + " has duplicate/missing wallets.");
              wallets.add(wallet);
              if (row.qualified !== true || row.complete !== true || row.recordComplete !== true || row.settlementRecordComplete !== true ||
                  !Number.isInteger(wins) || wins < 0 || !Number.isInteger(losses) || losses < 0 ||
                  resolved !== wins + losses || resolved < 20 || rate < 90 || Math.abs(rate - wins / resolved * 100) > 1e-6 ||
                  !String(row.recordBasis || "").toLowerCase().includes("settlement-only") ||
                  !String(row.recordBasis || "").toLowerCase().includes("excluded") ||
                  !Number.isFinite(Number(row.selectedPeriodPnl))) throw new Error(file + " contains an invalid settlement-only trader.");
            }
          }
          for (const file of ["consensus-week.json", "consensus-month.json"]) {
            const groups = docs[file].consensus;
            if (!Array.isArray(groups) || groups.length === 0) throw new Error(file + " has no signals; preserving prior publication.");
            const seen = new Set();
            for (const group of groups) {
              const condition = String(group.conditionId || "").toLowerCase();
              const traders = Array.isArray(group.traders) ? group.traders : [];
              if (!condition || seen.has(condition) || group.marketMetadataVerified !== true || group.marketClosed !== false ||
                  !Number.isFinite(Date.parse(group.endDate)) || Date.parse(group.endDate) <= Date.now() ||
                  Date.parse(group.endDate) > Date.now() + 24 * 60 * 60 * 1000 || traders.length < 2 ||
                  Number(group.qualifiedWalletCount) !== traders.length) throw new Error(file + " has invalid/duplicate consensus.");
              seen.add(condition);
              const wallets = new Set();
              for (const trader of traders) {
                const wallet = String(trader.wallet || "").toLowerCase();
                if (!wallet || wallets.has(wallet) || String(trader.side || "").toLowerCase() !== String(group.outcome || "").toLowerCase() ||
                    Number(trader.entryCostUsd) < 10 || Number(trader.recentBuyUsd) <= 0 ||
                    trader.qualified !== true || trader.settlementRecordComplete !== true ||
                    Number(trader.resolvedMarkets) < 20 || Number(trader.winRate) < 90) throw new Error(file + " contains a nonqualifying consensus holder.");
                wallets.add(wallet);
              }
              if (group.signalTier !== (traders.length >= 8 ? "Strong Signals" : "Watchlist")) throw new Error(file + " has a wrong signal tier.");
            }
          }
          if (status.weekLeaders !== docs["week.json"].leaders.length || status.monthLeaders !== docs["month.json"].leaders.length ||
              status.weekConsensusSignals !== docs["consensus-week.json"].consensus.length ||
              status.monthConsensusSignals !== docs["consensus-month.json"].consensus.length) throw new Error("status counts do not match output files.");
          console.log("Scanner v3 output validated.");
          NODE
      - name: Publish validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week.json month.json consensus-week.json consensus-month.json status.json
          git diff --cached --quiet || git commit -m "Publish validated scanner v3 data"
          git push
