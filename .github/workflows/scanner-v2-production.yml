name: Polymarket Top 100 refresh

on:
  push:
    branches: [main]
    paths:
      - "scanner-v2/run.js"
      - "scanner-v2/data-api.js"
      - "scanner-v2/consensus.js"
      - "scanner-v2/resolution-data.js"
      - "scanner-v2/gamma-api.js"
      - ".github/workflows/scanner-v2-production.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: polymarket-simple-top100-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run scanner unit tests
        run: node --test scanner-v2/*.test.js
      - name: Check scanner syntax
        run: node --check scanner-v2/run.js
      - name: Fetch Polymarket Top 100
        run: node scanner-v2/run.js
      - name: Validate leaderboard files
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const status = JSON.parse(await fs.readFile("status.json", "utf8"));
          if (status.ok !== true || status.scannerVersion !== "settlement-v2") throw new Error("Scanner status failed");
          if (status.windowDays !== 60 || status.consensusBuiltFromQualifiedTradersOnly !== true) throw new Error("Scanner must use the 60-day window and build consensus from qualified traders only.");
          for (const period of ["week", "month"]) {
            const data = JSON.parse(await fs.readFile(period + ".json", "utf8"));
            if (data.qualification?.windowDays !== 60) throw new Error(period + ".json does not use the required 60-day qualification window");
            if (!Array.isArray(data.leaders) || data.leaders.length < 1 || data.leaders.length > 100) {
              throw new Error(period + ".json must contain 1-100 real Polymarket traders");
            }
            const wallets = data.leaders.map(row => row.wallet);
            if (wallets.some(wallet => !/^0x[a-f0-9]{40}$/.test(wallet)) || new Set(wallets).size !== wallets.length) {
              throw new Error(period + ".json has missing or duplicate wallet addresses");
            }
            if (data.leaders.some(row => !Number.isFinite(row.pnl))) throw new Error(period + ".json has a trader without P&L");
            const unqualified = data.leaders.filter(row => row.recordComplete !== true || row.settlementRecordComplete !== true || !Number.isFinite(Number(row.wins)) || !Number.isFinite(Number(row.losses)) || !Number.isFinite(Number(row.resolvedMarkets)) || Number(row.resolvedMarkets) !== Number(row.wins) + Number(row.losses) || Number(row.resolvedMarkets) < 10 || !Number.isFinite(Number(row.winRate)) || Number(row.winRate) < 90);
            if (unqualified.length) throw new Error(period + ".json contains " + unqualified.length + " rows without complete 60-day settlement qualification");
            const consensus = JSON.parse(await fs.readFile("consensus-" + period + ".json", "utf8"));
            if (!Array.isArray(consensus.consensus) || Number(consensus.diagnostics?.signals) !== consensus.consensus.length || !consensus.source?.includes("settlement-qualified leaderboard traders")) {
              throw new Error("Consensus output is malformed or not built from qualified traders");
            }
          }
          if (Date.parse(status.generatedAt) <= Date.parse(status.startedAt)) throw new Error("Invalid generated timestamp");
          console.log("Validated real Polymarket Top 100 data for week and month.");
          NODE
      - name: Publish website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week.json month.json consensus-week.json consensus-month.json status.json
          git commit -m "Publish settlement-qualified Polymarket Top 100" || echo "No data changes"
          git push origin HEAD:main
