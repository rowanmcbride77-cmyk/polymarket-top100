<script>

/* =========================================================
   WORKER
========================================================= */

const WORKER =
"https://polymarket-proxy.rowanmcbride77.workers.dev";


/* =========================================================
   STATE
========================================================= */

const state = {

  candidates:[],

  traders:[],

  markets:[],

  details:new Map(),

  period:"WEEK"

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
document.getElementById(id);


function money(value){

  const n=Number(value);

  if(!Number.isFinite(n))
    return "$0.00";

  return n.toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:2
  });

}


function num(value){

  const n=Number(value);

  if(!Number.isFinite(n))
    return "0";

  return n.toLocaleString("en-US",{
    maximumFractionDigits:2
  });

}


function pct(value){

  const n=Number(value);

  if(!Number.isFinite(n))
    return "—";

  return n.toFixed(1)+"%";

}


function escapeHtml(value){

  return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function shortWallet(wallet){

  if(!wallet)
    return "";

  return wallet.slice(0,6)+"..."+wallet.slice(-4);

}


function showError(message){

  $("error").innerHTML =
    message
    ? `<div class="error">${escapeHtml(message)}</div>`
    : "";

}


function arrayData(data){

  if(Array.isArray(data))
    return data;

  if(Array.isArray(data?.data))
    return data.data;

  if(Array.isArray(data?.results))
    return data.results;

  return [];

}


/* =========================================================
   WORKER REQUEST
========================================================= */

async function workerRequest(path,params={}){

  const url =
    new URL(
      WORKER.replace(/\/+$/,"")+
      "/"+
      path.replace(/^\/+/,"")
    );

  for(const [key,value] of Object.entries(params)){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      url.searchParams.set(
        key,
        String(value)
      );

    }

  }

  const response =
    await fetch(
      url.toString(),
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  const text =
    await response.text();

  let data;

  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }catch{

    throw new Error(
      "Worker returned invalid JSON."
    );

  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      `Worker HTTP ${response.status}`
    );

  }

  return data;

}


/* =========================================================
   LEADERBOARD
========================================================= */

async function getLeaderboard(
  period,
  orderBy,
  offset
){

  return workerRequest(
    "leaderboard",
    {
      category:"OVERALL",
      timePeriod:period,
      orderBy,
      limit:50,
      offset
    }
  );

}


async function getCandidates(period){

  const requests=[];

  /*
    Get the largest useful candidate pool.
    We use both PNL and volume so consistency
    traders aren't excluded simply because they
    don't have huge PNL.
  */

  for(
    const order of ["PNL","VOL"]
  ){

    requests.push(
      getLeaderboard(
        period,
        order,
        0
      )
    );

    requests.push(
      getLeaderboard(
        period,
        order,
        50
      )
    );

  }

  const results =
    await Promise.all(requests);

  const map =
    new Map();

  for(
    const result of results
  ){

    for(
      const row of arrayData(result)
    ){

      const wallet =
        row.proxyWallet ||
        row.proxy_wallet ||
        row.address ||
        row.wallet;

      if(
        !/^0x[a-fA-F0-9]{40}$/.test(
          String(wallet)
        )
      ){
        continue;
      }

      const key =
        wallet.toLowerCase();

      if(!map.has(key)){

        map.set(
          key,
          {
            ...row,
            proxyWallet:wallet,
            userName:
              row.userName ||
              row.user_name ||
              row.username ||
              row.name ||
              shortWallet(wallet)
          }
        );

      }

    }

  }

  return [...map.values()];

}


/* =========================================================
   CLOSED POSITIONS
========================================================= */

async function getClosed(wallet){

  const data =
    await workerRequest(
      "closed-positions",
      {
        user:wallet,
        period:state.period
      }
    );

  return arrayData(data);

}


/* =========================================================
   ACTIVE POSITIONS
========================================================= */

async function getPositions(wallet){

  const data =
    await workerRequest(
      "positions",
      {
        user:wallet
      }
    );

  return arrayData(data);

}


/* =========================================================
   TRADES
========================================================= */

async function getTrades(wallet){

  const data =
    await workerRequest(
      "trades",
      {
        user:wallet
      }
    );

  return arrayData(data);

}


/* =========================================================
   WALLET NAME
========================================================= */

function walletName(row){

  return (
    row.userName ||
    row.user_name ||
    row.username ||
    row.name ||
    shortWallet(
      row.proxyWallet ||
      row.proxy_wallet
    )
  );

}


/* =========================================================
   CLOSED POSITION STATS
========================================================= */

function closedTimestamp(p){

  const values=[

    p.timestamp,

    p.last_event_at,

    p.lastEventAt,

    p.end_time,

    p.endTime,

    p.closed_at,

    p.closedAt

  ];

  for(
    const value of values
  ){

    const n=Number(value);

    if(
      Number.isFinite(n) &&
      n>0
    ){

      /*
        Milliseconds -> seconds
      */

      return n > 100000000000
        ? n/1000
        : n;

    }

  }

  return 0;

}


function realized(p){

  const values=[

    p.realized_pnl,

    p.realizedPnl,

    p.realizedPnlUsd,

    p.cashPnl,

    p.cash_pnl,

    p.pnl

  ];

  for(
    const value of values
  ){

    const n=Number(value);

    if(Number.isFinite(n))
      return n;

  }

  return 0;

}


function entryValue(p){

  const values=[

    p.initial_value,

    p.initialValue,

    p.entry_value,

    p.entryValue,

    p.entry_cost_usdc,

    p.entryCost,

    p.cost

  ];

  for(
    const value of values
  ){

    const n=Number(value);

    if(
      Number.isFinite(n) &&
      n>0
    ){

      return n;

    }

  }

  return 0;

}


function calculateStats(rows){

  let wins=0;

  let losses=0;

  let profit=0;

  let volume=0;

  for(
    const p of rows
  ){

    const pnl =
      realized(p);

    /*
      Only actual positive/negative
      closed P&L counts as a W/L.
      Zero P&L does NOT become a win.
    */

    if(pnl>0)
      wins++;

    else if(pnl<0)
      losses++;

    profit += pnl;

    volume += entryValue(p);

  }

  const total =
    wins+losses;

  return {

    wins,

    losses,

    total,

    profit,

    volume,

    winPct:
      total
      ? wins/total*100
      : null,

    ratio:
      losses>0
      ? wins/losses
      : null,

    roi:
      volume>0
      ? profit/volume*100
      : null

  };

}


/* =========================================================
   LOAD TRADER
========================================================= */

async function loadTrader(row){

  const wallet =
    row.proxyWallet ||
    row.proxy_wallet;

  const key =
    wallet.toLowerCase();

  if(
    state.details.has(key)
  ){

    return state.details.get(key);

  }

  const closed =
    await getClosed(wallet);

  const stats =
    calculateStats(closed);

  const trader={

    ...row,

    proxyWallet:wallet,

    userName:walletName(row),

    closed,

    active:[],

    stats

  };

  state.details.set(
    key,
    trader
  );

  return trader;

}


/* =========================================================
   SORT
========================================================= */

function sortTraders(
  rows,
  mode
){

  return [...rows].sort(
    (a,b)=>{

      if(mode==="WL"){

        return (
          (b.stats.ratio ?? -1) -
          (a.stats.ratio ?? -1)
        );

      }

      if(mode==="WINPCT"){

        return (
          (b.stats.winPct ?? -1) -
          (a.stats.winPct ?? -1)
        );

      }

      if(mode==="ROI"){

        return (
          (b.stats.roi ?? -Infinity) -
          (a.stats.roi ?? -Infinity)
        );

      }

      if(mode==="VOLUME"){

        return (
          b.stats.volume -
          a.stats.volume
        );

      }

      return (
        b.stats.profit -
        a.stats.profit
      );

    }
  );

}


/* =========================================================
   SCAN
========================================================= */

async function scan(){

  showError("");

  $("scanBtn").disabled=true;

  $("traderBody").innerHTML=`

<tr>
<td colspan="10" class="loading">
Loading Polymarket leaderboard...
</td>
</tr>

`;

  state.period =
    $("period").value;

  state.details.clear();

  try{

    const candidates =
      await getCandidates(
        state.period
      );

    if(!candidates.length){

      throw new Error(
        "The Worker returned no leaderboard traders."
      );

    }

    const traders=[];

    const batchSize=6;

    for(
      let i=0;
      i<candidates.length;
      i+=batchSize
    ){

      const batch =
        candidates.slice(
          i,
          i+batchSize
        );

      const results =
        await Promise.all(
          batch.map(
            async candidate=>{

              try{

                const trader =
                  await loadTrader(
                    candidate
                  );

                /*
                  IMPORTANT:
                  Remove 0-0 accounts.
                  Also don't allow fake
                  15-0 caps.
                */

                if(
                  trader.stats.total<=0
                ){

                  return null;

                }

                return trader;

              }catch(error){

                console.warn(
                  "Trader failed:",
                  candidate.proxyWallet,
                  error
                );

                return null;

              }

            }
          )
        );

      traders.push(
        ...results.filter(Boolean)
      );

      $("status").textContent =
        `Calculating records: ${
          Math.min(
            i+batchSize,
            candidates.length
          )
        } / ${candidates.length}`;

    }

    state.traders =
      traders;

    renderTraders();

    $("status").textContent =
      `Loaded ${state.traders.length} traders with actual closed results.`;

  }catch(error){

    console.error(error);

    showError(
      error.message
    );

    $("traderBody").innerHTML=`

<tr>
<td colspan="10" class="loading">
Scan failed.
</td>
</tr>

`;

  }finally{

    $("scanBtn").disabled=false;

  }

}


/* =========================================================
   RENDER TRADERS
========================================================= */

function renderTraders(){

  const sorted =
    sortTraders(
      state.traders,
      $("ranking").value
    ).slice(0,100);

  $("traderCount").textContent =
    sorted.length;

  $("volumeTotal").textContent =
    money(
      sorted.reduce(
        (sum,t)=>
          sum+t.stats.volume,
        0
      )
    );

  if(!sorted.length){

    $("traderBody").innerHTML=`

<tr>
<td colspan="10" class="loading">
No qualifying traders.
</td>
</tr>

`;

    return;

  }

  $("traderBody").innerHTML =
    sorted.map(
      (t,i)=>{

        const s=t.stats;

        return `

<tr>

<td class="rank">
#${i+1}
</td>

<td>

<div class="name">
${escapeHtml(t.userName)}
</div>

<div class="wallet">
${escapeHtml(
  shortWallet(t.proxyWallet)
)}
</div>

</td>

<td>
<b>${s.wins}-${s.losses}</b>
</td>

<td>
${pct(s.winPct)}
</td>

<td>

<b>
${
  s.ratio === null
  ? "—"
  : s.ratio.toFixed(2)+":1"
}
</b>

</td>

<td class="${
  s.profit>=0
  ? "green"
  : "red"
}">
${money(s.profit)}
</td>

<td class="${
  (s.roi??0)>=0
  ? "green"
  : "red"
}">
${pct(s.roi)}
</td>

<td>
${money(s.volume)}
</td>

<td>
<span id="active-count-${i}">
—
</span>
</td>

<td>

<button
onclick="toggleTrader(
'${escapeHtml(t.proxyWallet)}',
${i}
)">
View
</button>

</td>

</tr>


<tr
id="detail-${i}"
style="display:none"
class="details"
>

<td colspan="10">

<div class="details-inner">
Loading...
</div>

</td>

</tr>

`;

      }
    ).join("");

}


/* =========================================================
   TRADER DETAIL
========================================================= */

async function toggleTrader(
  wallet,
  index
){

  const row =
    document.getElementById(
      "detail-"+index
    );

  if(!row)
    return;

  if(
    row.style.display!=="none"
  ){

    row.style.display="none";

    return;

  }

  row.style.display="table-row";

  const inner =
    row.querySelector(
      ".details-inner"
    );

  inner.innerHTML=`

<div class="loading">
Loading positions...
</div>

`;

  try{

    const trader =
      state.traders.find(
        t=>
          t.proxyWallet.toLowerCase()
          ===wallet.toLowerCase()
      );

    if(!trader)
      throw new Error(
        "Trader not found."
      );

    const [
      positions,
      trades
    ] =
      await Promise.all([
        getPositions(wallet),
        getTrades(wallet)
      ]);

    trader.active =
      positions.filter(
        p=>{

          const size=
            Number(
              p.size ??
              p.current_size ??
              p.tokens ??
              0
            );

          if(
            !Number.isFinite(size) ||
            size<=0
          )
            return false;

          if(p.redeemable===true)
            return false;

          return true;

        }
      );

    $("active-count-"+index)
      .textContent=
      trader.active.length;

    renderActiveDetail(
      inner,
      trader,
      trades
    );

  }catch(error){

    inner.innerHTML=`

<div class="error">
${escapeHtml(error.message)}
</div>

`;

  }

}


/* =========================================================
   PURCHASE INFORMATION
========================================================= */

function getToken(p){

  return String(
    p.asset ??
    p.token_id ??
    p.tokenId ??
    ""
  );

}


function getCondition(p){

  return String(
    p.condition_id ??
    p.conditionId ??
    ""
  );

}


function findBuy(
  position,
  trades
){

  const asset =
    getToken(position);

  const condition =
    getCondition(position);

  const buys =
    trades
    .filter(
      trade=>
        String(
          trade.side || ""
        ).toUpperCase()==="BUY"
    )
    .filter(
      trade=>{

        const ta=
          String(
            trade.asset ??
            trade.token_id ??
            trade.tokenId ??
            ""
          );

        const tc=
          String(
            trade.conditionId ??
            trade.condition_id ??
            ""
          );

        return (
          (asset && ta===asset) ||
          (condition && tc===condition)
        );

      }
    )
    .sort(
      (a,b)=>
        Number(
          a.timestamp || 0
        )-
        Number(
          b.timestamp || 0
        )
    );

  return buys[0] || null;

}


/* =========================================================
   POSITION HTML
========================================================= */

function positionHtml(
  p,
  trades
){

  const shares =
    Number(
      p.size ??
      p.current_size ??
      p.tokens ??
      0
    );

  const entry =
    Number(
      p.avg_price ??
      p.avgPrice ??
      0
    );

  const current =
    Number(
      p.cur_price ??
      p.curPrice ??
      p.currentPrice ??
      0
    );

  const currentValue =
    Number(
      p.current_value ??
      p.currentValue ??
      shares*current
    );

  const initial =
    Number(
      p.initial_value ??
      p.initialValue ??
      shares*entry
    );

  const totalPnl =
    Number(
      p.cash_pnl ??
      p.cashPnl ??
      (currentValue-initial)
    );

  const buy =
    findBuy(
      p,
      trades
    );

  let buyDate="Unavailable";

  if(buy){

    const ts=
      Number(
        buy.timestamp || 0
      );

    if(ts){

      buyDate =
        new Date(
          ts>100000000000
          ? ts
          : ts*1000
        ).toLocaleString();

    }

  }

  const title =
    p.title ||
    p.question ||
    "Unknown Market";

  const outcome =
    p.outcome ||
    "Unknown";

  return `

<div class="position">

<div class="position-title">
${escapeHtml(title)}
</div>

<div>
<span class="pill">
${escapeHtml(outcome)}
</span>
</div>

<div class="position-meta">

Shares:
<b>${num(shares)}</b>
<br>

Entry:
<b>${money(entry)}</b>
<br>

Current:
<b>${money(current)}</b>
<br>

Investment:
<b>${money(initial)}</b>
<br>

Current Value:
<b>${money(currentValue)}</b>
<br>

Total Unrealized P&L:
<b class="${
  totalPnl>=0
  ? "green"
  : "red"
}">
${money(totalPnl)}
</b>
<br>

Bought:
<b>${escapeHtml(buyDate)}</b>

</div>

</div>

`;

}

/* =========================================================
   ACTIVE MARKETS
========================================================= */

function marketKey(p){

  return String(
    p.condition_id ??
    p.conditionId ??
    p.market ??
    p.title ??
    ""
  );

}


function buildMarkets(){

  const map=
    new Map();

  for(
    const trader of state.traders
  ){

    for(
      const p of trader.active || []
    ){

      const key=
        marketKey(p);

      if(!key)
        continue;

      if(!map.has(key)){

        map.set(
          key,
          {
            key,
            title:
              p.title ||
              p.question ||
              "Unknown Market",
            positions:[]
          }
        );

      }

      map.get(key)
        .positions
        .push({
          trader,
          position:p
        });

    }

  }

  return [...map.values()];

}


/* =========================================================
   MARKET METRIC
========================================================= */

function marketMetric(
  market,
  mode
){

  let volume=0;
  let pnl=0;

  let yes=0;
  let no=0;

  const traderSet=
    new Set();

  for(
    const item of market.positions
  ){

    const p=item.position;

    const shares=
      Number(
        p.size ??
        p.current_size ??
        0
      );

    const price=
      Number(
        p.avg_price ??
        p.avgPrice ??
        0
      );

    volume +=
      shares*price;

    const current=
      Number(
        p.cur_price ??
        p.curPrice ??
        0
      );

    pnl +=
      Number(
        p.cash_pnl ??
        p.cashPnl ??
        ((current-price)*shares)
      );

    const outcome=
      String(
        p.outcome || ""
      ).toLowerCase();

    if(outcome==="yes")
      yes++;

    else if(outcome==="no")
      no++;

    traderSet.add(
      item.trader.proxyWallet
    );

  }

  const total=
    yes+no;

  const winPct=
    total
    ? yes/total*100
    : null;

  const roi=
    volume
    ? pnl/volume*100
    : null;

  if(mode==="VOLUME")
    return volume;

  if(mode==="PNL")
    return pnl;

  if(mode==="ROI")
    return roi ?? -Infinity;

  if(mode==="WINPCT")
    return winPct ?? -Infinity;

  if(mode==="WL"){

    /*
      For market ranking we use the
      actual trader records represented
      in that market.
    */

    let wins=0;
    let losses=0;

    for(
      const item of market.positions
    ){

      wins +=
        item.trader.stats.wins;

      losses +=
        item.trader.stats.losses;

    }

    return losses
      ? wins/losses
      : -Infinity;

  }

  return traderSet.size;

}

  const mode=

  let markets=

  markets.sort(

    ],

    [

      markets.filter(
        m=>m.positions.length>=2

    [

      markets.filter(
        m=>m.positions.length>=1

}

/* =========================================================
   ACTIVE MARKET SCAN
========================================================= */

async function scanMarkets(){

  showError("");

  if(!state.traders.length){

    showError(
      "Scan traders first."
    );

    return;

  }

  $("marketsBtn").disabled=true;

  try{

    $("marketStatus")
      .textContent=
      "Loading active positions...";

    const batchSize=6;

    for(
      let i=0;
      i<state.traders.length;
      i+=batchSize
    ){

      const batch=
        state.traders.slice(
          i,
          i+batchSize
        );

      await Promise.all(
        batch.map(
          async trader=>{

            try{

              const positions=
                await getPositions(
                  trader.proxyWallet
                );

              trader.active=
                positions.filter(
                  p=>{

                    const size=
                      Number(
                        p.size ??
                        p.current_size ??
                        p.tokens ??
                        0
                      );

                    if(
                      !Number.isFinite(size) ||
                      size<=0
                    )
                      return false;

                    if(
                      p.redeemable===true
                    )
                      return false;

                    return true;

                  }
                );

            }catch(error){

              console.warn(
                "Position error:",
                trader.proxyWallet,
                error
              );

              trader.active=[];

            }

          }
        )
      );

      $("marketStatus")
        .textContent=
        `Loading positions: ${
          Math.min(
            i+batchSize,
            state.traders.length
          )
        } / ${state.traders.length}`;

    }

    state.markets=
      buildMarkets();

    $("activeCount").textContent=
      state.traders.reduce(
        (sum,t)=>
          sum+
          (t.active?.length||0),
        0
      );

    $("marketCount").textContent=
      state.markets.length;

    renderMarkets();

    $("marketStatus")
      .textContent=
      `${state.markets.length} active markets found.`;

  }catch(error){

    showError(
      error.message
    );

  }finally{

    $("marketsBtn").disabled=false;

  }

}
