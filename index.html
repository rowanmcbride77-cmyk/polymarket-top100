*{box-sizing:border-box}

    grid-template-columns:55px minmax(220px,1.7fr) 120px 100px 120px 90px;

.red{

    margin:8px 0;
}

.shared-title{
    font-weight:bold;
}

.shared-trader{
    display:flex;
    justify-content:space-between;
    padding-top:9px;
    color:#bbb;
    font-size:13px;

    padding:25px;

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);

    .row{
        grid-template-columns:40px 1fr 80px 75px;
    }

    .row>*:nth-child(5),
    .row>*:nth-child(6){
        display:none;
    }

<body>

<div class="wrap">

<h1>Polymarket Top 100</h1>

<div class="controls">
    <button id="week" class="active">Week</button>
    <button id="month">Month</button>
    <button id="three">3 Months</button>

    <select id="sort">
        <option value="record">Best Record</option>
        <option value="winrate">Win %</option>
        <option value="pnl">P/L</option>
        <option value="roi">ROI</option>
    </select>

    <input id="search" placeholder="Search trader...">
</div>

<div id="status" class="status">
    Loading...
</div>

<div class="stats">
    <div class="stat">
        <span>Traders</span>
        <b id="statTraders">0</b>
    </div>

    <div class="stat">
        <span>Active Markets</span>
        <b id="statMarkets">0</b>
    </div>

    <div class="stat">
        <span>Wins</span>
        <b id="statWins">0</b>
    </div>

    <div class="stat">
        <span>Losses</span>
        <b id="statLosses">0</b>
    </div>
</div>

<div class="section">
    <h2>Top 100 Traders</h2>

    <div id="traders" class="table">
        <div class="loading">Loading traders...</div>
    </div>
</div>

<div class="section">
    <h2>Shared Active Markets</h2>

    <div id="shared">
        <div class="loading">Loading...</div>
    </div>
</div>

</div>

<script>

const WORKER =
    "https://polymarket-proxy.rowanmcbride77.workers.dev";

const DIRECT =
    "https://data-api.polymarket.com";

let PERIOD = "WEEK";

let traders = [];
let sharedMarkets = [];

const $ = id => document.getElementById(id);


/* ----------------------------- */
/* BASIC HELPERS */
/* ----------------------------- */

function esc(v){

    return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}


function n(v){

    const x = Number(v);

    return Number.isFinite(x) ? x : 0;
}


function money(v){

    if(v === null || v === undefined || !Number.isFinite(Number(v))){
        return "—";
    }

    const x = Number(v);

    return (x < 0 ? "-$" : "$") +
        Math.abs(x).toLocaleString(undefined,{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}


function dateValue(v){

    if(v === null || v === undefined || v === ""){
        return null;
    }

    const x = Number(v);

    if(Number.isFinite(x)){
        return new Date(x < 1000000000000 ? x * 1000 : x);
    }

    const d = new Date(v);

    return isNaN(d) ? null : d;
}


function formatDate(v){

    const d = dateValue(v);

    if(!d){
        return "Buy time unavailable";
    }

    return d.toLocaleString([],{
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
    });
}


/* ----------------------------- */
/* API */
/* ----------------------------- */

async function fetchJSON(base,path){

    const r = await fetch(base + path,{
        cache:"no-store"
    });

    const text = await r.text();

    if(!r.ok){
        throw new Error(
            "HTTP " + r.status + ": " + text.slice(0,250)
        );
    }

    try{
        return JSON.parse(text);
    }catch{
        throw new Error("Invalid JSON");
    }
}


/*
   Try worker first.

   If worker does not expose the route,
   automatically go directly to Polymarket.
*/
async function api(path){

    try{
        return await fetchJSON(WORKER,path);
    }catch(workerError){

        return await fetchJSON(DIRECT,path);
    }
}


function arrayFrom(data){

    if(Array.isArray(data)){
        return data;
    }

    if(Array.isArray(data.data)){
        return data.data;
    }

    if(Array.isArray(data.results)){
        return data.results;
    }

    if(Array.isArray(data.positions)){
        return data.positions;
    }

    return [];
}


/* ----------------------------- */
/* LEADERBOARD */
/* ----------------------------- */

async function leaderboard(period,order,offset){

    const q =
        "?timePeriod=" + encodeURIComponent(period) +
        "&category=OVERALL" +
        "&orderBy=" + encodeURIComponent(order) +
        "&limit=50" +
        "&offset=" + offset;

    /*
       v1 is the important route.
       There is deliberately NO /v2/leaderboard here.
    */

    return arrayFrom(
        await api("/v1/leaderboard" + q)
    );
}


/* ----------------------------- */
/* CANDIDATES */
/* ----------------------------- */

async function getCandidates(){

    const map = new Map();

    /*
       Get a large pool from P/L and volume.
       These are ONLY candidate sources.
       Final ranking is based on actual W/L.
    */

    const offsets = [];

    for(let x=0;x<=950;x+=50){
        offsets.push(x);
    }

    const jobs = [];

    for(const order of ["PNL","VOL"]){

        for(const offset of offsets){

            jobs.push(
                leaderboard(PERIOD,order,offset)
                .then(rows => {

                    for(const row of rows){

                        const wallet =
                            row.proxyWallet ||
                            row.proxy_wallet ||
                            row.wallet ||
                            row.address;

                        if(!wallet){
                            continue;
                        }

                        if(!map.has(wallet)){

                            map.set(wallet,{
                                wallet,
                                name:
                                    row.userName ||
                                    row.username ||
                                    row.name ||
                                    row.xUsername ||
                                    wallet.slice(0,12),
                                rank:row.rank || null
                            });
                        }
                    }
                })
                .catch(()=>{})
            );
        }
    }

    /*
       For 3 months, the leaderboard does not have a
       3-month period, so add MONTH and ALL candidates.
    */

    if(PERIOD === "THREEMONTH"){

        for(const sourcePeriod of ["MONTH","ALL"]){

            for(const order of ["PNL","VOL"]){

                for(let offset=0;offset<=500;offset+=50){

                    jobs.push(
                        leaderboard(sourcePeriod,order,offset)
                        .then(rows=>{

                            for(const row of rows){

                                const wallet =
                                    row.proxyWallet ||
                                    row.proxy_wallet ||
                                    row.wallet ||
                                    row.address;

                                if(!wallet){
                                    continue;
                                }

                                if(!map.has(wallet)){

                                    map.set(wallet,{
                                        wallet,
                                        name:
                                            row.userName ||
                                            row.username ||
                                            row.name ||
                                            row.xUsername ||
                                            wallet.slice(0,12),
                                        rank:row.rank || null
                                    });
                                }
                            }
                        })
                        .catch(()=>{})
                    );
                }
            }
        }
    }

    await Promise.all(jobs);

    return [...map.values()];
}


/* ----------------------------- */
/* CLOSED POSITIONS */
/* ----------------------------- */

async function closedPositions(wallet){

    let all = [];

    for(let offset=0;offset<=1000;offset+=50){

        try{

            const data = await api(
                "/closed-positions?user=" +
                encodeURIComponent(wallet) +
                "&limit=50&offset=" +
                offset
            );

            const rows = arrayFrom(data);

            if(!rows.length){
                break;
            }

            all.push(...rows);

            if(rows.length < 50){
                break;
            }

        }catch{

            break;
        }
    }

    return all;
}


/* ----------------------------- */
/* P/L */
/* ----------------------------- */

function getPnl(row){

    const fields = [
        "cashPnl",
        "realizedPnl",
        "realizedPNL",
        "pnl",
        "profit",
        "profitLoss"
    ];

    for(const field of fields){

        if(
            row[field] !== undefined &&
            row[field] !== null &&
            Number.isFinite(Number(row[field]))
        ){
            return Number(row[field]);
        }
    }

    return null;
}


function getInvested(row){

    const fields = [
        "initialValue",
        "initial_value",
        "cost",
        "costBasis"
    ];

    for(const field of fields){

        if(
            row[field] !== undefined &&
            row[field] !== null &&
            Number.isFinite(Number(row[field]))
        ){
            return Number(row[field]);
        }
    }

    return null;
}


function rowDate(row){

    return (
        row.timestamp ||
        row.closedAt ||
        row.closed_at ||
        row.updatedAt ||
        row.updated_at ||
        row.createdAt ||
        row.created_at ||
        row.endDate ||
        row.end_date
    );
}


function startDate(){

    const d = new Date();

    if(PERIOD === "WEEK"){

        d.setDate(d.getDate()-7);

    }else if(PERIOD === "MONTH"){

        d.setMonth(d.getMonth()-1);

    }else{

        d.setMonth(d.getMonth()-3);

    }

    return d;
}


/* ----------------------------- */
/* RECORD */
/* ----------------------------- */

function calculateRecord(rows){

    const start = startDate();

    let wins = 0;
    let losses = 0;

    let pnl = 0;
    let pnlKnown = false;

    let invested = 0;

    for(const row of rows){

        const d = dateValue(rowDate(row));

        /*
           Only apply the date filter when the API actually
           gives us a usable timestamp.
        */

        if(d && d < start){
            continue;
        }

        const p = getPnl(row);

        if(p === null){
            continue;
        }

        pnl += p;
        pnlKnown = true;

        const inv = getInvested(row);

        if(inv !== null && inv > 0){
            invested += inv;
        }

        if(p > 0){

            wins++;

        }else if(p < 0){

            losses++;
        }
    }

    const total = wins + losses;

    const winrate =
        total > 0
        ? wins / total * 100
        : 0;

    const roi =
        invested > 0
        ? pnl / invested * 100
        : null;

    return {
        wins,
        losses,
        total,
        winrate,
        pnl:pnlKnown ? pnl : null,
        invested,
        roi
    };
}


/* ----------------------------- */
/* CONCURRENCY */
/* ----------------------------- */

async function mapLimit(items,limit,fn){

    const result = new Array(items.length);

    let next = 0;

    async function worker(){

        while(true){

            const i = next++;

            if(i >= items.length){
                return;
            }

            try{

                result[i] = await fn(items[i],i);

            }catch{

                result[i] = null;
            }
        }
    }

    const workers = [];

    for(
        let i=0;
        i<Math.min(limit,items.length);
        i++
    ){
        workers.push(worker());
    }

    await Promise.all(workers);

    return result;
}


/* ----------------------------- */
/* GET TRADER RECORD */
/* ----------------------------- */

async function getTrader(candidate){

    const rows =
        await closedPositions(candidate.wallet);

    const record =
        calculateRecord(rows);

    return {
        ...candidate,
        ...record,
        active:[]
    };
}


/* ----------------------------- */
/* ACTIVE POSITIONS */
/* ----------------------------- */

async function getPositions(wallet){

    let all = [];

    for(let offset=0;offset<=1000;offset+=500){

        try{

            const data = await api(
                "/positions?user=" +
                encodeURIComponent(wallet) +
                "&sizeThreshold=0" +
                "&limit=500" +
                "&offset=" +
                offset
            );

            const rows = arrayFrom(data);

            if(!rows.length){
                break;
            }

            all.push(...rows);

            if(rows.length < 500){
                break;
            }

        }catch{

            break;
        }
    }

    /*
       IMPORTANT:
       Do NOT filter by endDate.
       A valid Polymarket position can have date
       fields that are missing/stale.
    */

    return all.filter(p => {

        const size = Number(p.size);

        return (
            Number.isFinite(size) &&
            size > 0 &&
            p.redeemable !== true &&
            p.redeemed !== true &&
            p.closed !== true
        );
    });
}


/* ----------------------------- */
/* ACTIVE BUY DATA */
/* ----------------------------- */

async function getBuyData(wallet,position){

    const condition =
        position.conditionId ||
        position.condition_id ||
        position.market ||
        position.condition;

    if(!condition){
        return {
            amount:null,
            firstBuy:null
        };
    }

    try{

        const data = await api(
            "/trades?user=" +
            encodeURIComponent(wallet) +
            "&market=" +
            encodeURIComponent(condition) +
            "&side=BUY" +
            "&limit=500"
        );

        const trades = arrayFrom(data);

        let amount = 0;
        let amountKnown = false;
        let first = null;

        for(const trade of trades){

            const price = Number(trade.price);
            const size = Number(trade.size);

            let dollars = null;

            if(
                trade.usdcSize !== undefined &&
                Number.isFinite(Number(trade.usdcSize))
            ){

                dollars = Number(trade.usdcSize);

            }else if(
                Number.isFinite(price) &&
                Number.isFinite(size)
            ){

                dollars = price * size;
            }

            if(dollars !== null){

                amount += dollars;
                amountKnown = true;
            }

            const time =
                trade.timestamp ||
                trade.createdAt ||
                trade.created_at;

            const d = dateValue(time);

            if(d){

                if(!first || d < first){
                    first = d;
                }
            }
        }

        return {
            amount:amountKnown ? amount : null,
            firstBuy:first
        };

    }catch{

        return {
            amount:null,
            firstBuy:null
        };
    }
}


/* ----------------------------- */
/* ACTIVE ENRICHMENT */
/* ----------------------------- */

async function enrichTrader(t){

    const positions =
        await getPositions(t.wallet);

    /*
       Show active positions immediately.
       Buy details are added afterward.
    */

    t.active = positions.map(p => ({
        ...p,
        buyAmount:null,
        firstBuy:null
    }));

    /*
       Only enrich active markets.
       We never download a trader's entire history.
    */

    await mapLimit(
        t.active,
        5,
        async p => {

            const info =
                await getBuyData(t.wallet,p);

            p.buyAmount = info.amount;
            p.firstBuy = info.firstBuy;

            return p;
        }
    );

    return t;
}


/* ----------------------------- */
/* MARKET HELPERS */
/* ----------------------------- */

function marketId(p){

    return (
        p.conditionId ||
        p.condition_id ||
        p.market ||
        p.condition ||
        p.id ||
        ""
    );
}


function marketTitle(p){

    return (
        p.title ||
        p.question ||
        p.marketQuestion ||
        p.name ||
        (
            "Market " +
            String(marketId(p)).slice(0,20)
        )
    );
}


function activeAmount(p){

    if(p.buyAmount !== null){
        return money(p.buyAmount);
    }

    if(
        p.initialValue !== undefined &&
        Number.isFinite(Number(p.initialValue))
    ){
        return money(p.initialValue);
    }

    if(
        p.currentValue !== undefined &&
        Number.isFinite(Number(p.currentValue))
    ){
        return money(p.currentValue);
    }

    if(
        Number.isFinite(Number(p.size)) &&
        Number.isFinite(Number(p.avgPrice))
    ){
        return money(
            Number(p.size) *
            Number(p.avgPrice)
        );
    }

    return "—";
}


/* ----------------------------- */
/* SORT */
/* ----------------------------- */

function sortTraders(){

    const mode = $("sort").value;

    traders.sort((a,b)=>{

        if(mode === "pnl"){

            return (
                n(b.pnl)-n(a.pnl) ||
                b.winrate-a.winrate ||
                b.wins-a.wins
            );
        }

        if(mode === "roi"){

            return (
                n(b.roi)-n(a.roi) ||
                b.winrate-a.winrate ||
                b.wins-a.wins
            );
        }

        if(mode === "winrate"){

            return (
                b.winrate-a.winrate ||
                b.wins-a.wins ||
                b.total-a.total ||
                n(b.pnl)-n(a.pnl)
            );
        }

        /*
           BEST RECORD

           50-0 > 49-0 > 1-0
           because consistency AND number of wins matter.
        */

        return (
            b.winrate-a.winrate ||
            b.wins-a.wins ||
            b.total-a.total ||
            n(b.pnl)-n(a.pnl)
        );
    });
}


/* ----------------------------- */
/* RENDER TRADERS */
/* ----------------------------- */

function renderTraders(){

    sortTraders();

    const q =
        $("search").value
        .trim()
        .toLowerCase();

    const list =
        q
        ? traders.filter(t =>
            t.name.toLowerCase().includes(q) ||
            t.wallet.toLowerCase().includes(q)
          )
        : traders;

    if(!list.length){

        $("traders").innerHTML =
            '<div class="loading">No traders found.</div>';

        return;
    }

    let html = `
        <div class="row head">
            <div>#</div>
            <div>Trader</div>
            <div>Record</div>
            <div>Win %</div>
            <div>P/L</div>
            <div>Active</div>
        </div>
    `;

    list.slice(0,100).forEach((t,i)=>{

        const pnlClass =
            t.pnl === null
            ? "muted"
            : t.pnl >= 0
              ? "green"
              : "red";

        html += `
            <div
                class="row trader"
                data-wallet="${esc(t.wallet)}"
            >

                <div>${i+1}</div>

                <div>
                    <div class="name">
                        ${esc(t.name)}
                    </div>

                    <span class="wallet">
                        ${esc(t.wallet)}
                    </span>
                </div>

                <div class="record">
                    ${t.wins}-${t.losses}
                </div>

                <div>
                    ${
                        t.total
                        ? t.winrate.toFixed(1)+"%"
                        : "—"
                    }
                </div>

                <div class="${pnlClass}">
                    ${money(t.pnl)}
                </div>

                <div>
                    ${t.active.length}
                </div>

            </div>

            <div
                class="detail"
                id="detail-${esc(t.wallet)}"
            >

                <div class="detail-title">
                    Active Markets
                </div>

                ${
                    t.active.length
                    ? t.active.map(p => activeMarketHTML(t,p)).join("")
                    : '<div class="muted">No active positions found.</div>'
                }

            </div>
        `;
    });

    $("traders").innerHTML = html;

    document
        .querySelectorAll(".trader")
        .forEach(el => {

            el.onclick = () => {

                const detail =
                    document.getElementById(
                        "detail-" + el.dataset.wallet
                    );

                if(detail){
                    detail.classList.toggle("open");
                }
            };
        });
}


function activeMarketHTML(t,p){

    return `
        <div class="market">

            <div class="market-top">

                <div class="market-name">
                    ${esc(marketTitle(p))}
                </div>

                <div>
                    ${activeAmount(p)}
                </div>

            </div>

            <div class="market-meta">

                ${
                    esc(
                        p.outcome ||
                        p.outcomeName ||
                        "Position"
                    )
                }

                ${
                    p.avgPrice !== undefined
                    ? " • Avg " +
                      Number(p.avgPrice).toFixed(3)
                    : ""
                }

                ${
                    p.curPrice !== undefined
                    ? " • Current " +
                      Number(p.curPrice).toFixed(3)
                    : ""
                }

                ${
                    p.firstBuy
                    ? " • Bought " +
                      formatDate(p.firstBuy)
                    : ""
                }

            </div>

        </div>
    `;
}


/* ----------------------------- */
/* SHARED MARKETS */
/* ----------------------------- */

function buildShared(){

    const map = new Map();

    for(const trader of traders){

        for(const position of trader.active){

            const id = marketId(position);

            if(!id){
                continue;
            }

            if(!map.has(id)){

                map.set(id,{
                    id,
                    title:marketTitle(position),
                    traders:[]
                });
            }

            map.get(id).traders.push({
                trader,
                position
            });
        }
    }

    sharedMarkets =
        [...map.values()]
        .filter(x => x.traders.length >= 2)
        .sort(
            (a,b) =>
                b.traders.length -
                a.traders.length
        );
}


function renderShared(){

    buildShared();

    if(!sharedMarkets.length){

        $("shared").innerHTML =
            '<div class="loading">No shared active markets found.</div>';

    }else{

        $("shared").innerHTML =
            sharedMarkets.map(m => `

                <div class="shared">

                    <div class="shared-title">
                        ${esc(m.title)}
                        <span class="muted">
                            • ${m.traders.length} traders
                        </span>
                    </div>

                    ${
                        m.traders.map(x => `

                            <div class="shared-trader">

                                <span>
                                    ${esc(x.trader.name)}
                                </span>

                                <span>
                                    ${activeAmount(x.position)}
                                </span>

                            </div>

                        `).join("")
                    }

                </div>

            `).join("");
    }

    const marketCount =
        new Set(
            traders.flatMap(t =>
                t.active.map(marketId)
            )
        ).size;

    $("statMarkets").textContent =
        marketCount.toLocaleString();
}


/* ----------------------------- */
/* MAIN SCAN */
/* ----------------------------- */

async function scan(){

    $("status").className = "status";

    $("status").textContent =
        "Finding Polymarket traders...";

    $("traders").innerHTML =
        '<div class="loading">Finding traders...</div>';

    $("shared").innerHTML =
        '<div class="loading">Loading active markets...</div>';

    traders = [];
    sharedMarkets = [];

    try{

        const candidates =
            await getCandidates();

        if(!candidates.length){

            throw new Error(
                "Polymarket leaderboard returned no traders."
            );
        }

        $("status").textContent =
            "Checking " +
            candidates.length +
            " wallets for actual resolved records...";

        /*
           Check up to 1000 candidates.
        */

        const checked =
            await mapLimit(
                candidates.slice(0,1000),
                20,
                getTrader
            );

        traders =
            checked
            .filter(Boolean)
            .filter(t => t.total > 0);

        sortTraders();

        /*
           TOP 100 FIRST.
        */

        traders =
            traders.slice(0,100);

        $("status").textContent =
            "Loading active markets for " +
            traders.length +
            " traders...";

        /*
           Get current active positions.
        */

        await mapLimit(
            traders,
            12,
            enrichTrader
        );

        renderTraders();
        renderShared();

        const wins =
            traders.reduce(
                (sum,t) => sum+t.wins,
                0
            );

        const losses =
            traders.reduce(
                (sum,t) => sum+t.losses,
                0
            );

        $("statTraders").textContent =
            traders.length;

        $("statWins").textContent =
            wins.toLocaleString();

        $("statLosses").textContent =
            losses.toLocaleString();

        $("status").textContent =
            "Done — " +
            traders.length +
            " traders loaded.";

    }catch(error){

        $("status").className =
            "status error";

        $("status").textContent =
            "Scan failed: " +
            error.message;

        $("traders").innerHTML =
            '<div class="loading">No traders found.</div>';

        $("shared").innerHTML =
            '<div class="loading">No shared active markets found.</div>';
    }
}


/* ----------------------------- */
/* CONTROLS */

$("week").onclick = () => {

    PERIOD = "WEEK";

    $("week").classList.add("active");
    $("month").classList.remove("active");
    $("three").classList.remove("active");

    scan();
};


$("month").onclick = () => {

    PERIOD = "MONTH";

    $("month").classList.add("active");
    $("week").classList.remove("active");
    $("three").classList.remove("active");

    scan();
};


$("three").onclick = () => {

    PERIOD = "THREEMONTH";

    $("three").classList.add("active");
    $("week").classList.remove("active");
    $("month").classList.remove("active");

    scan();
};


$("sort").onchange = renderTraders;

$("search").oninput = renderTraders;


/* START */

scan();

</script>
