}
.status{

}

  font-size:12px;
  font-weight:700;
  margin-right:5px;
}
.yes{background:#073d20;color:#55ed99}
.no{background:#481313;color:#ff7070}

.market-title{
  color:#eee;
  font-weight:700;
}
.market-row{

}

.market-detail{
  background:#090909;

.distribution{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.market-wallet{
  border:1px solid #282828;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
}
.volume{
  color:#f4f4f4;
  font-weight:700;
}
.small{font-size:12px;color:#888}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  table{font-size:13px}
}
</style>

<body>
<div class="container">

  <button class="scan" onclick="scan()">Scan Top 100</button>

  <h1>Polymarket Top 100</h1>
  <div class="subtitle">
    Weekly leaderboard · P&L · volume · resolved W/L · active markets
  </div>

  <div id="status" class="status">
    Ready to scan.
  </div>

  <section class="card">
    <h2>Top 100 Weekly Traders</h2>
    <div class="muted">
      Click a trader to see current active positions and recent trades.
    </div>

    <div class="controls">
      <input id="traderSearch"
             placeholder="Search trader or wallet..."
             oninput="renderTraders()">
    </div>

    <div id="traders"></div>
  </section>

  <section class="card">
    <h2>Active Markets</h2>
    <div class="muted">
      Current positions held by Top-100 wallets. Click a market to see every trader holding it.
    </div>

    <div class="controls">
      <input id="marketSearch"
             placeholder="Search market..."
             oninput="renderMarkets()">

      <select id="walletFilter" onchange="renderMarkets()">
        <option value="1">1+ wallets</option>
        <option value="2">2+ wallets</option>
        <option value="3">3+ wallets</option>
        <option value="5">5+ wallets</option>
      </select>
    </div>

    <div id="markets"></div>
  </section>

</div>

<script>
const PROXY =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

let traders = [];
let markets = [];
let expandedTrader = null;
let expandedMarket = null;

function money(n){
  n=Number(n||0);
  return n.toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:2
  });
}

function num(n){
  return Number(n||0).toLocaleString("en-US",{
    maximumFractionDigits:2
  });
}

function date(v){
  if(!v) return "—";
  let d = new Date(
    typeof v === "number"
      ? (v < 100000000000 ? v*1000 : v)
      : v
  );
  if(isNaN(d)) return "—";
  return d.toLocaleString();
}

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function teamColor(name){
  const n=String(name||"").toLowerCase();
  for(const [team,color] of Object.entries(TEAM_COLORS)){
    if(n.includes(team)) return color;
  }
  return null;
}

function outcomeBadge(outcome){
  const text=String(outcome||"").trim();

  if(!text) return "";

  const lower=text.toLowerCase();

  if(lower==="yes"){
    return `<span class="badge yes">YES</span>`;
  }

  if(lower==="no"){
    return `<span class="badge no">NO</span>`;
  }

  const color=teamColor(text);

  return `
    <span class="badge team"
      style="${color ? `background:${color};` : ""}">
      ${escapeHtml(text)}
    </span>`;
}

async function get(path){
  const r=await fetch(PROXY + path);

  if(!r.ok){
    throw new Error(
      `HTTP ${r.status}: ${await r.text()}`
    );
  }

  return await r.json();
}

function normalizeArray(x){
  if(Array.isArray(x)) return x;
  if(Array.isArray(x?.data)) return x.data;
  if(Array.isArray(x?.results)) return x.results;
  return [];
}

/*
  Get exactly 100 leaderboard traders.

  The v1 endpoint maxes out at 50 per request,
  so two pages are fetched concurrently.
*/
async function getTop100(){
  const pages = await Promise.all([
    get("/v1/leaderboard?timePeriod=WEEK&orderBy=PNL&limit=50&offset=0"),
    get("/v1/leaderboard?timePeriod=WEEK&orderBy=PNL&limit=50&offset=50")
  ]);

  let rows=[
    ...normalizeArray(pages[0]),
    ...normalizeArray(pages[1])
  ];

  /*
    Some versions of the API can return duplicate rows
    across pagination. Deduplicate by wallet.
  */
  const map=new Map();

  for(const r of rows){
    const wallet =
      r.proxyWallet ||
      r.address ||
      r.wallet ||
      r.user ||
      "";

    if(wallet){
      map.set(wallet.toLowerCase(),r);
    }
  }

  rows=[...map.values()];

  rows.sort((a,b)=>
    Number(a.rank||999999)-Number(b.rank||999999)
  );

  return rows.slice(0,100);
}

/*
  Current positions.
  We deliberately use the current /positions endpoint,
  then additionally filter stale/resolved positions.
*/
async function getPositions(wallet){
  const data=await get(
    `/positions?user=${encodeURIComponent(wallet)}&limit=500`
  );

  let rows=normalizeArray(data);

  const now=Date.now();

  return rows.filter(p=>{
    const size=Number(p.size||0);

    if(size<=0) return false;

    if(p.closed===true) return false;
    if(p.redeemable===true) return false;
    if(p.mergeable===true) return false;

    /*
      If the API provides an end date, don't display
      positions belonging to markets that have already ended.
    */
    const end =
      p.endDate ||
      p.end_date ||
      p.endDateIso;

    if(end){
      const t=new Date(end).getTime();

      if(Number.isFinite(t) && t < now){
        return false;
      }
    }

    return true;
  });
}

/*
  Historical trades used only for the recent-trades panel.
*/
async function getTrades(wallet){
  const data=await get(
    `/trades?user=${encodeURIComponent(wallet)}&limit=100`
  );

  return normalizeArray(data);
}

/*
  Closed positions are used for weekly W/L.

  Positive realized P&L = win.
  Negative realized P&L = loss.

  Active positions are NOT included.
*/
async function getClosed(wallet){
  try{
    const data=await get(
      `/closed-positions?user=${encodeURIComponent(wallet)}&limit=50&sortBy=TIMESTAMP&sortDirection=DESC`
    );

    return normalizeArray(data);
  }catch(e){
    return [];
  }
}

function closedTimestamp(p){
  return (
    p.timestamp ||
    p.closedAt ||
    p.closed_at ||
    p.endDate ||
    p.updatedAt ||
    p.updated_at ||
    0
  );
}

function weeklyWL(closed){
  const now=Date.now();
  const weekAgo=now-7*24*60*60*1000;

  let wins=0;
  let losses=0;

  for(const p of closed){
    const raw=closedTimestamp(p);

    if(!raw) continue;

    const t=new Date(
      typeof raw==="number"
        ? (raw<100000000000?raw*1000:raw)
        : raw
    ).getTime();

    if(!Number.isFinite(t)) continue;
    if(t<weekAgo || t>now) continue;

    const pnl=Number(
      p.realizedPnl ??
      p.realizedPNL ??
      p.cashPnl ??
      p.pnl ??
      0
    );

    if(pnl>0) wins++;
    else if(pnl<0) losses++;
  }

  const total=wins+losses;

  return {
    wins,
    losses,
    total,
    pct: total ? wins/total*100 : 0
  };
}

function normalizeTrader(row){
  return {
    rank:Number(row.rank||0),
    wallet:
      row.proxyWallet ||
      row.address ||
      row.wallet ||
      "",
    name:
      row.userName ||
      row.username ||
      row.name ||
      row.pseudonym ||
      row.proxyWallet ||
      "Unknown",
    pnl:Number(row.pnl||0),
    volume:Number(row.vol||row.volume||0),
    positions:[],
    trades:[],
    closed:[],
    wl:{wins:0,losses:0,total:0,pct:0}
  };
}

async function loadTraderDetails(t){
  const [positions,trades,closed]=await Promise.all([
    getPositions(t.wallet),
    getTrades(t.wallet),
    getClosed(t.wallet)
  ]);

  t.positions=positions;
  t.trades=trades;
  t.closed=closed;
  t.wl=weeklyWL(closed);

  return t;
}

/*
  Controlled concurrency:
  much faster than doing 100 wallets sequentially,
  but avoids firing hundreds of simultaneous requests.
*/
async function mapLimit(items,limit,fn){
  const out=new Array(items.length);
  let next=0;

  async function worker(){
    while(true){
      const i=next++;

      if(i>=items.length) return;

      try{
        out[i]=await fn(items[i],i);
      }catch(e){
        console.error(e);
        out[i]=items[i];
      }
    }
  }

  await Promise.all(
    Array.from(
      {length:Math.min(limit,items.length)},
      worker
    )
  );

  return out;
}

async function scan(){
  const status=document.getElementById("status");

  status.className="status";
  status.textContent="Loading Top 100 leaderboard...";

  try{
    const rows=await getTop100();

    if(rows.length<100){
      status.className="status bad";
      status.textContent=
        `Only ${rows.length} leaderboard traders were returned.`;
      return;
    }

    traders=rows.map(normalizeTrader);

    status.textContent=
      `Found all 100 traders. Loading positions and trade history...`;

    /*
      10 concurrent wallets makes the scan considerably
      faster than sequential loading.
    */
    traders=await mapLimit(
      traders,
      10,
      async t=>{
        await loadTraderDetails(t);

        status.textContent=
          `Loaded ${traders.filter(x=>x.positions || x.trades).length}/100 traders...`;

        return t;
      }
    );

    buildMarkets();

    status.className="status good";
    status.textContent=
      `Loaded and verified: ${traders.length} traders · ${
        traders.reduce((a,t)=>a+t.positions.length,0)
      } active positions.`;

    renderTraders();
    renderMarkets();

  }catch(e){
    console.error(e);

    status.className="status bad";
    status.textContent=
      `Scan failed: ${e.message}`;
  }
}

function renderTraders(){
  const q=
    document.getElementById("traderSearch")
      .value.toLowerCase()
      .trim();

  const filtered=traders.filter(t=>
    t.name.toLowerCase().includes(q) ||
    t.wallet.toLowerCase().includes(q)
  );

  let html=`
  <table>
    <thead>
      <tr>
        <th>RANK</th>
        <th>TRADER</th>
        <th>WEEKLY P&L</th>
        <th>VOLUME</th>
        <th>WIN / LOSS</th>
        <th>W/L %</th>
      </tr>
    </thead>
    <tbody>`;

  for(const t of filtered){

    html+=`
      <tr class="clickable"
          onclick="toggleTrader('${t.wallet}')">
        <td>${t.rank}</td>
        <td>
          <div class="trader-name">${escapeHtml(t.name)}</div>
          <div class="wallet">${escapeHtml(shortWallet(t.wallet))}</div>
        </td>
        <td class="${t.pnl>=0?'money':'loss'}">
          ${money(t.pnl)}
        </td>
        <td>${money(t.volume)}</td>
        <td>
          ${t.wl.wins} - ${t.wl.losses}
        </td>
        <td>
          ${t.wl.total ? t.wl.pct.toFixed(1)+"%" : "—"}
        </td>
      </tr>`;

    if(expandedTrader===t.wallet){
      html+=`
      <tr class="expand">
        <td colspan="6">
          ${renderTraderDetail(t)}
        </td>
      </tr>`;
    }
  }

  html+=`</tbody></table>`;

  document.getElementById("traders").innerHTML=html;
}

function shortWallet(w){
  if(!w) return "";
  return w.slice(0,6)+"..."+w.slice(-4);
}

function renderTraderDetail(t){

  const recent=t.trades
    .slice()
    .sort((a,b)=>
      Number(b.timestamp||0)-Number(a.timestamp||0)
    )
    .slice(0,20);

  return `
  <div class="detail">

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Weekly P&L</div>
        <div class="stat-value ${t.pnl>=0?'money':'loss'}">
          ${money(t.pnl)}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">Weekly Volume</div>
        <div class="stat-value">${money(t.volume)}</div>
      </div>

      <div class="stat">
        <div class="stat-label">Weekly W/L</div>
        <div class="stat-value">
          ${t.wl.wins} - ${t.wl.losses}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">Active Positions</div>
        <div class="stat-value">${t.positions.length}</div>
      </div>

    </div>

    <h3>Active Positions</h3>

    ${
      t.positions.length
      ? t.positions.map(renderPosition).join("")
      : `<div class="muted">No current active positions.</div>`
    }

    <h3 style="margin-top:25px">Recent Trades</h3>

    ${
      recent.length
      ? recent.map(renderTrade).join("")
      : `<div class="muted">No recent trades returned.</div>`
    }

  </div>`;
}

function renderPosition(p){

  const spent=
    Number(
      p.initialValue ??
      p.initial_value ??
      (
        Number(p.size||0) *
        Number(p.avgPrice||p.avg_price||0)
      )
    );

  return `
  <div class="position">
    <div class="position-title">
      ${escapeHtml(
        p.title ||
        p.question ||
        p.marketTitle ||
        "Unknown market"
      )}
    </div>

    ${outcomeBadge(
      p.outcome ||
      p.side ||
      ""
    )}

    <span class="small">
      Shares: ${num(p.size)}
    </span>

    <span class="small">
      Avg: ${Number(
        p.avgPrice ||
        p.avg_price ||
        p.price ||
        0
      ).toFixed(3)}
    </span>

    <div style="margin-top:8px">
      <b>Spent:</b> ${money(spent)}
      &nbsp; · &nbsp;
      <b>Current value:</b> ${money(p.currentValue)}
    </div>

    <div class="small" style="margin-top:6px">
      Bought in:
      ${date(
        p.timestamp ||
        p.createdAt ||
        p.created_at ||
        p.firstEntryAt
      )}
    </div>
  </div>`;
}

function renderTrade(t){

  const price=Number(t.price||0);
  const size=Number(t.size||0);

  /*
    For a BUY, price × size is the amount spent.
    For SELL it represents the gross sale amount.
  */
  const amount=price*size;

  return `
  <div class="position">
    <div>
      <span class="badge ${
        String(t.side||"").toUpperCase()==="BUY"
          ? "yes"
          : "no"
      }">
        ${escapeHtml(t.side||"TRADE")}
      </span>

      ${outcomeBadge(
        t.outcome ||
        t.asset ||
        ""
      )}
    </div>

    <div class="position-title" style="margin-top:8px">
      ${escapeHtml(
        t.title ||
        t.market ||
        t.question ||
        "Unknown market"
      )}
    </div>

    <div>
      <b>Amount:</b> ${money(amount)}
      &nbsp; · &nbsp;
      <b>Shares:</b> ${num(size)}
      &nbsp; · &nbsp;
      <b>Price:</b> ${price.toFixed(3)}
    </div>

    <div class="small" style="margin-top:6px">
      ${date(t.timestamp)}
    </div>
  </div>`;
}

/*
  Build one market record from every current position
  held by the Top 100.
*/
function buildMarkets(){

  const map=new Map();

  for(const trader of traders){

    for(const p of trader.positions){

      const key=
        p.conditionId ||
        p.conditionID ||
        p.market ||
        p.asset ||
        p.title;

      if(!key) continue;

      if(!map.has(key)){
        map.set(key,{
          key,
          title:
            p.title ||
            p.question ||
            p.marketTitle ||
            "Unknown market",
          wallets:[],
          volume:0,
          outcomes:new Map()
        });
      }

      const m=map.get(key);

      const invested=Number(
        p.initialValue ??
        p.initial_value ??
        (
          Number(p.size||0) *
          Number(p.avgPrice||p.avg_price||0)
        )
      );

      m.volume+=invested;

      const outcome=
        p.outcome ||
        p.side ||
        "Unknown";

      if(!m.outcomes.has(outcome)){
        m.outcomes.set(outcome,{
          count:0,
          volume:0
        });
      }

      m.outcomes.get(outcome).count++;
      m.outcomes.get(outcome).volume+=invested;

      m.wallets.push({
        trader,
        position:p,
        volume:invested,
        outcome
      });
    }
  }

  markets=[...map.values()]
    .sort((a,b)=>b.volume-a.volume);
}

function isBinaryMarket(m){

  const outcomes=[...m.outcomes.keys()]
    .map(x=>x.toLowerCase());

  return outcomes.every(
    x=>x==="yes" || x==="no"
  );
}

function renderMarkets(){

  const q=
    document.getElementById("marketSearch")
      .value.toLowerCase()
      .trim();

  const min=
    Number(document.getElementById("walletFilter").value);

  const filtered=markets.filter(m=>
    m.wallets.length>=min &&
    m.title.toLowerCase().includes(q)
  );

  let html=`
  <table>
    <thead>
      <tr>
        <th>MARKET</th>
        <th>WALLETS</th>
        <th>POSITIONS</th>
        <th>OUTCOMES</th>
        <th>TOTAL VOLUME</th>
      </tr>
    </thead>
    <tbody>`;

  for(const m of filtered){

    html+=`
    <tr class="market-row"
        onclick="toggleMarket('${encodeURIComponent(m.key)}')">

      <td>
        <span class="market-title">
          ${escapeHtml(m.title)}
        </span>
      </td>

      <td>${m.wallets.length}</td>

      <td>${m.wallets.length}</td>

      <td>
        <div class="distribution">
          ${renderDistribution(m)}
        </div>
      </td>

      <td class="volume">
        ${money(m.volume)}
      </td>

    </tr>`;

    if(
      expandedMarket ===
      encodeURIComponent(m.key)
    ){
      html+=`
      <tr class="market-detail">
        <td colspan="5">
          ${renderMarketDetail(m)}
        </td>
      </tr>`;
    }
  }

  html+=`</tbody></table>`;

  document.getElementById("markets").innerHTML=html;
}

function renderDistribution(m){

  let html="";

  for(const [outcome,data] of m.outcomes){

    const pct=
      m.wallets.length
        ? data.count/m.wallets.length*100
        : 0;

    html+=`
      <span
        class="badge team"
        style="${
          teamColor(outcome)
            ? `background:${teamColor(outcome)};`
            : (
              outcome.toLowerCase()==="yes"
                ? "background:#073d20;"
                : outcome.toLowerCase()==="no"
                  ? "background:#481313;"
                  : ""
            )
        }"
      >
        ${escapeHtml(outcome)}
        ${data.count}
        (${pct.toFixed(1)}%)
      </span>`;
  }

  return html;
}

function renderMarketDetail(m){

  const binary=isBinaryMarket(m);

  return `
  <div class="detail">

    <div class="stats">

      ${
        binary
        ? `
        <div class="stat">
          <div class="stat-label">YES</div>
          <div class="stat-value">
            ${
              [...m.outcomes.entries()]
                .find(([k])=>k.toLowerCase()==="yes")
                ?. [1]?.count || 0
            }
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">NO</div>
          <div class="stat-value">
            ${
              [...m.outcomes.entries()]
                .find(([k])=>k.toLowerCase()==="no")
                ?. [1]?.count || 0
            }
          </div>
        </div>
        `
        : `
        <div class="stat">
          <div class="stat-label">OUTCOMES</div>
          <div class="stat-value">
            ${m.outcomes.size}
          </div>
        </div>
        `
      }

      <div class="stat">
        <div class="stat-label">TOP-100 WALLETS</div>
        <div class="stat-value">
          ${m.wallets.length}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">TOTAL VOLUME</div>
        <div class="stat-value">
          ${money(m.volume)}
        </div>
      </div>

    </div>

    <h3>
      Top-100 traders with an active position
    </h3>

    ${m.wallets
      .sort((a,b)=>b.volume-a.volume)
      .map(w=>{

        const p=w.position;

        return `
        <div class="market-wallet">

          <div class="trader-name">
            ${escapeHtml(w.trader.name)}

            ${outcomeBadge(w.outcome)}
          </div>

          <div class="wallet">
            ${escapeHtml(shortWallet(w.trader.wallet))}
          </div>

          <div style="margin-top:8px">

            <b>Volume invested:</b>
            ${money(w.volume)}

            &nbsp; · &nbsp;

            <b>Shares:</b>
            ${num(p.size)}

            &nbsp; · &nbsp;

            <b>Avg entry:</b>
            ${Number(
              p.avgPrice ||
              p.avg_price ||
              p.price ||
              0
            ).toFixed(3)}

          </div>

          <div class="small" style="margin-top:6px">
            Bought in:
            ${date(
              p.timestamp ||
              p.createdAt ||
              p.created_at ||
              p.firstEntryAt
            )}
          </div>

        </div>`;
      }).join("")}

  </div>`;
}

function toggleTrader(wallet){
  expandedTrader =
    expandedTrader===wallet
      ? null
      : wallet;

  renderTraders();
}

function toggleMarket(key){
  expandedMarket =
    expandedMarket===key
      ? null
      : key;

  renderMarkets();
}

/*
  Start automatically.
*/
scan();
</script>
</body>
</html>
