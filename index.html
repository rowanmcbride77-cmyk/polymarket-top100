<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket Trader Tracker</title>

<style>
*{box-sizing:border-box}

body{

    background:#080808;
    color:#f5f5f5;
    font-family:Inter,Arial,sans-serif;

.container{

}

h2{

}

h3{

}

.subtitle,.muted,.small{

}

.scan{
    float:right;

    color:#000;
    border:0;
    border-radius:9px;
    padding:11px 18px;
    font-weight:700;
    cursor:pointer;
}

.status{
    clear:both;
    margin:25px 0;
    padding:14px 16px;
    border-radius:10px;
    background:#111;
    border:1px solid #292929;
}

.status.good{
    color:#70e89a;
    border-color:#1e6b38;
}

.status.bad{

    border-color:#7a2525;
}

.card{
    background:#0d0d0d;

    border-radius:16px;

    margin-top:24px;
}

.controls{

    flex-wrap:wrap;

}

select,input,button{

    color:#fff;
    border:1px solid #333;

}

select{
    min-width:180px;

input{

button{

.stat-value{

.money{

.loss{

.trader-name{

}

.wallet{

    margin-top:3px;

.position,.market-wallet{

    border-radius:10px;

.position-title{
    font-weight:700;
    margin-bottom:8px;
}

    padding:4px 9px;
    border-radius:999px;

    font-weight:700;
    margin-right:5px;

.yes{
    background:#073d20;
    color:#55ed99;
}

.no{
    background:#481313;
    color:#ff7070;
}

    background:#242424;
    color:#fff;

.multi{
    color:#ffca58;

}

    .stats{

}

@media(max-width:650px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .container{

let traders = [];
let events = [];

let expandedTrader = null;

let currentDays = 7;
let currentRanking = "winloss";

function money(n){

    return Number(n || 0).toLocaleString(
        "en-US",
        {
            style:"currency",
            currency:"USD",
            maximumFractionDigits:2
        }
    );
}

function num(n){

    return Number(n || 0).toLocaleString(
        "en-US",
        {maximumFractionDigits:2}
    );
}

function escapeHtml(v){

    return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function shortWallet(w){

    if(!w) return "";

    return w.slice(0,6) + "..." + w.slice(-4);
}

function formatDate(v){

    if(!v) return "Unknown";

    let d;

    if(typeof v === "number"){

        d = new Date(
            v < 100000000000
                ? v * 1000
                : v
        );

    }else{

        d = new Date(v);

    }

    if(isNaN(d.getTime())) return "Unknown";

    return d.toLocaleString();
}

function normalizeArray(x){

    if(Array.isArray(x)) return x;

    if(Array.isArray(x?.data)) return x.data;

    if(Array.isArray(x?.results)) return x.results;

    return [];
}

async function api(path){

    const response =
        await fetch(PROXY + path);

    if(!response.ok){

        throw new Error(
            "API error " +
            response.status +
            ": " +
            await response.text()
        );
    }

    return await response.json();
}

function getTeamColor(name){

    const lower =
        String(name || "").toLowerCase();

    for(const [team,color]
        of Object.entries(TEAM_COLORS)){

        if(lower.includes(team))
            return color;
    }

    return null;
}

function outcomeBadge(outcome){

    if(!outcome) return "";

    const text =
        String(outcome).trim();

    const lower =
        text.toLowerCase();

    if(lower === "yes")
        return `<span class="badge yes">YES</span>`;

    if(lower === "no")
        return `<span class="badge no">NO</span>`;

    const color =
        getTeamColor(text);

    return `
        <span
            class="badge team"
            style="${color ? "background:"+color+";" : ""}"
        >
            ${escapeHtml(text)}
        </span>
    `;
}

/* =========================================================
   LEADERBOARD
========================================================= */

async function getWallets(){

    /*
      We intentionally do NOT rank these by profit here.

      We pull the leaderboard wallets, then calculate their
      actual period performance ourselves.
    */

    const pages =
        await Promise.all([

            api(
                "/v1/leaderboard" +
                "?timePeriod=WEEK" +
                "&orderBy=PNL" +
                "&limit=50" +
                "&offset=0"
            ),

            api(
                "/v1/leaderboard" +
                "?timePeriod=WEEK" +
                "&orderBy=PNL" +
                "&limit=50" +
                "&offset=50"
            )

        ]);

    const rows = [
        ...normalizeArray(pages[0]),
        ...normalizeArray(pages[1])
    ];

    const map = new Map();

    for(const r of rows){

        const wallet =
            r.proxyWallet ||
            r.address ||
            r.wallet ||
            r.user ||
            "";

        if(wallet)
            map.set(wallet.toLowerCase(),r);
    }

    return [...map.values()].slice(0,100);
}

function normalizeTrader(row){

    return {

        rank:Number(row.rank || 0),

        wallet:
            row.proxyWallet ||
            row.address ||
            row.wallet ||
            row.user ||
            "",

        name:
            row.userName ||
            row.username ||
            row.name ||
            row.pseudonym ||
            "Unknown",

        positions:[],
        trades:[],
        closed:[],

        pnl:0,
        volume:0,
        wins:0,
        losses:0,
        resolved:0,
        winPct:0,
        roi:0,
        ratio:0

    };
}

/* =========================================================
   RAW DATA
========================================================= */

async function getPositions(wallet){

    const data =
        await api(
            "/positions?user=" +
            encodeURIComponent(wallet) +
            "&limit=500"
        );

    return normalizeArray(data);
}

async function getTrades(wallet){

    const data =
        await api(
            "/trades?user=" +
            encodeURIComponent(wallet) +
            "&limit=500"
        );

    return normalizeArray(data);
}

async function getClosed(wallet){

    try{

        const data =
            await api(
                "/closed-positions?user=" +
                encodeURIComponent(wallet) +
                "&limit=500"
            );

        return normalizeArray(data);

    }catch(e){

        console.warn(
            "Closed-position endpoint failed",
            wallet,
            e
        );

        return [];
    }
}

/* =========================================================
   TIME / P&L
========================================================= */

function timestampOf(x){

    return (
        x.timestamp ||
        x.closedAt ||
        x.closed_at ||
        x.updatedAt ||
        x.updated_at ||
        x.createdAt ||
        x.created_at ||
        x.endDate ||
        x.end_date ||
        0
    );
}

function timestampMs(v){

    if(!v) return 0;

    if(typeof v === "number"){

        return v < 100000000000
            ? v * 1000
            : v;
    }

    const t =
        new Date(v).getTime();

    return Number.isFinite(t) ? t : 0;
}

function isWithinPeriod(x){

    const t =
        timestampMs(timestampOf(x));

    if(!t) return false;

    const cutoff =
        Date.now() -
        currentDays *
        86400000;

    return t >= cutoff &&
           t <= Date.now();
}

function getPnl(x){

    return Number(
        x.realizedPnl ??
        x.realizedPNL ??
        x.realized_pnl ??
        x.cashPnl ??
        x.cash_pnl ??
        x.pnl ??
        x.PnL ??
        0
    );
}

function getCost(x){

    return Number(
        x.entry_cost_usdc ??
        x.entryCost ??
        x.initialValue ??
        x.initial_value ??
        x.cost ??
        x.amount ??
        0
    );
}

function calculateStats(closed){

    let wins = 0;
    let losses = 0;
    let pnl = 0;
    let volume = 0;

    for(const p of closed){

        if(!isWithinPeriod(p))
            continue;

        const result =
            getPnl(p);

        const cost =
            getCost(p);

        if(result > 0){

            wins++;

        }else if(result < 0){

            losses++;

        }else{

            continue;
        }

        pnl += result;
        volume += Math.abs(cost);
    }

    const resolved =
        wins + losses;

    const winPct =
        resolved
            ? wins / resolved * 100
            : 0;

    /*
      ROI = realized profit / capital deployed

      We deliberately do NOT use:
      P&L / current bankroll

      because that produces misleading ROI for traders
      with changing bankrolls.
    */

    const roi =
        volume > 0
            ? pnl / volume * 100
            : 0;

    /*
      Ratio is wins/losses.

      A zero-loss record is displayed as infinity,
      but the resolved count remains visible so that
      2-0 isn't confused with 50-0.
    */

    const ratio =
        losses === 0
            ? (wins > 0 ? Infinity : 0)
            : wins / losses;

    return {
        wins,
        losses,
        resolved,
        pnl,
        volume,
        winPct,
        roi,
        ratio
    };
}

/* =========================================================
   ACTIVE POSITION VALIDATION
========================================================= */

function marketEndTime(p){

    return timestampMs(
        p.endDate ||
        p.end_date ||
        p.endDateIso ||
        p.end_date_iso ||
        p.marketEndDate ||
        p.endTime ||
        p.end_time
    );
}

function positionIsActuallyActive(p){

    /*
      First remove explicit closed positions.
    */

    if(p.closed === true)
        return false;

    if(p.redeemed === true)
        return false;

    if(p.redeemable === true)
        return false;

    if(p.size !== undefined &&
       Number(p.size) <= 0)
        return false;

    /*
      Critical fix:
      If the market has already ended,
      it cannot appear under Active Positions.
    */

    const end =
        marketEndTime(p);

    if(end && end <= Date.now())
        return false;

    /*
      If the API explicitly tells us the position
      is closed, don't display it.
    */

    const status =
        String(
            p.status ||
            p.positionStatus ||
            ""
        ).toLowerCase();

    if(
        status === "closed" ||
        status === "settled" ||
        status === "resolved"
    ){
        return false;
    }

    return true;
}

function getEntryTime(p){

    return (
        p.timestamp ||
        p.createdAt ||
        p.created_at ||
        p.firstEntryAt ||
        p.first_entry_at ||
        p.entryTimestamp ||
        p.entry_timestamp
    );
}

function getInvested(p){

    const direct =
        Number(
            p.initialValue ??
            p.initial_value ??
            p.entry_cost_usdc ??
            p.entryCost ??
            0
        );

    if(direct)
        return Math.abs(direct);

    const shares =
        Number(p.size || 0);

    const price =
        Number(
            p.avgPrice ??
            p.avg_price ??
            p.price ??
            0
        );

    return Math.abs(
        shares * price
    );
}

/* =========================================================
   LOAD TRADERS
========================================================= */

async function loadTrader(t){

    const [
        positions,
        trades,
        closed
    ] =
        await Promise.all([

            getPositions(t.wallet),
            getTrades(t.wallet),
            getClosed(t.wallet)

        ]);

    t.positions =
        positions.filter(
            positionIsActuallyActive
        );

    t.trades =
        trades;

    t.closed =
        closed;

    const stats =
        calculateStats(closed);

    t.wins =
        stats.wins;

    t.losses =
        stats.losses;

    t.resolved =
        stats.resolved;

    t.pnl =
        stats.pnl;

    t.volume =
        stats.volume;

    t.winPct =
        stats.winPct;

    t.roi =
        stats.roi;

    t.ratio =
        stats.ratio;

    return t;
}

async function mapLimit(items,limit,fn){

    const output =
        new Array(items.length);

    let next = 0;

    async function worker(){

        while(true){

            const i =
                next++;

            if(i >= items.length)
                return;

            try{

                output[i] =
                    await fn(items[i]);

            }catch(e){

                console.error(e);

                output[i] =
                    items[i];
            }
        }
    }

    await Promise.all(
        Array.from(
            {
                length:
                    Math.min(
                        limit,
                        items.length
                    )
            },
            worker
        )
    );

    return output;
}

/* =========================================================
   RANKING
========================================================= */

function rankingValue(t){

    switch(currentRanking){

        case "winloss":
            return t.ratio;

        case "winpct":
            return t.winPct;

        case "profit":
            return t.pnl;

        case "roi":
            return t.roi;

        case "volume":
            return t.volume;

        default:
            return t.ratio;
    }
}

function applyRanking(){

    currentDays =
        Number(
            document.getElementById(
                "period"
            ).value
        );

    currentRanking =
        document.getElementById(
            "ranking"
        ).value;

    sortTraders();

    renderTraders();
}

function sortTraders(){

    traders.sort(
        (a,b)=>{

            const av =
                rankingValue(a);

            const bv =
                rankingValue(b);

            if(
                currentRanking === "winloss" &&
                av === Infinity &&
                bv !== Infinity
            )
                return -1;

            if(
                currentRanking === "winloss" &&
                bv === Infinity &&
                av !== Infinity
            )
                return 1;

            if(av !== bv)
                return bv - av;

            /*
              Tie breaker:
              more resolved trades first.
            */

            if(a.resolved !== b.resolved)
                return b.resolved-a.resolved;

            return b.pnl-a.pnl;
        }
    );
}

/* =========================================================
   LEADERBOARD DISPLAY
========================================================= */

function renderTraders(){

    const q =
        document.getElementById(
            "traderSearch"
        ).value.toLowerCase().trim();

    const filtered =
        traders.filter(t=>
            t.name
                .toLowerCase()
                .includes(q) ||
            t.wallet
                .toLowerCase()
                .includes(q)
        );

    let html = `

    <table>

    <thead>

    <tr>

    <th>RANK</th>
    <th>TRADER</th>
    <th>W/L</th>
    <th>WIN %</th>
    <th>PROFIT</th>
    <th>ROI</th>
    <th>VOLUME</th>
    <th>RESOLVED</th>

    </tr>

    </thead>

    <tbody>
    `;

    filtered.forEach((t,index)=>{

        const rank =
            index + 1;

        const ratio =
            t.losses === 0
                ? (
                    t.wins > 0
                        ? "∞"
                        : "—"
                  )
                : t.ratio.toFixed(2);

        html += `

        <tr
            class="clickable"
            onclick="toggleTrader('${escapeHtml(t.wallet)}')"
        >

        <td>
            <b>${rank}</b>
        </td>

        <td>

            <div class="trader-name">
                ${escapeHtml(t.name)}
            </div>

            <div class="wallet">
                ${shortWallet(t.wallet)}
            </div>

        </td>

        <td>
            <b>${t.wins}-${t.losses}</b>
            <div class="small">
                Ratio: ${ratio}
            </div>
        </td>

        <td>
            ${t.resolved
                ? t.winPct.toFixed(1)+"%"
                : "—"}
        </td>

        <td
            class="${t.pnl >= 0
                ? "money"
                : "loss"}"
        >
            ${money(t.pnl)}
        </td>

        <td>
            ${t.resolved
                ? t.roi.toFixed(2)+"%"
                : "—"}
        </td>

        <td>
            ${money(t.volume)}
        </td>

        <td>
            ${t.resolved}
        </td>

        </tr>
        `;

        if(
            expandedTrader ===
            t.wallet
        ){

            html += `

            <tr class="expand">

            <td colspan="8">

            ${renderTraderDetail(t)}

            </td>

            </tr>
            `;
        }

    });

    html += `
    </tbody>
    </table>
    `;

    document.getElementById(
        "leaderboard"
    ).innerHTML = html;
}

function renderTraderDetail(t){

    return `

    <div class="detail">

        <div class="stats">

            <div class="stat">
                <div class="stat-label">
                    RECORD
                </div>
                <div class="stat-value">
                    ${t.wins}-${t.losses}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    WIN %
                </div>
                <div class="stat-value">
                    ${t.resolved
                        ? t.winPct.toFixed(1)+"%"
                        : "—"}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    PROFIT
                </div>
                <div class="stat-value ${
                    t.pnl >= 0
                        ? "money"
                        : "loss"
                }">
                    ${money(t.pnl)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    ROI
                </div>
                <div class="stat-value">
                    ${t.resolved
                        ? t.roi.toFixed(2)+"%"
                        : "—"}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    VOLUME
                </div>
                <div class="stat-value">
                    ${money(t.volume)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    ACTIVE
                </div>
                <div class="stat-value">
                    ${t.positions.length}
                </div>
            </div>

        </div>

        <h3>
            Active Positions
        </h3>

        ${
            t.positions.length
                ? t.positions
                    .map(renderPosition)
                    .join("")
                : `<div class="muted">
                    No verified active positions.
                   </div>`
        }

        <h3>
            Recent Trades
        </h3>

        ${
            t.trades.length
                ? t.trades
                    .slice()
                    .sort(
                        (a,b)=>
                            timestampMs(
                                timestampOf(b)
                            ) -
                            timestampMs(
                                timestampOf(a)
                            )
                    )
                    .slice(0,30)
                    .map(renderTrade)
                    .join("")
                : `<div class="muted">
                    No recent trades returned.
                   </div>`
        }

    </div>
    `;
}

function renderPosition(p){

    return `

    <div class="position">

        <div class="position-title">

            ${escapeHtml(
                p.title ||
                p.question ||
                p.marketTitle ||
                "Unknown market"
            )}

        </div>

        ${
            outcomeBadge(
                p.outcome ||
                p.side ||
                ""
            )
        }

        <div style="margin-top:8px">

            <b>Amount invested:</b>
            ${money(getInvested(p))}

            &nbsp; · &nbsp;

            <b>Shares:</b>
            ${num(p.size)}

            &nbsp; · &nbsp;

            <b>Entry:</b>
            ${Number(
                p.avgPrice ||
                p.avg_price ||
                p.price ||
                0
            ).toFixed(3)}

        </div>

        <div class="small" style="margin-top:7px">

            <b>Bought:</b>
            ${formatDate(getEntryTime(p))}

        </div>

        ${
            marketEndTime(p)
                ? `
                <div
                    class="small"
                    style="margin-top:4px"
                >
                    Market ends:
                    ${formatDate(

                `

        }

    `;
}

function renderTrade(t){

    const price =
        Number(t.price || 0);

    const size =
        Number(t.size || 0);

    return `

    <div class="position">

        ${
            outcomeBadge(
                t.outcome ||
                t.side ||
                ""
            )
        }

        <div class="position-title"
             style="margin-top:8px">

            ${escapeHtml(
                t.title ||
                t.market ||
                t.question ||

            )}

        </div>

        <div>

            <b>Amount:</b>

        <div class="small"

function toggleTrader(wallet){

    expandedTrader =
        expandedTrader === wallet
            ? null
            : wallet;

    renderTraders();
}

/* =========================================================
   EVENTS
========================================================= */

function eventIdentity(p){

    return (
        p.eventId ||
        p.eventID ||
        p.event_id ||
        p.eventSlug ||
        p.event_slug ||
        p.eventTitle ||
        p.event_title ||
        p.groupItemTitle ||
        p.conditionId ||
        p.conditionID ||
        p.market
    );
}

function eventTitle(p){

    return (
        p.eventTitle ||
        p.event_title ||
        p.eventName ||
        p.event_name ||
        p.groupItemTitle ||
        p.title ||
        p.question ||
        "Unknown Event"
    );
}

function buildEvents(){

    const map =
        new Map();

    for(const trader of traders){

        for(const p of trader.positions){

            const key =
                eventIdentity(p);

            if(!key)
                continue;

            if(!map.has(key)){

                map.set(
                    key,
                    {
                        key,
                        title:eventTitle(p),
                        wallets:[],
                        outcomes:new Map(),
                        volume:0
                    }
                );
            }

            const event =
                map.get(key);

            const invested =
                getInvested(p);

            const outcome =
                p.outcome ||
                p.side ||
                "Unknown";

            event.volume +=
                invested;

            if(
                !event.outcomes
                    .has(outcome)
            ){

                event.outcomes.set(
                    outcome,
                    {
                        wallets:new Set(),
                        volume:0
                    }
                );
            }

            const outcomeData =
                event.outcomes
                    .get(outcome);

            outcomeData.wallets
                .add(trader.wallet);

            outcomeData.volume +=
                invested;

            event.wallets.push({
                trader,
                position:p,
                outcome,
                volume:invested
            });
        }
    }

    events =
        [...map.values()]
        .sort(
            (a,b)=>
                b.volume-a.volume
        );
}

function renderEvents(){

    const q =
        document.getElementById(
            "eventSearch"
        ).value.toLowerCase().trim();

    const min =
        Number(
            document.getElementById(
                "walletFilter"
            ).value
        );

    const filtered =
        events.filter(e=>{

            const walletCount =
                new Set(
                    e.wallets
                        .map(x=>x.trader.wallet)
                ).size;

            return (
                walletCount >= min &&
                e.title
                    .toLowerCase()
                    .includes(q)
            );
        });

    let html = `

    <table>

    <thead>

    <tr>
        <th>EVENT</th>
        <th>WALLETS</th>
        <th>OUTCOMES</th>
        <th>TOTAL VOLUME</th>
    </tr>

    </thead>

    <tbody>
    `;

    for(const e of filtered){

        const key =
            encodeURIComponent(e.key);

        const walletCount =
            new Set(
                e.wallets
                    .map(x=>x.trader.wallet)
            ).size;

        html += `

        <tr
            class="market-row"
            onclick="toggleEvent('${key}')"
        >

        <td>
            <b>
                ${escapeHtml(e.title)}
            </b>
        </td>

        <td>
            ${walletCount}
        </td>

        <td>
            ${renderEventDistribution(e)}
        </td>

        <td class="volume">
            ${money(e.volume)}
        </td>

        </tr>
        `;

        if(
            expandedEvent === key
        ){

            html += `

            <tr class="market-detail">

            <td colspan="4">

            ${renderEventDetail(e)}

            </td>

            </tr>
            `;
        }
    }

    html += `
    </tbody>
    </table>
    `;

    document.getElementById(
        "events"
    ).innerHTML = html;
}

function renderEventDistribution(e){

    let html = "";

    const totalWallets =
        new Set(
            e.wallets
                .map(x=>x.trader.wallet)
        ).size;

    for(
        const [
            outcome,
            data
        ]
        of e.outcomes
    ){

        const count =
            data.wallets.size;

        const pct =
            totalWallets
                ? count /
                  totalWallets *
                  100
                : 0;

        const color =
            getTeamColor(outcome);

        html += `

        <span
            class="badge team"
            style="${
                color
                    ? "background:"+color+";"
                    : ""
            }"
        >

            ${escapeHtml(outcome)}

            ${count}

            (${pct.toFixed(1)}%)

        </span>
        `;
    }

    return html;
}

function renderEventDetail(e){

    const walletMap =
        new Map();

    for(const item of e.wallets){

        if(
            !walletMap.has(
                item.trader.wallet
            )
        ){

            walletMap.set(
                item.trader.wallet,
                []
            );
        }

        walletMap
            .get(item.trader.wallet)
            .push(item);
    }

    let html = `

    <div class="detail">

    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                WALLETS
            </div>
            <div class="stat-value">
                ${walletMap.size}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                OUTCOMES
            </div>
            <div class="stat-value">
                ${e.outcomes.size}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                TOTAL VOLUME
            </div>
            <div class="stat-value">
                ${money(e.volume)}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                MULTI-OUTCOME
            </div>
            <div class="stat-value">
                ${
                    [...walletMap.values()]
                        .filter(x=>x.length>1)
                        .length
                }
            </div>
        </div>

    </div>

    <h3>
        Outcome Distribution
    </h3>

    <div>
        ${renderEventDistribution(e)}
    </div>

    <h3>
        Top-100 Wallets in This Event
    </h3>
    `;

    for(
        const [
            wallet,
            positions
        ]
        of walletMap
    ){

        const trader =
            positions[0].trader;

        const multi =
            positions.length > 1;

        html += `

        <div class="market-wallet">

            <div class="trader-name">

                ${escapeHtml(
                    trader.name
                )}

                ${
                    multi
                        ? `
                        <span class="multi">
                            MULTI-OUTCOME
                        </span>
                        `
                        : ""
                }

            </div>

            <div class="wallet">
                ${shortWallet(wallet)}
            </div>
        `;

        for(const item of positions){

            const p =
                item.position;

            html += `

            <div class="position">

                ${outcomeBadge(
                    item.outcome
                )}

                <div
                    style="margin-top:8px"
                >

                    <b>Volume:</b>
                    ${money(item.volume)}

                    &nbsp; · &nbsp;

                    <b>Shares:</b>
                    ${num(p.size)}

                    &nbsp; · &nbsp;

                    <b>Entry:</b>
                    ${Number(
                        p.avgPrice ||
                        p.avg_price ||
                        p.price ||
                        0
                    ).toFixed(3)}

                </div>

                <div
                    class="small"
                    style="margin-top:6px"
                >

                    <b>Bought:</b>
                    ${formatDate(
                        getEntryTime(p)
                    )}

                </div>

            </div>
            `;
        }

        html += `
        </div>
        `;
    }

    html += `
    </div>
    `;

    return html;
}

function toggleEvent(key){

    expandedEvent =
        expandedEvent === key
            ? null
            : key;

    renderEvents();
}

/* =========================================================
   SCAN
========================================================= */

async function scan(){

    const status =
        document.getElementById(
            "status"
        );

    currentDays =
        Number(
            document.getElementById(
                "period"
            ).value
        );

    currentRanking =
        document.getElementById(
            "ranking"
        ).value;

    status.className =
        "status";

    status.textContent =
        "Loading Top 100 wallets...";

    try{

        const rows =
            await getWallets();

        if(rows.length < 100){

            throw new Error(
                "Only " +
                rows.length +
                " wallets were returned. " +
                "The proxy did not return the complete Top 100."
            );
        }

        traders =
            rows
                .slice(0,100)
                .map(normalizeTrader);

        let completed = 0;

        /*
          10 simultaneous wallet requests keeps this
          substantially faster than processing wallets
          one at a time.
        */

        traders =
            await mapLimit(
                traders,
                10,
                async trader=>{

                    const result =
                        await loadTrader(
                            trader
                        );

                    completed++;

                    status.textContent =
                        "Analyzing " +
                        completed +
                        "/100 traders...";

                    return result;
                }
            );

        sortTraders();

        buildEvents();

        renderTraders();

        renderEvents();

        status.className =
            "status good";

        status.textContent =
            "Loaded 100 traders. " +
            "Ranking: " +
            document.getElementById(
                "ranking"
            ).selectedOptions[0].text +
            " · Period: " +
            document.getElementById(
                "period"
            ).selectedOptions[0].text;

    }catch(error){

        console.error(error);

        status.className =
            "status bad";

        status.textContent =
            "Scan failed: " +
            error.message;
    }
}

scan();
