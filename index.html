<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Top Traders</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 22px 25px 14px;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  background: #000;
  z-index: 20;
}

h1 {
  margin: 0 0 15px;
  font-size: 25px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

select,
button {
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 7px;
  padding: 9px 12px;
  font-size: 14px;
}

button {
  cursor: pointer;
  font-weight: 700;
}

button:hover {
  background: #1c1c1c;
}

main {
  padding: 20px 25px 50px;
  max-width: 1500px;
  margin: auto;
}

.status {
  margin-bottom: 18px;
  color: #aaa;
  font-size: 14px;
}

.progress-wrap {
  width: 100%;
  height: 7px;
  background: #151515;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.progress {
  height: 100%;
  width: 0%;
  background: #fff;
  transition: width .2s;
}

.section {
  margin-top: 28px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-title h2 {
  margin: 0;
  font-size: 19px;
}

.count {
  color: #888;
  font-size: 13px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid #222;
  border-radius: 9px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th {
  background: #111;
  color: #999;
  font-size: 12px;
  text-align: left;
  padding: 11px;
  border-bottom: 1px solid #222;
}

td {
  padding: 11px;
  border-bottom: 1px solid #171717;
  font-size: 14px;
}

tr:last-child td {
  border-bottom: 0;
}

.rank {
  color: #777;
  width: 50px;
}

.name {
  font-weight: 700;
}

.record {
  font-weight: 700;
}

.ratio {
  font-weight: 700;
}

.good {
  color: #fff;
}

.bad {
  color: #aaa;
}

.market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 12px;
}

.market {
  background: #0b0b0b;
  border: 1px solid #222;
  border-radius: 9px;
  padding: 15px;
}

.market-title {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.35;
  margin-bottom: 9px;
}

.market-meta {
  color: #888;
  font-size: 12px;
  margin-bottom: 12px;
}

.side {
  display: inline-block;
  background: #171717;
  border: 1px solid #303030;
  border-radius: 5px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 700;
  margin-right: 5px;
}

.holder {
  border-top: 1px solid #1d1d1d;
  padding: 9px 0;
  font-size: 13px;
}

.holder:first-child {
  border-top: 0;
}

.holder-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.holder-name {
  font-weight: 700;
}

.holder-record {
  color: #aaa;
}

.holder-details {
  color: #888;
  margin-top: 4px;
  font-size: 12px;
}

.empty {
  border: 1px solid #222;
  border-radius: 8px;
  padding: 25px;
  color: #777;
  text-align: center;
}

.error {
  color: #aaa;
  border: 1px solid #333;
  padding: 15px;
  border-radius: 8px;
  background: #0b0b0b;
}

.hidden {
  display: none;
}

.small {
  font-size: 12px;
  color: #777;
}

@media(max-width:700px) {
  header,
  main {
    padding-left: 12px;
    padding-right: 12px;
  }

  .market-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Polymarket Top Traders</h1>

  <div class="controls">
    <select id="period">
      <option value="week">Week</option>
      <option value="month">Month</option>
      <option value="3m">3 Months</option>
    </select>

    <select id="threshold">
      <option value="1">1+ traders</option>
      <option value="2">2+ traders</option>
      <option value="5">5+ traders</option>
      <option value="10">10+ traders</option>
    </select>

    <button id="scanBtn">Scan</button>
  </div>
</header>

<main>

  <div class="status" id="status">
    Ready.
    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <section class="section">
    <div class="section-title">
      <h2>Top 100 Traders</h2>
      <span class="count" id="topCount">0 traders</span>
    </div>

    <div id="top100">
      <div class="empty">Press Scan.</div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">
      <h2>Shared Active Markets</h2>
      <span class="count" id="marketCount">0 markets</span>
    </div>

    <div id="markets">
      <div class="empty">No scan completed.</div>
    </div>
  </section>

</main>

<script>
const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const $ = id => document.getElementById(id);

const state = {
  traders: [],
  markets: []
};

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function setStatus(text, percent = null) {
  $("status").childNodes[0].nodeValue = text + " ";

  if (percent !== null) {
    $("progress").style.width = Math.max(0, Math.min(100, percent)) + "%";
  }
}

function formatMoney(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) return "—";

  return n.toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 2
  });
}

function formatNumber(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) return "—";

  return n.toLocaleString("en-US", {
    maximumFractionDigits: 2
  });
}

function formatDate(value) {
  if (!value) return "Unknown";

  let date;

  if (typeof value === "number") {
    date = new Date(
      value < 10000000000 ? value * 1000 : value
    );
  } else {
    date = new Date(value);
  }

  if (Number.isNaN(date.getTime())) return "Unknown";

  return date.toLocaleString();
}

function ratio(wins, losses) {
  wins = Number(wins) || 0;
  losses = Number(losses) || 0;

  if (losses === 0) {
    return wins > 0 ? Infinity : 0;
  }

  return wins / losses;
}

function ratioText(wins, losses) {
  wins = Number(wins) || 0;
  losses = Number(losses) || 0;

  if (losses === 0) {
    return wins > 0 ? "∞" : "0.00";
  }

  return (wins / losses).toFixed(2);
}

function normalizeTrader(row) {
  return {
    rank: row.rank ?? row.position ?? null,
    name:
      row.userName ??
      row.username ??
      row.name ??
      row.displayName ??
      "Unknown Trader",

    wallet:
      row.proxyWallet ??
      row.proxy_wallet ??
      row.address ??
      row.wallet ??
      "",

    wins:
      Number(
        row.wins ??
        row.win ??
        row.w ??
        row.resolvedWins ??
        0
      ),

    losses:
      Number(
        row.losses ??
        row.loss ??
        row.l ??
        row.resolvedLosses ??
        0
      ),

    pnl:
      Number(
        row.pnl ??
        row.profit ??
        row.PnL ??
        0
      ),

    volume:
      Number(
        row.volume ??
        row.vol ??
        row.volume_usdc ??
        0
      )
  };
}

function renderTop100(traders) {
  $("topCount").textContent =
    `${traders.length.toLocaleString()} traders`;

  if (!traders.length) {
    $("top100").innerHTML =
      `<div class="empty">No traders returned.</div>`;
    return;
  }

  const rows = traders.map((t, i) => {
    const wins = t.wins;
    const losses = t.losses;

    return `
      <tr>
        <td class="rank">${i + 1}</td>

        <td class="name">
          ${escapeHTML(t.name)}
        </td>

        <td class="record">
          ${wins}-${losses}
        </td>

        <td class="ratio">
          ${ratioText(wins, losses)}
        </td>

        <td>
          ${formatMoney(t.pnl)}
        </td>

        <td>
          ${formatMoney(t.volume)}
        </td>
      </tr>
    `;
  }).join("");

  $("top100").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Trader</th>
            <th>W-L</th>
            <th>W/L</th>
            <th>P&L</th>
            <th>Volume</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  `;
}

function normalizeMarket(row) {
  return {
    title:
      row.title ??
      row.name ??
      row.question ??
      "Unknown Market",

    condition:
      row.condition_id ??
      row.conditionId ??
      row.condition ??
      "",

    outcome:
      row.outcome ??
      row.side ??
      row.position ??
      "Unknown",

    holders:
      Array.isArray(row.holders)
        ? row.holders
        : Array.isArray(row.traders)
          ? row.traders
          : [],

    endDate:
      row.end_date ??
      row.endDate ??
      row.endDateIso ??
      null
  };
}

function renderMarkets(markets) {
  const threshold =
    Number($("threshold").value) || 1;

  const filtered = markets
    .map(normalizeMarket)
    .filter(m => m.holders.length >= threshold)
    .sort((a, b) =>
      b.holders.length - a.holders.length
    );

  $("marketCount").textContent =
    `${filtered.length.toLocaleString()} markets`;

  if (!filtered.length) {
    $("markets").innerHTML =
      `<div class="empty">
        No matching active markets found.
      </div>`;
    return;
  }

  $("markets").innerHTML = `
    <div class="market-grid">
      ${filtered.map(m => `
        <div class="market">

          <div class="market-title">
            ${escapeHTML(m.title)}
          </div>

          <div class="market-meta">
            <span class="side">
              ${escapeHTML(m.outcome)}
            </span>

            ${m.holders.length}
            trader${m.holders.length === 1 ? "" : "s"}

            ${m.endDate
              ? ` · Ends ${escapeHTML(formatDate(m.endDate))}`
              : ""}
          </div>

          ${
            m.holders.map(h => {

              const name =
                h.userName ??
                h.username ??
                h.name ??
                "Unknown Trader";

              const wins =
                Number(
                  h.wins ??
                  h.win ??
                  h.w ??
                  0
                );

              const losses =
                Number(
                  h.losses ??
                  h.loss ??
                  h.l ??
                  0
                );

              const volume =
                Number(
                  h.volume_usdc ??
                  h.volume ??
                  h.usdc ??
                  0
                );

              const bought =
                h.buyTime ??
                h.buy_time ??
                h.firstTradeAt ??
                h.first_trade_at ??
                h.timestamp ??
                h.time ??
                null;

              return `
                <div class="holder">

                  <div class="holder-top">

                    <span class="holder-name">
                      ${escapeHTML(name)}
                    </span>

                    <span class="holder-record">
                      ${wins}-${losses}
                      · ${ratioText(wins, losses)}
                    </span>

                  </div>

                  <div class="holder-details">
                    Bought:
                    ${escapeHTML(formatDate(bought))}
                    · Volume:
                    ${formatMoney(volume)}
                  </div>

                </div>
              `;
            }).join("")
          }

        </div>
      `).join("")}
    </div>
  `;
}

async function api(path, options = {}) {
  const url =
    WORKER.replace(/\/+$/, "") +
    "/" +
    path.replace(/^\/+/, "");

  const response = await fetch(url, {
    ...options,
    headers: {
      "Accept": "application/json",
      ...(options.headers || {})
    }
  });

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      `Worker returned non-JSON (${response.status})`
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      `Worker error ${response.status}`
    );
  }

  return data;
}

function extractArray(data) {
  if (Array.isArray(data)) return data;

  if (Array.isArray(data.data)) return data.data;

  if (Array.isArray(data.results)) return data.results;

  if (Array.isArray(data.traders)) return data.traders;

  if (Array.isArray(data.leaderboard))
    return data.leaderboard;

  if (Array.isArray(data.markets))
    return data.markets;

  return [];
}

async function scan() {

  const period = $("period").value;
  const threshold = $("threshold").value;

  $("scanBtn").disabled = true;

  $("top100").innerHTML =
    `<div class="empty">Loading...</div>`;

  $("markets").innerHTML =
    `<div class="empty">Loading...</div>`;

  try {

    setStatus(
      `Connecting to Polymarket...`,
      5
    );

    /*
      The Worker is responsible for talking to the
      Polymarket API. The HTML never needs a GitHub URL.
    */

    setStatus(
      `Loading ${period === "3m" ? "3-month" : period} leaderboard...`,
      20
    );

    const leaderboard =
      await api(
        `leaderboard?period=${encodeURIComponent(period)}&limit=100`
      );

    let traders =
      extractArray(leaderboard)
        .map(normalizeTrader);

    /*
      Pure W/L ranking:
      1. No losses first
      2. W/L ratio
      3. Wins
      4. P&L
    */

    traders.sort((a, b) => {

      const ar = ratio(a.wins, a.losses);
      const br = ratio(b.wins, b.losses);

      if (ar !== br) {
        if (ar === Infinity) return -1;
        if (br === Infinity) return 1;
        return br - ar;
      }

      if (a.wins !== b.wins)
        return b.wins - a.wins;

      return b.pnl - a.pnl;
    });

    traders =
      traders.slice(0, 100);

    state.traders = traders;

    renderTop100(traders);

    setStatus(
      `Loaded ${traders.length} traders. Finding shared active markets...`,
      55
    );

    const markets =
      await api(
        `active-markets?period=${encodeURIComponent(period)}&limit=1000&threshold=${encodeURIComponent(threshold)}`
      );

    state.markets =
      extractArray(markets);

    renderMarkets(state.markets);

    setStatus(
      `Complete — ${traders.length} traders and ${state.markets.length} active markets loaded.`,
      100
    );

  } catch (error) {

    console.error(error);

    $("top100").innerHTML = `
      <div class="error">
        <strong>Scan failed.</strong><br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    $("markets").innerHTML = `
      <div class="error">
        The Worker did not return the requested scanner data.
        <br><br>
        Worker:
        ${escapeHTML(WORKER)}
        <br><br>
        Make sure the Worker has the
        <strong>/leaderboard</strong> and
        <strong>/active-markets</strong> routes.
      </div>
    `;

    setStatus(
      `Scan failed: ${error.message}`,
      0
    );

  } finally {

    $("scanBtn").disabled = false;
  }
}

$("scanBtn").addEventListener(
  "click",
  scan
);

$("threshold").addEventListener(
  "change",
  () => {
    if (state.markets.length) {
      renderMarkets(state.markets);
    }
  }
);

$("period").addEventListener(
  "change",
  () => {
    if (state.traders.length) {
      scan();
    }
  }
);
</script>

</body>
</html>
