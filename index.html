<!DOCTYPE html>

<head>

.buy-time{

  font-size:12px;
  padding:8px 0;

}

  display:grid;

  grid-template-columns:minmax(120px,1fr) 70px 75px;

  details{
    width:300px;
    max-width:300px;
  }

  .shared-grid{
    grid-template-columns:1fr;

<body>

<div class="container">

<h1>Polymarket Top 100</h1>

<div class="controls">

<select id="period">
  <option value="WEEK">Week</option>
  <option value="MONTH">Month</option>
  <option value="3MONTHS">3 Months</option>
</select>

<button id="scanBtn">Scan Top 100</button>
<button id="activeBtn">Refresh Active Markets</button>

<select id="sortMode">
  <option value="record">Best Record</option>
  <option value="winrate">Win %</option>
  <option value="pnl">P/L</option>
</select>

</div>

<div class="status" id="status">Ready.</div>

<div class="table-wrap">

<table>

<thead>
<tr>
  <th>#</th>
  <th>Trader</th>
  <th>Record</th>
  <th>Win %</th>
  <th>P/L</th>
  <th>Active</th>
  <th>Active Markets</th>
</tr>
</thead>

<tbody id="traders"></tbody>

</table>

</div>


<div class="shared">

<h2>Shared Active Markets</h2>

<div id="sharedMarkets">
  <div class="empty">No shared active markets yet.</div>
</div>

</div>

</div>


<script>

const WORKER="https://polymarket-proxy.rowanmcbride77.workers.dev";
const DIRECT="https://data-api.polymarket.com";

let traders=[];
let generation=0;


/* ============================================================
   BASIC
============================================================ */

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}


async function api(path){

  try{

    const r=await fetch(WORKER+path,{
      cache:"no-store"
    });

    if(r.ok){
      return await r.json();
    }

  }catch(e){}


  const r=await fetch(DIRECT+path,{
    cache:"no-store"
  });

  if(!r.ok){
    throw new Error("API "+r.status);
  }

  return await r.json();
}


async function pool(items,limit,fn){

  const results=new Array(items.length);
  let next=0;

  async function worker(){

    while(true){

      const i=next++;

      if(i>=items.length){
        return;
      }

      try{
        results[i]=await fn(items[i],i);
      }catch(e){
        results[i]=null;
      }
    }
  }

  const workers=[];

  for(let i=0;i<Math.min(limit,items.length);i++){
    workers.push(worker());
  }

  await Promise.all(workers);

  return results;
}


function esc(v){

  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function walletOf(x){

  return x.proxyWallet ||
         x.proxy_wallet ||
         x.user ||
         x.address ||
         x.wallet ||
         x.userAddress ||
         "";
}


function nameOf(x){

  return x.userName ||
         x.username ||
         x.name ||
         x.displayName ||
         x.pseudonym ||
         x.profile?.name ||
         x.profile?.username ||
         "";
}


function timestampOf(x){

  const values=[
    x.timestamp,
    x.ts,
    x.last_event_at,
    x.lastEventAt,
    x.createdAt,
    x.created_at,
    x.updatedAt,
    x.updated_at
  ];

  for(const v of values){

    if(v==null)continue;

    if(typeof v==="number"){
      return v>100000000000 ? v/1000 : v;
    }

    const n=Number(v);

    if(Number.isFinite(n)){
      return n>100000000000 ? n/1000 : n;
    }

    const d=Date.parse(v);

    if(Number.isFinite(d)){
      return d/1000;
    }
  }

  return null;
}


function money(n){

  n=Number(n);

  if(!Number.isFinite(n)){
    return "—";
  }

  const a=Math.abs(n);

  if(a>=1000000){
    return (n<0?"-$":"$")+(a/1000000).toFixed(2)+"M";
  }

  if(a>=1000){
    return (n<0?"-$":"$")+(a/1000).toFixed(1)+"K";
  }

  return (n<0?"-$":"$")+a.toFixed(2);
}


function formatDate(ts){

  if(!ts){
    return "—";
  }

  const d=new Date(ts*1000);

  if(isNaN(d.getTime())){
    return "—";
  }

  return d.toLocaleString([],{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}


function pnlOf(x){

  const values=[
    x.realizedPnl,
    x.realized_pnl,
    x.cashPnl,
    x.cash_pnl,
    x.pnl,
    x.profit
  ];

  for(const v of values){

    const n=Number(v);

    if(Number.isFinite(n)){
      return n;
    }
  }

  return null;
}


function periodStart(period){

  const now=Date.now()/1000;

  if(period==="WEEK"){
    return now-7*86400;
  }

  if(period==="MONTH"){
    return now-30*86400;
  }

  return now-90*86400;
}


/* ============================================================
   LEADERBOARD CANDIDATES
============================================================ */

async function getCandidates(){

  const paths=[];

  /*
    Only pull the first 200 from PNL and VOL.

    This keeps the initial scan much faster.
  */

  for(const order of ["PNL","VOL"]){

    for(let offset=0;offset<200;offset+=50){

      paths.push(
        `/v1/leaderboard`+
        `?timePeriod=WEEK`+
        `&category=OVERALL`+
        `&orderBy=${order}`+
        `&limit=50`+
        `&offset=${offset}`
      );

    }
  }


  const responses=await pool(
    paths,
    8,
    async path=>{

      try{
        return await api(path);
      }catch(e){
        return null;
      }

    }
  );


  const map=new Map();


  for(const data of responses){

    if(!data)continue;

    const rows=
      Array.isArray(data)
        ?data
        :Array.isArray(data.data)
          ?data.data
          :[];


    for(const row of rows){

      const wallet=walletOf(row);

      if(!wallet)continue;

      const key=wallet.toLowerCase();

      if(!map.has(key)){

        map.set(key,{
          wallet,
          name:nameOf(row)
        });

      }

    }

  }


  return [...map.values()];
}


/* ============================================================
   RECORD
============================================================ */

async function closedPage(wallet,offset){

  const path=
    `/v1/closed-positions`+
    `?user=${encodeURIComponent(wallet)}`+
    `&limit=50`+
    `&offset=${offset}`+
    `&sortBy=TIMESTAMP`+
    `&sortDirection=DESC`;

  try{

    const data=await api(path);

    return Array.isArray(data)
      ?data
      :Array.isArray(data.data)
        ?data.data
        :[];

  }catch(e){

    return [];
  }
}


async function getRecord(wallet,period){

  const start=periodStart(period);

  let rows=[];


  /*
    First page almost always contains the relevant recent
    resolved markets.

    Only request another page if necessary.
  */

  const first=await closedPage(wallet,0);

  rows.push(...first);


  const dated=first
    .map(x=>timestampOf(x))
    .filter(Boolean);


  if(
    dated.length &&
    Math.min(...dated)>=start &&
    first.length>=50
  ){

    const second=await closedPage(wallet,50);

    rows.push(...second);

  }


  let wins=0;
  let losses=0;
  let pnl=0;


  for(const row of rows){

    const ts=timestampOf(row);

    if(ts && ts<start){
      continue;
    }

    const p=pnlOf(row);

    if(p==null){
      continue;
    }

    if(p>0){

      wins++;
      pnl+=p;

    }else if(p<0){

      losses++;
      pnl+=p;

    }

  }


  const total=wins+losses;


  return{
    wins,
    losses,
    total,
    winRate:total?wins/total:0,
    pnl
  };
}


/* ============================================================
   ACTIVE POSITIONS
============================================================ */

async function getActivePositions(wallet){

  try{

    const path=
      `/v2/positions`+
      `?user=${encodeURIComponent(wallet)}`+
      `&status=OPEN`+
      `&filter_type=TOKENS`+
      `&filter_amount=0`+
      `&limit=1000`;

    const data=await api(path);

    const rows=
      Array.isArray(data?.data)
        ?data.data
        :[];


    /*
      Polymarket's OPEN status is a superset.
      Only actual OPEN rows are live positions.
    */

    return rows.filter(x=>{

      const status=
        String(x.status||"").toUpperCase();

      const size=Number(
        x.current_size ??
        x.currentSize ??
        x.size ??
        0
      );

      if(status!=="OPEN"){
        return false;
      }

      if(size<=0){
        return false;
      }

      if(x.redeemable){
        return false;
      }

      return true;

    });

  }catch(e){

    return [];

  }
}


/* ============================================================
   COMBINE POSITIONS INTO UNIQUE MARKETS
============================================================ */

function combineActive(rows){

  const map=new Map();


  for(const x of rows){

    const condition=
      x.condition_id ||
      x.conditionId ||
      x.market ||
      x.condition ||
      "";


    if(!condition){
      continue;
    }


    const outcome=
      x.outcome ||
      x.outcome_name ||
      x.side ||
      "Unknown";


    const size=Number(
      x.current_size ??
      x.currentSize ??
      x.size ??
      0
    );


    const cost=Number(
      x.entry_cost_usdc ??
      x.entryCostUsdc ??
      x.initialValue ??
      x.initial_value ??
      0
    );


    const key=condition;


    if(!map.has(key)){

      map.set(key,{
        condition,
        title:
          x.title ||
          x.question ||
          x.name ||
          "Unknown market",

        outcomes:{},

        amount:0,

        lastEvent:
          x.last_event_at ||
          x.lastEventAt ||
          null,

        loaded:false,

        buyTime:null
      });

    }


    const m=map.get(key);


    if(!m.outcomes[outcome]){
      m.outcomes[outcome]={
        size:0,
        cost:0
      };
    }


    m.outcomes[outcome].size+=size;
    m.outcomes[outcome].cost+=cost;

    m.amount+=cost;


    const ts=timestampOf(x);

    if(ts && (!m.lastEvent || ts>m.lastEvent)){
      m.lastEvent=ts;
    }

  }


  return [...map.values()];
}


/* ============================================================
   LAZY BUY TIME
============================================================ */

async function loadBuyTime(trader,market){

  if(market.loaded){
    return;
  }

  market.loaded=true;


  try{

    const path=
      `/v2/trades`+
      `?user=${encodeURIComponent(trader.wallet)}`+
      `&condition=${encodeURIComponent(market.condition)}`+
      `&limit=500`;

    const data=await api(path);

    const rows=
      Array.isArray(data?.data)
        ?data.data
        :[];


    let earliest=null;


    for(const trade of rows){

      const side=
        String(
          trade.side ||
          trade.taker_side ||
          ""
        ).toUpperCase();


      if(side!=="BUY"){
        continue;
      }


      const ts=timestampOf(trade);

      if(ts && (!earliest || ts<earliest)){
        earliest=ts;
      }

    }


    market.buyTime=earliest;


  }catch(e){

    market.buyTime=null;

  }

}


/* ============================================================
   ACTIVE MARKET HTML
============================================================ */

function marketHTML(trader,market){

  const sides=Object.entries(market.outcomes);


  return`
  <div class="market">

    <div class="market-title">
      ${esc(market.title)}
    </div>

    <div class="market-meta">

      ${sides.map(([side,data])=>`
        <strong>${esc(side)}</strong>
        ${money(data.cost)}
      `).join(" · ")}

      ${market.buyTime
        ?` · <span class="buy-time">Bought ${esc(formatDate(market.buyTime))}</span>`
        :` · <span class="buy-time">Bought —</span>`
      }

    </div>

  </div>`;
}


function renderActive(t){

  if(!t.activeMarkets.length){
    return `<div class="empty">No active markets.</div>`;
  }


  return`
  <div class="market-list">

    ${t.activeMarkets.map(m=>
      marketHTML(t,m)
    ).join("")}

  </div>`;
}


/* ============================================================
   SORT
============================================================ */

function sortTraders(){

  const mode=document.getElementById("sortMode").value;


  traders.sort((a,b)=>{

    /*
      ACTIVE FIRST.

      25-0 + active
      beats
      50-0 + no active.
    */

    const aa=a.activeMarkets.length>0?1:0;
    const bb=b.activeMarkets.length>0?1:0;


    if(aa!==bb){
      return bb-aa;
    }


    if(mode==="pnl"){

      if(b.record.pnl!==a.record.pnl){
        return b.record.pnl-a.record.pnl;
      }

    }else{

      if(b.record.winRate!==a.record.winRate){
        return b.record.winRate-a.record.winRate;
      }

    }


    if(b.record.wins!==a.record.wins){
      return b.record.wins-a.record.wins;
    }


    if(b.record.total!==a.record.total){
      return b.record.total-a.record.total;
    }


    return b.record.pnl-a.record.pnl;

  });

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  sortTraders();


  document.getElementById("traders").innerHTML=

    traders.map((t,i)=>{

      const active=t.activeMarkets.length>0;


      return`
      <tr>

        <td class="rank">
          ${i+1}
        </td>


        <td>

          <div class="name">
            ${esc(t.name||"Unknown Trader")}
          </div>

          <div class="wallet">
            ${esc(t.wallet)}
          </div>

        </td>


        <td class="record">
          ${t.record.wins}-${t.record.losses}
        </td>


        <td>
          ${(t.record.winRate*100).toFixed(1)}%
        </td>


        <td class="${t.record.pnl<0?"pnl-negative":""}">
          ${money(t.record.pnl)}
        </td>


        <td class="${active?"active-yes":"active-no"}">
          ${active?"YES":"NO"}
        </td>


        <td>

          <details
            data-wallet="${esc(t.wallet)}"
          >

            <summary>
              ${active
                ?`${t.activeMarkets.length} active market${t.activeMarkets.length===1?"":"s"}`
                :"None"
              }
            </summary>

            ${renderActive(t)}

          </details>

        </td>

      </tr>`;

    }).join("");


  /*
    Lazy-load buy times ONLY when a dropdown is opened.
  */

  document
    .querySelectorAll("details[data-wallet]")
    .forEach(details=>{

      details.addEventListener("toggle",async()=>{

        if(!details.open){
          return;
        }


        const wallet=details.dataset.wallet;

        const trader=traders.find(
          t=>t.wallet===wallet
        );

        if(!trader){
          return;
        }


        const needsTime=
          trader.activeMarkets.some(
            m=>!m.loaded
          );


        if(!needsTime){
          return;
        }


        /*
          Load all market times for this trader in parallel.
        */

        await pool(
          trader.activeMarkets,
          8,
          market=>
            loadBuyTime(trader,market)
        );


        /*
          Re-rendering would close the dropdown,
          so update only the contents manually.
        */

        const list=details.querySelector(".market-list");

        if(list){

          list.innerHTML=
            trader.activeMarkets
              .map(m=>marketHTML(trader,m))
              .join("");

        }

      });

    });


  renderShared();

}


/* ============================================================
   SHARED ACTIVE MARKETS
============================================================ */

function renderShared(){

  const map=new Map();


  for(const trader of traders){

    for(const market of trader.activeMarkets){

      if(!market.condition){
        continue;
      }


      if(!map.has(market.condition)){

        map.set(
          market.condition,
          {
            title:market.title,
            traders:[]
          }
        );

      }


      /*
        One trader gets ONE row per market.

        If they hold both Yes and No,
        combine it into the same row.
      */

      const group=map.get(market.condition);


      const existing=group.traders.find(
        x=>x.wallet===trader.wallet
      );


      const sides=Object.entries(market.outcomes)
        .map(([side,data])=>
          `${side} ${money(data.cost)}`
        )
        .join(" · ");


      if(existing){

        existing.sides=sides;

      }else{

        group.traders.push({
          name:trader.name||"Unknown Trader",
          wallet:trader.wallet,
          sides
        });

      }

    }

  }


  const shared=
    [...map.values()]
      .filter(x=>x.traders.length>=2)
      .sort(
        (a,b)=>
          b.traders.length-a.traders.length
      );


  if(!shared.length){

    document.getElementById("sharedMarkets").innerHTML=
      `<div class="empty">No shared active markets found.</div>`;

    return;
  }


  document.getElementById("sharedMarkets").innerHTML=

    `<div class="shared-grid">

      ${shared.map(m=>`

        <div class="shared-market">

          <div class="shared-title">
            ${esc(m.title)}
          </div>

          <div class="shared-count">
            ${m.traders.length} Top-100 traders
          </div>


          ${m.traders.map(t=>`

            <div class="shared-row">

              <div class="shared-name">

                ${esc(t.name)}

                <div class="small-wallet">
                  ${esc(
                    t.wallet.slice(0,6)+
                    "..." +
                    t.wallet.slice(-4)
                  )}
                </div>

              </div>

              <div class="shared-side">
                ${esc(t.sides)}
              </div>

              <div class="shared-amount">
              </div>

            </div>

          `).join("")}

        </div>

      `).join("")}

    </div>`;

}


/* ============================================================
   MAIN SCAN
============================================================ */

async function scan(){

  const myGeneration=++generation;

  const scanBtn=document.getElementById("scanBtn");
  const activeBtn=document.getElementById("activeBtn");
  const status=document.getElementById("status");


  scanBtn.disabled=true;
  activeBtn.disabled=true;


  document.getElementById("traders").innerHTML="";
  document.getElementById("sharedMarkets").innerHTML=
    `<div class="empty">Scanning...</div>`;


  try{

    status.textContent=
      "Finding traders...";


    const candidates=await getCandidates();


    /*
      Keep a decent candidate pool without making the scan
      unbearably slow.
    */

    const poolCandidates=
      candidates.slice(0,200);


    status.textContent=
      `Checking ${poolCandidates.length} traders...`;


    const period=
      document.getElementById("period").value;


    /*
      Record + active position request happen together.
    */

    const results=await pool(
      poolCandidates,
      30,
      async candidate=>{

        const [record,active]=
          await Promise.all([
            getRecord(candidate.wallet,period),
            getActivePositions(candidate.wallet)
          ]);


        return{

          wallet:candidate.wallet,

          name:candidate.name,

          record,

          activeMarkets:
            combineActive(active)

        };

      }
    );


    if(myGeneration!==generation){
      return;
    }


    traders=
      results
        .filter(Boolean)
        .sort((a,b)=>{

          const aa=a.activeMarkets.length?1:0;
          const bb=b.activeMarkets.length?1:0;


          if(aa!==bb){
            return bb-aa;
          }


          if(b.record.winRate!==a.record.winRate){
            return b.record.winRate-a.record.winRate;
          }


          if(b.record.wins!==a.record.wins){
            return b.record.wins-a.record.wins;
          }


          if(b.record.total!==a.record.total){
            return b.record.total-a.record.total;
          }


          return b.record.pnl-a.record.pnl;

        })
        .slice(0,100);


    render();


    status.textContent=
      `Done — ${traders.length} traders loaded.`;


  }catch(e){

    console.error(e);

    status.textContent=
      "Scan failed.";

  }finally{

    scanBtn.disabled=false;
    activeBtn.disabled=false;

  }

}


/* ============================================================
   REFRESH ACTIVE
============================================================ */

async function refreshActive(){

  if(!traders.length){

    document.getElementById("status").textContent=
      "Run a scan first.";

    return;
  }


  const button=
    document.getElementById("activeBtn");


  button.disabled=true;


  try{

    document.getElementById("status").textContent=
      "Refreshing active markets...";


    await pool(
      traders,
      30,
      async trader=>{

        const rows=
          await getActivePositions(
            trader.wallet
          );


        trader.activeMarkets=
          combineActive(rows);

      }
    );


    render();


    document.getElementById("status").textContent=
      "Active markets refreshed.";


  }finally{

    button.disabled=false;

  }

}


/* ============================================================
   EVENTS
============================================================ */

document.getElementById("scanBtn").onclick=scan;

document.getElementById("activeBtn").onclick=
  refreshActive;


document.getElementById("sortMode").onchange=
  render;


document.getElementById("period").onchange=()=>{

  traders=[];

  document.getElementById("traders").innerHTML="";

  document.getElementById("sharedMarkets").innerHTML=
    `<div class="empty">Run a new scan for this period.</div>`;

  document.getElementById("status").textContent=
    "Period changed.";

};


/* Start */

scan();

</script>
