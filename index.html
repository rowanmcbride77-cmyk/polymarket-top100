<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Best Records</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

.wrap {
  width: 100%;
  padding: 18px;
}

.topbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

button,
select {
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 14px;
}

button {
  cursor: pointer;
  font-weight: 700;
}

button:hover {
  background: #191919;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.status {
  border: 1px solid #333;
  border-radius: 9px;
  padding: 12px 14px;
  margin-bottom: 14px;
  color: #aaa;
  background: #0b0b0b;
}

.status.good {
  color: #63ff8a;
  border-color: #175b2b;
}

.status.bad {
  color: #ff6565;
  border-color: #5b1717;
}

.progress {
  width: 100%;
  height: 5px;
  background: #1b1b1b;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progressBar {
  height: 100%;
  width: 0%;
  background: #fff;
  transition: width .15s ease;
}

.card {
  background: #090909;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;
}

.cardHeader {
  padding: 18px 20px;
  border-bottom: 1px solid #222;
}

.cardHeader h2 {
  margin: 0 0 5px;
  font-size: 21px;
}

.cardHeader p {
  margin: 0;
  color: #777;
  font-size: 13px;
}

.tableWrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

thead {
  background: #0b0b0b;
}

th {
  text-align: left;
  color: #777;
  font-size: 12px;
  font-weight: 700;
  padding: 13px 14px;
  border-bottom: 1px solid #202020;
}

td {
  padding: 14px;
  border-bottom: 1px solid #171717;
  font-size: 14px;
}

tr:last-child td {
  border-bottom: none;
}

.rank {
  width: 55px;
  color: #777;
  font-weight: 700;
}

.traderName {
  font-weight: 700;
  font-size: 15px;
}

.wallet {
  color: #555;
  font-family: monospace;
  font-size: 12px;
  margin-top: 4px;
}

.record {
  font-weight: 800;
  font-size: 15px;
}

.record.good {
  color: #52ed79;
}

.record.normal {
  color: #f5f5f5;
}

.winrate {
  font-weight: 700;
}

.meta {
  padding: 14px 18px;
  color: #666;
  font-size: 12px;
  border-top: 1px solid #202020;
}

.empty {
  padding: 45px;
  text-align: center;
  color: #666;
}

@media (max-width: 700px) {
  .wrap {
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <select id="period">
      <option value="WEEK">Week</option>
      <option value="MONTH">Month</option>
      <option value="3MONTHS">3 Months</option>
    </select>

    <button id="scanBtn" onclick="scan()">Scan Best Records</button>
  </div>

  <div id="status" class="status">
    Ready.
  </div>

  <div class="progress">
    <div id="progressBar" class="progressBar"></div>
  </div>

  <div class="card">

    <div class="cardHeader">
      <h2>Best Records</h2>
      <p>Ranked by record quality. P/L, ROI, volume, and active positions are not used.</p>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>TRADER</th>
            <th>RECORD</th>
            <th>WIN %</th>
          </tr>
        </thead>

        <tbody id="tbody">
          <tr>
            <td colspan="4" class="empty">
              Click Scan Best Records
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="meta" class="meta"></div>

  </div>
</div>

<script>

const PROXY = "https://polymarket-proxy.rowanmcbride77.workers.dev";
const API = "https://data-api.polymarket.com";

let traders = [];
let scanning = false;


/* =========================
   BASIC HELPERS
========================= */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setStatus(text, type = "") {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + type;
}

function setProgress(value) {
  document.getElementById("progressBar").style.width =
    Math.max(0, Math.min(100, value)) + "%";
}

function periodStart(period) {
  const now = Date.now();

  if (period === "WEEK") {
    return now - 7 * 24 * 60 * 60 * 1000;
  }

  if (period === "MONTH") {
    return now - 30 * 24 * 60 * 60 * 1000;
  }

  return now - 90 * 24 * 60 * 60 * 1000;
}


/* =========================
   API
========================= */

async function getJSON(path, attempts = 3) {

  const urls = [
    PROXY + path,
    API + path
  ];

  for (let attempt = 0; attempt < attempts; attempt++) {

    for (const url of urls) {

      try {

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.ok) {
          return await response.json();
        }

      } catch (err) {
        // Try next endpoint.
      }
    }

    await sleep(300 * (attempt + 1));
  }

  throw new Error("API request failed");
}


/* =========================
   LEADERBOARD CANDIDATES
========================= */

async function getCandidates(period) {

  const candidates = new Map();

  const periods =
    period === "3MONTHS"
      ? ["MONTH", "WEEK"]
      : [period];

  const orders = ["PNL", "VOL"];

  for (const p of periods) {

    for (const order of orders) {

      try {

        const data = await getJSON(
          `/v1/leaderboard?timePeriod=${p}&orderBy=${order}&category=OVERALL&limit=100&offset=0`
        );

        const rows = Array.isArray(data)
          ? data
          : (data?.data || data?.leaderboard || []);

        for (const row of rows) {

          const wallet =
            row.proxyWallet ||
            row.wallet ||
            row.address ||
            row.user;

          if (!wallet) continue;

          const key = wallet.toLowerCase();

          if (!candidates.has(key)) {
            candidates.set(key, {
              wallet,
              name:
                row.userName ||
                row.username ||
                row.name ||
                wallet.slice(0, 8)
            });
          }
        }

      } catch (err) {
        // Continue with other candidate sources.
      }
    }
  }

  return [...candidates.values()];
}


/* =========================
   POSITION FETCH
========================= */

async function getPositions(wallet, status) {

  const path =
    `/v2/positions?user=${encodeURIComponent(wallet)}` +
    `&status=${status}` +
    `&limit=1000` +
    `&sort_by=TIMESTAMP`;

  try {
    return await getJSON(path);
  } catch (err) {

    try {

      const fallback =
        `/v2/positions?user=${encodeURIComponent(wallet)}` +
        `&status=${status}` +
        `&limit=1000`;

      return await getJSON(fallback);

    } catch (err2) {
      return [];
    }
  }
}


/* =========================
   RECORD CALCULATION
========================= */

function getTimestamp(row) {

  const candidates = [
    row.last_event_at,
    row.timestamp,
    row.updated_at,
    row.created_at
  ];

  for (const value of candidates) {

    if (value === undefined || value === null) continue;

    const n = Number(value);

    if (Number.isFinite(n)) {
      return n < 100000000000
        ? n * 1000
        : n;
    }

    const parsed = Date.parse(value);

    if (Number.isFinite(parsed)) {
      return parsed;
    }
  }

  return 0;
}


function getCondition(row) {

  return (
    row.condition_id ||
    row.conditionId ||
    row.condition ||
    row.market ||
    row.slug ||
    ""
  );
}


function pnlValue(row) {

  const values = [
    row.realized_pnl,
    row.realizedPnl,
    row.pnl,
    row.PNL,
    row.total_pnl
  ];

  for (const value of values) {

    const n = Number(value);

    if (Number.isFinite(n)) {
      return n;
    }
  }

  return 0;
}


function determineOutcome(rows) {

  let hasWin = false;
  let hasLoss = false;

  for (const row of rows) {

    const status = String(row.status || "").toUpperCase();

    if (
      status === "REDEEMABLE" ||
      status === "WIN" ||
      status === "WON"
    ) {
      hasWin = true;
    }

    if (
      status === "REDEEMABLE_LOST" ||
      status === "LOSS" ||
      status === "LOST"
    ) {
      hasLoss = true;
    }
  }

  /*
    Explicit resolved statuses always beat P/L.
  */

  if (hasWin && !hasLoss) {
    return "WIN";
  }

  if (hasLoss && !hasWin) {
    return "LOSS";
  }

  /*
    If a condition contains both sides, determine
    the resolved result using realized P/L.
  */

  let pnl = 0;

  for (const row of rows) {
    pnl += pnlValue(row);
  }

  if (pnl > 0) return "WIN";
  if (pnl < 0) return "LOSS";

  return null;
}


async function loadRecord(wallet, startTime) {

  const [
    redeemable,
    redeemableLost,
    closed
  ] = await Promise.all([
    getPositions(wallet, "REDEEMABLE"),
    getPositions(wallet, "REDEEMABLE_LOST"),
    getPositions(wallet, "CLOSED")
  ]);

  const all = [
    ...(Array.isArray(redeemable) ? redeemable : []),
    ...(Array.isArray(redeemableLost) ? redeemableLost : []),
    ...(Array.isArray(closed) ? closed : [])
  ];

  const byCondition = new Map();

  for (const row of all) {

    const ts = getTimestamp(row);

    if (ts && ts < startTime) continue;

    const condition = getCondition(row);

    if (!condition) continue;

    if (!byCondition.has(condition)) {
      byCondition.set(condition, []);
    }

    byCondition.get(condition).push(row);
  }

  let wins = 0;
  let losses = 0;

  for (const rows of byCondition.values()) {

    const outcome = determineOutcome(rows);

    if (outcome === "WIN") {
      wins++;
    } else if (outcome === "LOSS") {
      losses++;
    }
  }

  const total = wins + losses;

  return {
    wins,
    losses,
    total,
    winRate: total > 0
      ? wins / total
      : 0
  };
}


/* =========================
   RECORD RANKING
========================= */

/*
   THIS IS THE IMPORTANT PART.

   We do NOT rank by:
   - P/L
   - ROI
   - volume
   - active markets
   - raw number of wins

   We rank by record quality.

   To prevent tiny records like 2-0 from
   automatically beating something like 33-1,
   we use a confidence-adjusted win rate.

   The more resolved markets a trader has,
   the more weight their actual win rate gets.
*/

function recordScore(t) {

  const wins = t.wins;
  const losses = t.losses;
  const total = wins + losses;

  if (total === 0) return 0;

  /*
    20-market neutral prior.
    This keeps 2-0 from jumping over 33-1,
    while still rewarding extremely strong records.
  */

  const priorGames = 20;
  const priorWins = 10;

  return (wins + priorWins) / (total + priorGames);
}


function sortBestRecords(a, b) {

  /*
    Primary:
    confidence-adjusted record quality
  */

  const scoreDiff =
    recordScore(b) - recordScore(a);

  if (Math.abs(scoreDiff) > 0.000001) {
    return scoreDiff;
  }

  /*
    Then actual win rate.
  */

  if (b.winRate !== a.winRate) {
    return b.winRate - a.winRate;
  }

  /*
    Then more wins.
  */

  if (b.wins !== a.wins) {
    return b.wins - a.wins;
  }

  /*
    Then fewer losses.
  */

  if (a.losses !== b.losses) {
    return a.losses - b.losses;
  }

  /*
    Finally total sample size.
  */

  return b.total - a.total;
}


/* =========================
   CONCURRENCY
========================= */

async function runPool(items, worker, concurrency, progressCallback) {

  const results = new Array(items.length);

  let next = 0;
  let completed = 0;

  async function runner() {

    while (true) {

      const index = next++;

      if (index >= items.length) return;

      try {
        results[index] = await worker(items[index], index);
      } catch (err) {
        results[index] = null;
      }

      completed++;

      if (progressCallback) {
        progressCallback(completed, items.length);
      }
    }
  }

  const workers = [];

  for (
    let i = 0;
    i < Math.min(concurrency, items.length);
    i++
  ) {
    workers.push(runner());
  }

  await Promise.all(workers);

  return results;
}


/* =========================
   RENDER
========================= */

function render(rows) {

  const tbody = document.getElementById("tbody");

  if (!rows.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          No resolved records found.
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = rows.map((t, i) => {

    const pct = (t.winRate * 100).toFixed(1);

    const recordClass =
      t.winRate >= 0.55
        ? "good"
        : "normal";

    return `
      <tr>

        <td class="rank">
          #${i + 1}
        </td>

        <td>
          <div class="traderName">
            ${escapeHTML(t.name)}
          </div>

          <div class="wallet">
            ${escapeHTML(t.wallet)}
          </div>
        </td>

        <td class="record ${recordClass}">
          ${t.wins}-${t.losses}
        </td>

        <td class="winrate">
          ${pct}%
        </td>

      </tr>
    `;

  }).join("");

  document.getElementById("meta").textContent =
    `${rows.length} best records shown`;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   SCAN
========================= */

async function scan() {

  if (scanning) return;

  scanning = true;

  const button = document.getElementById("scanBtn");
  button.disabled = true;

  document.getElementById("tbody").innerHTML = `
    <tr>
      <td colspan="4" class="empty">
        Scanning...
      </td>
    </tr>
  `;

  document.getElementById("meta").textContent = "";

  setProgress(0);

  const period =
    document.getElementById("period").value;

  const startTime = periodStart(period);

  try {

    setStatus("Finding candidate traders...");

    const candidates =
      await getCandidates(period);

    if (!candidates.length) {
      throw new Error("No candidate traders found.");
    }

    setStatus(
      `Checking ${candidates.length} traders for resolved records...`
    );

    const results = await runPool(
      candidates,

      async trader => {

        const record =
          await loadRecord(
            trader.wallet,
            startTime
          );

        return {
          ...trader,
          ...record
        };
      },

      20,

      (done, total) => {

        const pct =
          (done / total) * 100;

        setProgress(pct);

        setStatus(
          `Checking records: ${done}/${total}`
        );
      }
    );

    const valid = results
      .filter(Boolean)
      .filter(t => t.total > 0);

    /*
      SORT THE ENTIRE RESULT SET FIRST.
      Only THEN take the top 100.
    */

    valid.sort(sortBestRecords);

    const top100 =
      valid.slice(0, 100);

    render(top100);

    setProgress(100);

    setStatus(
      `Finished — ${top100.length} best records found.`,
      "good"
    );

  } catch (err) {

    console.error(err);

    setStatus(
      "Scan failed. Try again.",
      "bad"
    );

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          Scan failed.
        </td>
      </tr>
    `;

  } finally {

    scanning = false;
    button.disabled = false;
  }
}

</script>

</body>
</html>
