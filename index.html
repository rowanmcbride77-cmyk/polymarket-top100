<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket Top 100</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: #fff;
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

main {
  max-width: 1250px;
  margin: auto;
  padding: 22px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  flex-wrap: wrap;
}

h1 {
  font-size: 26px;
  margin: 0 0 5px;
}

.sub {
  color: #999;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}

select,
button {
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 9px 12px;
}

button {
  cursor: pointer;
  background: #fff;
  color: #000;
  font-weight: 700;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.status {
  background: #0d0d0d;
  border: 1px solid #222;
  border-radius: 9px;
  padding: 11px;
  margin: 12px 0;
  color: #bbb;
}

.bar {
  height: 5px;
  background: #1b1b1b;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0;
  background: #fff;
  transition: width .2s;
}

.section {
  margin-top: 25px;
}

.section h2 {
  font-size: 18px;
  margin: 0 0 10px;
}

.tablewrap {
  overflow: auto;
  border: 1px solid #222;
  border-radius: 10px;
}

.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

.table th,
.table td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid #1d1d1d;
  white-space: nowrap;
}

.table th {
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
}

.table tr:last-child td {
  border-bottom: 0;
}

.rank {
  color: #777;
  width: 55px;
}

.ratio {
  font-weight: 800;
}

.muted {
  color: #777;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 10px;
}

.card {
  border: 1px solid #242424;
  background: #0b0b0b;
  border-radius: 10px;
  padding: 14px;
}

.card h3 {
  font-size: 15px;
  margin: 0 0 7px;
}

.meta {
  color: #999;
  font-size: 12px;
}

.holders {
  margin-top: 10px;
  display: grid;
  gap: 7px;
}

.holder {
  border-top: 1px solid #202020;
  padding-top: 7px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.pill {
  border: 1px solid #333;
  border-radius: 999px;
  padding: 2px 7px;
  color: #ccc;
  font-size: 11px;
  white-space: nowrap;
}

.small {
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<main>

<div class="top">
  <div>
    <h1>Polymarket Top 100</h1>
    <div class="sub">
      Win/loss leaderboard + shared active positions
    </div>
  </div>

  <div class="small" id="apiState">
    Worker: checking…
  </div>
</div>

<div class="controls">

  <select id="period">
    <option value="week">Week</option>
    <option value="month">Month</option>
    <option value="3m">3 Months</option>
  </select>

  <select id="threshold">
    <option value="1">1+ traders</option>
    <option value="2">2+ traders</option>
    <option value="5">5+ traders</option>
    <option value="10">10+ traders</option>
  </select>

  <button id="scan">
    Scan
  </button>

  <button id="stop" disabled>
    Stop
  </button>

</div>

<div class="status">

  <div id="statusText">
    Ready.
  </div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

</div>

<div class="section">

  <h2>
    Top 100 Traders
  </h2>

  <div class="tablewrap">

    <table class="table">

      <thead>
        <tr>
          <th>Rank</th>
          <th>Trader</th>
          <th>W-L</th>
          <th>W/L Ratio</th>
          <th>P&L</th>
          <th>Leaderboard Rank</th>
        </tr>
      </thead>

      <tbody id="traders"></tbody>

    </table>

  </div>

</div>

<div class="section">

  <h2>
    Shared Active Markets
  </h2>

  <div id="markets" class="cards"></div>

</div>

</main>

<script>

const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const $ = id => document.getElementById(id);

let stopped = false;


function setStatus(text, progress) {

  $("statusText").textContent = text;

  if (progress != null) {
    $("fill").style.width =
      Math.max(0, Math.min(100, progress)) + "%";
  }
}


function esc(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );
}


function fmtMoney(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return "$" +
    n.toLocaleString(undefined, {
      maximumFractionDigits: 0
    });
}


function fmtDate(timestamp) {

  if (!timestamp) {
    return "—";
  }

  return new Date(
    Number(timestamp) * 1000
  ).toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}


async function api(path, params = {}) {

  const url =
    new URL(WORKER + "/api/" + path);

  for (const [key, value] of Object.entries(params)) {

    if (
      value !== undefined &&
      value !== null &&
      value !== ""
    ) {
      url.searchParams.set(key, value);
    }

  }

  const response =
    await fetch(url.toString());

  const data =
    await response
      .json()
      .catch(() => ({
        error: "Invalid JSON response"
      }));

  if (!response.ok) {

    throw new Error(
      data.error ||
      ("HTTP " + response.status)
    );

  }

  return data;
}


async function testWorker() {

  try {

    const response =
      await fetch(WORKER + "/health");

    const data =
      await response.json();

    $("apiState").textContent =
      data.ok
        ? "Worker: online"
        : "Worker: error";

  } catch (error) {

    $("apiState").textContent =
      "Worker: offline";

  }

}


function periodBounds(period) {

  const now =
    Math.floor(Date.now() / 1000);

  const days =
    period === "week"
      ? 7
      : period === "month"
        ? 30
        : 90;

  return {
    start: now - days * 86400,
    end: now
  };

}


async function leaderboard(period) {

  let output = [];
  let cursor = "";

  while (output.length < 1000) {

    const data =
      await api("leaderboard", {
        time_period:
          period === "3m"
            ? "month"
            : period,

        sort_by: "PNL",

        limit: 1000,

        cursor
      });

    const rows =
      Array.isArray(data.data)
        ? data.data
        : [];

    output.push(...rows);

    if (
      !data.pagination?.has_more ||
      !data.pagination?.next_cursor ||
      rows.length === 0
    ) {
      break;
    }

    cursor =
      data.pagination.next_cursor;

  }

  return output.slice(0, 1000);

}


async function mapLimit(items, limit, fn) {

  const results =
    new Array(items.length);

  let next = 0;

  async function worker() {

    while (true) {

      const index = next++;

      if (
        index >= items.length ||
        stopped
      ) {
        return;
      }

      try {

        results[index] =
          await fn(
            items[index],
            index
          );

      } catch (error) {

        results[index] = {
          error: error.message
        };

      }

    }

  }

  await Promise.all(
    Array.from(
      { length: limit },
      worker
    )
  );

  return results;

}


function normalizeTrader(row) {

  return {

    wallet:
      row.user_id ||
      row.proxy_wallet ||
      row.user ||
      row.wallet,

    name:
      row.user_name ||
      row.username ||
      row.name ||
      "Anonymous",

    pnl:
      Number(row.pnl) || 0,

    rank:
      row.rank

  };

}


async function settledRecord(wallet, bounds) {

  const [winsData, lossesData] =
    await Promise.all([

      api("positions", {

        user: wallet,

        status: "REDEEMABLE",

        limit: 1000,

        start: bounds.start,

        end: bounds.end,

        sort_by: "TIMESTAMP"

      }),

      api("positions", {

        user: wallet,

        status: "REDEEMABLE_LOST",

        limit: 1000,

        start: bounds.start,

        end: bounds.end,

        sort_by: "TIMESTAMP"

      })

    ]);

  const wins =
    Array.isArray(winsData.data)
      ? winsData.data.length
      : 0;

  const losses =
    Array.isArray(lossesData.data)
      ? lossesData.data.length
      : 0;

  return {
    wins,
    losses
  };

}


function ratio(wins, losses) {

  if (losses === 0) {

    return wins > 0
      ? Infinity
      : 0;

  }

  return wins / losses;

}


async function buildTop(leaderboardRows, period) {

  const bounds =
    periodBounds(period);

  const candidates =
    leaderboardRows
      .map(normalizeTrader)
      .filter(row => row.wallet);

  let completed = 0;

  setStatus(
    "Calculating resolved W/L records for " +
    candidates.length +
    " candidates…",
    5
  );

  const records =
    await mapLimit(
      candidates,
      24,
      async trader => {

        const record =
          await settledRecord(
            trader.wallet,
            bounds
          );

        completed++;

        if (completed % 10 === 0) {

          setStatus(
            "Calculating W/L: " +
            completed +
            "/" +
            candidates.length,

            5 +
            completed /
              candidates.length *
              70
          );

        }

        return {
          ...trader,
          ...record
        };

      }
    );

  records.sort((a, b) => {

    const aRatio =
      ratio(a.wins, a.losses);

    const bRatio =
      ratio(b.wins, b.losses);

    if (
      aRatio === Infinity &&
      bRatio !== Infinity
    ) {
      return -1;
    }

    if (
      bRatio === Infinity &&
      aRatio !== Infinity
    ) {
      return 1;
    }

    if (aRatio !== bRatio) {
      return bRatio - aRatio;
    }

    return b.wins - a.wins;

  });

  return records.slice(0, 100);

}


async function currentPositions(traders) {

  let completed = 0;

  setStatus(
    "Loading active positions for the top 1,000 weekly traders…",
    78
  );

  const results =
    await mapLimit(
      traders,
      24,
      async trader => {

        const data =
          await api("positions", {

            user: trader.wallet,

            status: "OPEN",

            limit: 1000,

            filter_type: "CASH",

            filter_amount: 1

          });

        completed++;

        if (completed % 10 === 0) {

          setStatus(
            "Active positions: " +
            completed +
            "/" +
            traders.length,

            78 +
            completed /
              traders.length *
              18
          );

        }

        return {

          trader,

          positions:
            Array.isArray(data.data)
              ? data.data
              : []

        };

      }
    );

  return results;

}


function renderTop(rows) {

  $("traders").innerHTML =
    rows.map((trader, index) => {

      const displayRatio =
        trader.losses === 0
          ? (
              trader.wins
                ? "∞"
                : "0"
            )
          : (
              trader.wins /
              trader.losses
            ).toFixed(2);

      return `
        <tr>

          <td class="rank">
            ${index + 1}
          </td>

          <td>
            <b>
              ${esc(trader.name)}
            </b>
          </td>

          <td>
            ${trader.wins}-${trader.losses}
          </td>

          <td class="ratio">
            ${displayRatio}
          </td>

          <td>
            ${fmtMoney(trader.pnl)}
          </td>

          <td class="muted">
            #${esc(trader.rank)}
          </td>

        </tr>
      `;

    }).join("");

}


function renderMarkets(holderRows) {

  const threshold =
    Number($("threshold").value);

  const markets =
    new Map();

  for (const row of holderRows) {

    for (const position of row.positions) {

      if (!position.condition_id) {
        continue;
      }

      const key =
        position.condition_id;

      if (!markets.has(key)) {

        markets.set(key, {

          title:
            position.title ||
            position.name ||
            "Untitled market",

          condition: key,

          outcome:
            position.outcome ||
            "Unknown",

          end_date:
            position.end_date,

          holders: []

        });

      }

      const market =
        markets.get(key);

      market.holders.push({

        name:
          row.trader.name,

        wins:
          row.trader.wins,

        losses:
          row.trader.losses,

        side:
          position.outcome ||
          "Unknown",

        volume:
          Number(
            position.entry_cost_usdc ||
            position.total_cost_usdc ||
            position.current_value ||
            0
          ),

        last:
          position.last_event_at

      });

    }

  }

  const filtered =
    [...markets.values()]
      .filter(
        market =>
          market.holders.length >=
          threshold
      )
      .filter(market => {

        const sides =
          new Set(
            market.holders.map(
              holder =>
                String(holder.side)
            )
          );

        return sides.size <= 1;

      })
      .sort(
        (a, b) =>
          b.holders.length -
          a.holders.length
      );

  if (!filtered.length) {

    $("markets").innerHTML =
      `
        <div class="small">
          No same-side active markets met
          the selected threshold.
        </div>
      `;

    return;
  }

  $("markets").innerHTML =
    filtered
      .slice(0, 100)
      .map(market => {

        const side =
          market.holders[0]?.side ||
          market.outcome;

        return `
          <div class="card">

            <h3>
              ${esc(market.title)}
            </h3>

            <div class="meta">

              ${esc(side)}

              ·

              ${market.holders.length}
              top-1,000 holder${
                market.holders.length === 1
                  ? ""
                  : "s"
              }

              ${
                market.end_date
                  ? " · ends " +
                    esc(
                      new Date(
                        market.end_date
                      ).toLocaleDateString()
                    )
                  : ""
              }

            </div>

            <div class="holders">

              ${
                market.holders
                  .sort(
                    (a, b) =>
                      b.volume -
                      a.volume
                  )
                  .map(holder => {

                    const r =
                      ratio(
                        holder.wins,
                        holder.losses
                      );

                    const displayRatio =
                      r === Infinity
                        ? "∞"
                        : r.toFixed(2);

                    return `
                      <div class="holder">

                        <span>

                          <b>
                            ${esc(
                              holder.name
                            )}
                          </b>

                          <br>

                          <span class="small">

                            ${holder.wins}-
                            ${holder.losses}
                            W/L

                            ·

                            ${displayRatio}
                            ratio

                            ·

                            last activity
                            ${esc(
                              fmtDate(
                                holder.last
                              )
                            )}

                          </span>

                        </span>

                        <span class="pill">

                          ${fmtMoney(
                            holder.volume
                          )}

                        </span>

                      </div>
                    `;

                  })
                  .join("")
              }

            </div>

          </div>
        `;

      })
      .join("");

}


async function scan() {

  stopped = false;

  $("scan").disabled = true;
  $("stop").disabled = false;

  $("traders").innerHTML = "";
  $("markets").innerHTML = "";

  try {

    const period =
      $("period").value;

    setStatus(
      "Loading Polymarket leaderboard…",
      1
    );

    const leaderboardRows =
      await leaderboard(period);

    if (stopped) {
      return;
    }

    setStatus(
      "Leaderboard loaded: " +
      leaderboardRows.length +
      " candidates.",
      4
    );

    const top =
      await buildTop(
        leaderboardRows,
        period
      );

    if (stopped) {
      return;
    }

    renderTop(top);

    const weeklyLeaderboard =
      await leaderboard("week");

    if (stopped) {
      return;
    }

    const weeklyTraders =
      weeklyLeaderboard.map(
        normalizeTrader
      );

    const active =
      await currentPositions(
        weeklyTraders
      );

    if (stopped) {
      return;
    }

    renderMarkets(active);

    setStatus(
      "Done. " +
      top.length +
      " traders ranked and shared active markets loaded.",
      100
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Scan failed: " +
      error.message,
      0
    );

  } finally {

    $("scan").disabled = false;
    $("stop").disabled = true;

  }

}


$("scan").onclick = scan;

$("stop").onclick = () => {

  stopped = true;

  setStatus(
    "Stopping…",
    0
  );

};

testWorker();

</script>

</body>
</html>
