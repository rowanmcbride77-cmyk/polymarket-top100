<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Best Records</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{width:100%;padding:18px}

.topbar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}

button,select{
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  padding:11px 14px;
  font-size:14px;
}

button{
  cursor:pointer;
  font-weight:700;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  border:1px solid #333;
  border-radius:9px;
  padding:12px 14px;
  margin-bottom:14px;
  color:#aaa;
  background:#0b0b0b;
}

.status.good{
  color:#63ff8a;
  border-color:#175b2b;
}

.status.bad{
  color:#ff6565;
  border-color:#5b1717;
}

.progress{
  width:100%;
  height:5px;
  background:#1b1b1b;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:20px;
}

.progressBar{
  height:100%;
  width:0%;
  background:#fff;
  transition:width .15s ease;
}

.card{
  background:#090909;
  border:1px solid #252525;
  border-radius:10px;
  overflow:hidden;
}

.cardHeader{
  padding:18px 20px;
  border-bottom:1px solid #222;
}

.cardHeader h2{
  margin:0 0 5px;
  font-size:21px;
}

.cardHeader p{
  margin:0;
  color:#777;
  font-size:13px;
}

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th{
  text-align:left;
  color:#777;
  font-size:12px;
  padding:13px 14px;
  border-bottom:1px solid #202020;
}

td{
  padding:14px;
  border-bottom:1px solid #171717;
  font-size:14px;
}

.rank{
  width:55px;
  color:#777;
  font-weight:700;
}

.traderName{
  font-weight:700;
  font-size:15px;
}

.wallet{
  color:#555;
  font-family:monospace;
  font-size:12px;
  margin-top:4px;
}

.record{
  font-weight:800;
  font-size:15px;
}

.record.good{
  color:#52ed79;
}

.winrate{
  font-weight:700;
}

.empty{
  padding:45px;
  text-align:center;
  color:#666;
}

.meta{
  padding:14px 18px;
  color:#666;
  font-size:12px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <select id="period">
      <option value="WEEK">Week</option>
      <option value="MONTH">Month</option>
      <option value="3MONTHS">3 Months</option>
    </select>

    <button id="scanBtn" onclick="scan()">
      Scan Best Records
    </button>
  </div>

  <div id="status" class="status">
    Ready.
  </div>

  <div class="progress">
    <div id="progressBar" class="progressBar"></div>
  </div>

  <div class="card">

    <div class="cardHeader">
      <h2>Best Records</h2>
      <p>Ranked strictly by resolved-market record and win rate.</p>
    </div>

    <div class="tableWrap">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>TRADER</th>
            <th>RECORD</th>
            <th>WIN %</th>
          </tr>
        </thead>

        <tbody id="tbody">

          <tr>
            <td colspan="4" class="empty">
              Click Scan Best Records
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <div id="meta" class="meta"></div>

  </div>

</div>

<script>

const PROXY =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const API =
  "https://data-api.polymarket.com";

let scanning = false;


/* =========================
   HELPERS
========================= */

function sleep(ms){
  return new Promise(r => setTimeout(r,ms));
}

function setStatus(text,type=""){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status "+type;
}

function setProgress(v){
  document.getElementById("progressBar").style.width=
    Math.max(0,Math.min(100,v))+"%";
}

function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function periodStart(period){

  const now=Date.now();

  if(period==="WEEK")
    return now-7*86400000;

  if(period==="MONTH")
    return now-30*86400000;

  return now-90*86400000;
}


/* =========================
   NORMALIZE API RESPONSE
========================= */

function normalizeRows(data){

  if(Array.isArray(data))
    return data;

  if(Array.isArray(data?.data))
    return data.data;

  if(Array.isArray(data?.positions))
    return data.positions;

  if(Array.isArray(data?.results))
    return data.results;

  return [];
}


/* =========================
   API
========================= */

async function getJSON(path){

  const urls=[
    PROXY+path,
    API+path
  ];

  for(let attempt=0;attempt<3;attempt++){

    for(const url of urls){

      try{

        const r=await fetch(url,{
          headers:{
            "Accept":"application/json"
          }
        });

        if(r.ok)
          return await r.json();

      }catch(e){}

    }

    await sleep(400*(attempt+1));
  }

  throw new Error("API request failed");
}


/* =========================
   CANDIDATES
========================= */

async function getCandidates(period){

  const candidates=new Map();

  const periods=
    period==="3MONTHS"
      ? ["MONTH","WEEK"]
      : [period];

  for(const p of periods){

    for(const order of ["PNL","VOL"]){

      try{

        const data=await getJSON(
          `/v1/leaderboard?timePeriod=${p}`+
          `&orderBy=${order}`+
          `&category=OVERALL`+
          `&limit=100`+
          `&offset=0`
        );

        const rows=normalizeRows(data);

        for(const row of rows){

          const wallet=
            row.proxyWallet ||
            row.wallet ||
            row.address ||
            row.user;

          if(!wallet) continue;

          const key=wallet.toLowerCase();

          if(!candidates.has(key)){

            candidates.set(key,{
              wallet:wallet,
              name:
                row.userName ||
                row.username ||
                row.name ||
                wallet.slice(0,8)
            });

          }

        }

      }catch(e){}

    }

  }

  return [...candidates.values()];
}


/* =========================
   POSITIONS
========================= */

async function getPositions(wallet,status){

  const base=
    `/v2/positions?user=${encodeURIComponent(wallet)}`+
    `&status=${status}`+
    `&limit=1000`;

  try{

    const data=await getJSON(
      base+"&sort_by=TIMESTAMP"
    );

    return normalizeRows(data);

  }catch(e){

    try{

      const data=await getJSON(base);

      return normalizeRows(data);

    }catch(e2){

      return [];

    }

  }

}


/* =========================
   TIMESTAMP
========================= */

function timestamp(row){

  const values=[
    row.last_event_at,
    row.timestamp,
    row.updated_at,
    row.created_at
  ];

  for(const v of values){

    if(v===undefined || v===null)
      continue;

    const n=Number(v);

    if(Number.isFinite(n)){

      return n<100000000000
        ? n*1000
        : n;

    }

    const d=Date.parse(v);

    if(Number.isFinite(d))
      return d;

  }

  return 0;
}


/* =========================
   CONDITION
========================= */

function condition(row){

  return(
    row.condition_id ||
    row.conditionId ||
    row.condition ||
    row.market ||
    row.slug ||
    ""
  );
}


/* =========================
   PNL
========================= */

function pnl(row){

  const values=[
    row.realized_pnl,
    row.realizedPnl,
    row.pnl,
    row.PNL,
    row.total_pnl
  ];

  for(const v of values){

    const n=Number(v);

    if(Number.isFinite(n))
      return n;

  }

  return 0;
}


/* =========================
   OUTCOME
========================= */

function outcome(rows){

  let win=false;
  let loss=false;

  for(const row of rows){

    const s=
      String(row.status || "").toUpperCase();

    if(
      s==="REDEEMABLE" ||
      s==="WIN" ||
      s==="WON"
    )
      win=true;

    if(
      s==="REDEEMABLE_LOST" ||
      s==="LOSS" ||
      s==="LOST"
    )
      loss=true;

  }

  if(win && !loss)
    return "WIN";

  if(loss && !win)
    return "LOSS";


  /*
    Fallback for closed positions.
  */

  let totalPnl=0;

  for(const row of rows)
    totalPnl+=pnl(row);

  if(totalPnl>0)
    return "WIN";

  if(totalPnl<0)
    return "LOSS";

  return null;
}


/* =========================
   LOAD RECORD
========================= */

async function loadRecord(wallet,start){

  const results=await Promise.all([
    getPositions(wallet,"REDEEMABLE"),
    getPositions(wallet,"REDEEMABLE_LOST"),
    getPositions(wallet,"CLOSED")
  ]);

  const all=[
    ...results[0],
    ...results[1],
    ...results[2]
  ];


  /*
    IMPORTANT:
    Group by condition so multiple
    position rows from the same
    market count as ONE resolved market.
  */

  const grouped=new Map();

  for(const row of all){

    const id=condition(row);

    if(!id)
      continue;

    const ts=timestamp(row);

    /*
      If the API gives no timestamp,
      don't automatically throw it away.
    */

    if(ts && ts<start)
      continue;

    if(!grouped.has(id))
      grouped.set(id,[]);

    grouped.get(id).push(row);

  }


  let wins=0;
  let losses=0;


  for(const rows of grouped.values()){

    const result=outcome(rows);

    if(result==="WIN")
      wins++;

    else if(result==="LOSS")
      losses++;

  }


  return{
    wins,
    losses,
    total:wins+losses,
    winRate:
      wins+losses
        ? wins/(wins+losses)
        : 0
  };

}


/* =========================
   RECORD SCORE
========================= */

/*
  Ranking is based on actual record.

  The first priority is the actual
  win percentage.

  Large samples break ties.

  This prevents something like:

      2-0

  from automatically being treated
  as better than:

      33-1
*/

function sortRecords(a,b){

  if(b.winRate!==a.winRate)
    return b.winRate-a.winRate;

  if(b.wins!==a.wins)
    return b.wins-a.wins;

  if(a.losses!==b.losses)
    return a.losses-b.losses;

  return b.total-a.total;
}


/* =========================
   CONCURRENT SCAN
========================= */

async function pool(items,worker,concurrency,onProgress){

  const results=new Array(items.length);

  let next=0;
  let done=0;

  async function runner(){

    while(true){

      const i=next++;

      if(i>=items.length)
        return;

      try{

        results[i]=
          await worker(items[i]);

      }catch(e){

        results[i]=null;

      }

      done++;

      if(onProgress)
        onProgress(done,items.length);

    }

  }

  const workers=[];

  for(
    let i=0;
    i<Math.min(concurrency,items.length);
    i++
  )
    workers.push(runner());

  await Promise.all(workers);

  return results;
}


/* =========================
   RENDER
========================= */

function render(rows){

  const tbody=
    document.getElementById("tbody");

  if(!rows.length){

    tbody.innerHTML=`
      <tr>
        <td colspan="4" class="empty">
          No resolved records found.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML=
    rows.map((t,i)=>{

      const pct=
        (t.winRate*100).toFixed(1);

      return`

        <tr>

          <td class="rank">
            #${i+1}
          </td>

          <td>

            <div class="traderName">
              ${escapeHTML(t.name)}
            </div>

            <div class="wallet">
              ${escapeHTML(t.wallet)}
            </div>

          </td>

          <td class="record ${
            t.winRate>=0.55
              ? "good"
              : ""
          }">

            ${t.wins}-${t.losses}

          </td>

          <td class="winrate">
            ${pct}%
          </td>

        </tr>

      `;

    }).join("");

  document.getElementById("meta").textContent=
    `${rows.length} records found`;

}


/* =========================
   SCAN
========================= */

async function scan(){

  if(scanning)
    return;

  scanning=true;

  const button=
    document.getElementById("scanBtn");

  button.disabled=true;

  setProgress(0);

  document.getElementById("tbody").innerHTML=`
    <tr>
      <td colspan="4" class="empty">
        Scanning...
      </td>
    </tr>
  `;

  const period=
    document.getElementById("period").value;

  const start=
    periodStart(period);


  try{

    setStatus(
      "Finding traders..."
    );

    const candidates=
      await getCandidates(period);


    if(!candidates.length)
      throw new Error(
        "No candidates found"
      );


    setStatus(
      `Checking ${candidates.length} traders...`
    );


    const results=
      await pool(

        candidates,

        async trader=>{

          const record=
            await loadRecord(
              trader.wallet,
              start
            );

          return{
            ...trader,
            ...record
          };

        },

        15,

        (done,total)=>{

          setProgress(
            done/total*100
          );

          setStatus(
            `Checking records: ${done}/${total}`
          );

        }

      );


    /*
      ONLY keep traders that actually
      have a resolved record.
    */

    const valid=
      results
        .filter(Boolean)
        .filter(t=>t.total>0);


    /*
      SORT ALL TRADERS BEFORE TAKING TOP 100.
    */

    valid.sort(sortRecords);


    const top=
      valid.slice(0,100);


    render(top);


    setProgress(100);

    setStatus(
      `Finished — ${top.length} best records found.`,
      "good"
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Scan failed. Check the Cloudflare proxy/API.",
      "bad"
    );

  }finally{

    scanning=false;
    button.disabled=false;

  }

}

</script>

</body>
</html>
