<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Polymarket W/L Scanner</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#f5f5f5;
  font:14px Arial,sans-serif;
}

main{
  max-width:1200px;
  margin:auto;
  padding:22px;
}

h1{
  margin:0 0 14px;
  font-size:25px;
}

.bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  background:#101010;
  border:1px solid #252525;
  border-radius:12px;
  padding:12px;
}

select,
button{
  background:#181818;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  padding:9px 12px;
}

button{
  cursor:pointer;
  font-weight:700;
}

button:hover{
  background:#222;
}

.status{
  margin:12px 0;
  color:#aaa;
  min-height:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }
}

section{
  background:#0d0d0d;
  border:1px solid #252525;
  border-radius:12px;
  overflow:hidden;
}

.head{
  padding:13px 15px;
  border-bottom:1px solid #252525;
  font-weight:800;
}

.scroll{
  max-height:650px;
  overflow:auto;
}

.row{
  display:grid;
  grid-template-columns:48px 1fr 75px 80px 90px;
  gap:8px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #191919;
}

.rank{
  color:#888;
}

.name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.muted{
  color:#888;
}

.win{
  color:#8ee28e;
}

.loss{
  color:#ff8c8c;
}

.cards{
  padding:12px;
}

.market{
  border:1px solid #262626;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.market h3{
  font-size:15px;
  margin:0 0 8px;
}

.pill{
  display:inline-block;
  border:1px solid #333;
  border-radius:999px;
  padding:3px 7px;
  margin-right:5px;
  font-size:11px;
  color:#aaa;
}

.holder{
  padding:8px 0;
  border-top:1px solid #202020;
  display:grid;
  grid-template-columns:1fr 80px 90px 125px 60px;
  gap:8px;
}

.error{
  color:#ff7777;
}

.empty{
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<main>

<h1>Polymarket W/L Scanner</h1>

<div class="bar">

<label>
Period

<select id="period">
<option value="week">Week</option>
<option value="month">Month</option>
<option value="3m">3 Months</option>
</select>

</label>

<label>
Shared

<select id="threshold">
<option value="1">1+</option>
<option value="2">2+</option>
<option value="5">5+</option>
<option value="10">10+</option>
</select>

</label>

<button id="scan">
SCAN
</button>

</div>

<div id="status" class="status">
Ready.
</div>

<div class="grid">

<section>

<div class="head">
Top 100 Traders — W/L ratio
</div>

<div id="leaders" class="scroll">
<div class="empty">
Run a scan.
</div>
</div>

</section>

<section>

<div class="head">
Shared Active Markets — Top 1,000 weekly traders
</div>

<div id="markets" class="cards">
<div class="empty">
Run a scan.
</div>
</div>

</section>

</div>

</main>

<script>

const WORKER =
  'https://polymarket-proxy.rowanmcbride77.workers.dev';

const $ = id =>
  document.getElementById(id);

const periodDays = {
  week: 7,
  month: 30,
  '3m': 90
};

let weeklyTop = [];
let activeCache = [];
let recordByUser = new Map();

function esc(s){
  return String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function fmt(n,d=2){
  return Number.isFinite(+n)
    ? (+n).toLocaleString(undefined,{
        maximumFractionDigits:d
      })
    : '—';
}

function ratio(w,l){
  if(l === 0){
    return w > 0 ? '∞' : '—';
  }

  return (w/l).toFixed(2);
}

async function api(path,timeout=25000){

  const ctl = new AbortController();

  const timer = setTimeout(
    () => ctl.abort(),
    timeout
  );

  try{

    const response = await fetch(
      WORKER +
      '/proxy?' +
      new URLSearchParams({
        path
      }),
      {
        signal:ctl.signal,
        cache:'no-store'
      }
    );

    const text = await response.text();

    let json;

    try{
      json = JSON.parse(text);
    }
    catch{
      throw new Error(
        'Worker returned non-JSON (' +
        response.status +
        ')'
      );
    }

    if(!response.ok){
      throw new Error(
        json.error ||
        ('HTTP ' + response.status)
      );
    }

    return json;

  }
  catch(error){

    if(error.name === 'AbortError'){
      throw new Error(
        'Request timed out'
      );
    }

    throw error;

  }
  finally{

    clearTimeout(timer);

  }
}

async function page(
  path,
  limit=1000,
  maxPages=5
){

  let output = [];
  let cursor = '';

  for(
    let i=0;
    i<maxPages;
    i++
  ){

    const url =
      new URL(
        path,
        'https://scanner.local'
      );

    url.searchParams.set(
      'limit',
      String(limit)
    );

    if(cursor){
      url.searchParams.set(
        'cursor',
        cursor
      );
    }

    const response =
      await api(
        url.pathname +
        url.search
      );

    const data =
      Array.isArray(response.data)
        ? response.data
        : [];

    output.push(...data);

    cursor =
      response.pagination?.next_cursor ||
      '';

    if(
      !cursor ||
      !response.pagination?.has_more
    ){
      break;
    }
  }

  return output;
}

function periodStart(period){

  return Math.floor(
    Date.now()/1000
  ) -
  periodDays[period] *
  86400;
}

async function userRecord(
  user,
  start
){

  const now =
    Math.floor(
      Date.now()/1000
    );

  const winners =
    'user=' +
    encodeURIComponent(user) +
    '&status=REDEEMABLE' +
    '&start=' +
    start +
    '&end=' +
    now +
    '&limit=1000';

  const losers =
    'user=' +
    encodeURIComponent(user) +
    '&status=REDEEMABLE_LOST' +
    '&start=' +
    start +
    '&end=' +
    now +
    '&limit=1000';

  const [
    winnerResponse,
    loserResponse
  ] = await Promise.all([

    api(
      '/v2/positions?' +
      winners
    ),

    api(
      '/v2/positions?' +
      losers
    )

  ]);

  return {

    w:
      Array.isArray(
        winnerResponse.data
      )
        ? winnerResponse.data.length
        : 0,

    l:
      Array.isArray(
        loserResponse.data
      )
        ? loserResponse.data.length
        : 0

  };
}

async function mapLimit(
  items,
  concurrency,
  fn
){

  let next = 0;

  const results =
    new Array(items.length);

  async function worker(){

    while(true){

      const index =
        next++;

      if(
        index >= items.length
      ){
        return;
      }

      try{

        results[index] =
          await fn(
            items[index],
            index
          );

      }
      catch(error){

        results[index] = {
          error:error.message
        };

      }

    }

  }

  await Promise.all(
    Array.from(
      {
        length:concurrency
      },
      worker
    )
  );

  return results;
}

async function scan(){

  $('scan').disabled = true;

  $('leaders').innerHTML = '';
  $('markets').innerHTML = '';

  const period =
    $('period').value;

  const start =
    periodStart(period);

  try{

    $('status').textContent =
      'Loading Polymarket leaderboard…';

    const leaderboardPeriod =
      period === '3m'
        ? 'month'
        : period;

    const leaderboard =
      await page(
        '/v2/leaderboard' +
        '?time_period=' +
        leaderboardPeriod +
        '&sort_by=PNL' +
        '&limit=1000',
        1000,
        2
      );

    weeklyTop =
      leaderboard.slice(
        0,
        1000
      );

    /*
      3-month mode uses the current
      month board plus the all-time
      board to create the candidate pool.
    */

    if(period === '3m'){

      const allTime =
        await page(
          '/v2/leaderboard' +
          '?time_period=all' +
          '&sort_by=PNL' +
          '&limit=1000',
          1000,
          2
        );

      const seen =
        new Set(
          weeklyTop.map(
            x =>
              x.user_id ||
              x.proxy_wallet ||
              x.user
          )
        );

      for(
        const trader of allTime
      ){

        const user =
          trader.user_id ||
          trader.proxy_wallet ||
          trader.user;

        if(!seen.has(user)){

          weeklyTop.push(
            trader
          );

          seen.add(user);

        }

      }

      weeklyTop =
        weeklyTop.slice(
          0,
          1000
        );
    }

    if(!weeklyTop.length){

      throw new Error(
        'Polymarket returned no leaderboard rows.'
      );

    }

    $('status').textContent =
      'Calculating W/L for ' +
      weeklyTop.length +
      ' traders…';

    const records =
      await mapLimit(
        weeklyTop,
        24,
        async trader => {

          const user =
            trader.user_id ||
            trader.proxy_wallet ||
            trader.user;

          const record =
            await userRecord(
              user,
              start
            );

          return {
            ...trader,
            ...record,
            user_id:user
          };

        }
      );

    const good =
      records.filter(
        x =>
          x &&
          !x.error
      );

    recordByUser =
      new Map(
        good.map(
          x => [
            x.user_id,
            {
              w:x.w,
              l:x.l
            }
          ]
        )
      );

    good.sort(
      (a,b) => {

        const aRatio =
          a.l
            ? a.w/a.l
            : a.w
              ? Infinity
              : -1;

        const bRatio =
          b.l
            ? b.w/b.l
            : b.w
              ? Infinity
              : -1;

        return (
          bRatio -
          aRatio
        ) ||
        (
          b.w -
          a.w
        ) ||
        (
          a.l -
          b.l
        );

      }
    );

    renderLeaders(
      good.slice(
        0,
        100
      )
    );

    $('status').textContent =
      'Loading active positions for the top 1,000…';

    const active =
      await mapLimit(
        weeklyTop,
        24,
        async trader => {

          const user =
            trader.user_id ||
            trader.proxy_wallet ||
            trader.user;

          const response =
            await api(
              '/v2/positions?' +
              'user=' +
              encodeURIComponent(user) +
              '&status=OPEN' +
              '&limit=1000'
            );

          const positions =
            Array.isArray(
              response.data
            )
              ? response.data
              : [];

          return positions
            .filter(
              position =>
                position.current_size >
                0.1
            )
            .map(
              position => ({
                ...position,
                user,
                display:
                  trader.user_name ||
                  trader.name ||
                  'Unnamed'
              })
            );

        }
      );

    const flat =
      active.flat();

    activeCache =
      flat;

    renderMarkets(
      flat
    );

    $('status').textContent =
      'Done. ' +
      good.length +
      ' ranked traders; ' +
      flat.length +
      ' active positions scanned.';

  }
  catch(error){

    $('status').innerHTML =
      '<span class="error">' +
      'Scan failed: ' +
      esc(error.message) +
      '</span>';

    $('leaders').innerHTML =
      '<div class="empty error">' +
      esc(error.message) +
      '</div>';

  }
  finally{

    $('scan').disabled =
      false;

  }
}

function renderLeaders(rows){

  $('leaders').innerHTML =
    rows.length

      ? rows.map(
          (trader,index) =>

            '<div class="row">' +

              '<div class="rank">' +
                (index + 1) +
              '</div>' +

              '<div class="name">' +
                esc(
                  trader.user_name ||
                  trader.name ||
                  'Unnamed'
                ) +
              '</div>' +

              '<div class="win">' +
                trader.w +
              '</div>' +

              '<div class="loss">' +
                trader.l +
              '</div>' +

              '<div>' +
                '<b>' +
                ratio(
                  trader.w,
                  trader.l
                ) +
                '</b>' +
              '</div>' +

            '</div>'
        ).join('')

      : '<div class="empty">' +
        'No qualifying traders.' +
        '</div>';
}

function renderMarkets(flat){

  const markets =
    new Map();

  for(
    const position of flat
  ){

    const key =
      position.condition_id ||
      position.conditionId;

    if(!key){
      continue;
    }

    if(!markets.has(key)){

      markets.set(
        key,
        {
          title:
            position.title ||
            position.question ||
            'Untitled market',

          condition:key,

          outcome:
            position.outcome ||
            'Unknown',

          holders:[]
        }
      );

    }

    markets
      .get(key)
      .holders
      .push(position);

  }

  let shared =
    [...markets.values()];

  const threshold =
    +$('threshold').value;

  shared =
    shared
      .filter(
        market =>
          market.holders.length >=
          threshold
      )
      .filter(
        market => {

          const sides =
            new Set(
              market.holders.map(
                holder =>
                  String(
                    holder.outcome ||
                    ''
                  ).toLowerCase()
              )
            );

          return sides.size === 1;

        }
      );

  shared.sort(
    (a,b) =>
      b.holders.length -
      a.holders.length
  );

  $('markets').innerHTML =
    shared.length

      ? shared
          .slice(0,100)
          .map(
            market =>

              '<div class="market">' +

                '<h3>' +
                esc(
                  market.title
                ) +
                '</h3>' +

                '<span class="pill">' +
                market.holders.length +
                ' trader' +
                (
                  market.holders.length === 1
                    ? ''
                    : 's'
                ) +
                '</span>' +

                '<span class="pill">' +
                esc(
                  market.outcome
                ) +
                '</span>' +

                market.holders
                  .sort(
                    (a,b) =>
                      (b.current_value || 0) -
                      (a.current_value || 0)
                  )
                  .map(
                    holder => {

                      const record =
                        recordByUser.get(
                          holder.user
                        );

                      return (

                        '<div class="holder">' +

                          '<div>' +

                            '<b>' +
                            esc(
                              holder.display
                            ) +
                            '</b>' +

                            '<div class="muted">' +
                            esc(
                              holder.outcome ||
                              ''
                            ) +
                            '</div>' +

                          '</div>' +

                          '<div>' +
                          fmt(
                            holder.current_size
                          ) +
                          ' sh' +
                          '</div>' +

                          '<div>' +
                          '$' +
                          fmt(
                            holder.entry_cost_usdc ??
                            holder.initial_value ??
                            0
                          ) +
                          '</div>' +

                          '<div>' +
                          (
                            holder.first_entry_at
                              ? new Date(
                                  holder.first_entry_at *
                                  1000
                                ).toLocaleString()
                              : '—'
                          ) +
                          '</div>' +

                          '<div class="muted">' +
                          'W/L ' +
                          (
                            record
                              ? record.w +
                                '-' +
                                record.l
                              : '—'
                          ) +
                          '</div>' +

                        '</div>'

                      );

                    }
                  )
                  .join('') +

              '</div>'
          )
          .join('')

      : '<div class="empty">' +
        'No same-side shared active markets met the threshold.' +
        '</div>';
}

$('scan')
  .addEventListener(
    'click',
    scan
  );

$('threshold')
  .addEventListener(
    'change',
    () => {

      if(activeCache.length){
        renderMarkets(
          activeCache
        );
      }

    }
  );

</script>

</body>
</html>
