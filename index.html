<style>
*{box-sizing:border-box}

body{

select,
button,
input{

    border:1px solid #333;

}

button{

}

button:hover{

button:disabled{

}

<body>

<div class="container">

<script>

/* ============================================================
   CONFIG
============================================================ */

const API =
    "https://data-api.polymarket.com";

const WORKER =
    "https://polymarket-proxy.rowanmcbride.workers.dev";


let traders = [];
let markets = [];
let openTrader = null;
let scanNumber = 0;


/* ============================================================
   BASIC HELPERS
============================================================ */

const $ = id =>
    document.getElementById(id);


function n(value){

    const x = Number(value);

    return Number.isFinite(x)
        ? x
        : 0;

}


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        })[c]);

}


function money(value){

    const x = n(value);
    const abs = Math.abs(x);

    let result;

    if(abs >= 1000000000)
        result = "$" + (abs/1000000000).toFixed(2) + "B";
    else if(abs >= 1000000)
        result = "$" + (abs/1000000).toFixed(2) + "M";
    else if(abs >= 1000)
        result = "$" + (abs/1000).toFixed(1) + "K";
    else
        result = "$" + abs.toFixed(2);

    return x < 0 ? "-" + result : result;

}


function percent(value){

    return n(value).toFixed(1) + "%";

}


function shortWallet(wallet){

    if(!wallet)
        return "";

    if(wallet.length <= 15)
        return wallet;

    return wallet.slice(0,8) +
        "..." +
        wallet.slice(-5);

}


function setStatus(text,good=false){

    $("status").textContent = text;

    $("status").className =
        "status" +
        (good ? " good" : "");

}


function setProgress(value){

    $("progressBar").style.width =
        Math.max(0,Math.min(100,value)) + "%";

}


function sleep(ms){

    return new Promise(resolve =>
        setTimeout(resolve,ms)
    );

}


/* ============================================================
   API
============================================================ */

/*
    Direct Data API first.

    If GitHub Pages/browser CORS prevents it,
    try the Cloudflare worker.

    Worker is attempted in two common formats.
*/

async function rawFetch(url){

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            20000
        );

    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal,
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );

        const text =
            await response.text();

        let data;

        try{
            data = JSON.parse(text);
        }catch{
            throw new Error(
                "Non-JSON response: " +
                text.slice(0,200)
            );
        }

        if(!response.ok){

            throw new Error(
                data?.error ||
                data?.message ||
                ("HTTP " + response.status)
            );

        }

        return data;

    }finally{

        clearTimeout(timeout);

    }

}


async function api(url){

    let directError = null;

    try{

        return await rawFetch(url);

    }catch(error){

        directError = error;

    }


    const proxy1 =
        WORKER +
        "?url=" +
        encodeURIComponent(url);


    try{

        return await rawFetch(proxy1);

    }catch{}


    const parsed =
        new URL(url);


    const proxy2 =
        WORKER +
        parsed.pathname +
        parsed.search;


    try{

        return await rawFetch(proxy2);

    }catch(error){

        throw new Error(
            "API failed: " +
            (
                error.message ||
                directError?.message ||
                "unknown error"
            )
        );

    }

}


/* ============================================================
   PERIOD
============================================================ */

function periodSeconds(){

    const period =
        $("period").value;

    if(period === "week")
        return 7 * 86400;

    if(period === "month")
        return 30 * 86400;

    return 90 * 86400;

}


function range(){

    const end =
        Math.floor(
            Date.now()/1000
        );

    return {
        start:end-periodSeconds(),
        end
    };

}


/* ============================================================
   V2 LEADERBOARD
============================================================ */

function leaderboardPeriod(){

    const period =
        $("period").value;

    if(period === "week")
        return "WEEK";

    if(period === "month")
        return "MONTH";

    /*
        3M is not a native leaderboard window.
        We use ALL to obtain a large candidate pool,
        then calculate the actual 90-day statistics.
    */

    return "ALL";

}


async function getLeaderboard(){

    const all = new Map();

    const periods = [

        {
            sort:"PNL",
            period:leaderboardPeriod()
        },

        {
            sort:"VOLUME",
            period:leaderboardPeriod()
        }

    ];


    for(const cfg of periods){

        let cursor = null;

        for(let page=0; page<3; page++){

            const params =
                new URLSearchParams();

            params.set(
                "time_period",
                cfg.period.toLowerCase()
            );

            params.set(
                "sort_by",
                cfg.sort
            );

            params.set(
                "category",
                "overall"
            );

            params.set(
                "limit",
                "100"
            );

            if(cursor)
                params.set(
                    "cursor",
                    cursor
                );


            const result =
                await api(
                    API +
                    "/v2/leaderboard?" +
                    params.toString()
                );


            const rows =
                Array.isArray(result)
                    ? result
                    : Array.isArray(result?.data)
                        ? result.data
                        : [];


            for(const row of rows){

                const wallet =
                    String(
                        row?.user_id ||
                        row?.proxy_wallet ||
                        row?.proxyWallet ||
                        row?.wallet ||
                        row?.user ||
                        ""
                    ).toLowerCase();


                if(!wallet)
                    continue;


                if(!all.has(wallet)){

                    all.set(
                        wallet,
                        {
                            wallet,
                            name:
                                row?.user_name ||
                                row?.userName ||
                                row?.username ||
                                row?.name ||
                                shortWallet(wallet),
                            profile:
                                row
                        }
                    );

                }

            }


            cursor =
                result?.pagination?.next_cursor ||
                null;


            if(!cursor || !rows.length)
                break;

        }

    }


    /*
        Sort the candidate pool by the requested
        period leaderboard data and keep 100.
    */

    let result =
        [...all.values()];


    result.sort(
        (a,b)=>
            n(b.profile?.pnl) -
            n(a.profile?.pnl)
    );


    return result.slice(0,100);

}


/* ============================================================
   PNL
============================================================ */

/*
    For week/month, the v2 leaderboard already gives
    the selected-period P/L.

    For 3M, use cumulative PnL history and calculate:

        PnL at now - PnL at 90d ago
*/

async function getPnl(trader){

    const period =
        $("period").value;


    if(
        period === "week" ||
        period === "month"
    ){

        /*
            Re-query the user's leaderboard standing.
            This gives the actual selected-window PNL.
        */

        const params =
            new URLSearchParams();

        params.set(
            "time_period",
            period
        );

        params.set(
            "sort_by",
            "PNL"
        );

        params.set(
            "category",
            "overall"
        );

        params.set(
            "user",
            trader.wallet
        );


        const result =
            await api(
                API +
                "/v2/leaderboard?" +
                params.toString()
            );


        const rows =
            Array.isArray(result)
                ? result
                : Array.isArray(result?.data)
                    ? result.data
                    : [];


        const row =
            rows[0] ||
            result?.data ||
            result;


        trader.pnl =
            n(
                row?.pnl
            );


        trader.volume =
            n(
                row?.volume ??
                row?.vol
            );


        trader.pnlLoaded=true;

        return;

    }


    /*
        3-month P/L.
    */

    const result =
        await api(
            API +
            "/v2/user-pnl?" +
            new URLSearchParams({
                user:trader.wallet,
                interval:"max",
                fidelity:"1d"
            }).toString()
        );


    const points =
        Array.isArray(
            result?.data?.points
        )
            ? result.data.points
            : Array.isArray(result?.points)
                ? result.points
                : [];


    if(!points.length){

        trader.pnl=0;
        trader.pnlLoaded=true;
        return;

    }


    const cutoff =
        range().start;


    let latest =
        points[points.length-1];


    let before =
        points[0];


    for(const point of points){

        const timestamp =
            n(
                point?.timestamp
            );


        if(timestamp <= cutoff){

            before = point;

        }

    }


    /*
        Use cumulative realized/position PnL.
    */

    const value = pointPnl(latest);
    const oldValue = pointPnl(before);

    trader.pnl =
        value-oldValue;

    trader.volume =
        n(
            latest?.volume_usdc ??
            latest?.volume
        );

    trader.pnlLoaded=true;

}


function pointPnl(point){

    if(!point)
        return 0;

    /*
        economic_pnl is the broadest account-level
        PnL measure when available.

        Otherwise use realized_pnl.
    */

    if(
        point.economic_pnl !== null &&
        point.economic_pnl !== undefined
    )
        return n(point.economic_pnl);

    if(
        point.realized_pnl !== null &&
        point.realized_pnl !== undefined
    )
        return n(point.realized_pnl);

    if(
        point.trade_pnl !== null &&
        point.trade_pnl !== undefined
    )
        return n(point.trade_pnl);

    return 0;

}


/* ============================================================
   VOLUME
============================================================ */

async function getVolume(trader){

    const r =
        range();


    const result =
        await api(
            API +
            "/v2/user-volume?" +
            new URLSearchParams({
                user:trader.wallet,
                start:String(r.start),
                end:String(r.end)
            }).toString()
        );


    const data =
        result?.data ||
        result ||
        {};


    trader.volume =
        n(
            data.volume_usdc ??
            data.volume
        );


    trader.volumeLoaded=true;

}


/* ============================================================
   CURRENT POSITIONS
============================================================ */

async function getCurrentPositions(trader){

    let cursor = null;

    const positions = [];


    for(let page=0; page<10; page++){

        const params =
            new URLSearchParams();

        params.set(
            "user",
            trader.wallet
        );

        params.set(
            "status",
            "OPEN"
        );

        params.set(
            "limit",
            "1000"
        );

        params.set(
            "sort_by",
            "CURRENT_VALUE"
        );

        params.set(
            "sort_direction",
            "DESC"
        );

        params.set(
            "filter_type",
            "TOKENS"
        );

        params.set(
            "filter_amount",
            "0.01"
        );

        params.set(
            "include_archived",
            "false"
        );


        if(cursor){

            params.set(
                "cursor",
                cursor
            );

        }


        const result =
            await api(
                API +
                "/v2/positions?" +
                params.toString()
            );


        const rows =
            Array.isArray(result)
                ? result
                : Array.isArray(result?.data)
                    ? result.data
                    : [];


        positions.push(
            ...rows
        );


        cursor =
            result?.pagination?.next_cursor ||
            null;


        if(
            !cursor ||
            !rows.length
        )
            break;

    }


    /*
        OPEN is a superset in Polymarket.

        Exclude:
        - redeemable winners
        - resolved positions
        - zero-size positions
        - zero-value positions
        - archived markets
    */

    trader.active =
        positions.filter(
            p=>{

                const status =
                    String(
                        p?.status ||
                        ""
                    ).toUpperCase();


                const redeemable =
                    p?.redeemable === true ||
                    status === "REDEEMABLE";


                const size =
                    n(
                        p?.current_size
                    );


                const value =
                    n(
                        p?.current_value
                    );


                return (
                    !redeemable &&
                    status !== "REDEEMABLE_LOST" &&
                    size > 0.01 &&
                    value > 0 &&
                    p?.archived !== true
                );

            }
        );


    /*
        Deduplicate token IDs.
    */

    const seen =
        new Set();


    trader.active =
        trader.active.filter(
            p=>{

                const key =
                    String(
                        p?.token_id ||
                        p?.condition_id +
                        "|" +
                        p?.outcome
                    );


                if(seen.has(key))
                    return false;


                seen.add(key);

                return true;

            }
        );


    trader.activeLoaded=true;

}


/* ============================================================
   WIN / LOSS
============================================================ */

/*
    We use two sources:

    1. REDEEMABLE = resolved winning positions.
    2. CLOSED rows that resolved at 0 = resolved losses.

    We do NOT count positions that were merely sold
    before resolution as wins/losses.
*/

async function getRecord(trader){

    const r =
        range();


    let wins = 0;
    let losses = 0;


    /*
        WINNERS
    */

    let cursor = null;


    for(let page=0; page<10; page++){

        const params =
            new URLSearchParams();

        params.set(
            "user",
            trader.wallet
        );

        params.set(
            "status",
            "REDEEMABLE"
        );

        params.set(
            "limit",
            "1000"
        );

        params.set(
            "sort_by",
            "TIMESTAMP"
        );

        params.set(
            "sort_direction",
            "DESC"
        );

        params.set(
            "start",
            String(r.start)
        );

        params.set(
            "end",
            String(r.end)
        );


        if(cursor)
            params.set(
                "cursor",
                cursor
            );


        const result =
            await api(
                API +
                "/v2/positions?" +
                params.toString()
            );


        const rows =
            Array.isArray(result)
                ? result
                : Array.isArray(result?.data)
                    ? result.data
                    : [];


        for(const p of rows){

            const price =
                n(
                    p?.current_price
                );


            /*
                REDEEMABLE is already a resolved
                winning position. Only count if
                the token actually pays 1.
            */

            if(
                price >= 0.999
            ){

                wins++;

            }

        }


        cursor =
            result?.pagination?.next_cursor ||
            null;


        if(!cursor || !rows.length)
            break;

    }


    /*
        LOSSES

        CLOSED rows with final price 0.
    */

    cursor = null;


    for(let page=0; page<10; page++){

        const params =
            new URLSearchParams();

        params.set(
            "user",
            trader.wallet
        );

        params.set(
            "status",
            "CLOSED"
        );

        params.set(
            "limit",
            "1000"
        );

        params.set(
            "sort_by",
            "TIMESTAMP"
        );

        params.set(
            "sort_direction",
            "DESC"
        );

        params.set(
            "start",
            String(r.start)
        );

        params.set(
            "end",
            String(r.end)
        );


        if(cursor)
            params.set(
                "cursor",
                cursor
            );


        const result =
            await api(
                API +
                "/v2/positions?" +
                params.toString()
            );


        const rows =
            Array.isArray(result)
                ? result
                : Array.isArray(result?.data)
                    ? result.data
                    : [];


        for(const p of rows){

            const price =
                n(
                    p?.current_price
                );


            /*
                0 = lost resolution.

                Do NOT count negative P/L alone,
                because a trader can intentionally
                sell a position for a loss.
            */

            if(
                price <= 0.001
            ){

                losses++;

            }

        }


        cursor =
            result?.pagination?.next_cursor ||
            null;


        if(!cursor || !rows.length)
            break;

    }


    trader.wins = wins;
    trader.losses = losses;

    trader.total =
        wins + losses;

    trader.winrate =
        trader.total
            ? wins/trader.total*100
            : 0;

    trader.recordLoaded=true;

}


/* ============================================================
   TRADER
============================================================ */

function createTrader(x){

    return {

        wallet:x.wallet,

        name:x.name,

        pnl:0,

        volume:0,

        roi:0,

        wins:0,

        losses:0,

        total:0,

        winrate:0,

        active:[],

        pnlLoaded:false,

        volumeLoaded:false,

        recordLoaded:false,

        activeLoaded:false,

        errors:[]

    };

}


/* ============================================================
   LOAD ONE TRADER
============================================================ */

async function loadTrader(trader){

    /*
        Run all independent calls together.
    */

    const results =
        await Promise.allSettled([

            getRecord(trader),

            getPnl(trader),

            getVolume(trader),

            getCurrentPositions(trader)

        ]);


    const names = [
        "W/L",
        "P/L",
        "Volume",
        "Positions"
    ];


    results.forEach(
        (result,index)=>{

            if(
                result.status === "rejected"
            ){

                trader.errors.push(
                    names[index] +
                    ": " +
                    result.reason?.message
                );

            }

        }
    );


    trader.roi =
        trader.volume > 0
            ? trader.pnl /
              trader.volume *
              100
            : 0;

}


/* ============================================================
   SORT
============================================================ */

function sortedTraders(){

    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();


    let list =
        traders.filter(
            t=>
                !search ||
                t.name
                    .toLowerCase()
                    .includes(search) ||
                t.wallet
                    .toLowerCase()
                    .includes(search)
        );


    const sort =
        $("sort").value;


    list.sort(
        (a,b)=>{

            if(sort === "winrate"){

                return (
                    b.winrate-a.winrate ||
                    b.wins-a.wins ||
                    b.total-a.total
                );

            }


            if(sort === "pnl"){

                return (
                    b.pnl-a.pnl ||
                    b.winrate-a.winrate
                );

            }


            if(sort === "roi"){

                return (
                    b.roi-a.roi ||
                    b.winrate-a.winrate
                );

            }


            if(sort === "volume"){

                return (
                    b.volume-a.volume
                );

            }


            /*
                RECORD

                Perfect records first.
                Then win percentage.
                Then number of wins.
            */

            const perfectA =
                a.total > 0 &&
                a.losses === 0;

            const perfectB =
                b.total > 0 &&
                b.losses === 0;


            if(
                perfectA !== perfectB
            ){

                return perfectB-perfectA;

            }


            return (
                b.winrate-a.winrate ||
                b.wins-a.wins ||
                b.total-a.total
            );

        }
    );


    return list;

}

/* ============================================================
   TOGGLE TRADER
============================================================ */

function toggleTrader(wallet){

    if(openTrader === wallet){

        openTrader = null;

    }else{

        openTrader = wallet;

    }


    renderTraders();

}


/* ============================================================
   ACTIVE MARKETS
============================================================ */

function buildMarkets(){

    const map =
        new Map();


    for(const trader of traders){

        for(const p of trader.active){

            const key =
                String(
                    p?.condition_id ||
                    p?.event_id ||
                    p?.slug ||
                    p?.title ||
                    ""
                );


            if(!key)
                continue;


            if(!map.has(key)){

                map.set(
                    key,
                    {
                        key,
                        title:
                            p?.title ||
                            p?.name ||
                            p?.slug ||
                            "Unknown market",
                        holders:new Map(),
                        totalValue:0
                    }
                );

            }


            const market =
                map.get(key);


            const value =
                n(
                    p?.current_value
                );


            market.totalValue +=
                value;


            if(
                !market.holders.has(
                    trader.wallet
                )
            ){

                market.holders.set(
                    trader.wallet,
                    {
                        trader,
                        sides:new Set(),
                        value:0
                    }
                );

            }


            const holder =
                market.holders.get(
                    trader.wallet
                );


            holder.value +=
                value;


            if(p?.outcome){

                holder.sides.add(
                    String(
                        p.outcome
                    )
                );

            }

        }

    }


    markets =
        [...map.values()]
            .map(
                market=>{

                    const holders =
                        [...market.holders.values()];


                    const yes =
                        holders.filter(
                            h=>
                                [...h.sides]
                                    .some(
                                        s=>
                                            s.toLowerCase()==="yes"
                                    )
                        ).length;


                    const no =
                        holders.filter(
                            h=>
                                [...h.sides]
                                    .some(
                                        s=>
                                            s.toLowerCase()==="no"
                                    )
                        ).length;


                    return {
                        ...market,
                        holders,
                        yes,
                        no
                    };

                }
            )
            .sort(
                (a,b)=>
                    b.holders.length -
                    a.holders.length
            );


    renderMarkets();

    updateStats();

}

}


/* ============================================================
   STATS
============================================================ */

function updateStats(){

    $("statTraders").textContent =
        traders.length;


    $("statResolved").textContent =
        traders.reduce(
            (sum,t)=>
                sum+t.total,
            0
        );


    $("statPositions").textContent =
        traders.reduce(
            (sum,t)=>
                sum+t.active.length,
            0
        );


    $("statMarkets").textContent =
        markets.length;


    $("statShared").textContent =
        markets.filter(
            m=>
                m.holders.length >= 2
        ).length;


    $("statPnl").textContent =
        money(
            traders.reduce(
                (sum,t)=>
                    sum+t.pnl,
                0
            )
        );

}


/* ============================================================
   MAIN SCAN
============================================================ */

async function scan(){

    const thisScan =
        ++scanNumber;


    traders=[];
    markets=[];
    openTrader=null;


    $("scanBtn").disabled =
        true;


    $("errors").innerHTML =
        "";


    $("traderTable").innerHTML =
        '<div class="empty">Loading Top 100...</div>';


    $("markets").innerHTML =
        '<div class="empty">Loading...</div>';


    setProgress(0);


    try{

        setStatus(
            "Loading Top 100 wallets..."
        );


        const candidates =
            await getLeaderboard();


        if(
            thisScan !== scanNumber
        )
            return;


        if(!candidates.length){

            throw new Error(
                "Polymarket returned zero leaderboard wallets."
            );

        }


        traders =
            candidates.map(
                createTrader
            );


        renderTraders();

        updateStats();

        setProgress(5);


        /*
            10 concurrent wallets.

            Each wallet gets:
            - W/L
            - P/L
            - volume
            - current positions

            simultaneously.
        */

        let nextIndex=0;
        let finished=0;

        const concurrency=10;


        async function worker(){

            while(true){

                const index =
                    nextIndex++;


                if(
                    index >= traders.length
                )
                    return;


                const trader =
                    traders[index];


                await loadTrader(
                    trader
                );


                finished++;


                if(
                    thisScan !== scanNumber
                )
                    return;


                buildMarkets();

                renderTraders();

                updateStats();


                setProgress(
                    5 +
                    (
                        finished /
                        traders.length
                    ) * 95
                );


                setStatus(
                    "Scanning " +
                    finished +
                    "/" +
                    traders.length +
                    " — " +
                    trader.name
                );

            }

        }


        await Promise.all(
            Array.from(
                {
                    length:concurrency
                },
                worker
            )
        );


        if(
            thisScan !== scanNumber
        )
            return;


        buildMarkets();

        renderTraders();

        updateStats();

        setProgress(100);


        const failed =
            traders.filter(
                t=>
                    t.errors.length
            );


        if(failed.length){

            $("errors").innerHTML =

                `<div class="error">
                    ${failed.length} wallet(s) had one or more API errors.

                    <br><br>

                    ${failed
                        .slice(0,10)
                        .map(
                            t=>
                                esc(
                                    t.name +
                                    ": " +
                                    t.errors.join(" | ")
                                )
                        )
                        .join("<br>")}

                </div>`;

        }


        setStatus(
            "Finished — " +
            traders.length +
            " traders scanned.",
            true
        );


    }catch(error){

        console.error(error);


        setStatus(
            "ERROR: " +
            error.message,
            false
        );


        $("traderTable").innerHTML =
            `<div class="error">
                ${esc(error.message)}
            </div>`;

    }finally{

        if(
            thisScan === scanNumber
        ){

            $("scanBtn").disabled =
                false;

        }

    }

}


/* ============================================================
   EVENTS
============================================================ */

$("scanBtn").onclick =
    scan;


$("sort").onchange =
    renderTraders;


$("search").oninput =

        $("markets").innerHTML =
            '<div class="empty">Click Scan Top 100.</div>';

        $("errors").innerHTML =

        updateStats();

    };
