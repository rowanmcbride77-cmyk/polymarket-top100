<script>

const WORKER =
"https://polymarket-proxy.rowanmcbride.workers.dev";

const DIRECT =
"https://data-api.polymarket.com";

let PERIOD="WEEK";

let traders=[];
let sharedMarkets=[];

let activeScanRunning=false;

const $=id=>document.getElementById(id);


/* =========================
   HELPERS
========================= */

function esc(v){

    return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


function n(v){

    const x=Number(v);

    return Number.isFinite(x)?x:0;
}


function money(v){

    if(
        v===null ||
        v===undefined ||
        !Number.isFinite(Number(v))
    ){
        return "—";
    }

    const x=Number(v);

    return (x<0?"-$":"$")+
        Math.abs(x).toLocaleString(undefined,{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}


function dateValue(v){

    if(v===null || v===undefined || v===""){
        return null;
    }

    const x=Number(v);

    if(Number.isFinite(x)){

        return new Date(
            x<1000000000000
            ?x*1000
            :x
        );
    }

    const d=new Date(v);

    return isNaN(d)?null:d;
}


function formatDate(v){

    const d=dateValue(v);

    if(!d){
        return "Buy time unavailable";
    }

    return d.toLocaleString([],{
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
    });
}


/* =========================
   API
========================= */

async function fetchJSON(base,path){

    const r=await fetch(
        base+path,
        {cache:"no-store"}
    );

    const text=await r.text();

    if(!r.ok){

        throw new Error(
            "HTTP "+
            r.status+
            ": "+
            text.slice(0,250)
        );
    }

    try{

        return JSON.parse(text);

    }catch{

        throw new Error(
            "Invalid JSON"
        );
    }
}


/*
   Worker first.
   Direct Data API second.
*/

async function api(path){

    try{

        return await fetchJSON(
            WORKER,
            path
        );

    }catch(workerError){

        return await fetchJSON(
            DIRECT,
            path
        );
    }
}


function arrayFrom(data){

    if(Array.isArray(data)){
        return data;
    }

    if(Array.isArray(data.data)){
        return data.data;
    }

    if(Array.isArray(data.results)){
        return data.results;
    }

    if(Array.isArray(data.positions)){
        return data.positions;
    }

    return [];
}


/* =========================
   LEADERBOARD
========================= */

async function leaderboard(
    period,
    order,
    offset
){

    const q=
        "?timePeriod="+
        encodeURIComponent(period)+
        "&category=OVERALL"+
        "&orderBy="+
        encodeURIComponent(order)+
        "&limit=50"+
        "&offset="+
        offset;

    return arrayFrom(
        await api(
            "/v1/leaderboard"+q
        )
    );
}


/* =========================
   CANDIDATES
========================= */

async function getCandidates(){

    const map=new Map();

    /*
       Get lots of candidate wallets.
    */

    const jobs=[];

    for(
        let offset=0;
        offset<=950;
        offset+=50
    ){

        for(
            const order of ["PNL","VOL"]
        ){

            jobs.push(

                leaderboard(
                    PERIOD,
                    order,
                    offset
                )
                .then(rows=>{

                    for(
                        const row of rows
                    ){

                        const wallet=
                            row.proxyWallet ||
                            row.proxy_wallet ||
                            row.wallet ||
                            row.address;

                        if(!wallet){
                            continue;
                        }

                        if(!map.has(wallet)){

                            map.set(
                                wallet,
                                {
                                    wallet,
                                    name:
                                        row.userName ||
                                        row.username ||
                                        row.name ||
                                        row.xUsername ||
                                        wallet.slice(0,12),

                                    rank:
                                        row.rank || null
                                }
                            );
                        }
                    }
                })
                .catch(()=>{})
            );
        }
    }

    /*
       Add MONTH and ALL candidates too.
       This is especially important for 3-month mode.
    */

    for(
        const fallbackPeriod
        of ["MONTH","ALL"]
    ){

        if(
            fallbackPeriod==="MONTH" &&
            PERIOD==="MONTH"
        ){
            continue;
        }

        for(
            let offset=0;
            offset<=500;
            offset+=50
        ){

            for(
                const order of ["PNL","VOL"]
            ){

                jobs.push(

                    leaderboard(
                        fallbackPeriod,
                        order,
                        offset
                    )
                    .then(rows=>{

                        for(
                            const row of rows
                        ){

                            const wallet=
                                row.proxyWallet ||
                                row.proxy_wallet ||
                                row.wallet ||
                                row.address;

                            if(!wallet){
                                continue;
                            }

                            if(!map.has(wallet)){

                                map.set(
                                    wallet,
                                    {
                                        wallet,
                                        name:
                                            row.userName ||
                                            row.username ||
                                            row.name ||
                                            row.xUsername ||
                                            wallet.slice(0,12),

                                        rank:
                                            row.rank || null
                                    }
                                );
                            }
                        }
                    })
                    .catch(()=>{})
                );
            }
        }
    }

    await Promise.all(jobs);

    return [...map.values()];
}


/* =========================
   CLOSED POSITIONS
========================= */

async function closedPositions(wallet){

    let all=[];

    for(
        let offset=0;
        offset<=2500;
        offset+=50
    ){

        try{

            const data=
                await api(
                    "/closed-positions?user="+
                    encodeURIComponent(wallet)+
                    "&limit=50"+
                    "&offset="+
                    offset
                );

            const rows=
                arrayFrom(data);

            if(!rows.length){
                break;
            }

            all.push(...rows);

            if(rows.length<50){
                break;
            }

        }catch{

            break;
        }
    }

    return all;
}


/* =========================
   PNL
========================= */

function getPnl(row){

    const fields=[
        "cashPnl",
        "realizedPnl",
        "realizedPNL",
        "pnl",
        "profit",
        "profitLoss"
    ];

    for(
        const field of fields
    ){

        if(
            row[field]!==undefined &&
            row[field]!==null &&
            Number.isFinite(
                Number(row[field])
            )
        ){

            return Number(
                row[field]
            );
        }
    }

    return null;
}


function getInvested(row){

    const fields=[
        "initialValue",
        "initial_value",
        "cost",
        "costBasis"
    ];

    for(
        const field of fields
    ){

        if(
            row[field]!==undefined &&
            row[field]!==null &&
            Number.isFinite(
                Number(row[field])
            )
        ){

            return Number(
                row[field]
            );
        }
    }

    return null;
}


function rowDate(row){

    return(
        row.timestamp ||
        row.closedAt ||
        row.closed_at ||
        row.updatedAt ||
        row.updated_at ||
        row.createdAt ||
        row.created_at ||
        row.endDate ||
        row.end_date
    );
}


function periodStart(){

    const d=new Date();

    if(PERIOD==="WEEK"){

        d.setDate(
            d.getDate()-7
        );

    }else if(PERIOD==="MONTH"){

        d.setMonth(
            d.getMonth()-1
        );

    }else{

        d.setMonth(
            d.getMonth()-3
        );
    }

    return d;
}


/* =========================
   RECORD
========================= */

function calculateRecord(rows){

    const start=periodStart();

    let wins=0;
    let losses=0;

    let pnl=0;
    let pnlKnown=false;

    let invested=0;

    for(
        const row of rows
    ){

        const d=
            dateValue(
                rowDate(row)
            );

        /*
           Only filter by date if a
           usable date actually exists.
        */

        if(
            d &&
            d<start
        ){
            continue;
        }

        const p=getPnl(row);

        if(p===null){
            continue;
        }

        pnl+=p;
        pnlKnown=true;

        const inv=
            getInvested(row);

        if(
            inv!==null &&
            inv>0
        ){

            invested+=inv;
        }

        if(p>0){

            wins++;

        }else if(p<0){

            losses++;
        }
    }

    const total=
        wins+losses;

    const winrate=
        total
        ?wins/total*100
        :0;

    const roi=
        invested>0
        ?pnl/invested*100
        :null;

    return{
        wins,
        losses,
        total,
        winrate,
        pnl:pnlKnown?pnl:null,
        invested,
        roi
    };
}


/* =========================
   CONCURRENCY
========================= */

async function mapLimit(
    items,
    limit,
    fn
){

    const result=
        new Array(items.length);

    let next=0;

    async function worker(){

        while(true){

            const i=next++;

            if(
                i>=items.length
            ){
                return;
            }

            try{

                result[i]=
                    await fn(
                        items[i],
                        i
                    );

            }catch{

                result[i]=null;
            }
        }
    }

    const workers=[];

    for(
        let i=0;
        i<Math.min(
            limit,
            items.length
        );
        i++
    ){

        workers.push(
            worker()
        );
    }

    await Promise.all(
        workers
    );

    return result;
}


/* =========================
   TRADER RECORD
========================= */

async function getTrader(candidate){

    const rows=
        await closedPositions(
            candidate.wallet
        );

    const record=
        calculateRecord(rows);

    return{
        ...candidate,
        ...record,
        active:[],
        activeLoaded:false
    };
}


/* =========================
   ACTIVE POSITIONS
========================= */

async function getPositions(wallet){

    let all=[];

    for(
        let offset=0;
        offset<=2500;
        offset+=500
    ){

        try{

            const data=
                await api(
                    "/positions?user="+
                    encodeURIComponent(wallet)+
                    "&sizeThreshold=0"+
                    "&limit=500"+
                    "&offset="+
                    offset
                );

            const rows=
                arrayFrom(data);

            if(!rows.length){
                break;
            }

            all.push(...rows);

            if(
                rows.length<500
            ){
                break;
            }

        }catch{

            break;
        }
    }

    /*
       This is intentionally NOT using
       endDate. Positive current positions
       are what we want.
    */

    return all.filter(
        p=>{

            const size=
                Number(p.size);

            return(
                Number.isFinite(size) &&
                size>0 &&
                p.redeemable!==true &&
                p.redeemed!==true &&
                p.closed!==true
            );
        }
    );
}


/* =========================
   BUY DATA
========================= */

async function getBuyData(
    wallet,
    position
){

    const condition=
        position.conditionId ||
        position.condition_id ||
        position.market ||
        position.condition;

    if(!condition){

        return{
            amount:null,
            firstBuy:null
        };
    }

    try{

        const data=
            await api(
                "/trades?user="+
                encodeURIComponent(wallet)+
                "&market="+
                encodeURIComponent(condition)+
                "&side=BUY"+
                "&limit=500"
            );

        const trades=
            arrayFrom(data);

        let amount=0;

        let amountKnown=false;

        let first=null;

        for(
            const trade of trades
        ){

            let dollars=null;

            if(
                trade.usdcSize!==undefined &&
                Number.isFinite(
                    Number(
                        trade.usdcSize
                    )
                )
            ){

                dollars=
                    Number(
                        trade.usdcSize
                    );

            }else{

                const size=
                    Number(
                        trade.size
                    );

                const price=
                    Number(
                        trade.price
                    );

                if(
                    Number.isFinite(size) &&
                    Number.isFinite(price)
                ){

                    dollars=
                        size*price;
                }
            }

            if(dollars!==null){

                amount+=dollars;

                amountKnown=true;
            }

            const time=
                trade.timestamp ||
                trade.createdAt ||
                trade.created_at;

            const d=
                dateValue(time);

            if(d){

                if(
                    !first ||
                    d<first
                ){

                    first=d;
                }
            }
        }

        return{
            amount:
                amountKnown
                ?amount
                :null,

            firstBuy:first
        };

    }catch{

        return{
            amount:null,
            firstBuy:null
        };
    }
}


/* =========================
   LOAD ONE TRADER'S ACTIVE
   POSITIONS
========================= */

async function loadTraderActive(
    trader
){

    if(
        trader.activeLoaded
    ){
        return trader;
    }

    const positions=
        await getPositions(
            trader.wallet
        );

    trader.active=
        positions.map(
            p=>({
                ...p,
                buyAmount:null,
                firstBuy:null
            })
        );

    trader.activeLoaded=true;

    /*
       Get BUY information only
       for current active markets.
    */

    await mapLimit(
        trader.active,
        5,
        async position=>{

            const info=
                await getBuyData(
                    trader.wallet,
                    position
                );

            position.buyAmount=
                info.amount;

            position.firstBuy=
                info.firstBuy;
        }
    );

    return trader;
}


/* =========================
   LOAD ALL ACTIVE
========================= */

async function scanActiveMarkets(){

    if(activeScanRunning){
        return;
    }

    activeScanRunning=true;

    $("scanActive").disabled=true;

    $("scanActive").textContent=
        "Scanning...";

    $("status").className=
        "status";

    $("status").textContent=
        "Scanning active markets for all 100 traders...";

    try{

        await mapLimit(
            traders,
            12,
            async trader=>{

                await loadTraderActive(
                    trader
                );

                renderTraders();

                return trader;
            }
        );

        renderTraders();

        renderShared();

        updateStats();

        $("status").textContent=
            "Active market scan complete — "+
            traders.length+
            " traders checked.";

    }catch(error){

        $("status").className=
            "status error";

        $("status").textContent=
            "Active market scan failed: "+
            error.message;

    }finally{

        activeScanRunning=false;

        $("scanActive").disabled=false;

        $("scanActive").textContent=
            "Scan Active Markets";
    }
}


/* =========================
   MARKET HELPERS
========================= */

function marketId(p){

    return(
        p.conditionId ||
        p.condition_id ||
        p.market ||
        p.condition ||
        p.id ||
        ""
    );
}


function marketTitle(p){

    return(
        p.title ||
        p.question ||
        p.marketQuestion ||
        p.name ||
        "Market "+
        String(
            marketId(p)
        ).slice(0,20)
    );
}


function activeAmount(p){

    /*
       Prefer actual BUY dollars.
    */

    if(
        p.buyAmount!==null &&
        p.buyAmount!==undefined
    ){

        return money(
            p.buyAmount
        );
    }

    if(
        p.initialValue!==undefined
    ){

        return money(
            p.initialValue
        );
    }

    if(
        p.currentValue!==undefined
    ){

        return money(
            p.currentValue
        );
    }

    if(
        Number.isFinite(
            Number(p.size)
        ) &&
        Number.isFinite(
            Number(p.avgPrice)
        )
    ){

        return money(
            Number(p.size)*
            Number(p.avgPrice)
        );
    }

    return "—";
}


/* =========================
   SORT
========================= */

function sortTraders(){

    const mode=
        $("sort").value;

    traders.sort(
        (a,b)=>{

            if(
                mode==="pnl"
            ){

                return(
                    n(b.pnl)-
                    n(a.pnl) ||

                    b.winrate-
                    a.winrate ||

                    b.wins-
                    a.wins
                );
            }

            if(
                mode==="roi"
            ){

                return(
                    n(b.roi)-
                    n(a.roi) ||

                    b.winrate-
                    a.winrate ||

                    b.wins-
                    a.wins
                );
            }

            if(
                mode==="winrate"
            ){

                return(
                    b.winrate-
                    a.winrate ||

                    b.wins-
                    a.wins ||

                    b.total-
                    a.total ||

                    n(b.pnl)-
                    n(a.pnl)
                );
            }

            /*
               Best Record:

               50-0
               49-0
               48-0
               ...
               1-0

               Then actual total wins.
            */

            return(
                b.winrate-
                a.winrate ||

                b.wins-
                a.wins ||

                b.total-
                a.total ||

                n(b.pnl)-
                n(a.pnl)
            );
        }
    );
}


/* =========================
   RENDER TRADERS
========================= */

function renderTraders(){

    sortTraders();

    const query=
        $("search")
        .value
        .trim()
        .toLowerCase();

    const list=
        query
        ?traders.filter(
            t=>
                t.name
                .toLowerCase()
                .includes(query) ||

                t.wallet
                .toLowerCase()
                .includes(query)
        )
        :traders;

    if(!list.length){

        $("traders").innerHTML=
            '<div class="loading">No traders found.</div>';

        return;
    }

    let html=`

        <div class="row head">

            <div>#</div>

            <div>Trader</div>

            <div>Record</div>

            <div>Win %</div>

            <div>P/L</div>

            <div>Active</div>

        </div>
    `;


    list
    .slice(0,100)
    .forEach(
        (t,i)=>{

            const pnlClass=
                t.pnl===null
                ?"muted"
                :t.pnl>=0
                ?"green"
                :"red";

            html+=`

                <div
                    class="row trader"
                    data-wallet="${esc(t.wallet)}"
                >

                    <div>
                        ${i+1}
                    </div>

                    <div>

                        <div class="name">
                            ${esc(t.name)}
                        </div>

                        <span class="wallet">
                            ${esc(t.wallet)}
                        </span>

                    </div>

                    <div class="record">

                        ${
                            t.total
                            ?t.wins+"-"+t.losses
                            :"—"
                        }

                    </div>

                    <div>

                        ${
                            t.total
                            ?t.winrate.toFixed(1)+"%"
                            :"—"
                        }

                    </div>

                    <div class="${pnlClass}">

                        ${money(t.pnl)}

                    </div>

                    <div>

                        ${
                            t.activeLoaded
                            ?t.active.length
                            :"—"
                        }

                    </div>

                </div>


                <div
                    class="detail"
                    id="detail-${esc(t.wallet)}"
                >

                    <div class="detail-title">
                        Active Markets
                    </div>

                    <div
                        class="trader-active-content"
                        data-wallet="${esc(t.wallet)}"
                    >

                        ${
                            t.activeLoaded
                            ?renderTraderMarkets(t)
                            :`
                                <div class="loading">
                                    Loading active markets...
                                </div>
                            `
                        }

                    </div>

                </div>
            `;
        }
    );


    $("traders").innerHTML=
        html;


    document
    .querySelectorAll(".trader")
    .forEach(
        el=>{

            el.onclick=async()=>{

                const wallet=
                    el.dataset.wallet;

                const trader=
                    traders.find(
                        t=>
                            t.wallet===
                            wallet
                    );

                const detail=
                    document.getElementById(
                        "detail-"+wallet
                    );

                if(!detail || !trader){
                    return;
                }

                detail.classList.toggle(
                    "open"
                );

                /*
                   If they click a trader,
                   automatically scan that trader's
                   active markets even if the global
                   scan has not been run.
                */

                if(
                    detail.classList.contains("open") &&
                    !trader.activeLoaded
                ){

                    const content=
                        detail.querySelector(
                            ".trader-active-content"
                        );

                    content.innerHTML=
                        `
                        <div class="loading">
                            Loading active markets...
                        </div>
                        `;

                    try{

                        await loadTraderActive(
                            trader
                        );

                        content.innerHTML=
                            renderTraderMarkets(
                                trader
                            );

                        updateStats();

                        renderShared();

                    }catch{

                        content.innerHTML=
                            `
                            <div class="muted">
                                Could not load active markets.
                            </div>
                            `;
                    }

                    /*
                       Keep detail open.
                    */
                    detail.classList.add(
                        "open"
                    );
                }
            };
        }
    );
}


function renderTraderMarkets(t){

    if(!t.active.length){

        return `
            <div class="muted">
                No active positions found.
            </div>
        `;
    }

    return t.active
    .map(
        p=>`

        <div class="market">

            <div class="market-top">

                <div class="market-name">

                    ${esc(
                        marketTitle(p)
                    )}

                </div>

                <div>

                    ${activeAmount(p)}

                </div>

            </div>


            <div class="market-meta">

                ${
                    esc(
                        p.outcome ||
                        p.outcomeName ||
                        "Position"
                    )
                }

                ${
                    p.avgPrice!==undefined
                    ?" • Avg "+
                     Number(
                        p.avgPrice
                     ).toFixed(3)
                    :""
                }

                ${
                    p.curPrice!==undefined
                    ?" • Current "+
                     Number(
                        p.curPrice
                     ).toFixed(3)
                    :""
                }

                ${
                    p.firstBuy
                    ?" • Bought "+
                     formatDate(
                        p.firstBuy
                     )
                    :""
                }

            </div>

        </div>

        `
    )
    .join("");
}


/* =========================
   SHARED MARKETS
========================= */

function buildShared(){

    const map=
        new Map();

    for(
        const trader of traders
    ){

        for(
            const position
            of trader.active
        ){

            const id=
                marketId(
                    position
                );

            if(!id){
                continue;
            }

            if(
                !map.has(id)
            ){

                map.set(
                    id,
                    {
                        id,
                        title:
                            marketTitle(
                                position
                            ),
                        traders:[]
                    }
                );
            }

            map
            .get(id)
            .traders
            .push({
                trader,
                position
            });
        }
    }

    sharedMarkets=
        [...map.values()]
        .filter(
            x=>
                x.traders.length>=2
        )
        .sort(
            (a,b)=>
                b.traders.length-
                a.traders.length
        );
}


function renderShared(){

    buildShared();

    if(!sharedMarkets.length){

        $("shared").innerHTML=
            `
            <div class="loading">
                No shared active markets found.
            </div>
            `;

        return;
    }

    $("shared").innerHTML=
        sharedMarkets
        .map(
            m=>`

            <div class="shared">

                <div class="shared-title">

                    ${esc(m.title)}

                    <span class="muted">
                        •
                        ${m.traders.length}
                        traders
                    </span>

                </div>


                ${
                    m.traders
                    .map(
                        x=>`

                        <div class="shared-trader">

                            <span>

                                ${esc(
                                    x.trader.name
                                )}

                                ${
                                    x.position.outcome
                                    ? " • "+
                                      esc(
                                        x.position.outcome
                                      )
                                    :""
                                }

                            </span>

                            <span>

                                ${activeAmount(
                                    x.position
                                )}

                            </span>

                        </div>

                        `
                    )
                    .join("")
                }

            </div>

            `
        )
        .join("");
}


/* =========================
   STATS
========================= */

function updateStats(){

    const wins=
        traders.reduce(
            (s,t)=>
                s+t.wins,
            0
        );

    const losses=
        traders.reduce(
            (s,t)=>
                s+t.losses,
            0
        );

    const markets=
        new Set(
            traders.flatMap(
                t=>
                    t.active
                    .map(marketId)
            )
        ).size;

    $("statTraders").textContent=
        traders.length;

    $("statWins").textContent=
        wins.toLocaleString();

    $("statLosses").textContent=
        losses.toLocaleString();

    $("statMarkets").textContent=
        markets.toLocaleString();
}


/* =========================
   MAIN SCAN
========================= */

async function scan(){

    $("status").className=
        "status";

    $("status").textContent=
        "Finding Polymarket traders...";

    $("traders").innerHTML=
        `
        <div class="loading">
            Finding traders...
        </div>
        `;

    $("shared").innerHTML=
        `
        <div class="loading">
            Active markets will load separately.
        </div>
        `;

    traders=[];

    try{

        const candidates=
            await getCandidates();

        if(!candidates.length){

            throw new Error(
                "No Polymarket traders returned."
            );
        }

        $("status").textContent=
            "Checking "+
            candidates.length+
            " wallets for records...";


        /*
           Check a large pool.

           IMPORTANT:
           We NO LONGER remove traders just
           because their calculated record is
           0-0.

           That was the reason the page could
           end up with only 41 traders.

           We keep 100 candidates, while the
           strongest actual records naturally
           sort to the top.
        */

        const checked=
            await mapLimit(
                candidates,
                20,
                getTrader
            );


        traders=
            checked
            .filter(Boolean);


        sortTraders();


        /*
           Exactly 100 traders whenever the
           candidate pool contains 100+ wallets.
        */

        traders=
            traders.slice(0,100);


        /*
           Do NOT scan all active markets yet.

           This makes the Top 100 appear immediately.
        */

        renderTraders();

        renderShared();

        updateStats();


        $("status").textContent=
            "Loaded "+
            traders.length+
            " traders. Click Scan Active Markets or open any trader.";

    }catch(error){

        $("status").className=
            "status error";

        $("status").textContent=
            "Scan failed: "+
            error.message;

        $("traders").innerHTML=
            `
            <div class="loading">
                No traders found.
            </div>
            `;

        $("shared").innerHTML=
            `
            <div class="loading">
                No shared active markets found.
            </div>
            `;
    }
}


/* =========================
   PERIOD BUTTONS
========================= */

$("week").onclick=()=>{

    PERIOD="WEEK";

    $("week").classList.add("active");
    $("month").classList.remove("active");
    $("three").classList.remove("active");

    scan();
};


$("month").onclick=()=>{

    PERIOD="MONTH";

    $("month").classList.add("active");
    $("week").classList.remove("active");
    $("three").classList.remove("active");

    scan();
};


$("three").onclick=()=>{

    PERIOD="THREEMONTH";

    $("three").classList.add("active");
    $("week").classList.remove("active");
    $("month").classList.remove("active");

    scan();
};


/* =========================
   OTHER CONTROLS
========================= */

$("sort").onchange=
    renderTraders;

$("search").oninput=
    renderTraders;

$("scanActive").onclick=
    scanActiveMarkets;


/* =========================
   START
========================= */

scan();

</script>
