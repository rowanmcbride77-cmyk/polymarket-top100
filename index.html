<body>

<div class="container">

  </div>

  <div class="controls">
    <select id="period">

      id="search"

      placeholder="Search trader..."
    >

  </div>

  <div class="stats">

      <div class="stat-label">Traders</div>

    </div>

    </div>

      <thead>

          <th>P/L</th>

          <th>Active Markets</th>

      <tbody id="traderBody"></tbody>
    </table>

<script>

const API = "https://data-api.polymarket.com/v2";
const WORKER = "https://polymarket-proxy.rowanmcbride77.workers.dev";

let traders = [];
let activeCache = new Map();
let buyCache = new Map();

const periodEl = document.getElementById("period");
const sortEl = document.getElementById("sort");
const searchEl = document.getElementById("search");
const scanBtn = document.getElementById("scanBtn");
const statusEl = document.getElementById("status");
const bodyEl = document.getElementById("traderBody");

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function fmtMoney(v) {
  v = num(v);

  const sign = v > 0 ? "+" : "";

  if (Math.abs(v) >= 1000000) {
    return sign + "$" + (v / 1000000).toFixed(2) + "M";
  }

  if (Math.abs(v) >= 1000) {
    return sign + "$" + (v / 1000).toFixed(1) + "K";
  }

  return sign + "$" + v.toFixed(0);
}

function fmtPercent(v) {
  return num(v).toFixed(1) + "%";
}

function fmtDate(ts) {
  if (!ts) return "Unknown";

  const d = new Date(Number(ts) * 1000);

  if (isNaN(d.getTime())) return "Unknown";

  return d.toLocaleString([], {
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function shortWallet(wallet) {
  if (!wallet) return "";

  if (wallet.length <= 18) return wallet;

  return wallet.slice(0, 8) + "..." + wallet.slice(-6);
}

function pnlClass(v) {
  if (v > 0) return "positive";
  if (v < 0) return "negative";
  return "neutral";
}

async function fetchJSON(path) {

  const urls = [
    API + path,
    WORKER + path
  ];

  for (const url of urls) {

    try {

      const response = await fetch(url);

      if (!response.ok) continue;

      const json = await response.json();

      if (json) return json;

    } catch (e) {
      console.warn("API failed:", url, e);
    }
  }

  return null;
}


/* ---------------------------------------------------------
   LEADERBOARD CANDIDATES
--------------------------------------------------------- */

async function getLeaderboard(period, sortBy, pages = 3) {

  const results = [];
  let cursor = null;

  for (let page = 0; page < pages; page++) {

    let url =
      `/leaderboard?time_period=${encodeURIComponent(period)}` +
      `&category=overall` +
      `&sort_by=${encodeURIComponent(sortBy)}` +
      `&limit=1000`;

    if (cursor) {
      url += `&cursor=${encodeURIComponent(cursor)}`;
    }

    const json = await fetchJSON(url);

    if (!json) break;

    const rows = Array.isArray(json.data)
      ? json.data
      : Array.isArray(json)
        ? json
        : [];

    results.push(...rows);

    const next =
      json.pagination?.next_cursor ||
      json.pagination?.nextCursor ||
      null;

    if (!next) break;

    cursor = next;
  }

  return results;
}


/* ---------------------------------------------------------
   CANDIDATE POOL
--------------------------------------------------------- */

async function getCandidatePool(period) {

  const sources = [];

  if (period === "week") {

    sources.push(
      getLeaderboard("week", "PNL", 2),
      getLeaderboard("week", "VOLUME", 2),
      getLeaderboard("month", "PNL", 1),
      getLeaderboard("month", "VOLUME", 1)
    );

  } else if (period === "month") {

    sources.push(
      getLeaderboard("month", "PNL", 2),
      getLeaderboard("month", "VOLUME", 2),
      getLeaderboard("week", "PNL", 1),
      getLeaderboard("week", "VOLUME", 1)
    );

  } else {

    sources.push(
      getLeaderboard("month", "PNL", 2),
      getLeaderboard("month", "VOLUME", 2),
      getLeaderboard("all", "PNL", 2),
      getLeaderboard("all", "VOLUME", 2)
    );
  }

  const groups = await Promise.all(sources);

  const map = new Map();

  for (const group of groups) {

    for (const row of group) {

      const wallet =
        row.user_id ||
        row.user ||
        row.proxy_wallet ||
        row.wallet ||
        row.address;

      if (!wallet) continue;

      const key = wallet.toLowerCase();

      if (!map.has(key)) {

        map.set(key, {
          wallet,
          name:
            row.user_name ||
            row.username ||
            row.name ||
            shortWallet(wallet),

          image:
            row.profile_image ||
            row.profileImage ||
            "",

          leaderboardPnl: num(row.pnl),
          leaderboardVolume: num(row.volume)
        });

      } else {

        const existing = map.get(key);

        if (
          !existing.leaderboardPnl &&
          Number.isFinite(Number(row.pnl))
        ) {
          existing.leaderboardPnl = num(row.pnl);
        }

        if (
          !existing.leaderboardVolume &&
          Number.isFinite(Number(row.volume))
        ) {
          existing.leaderboardVolume = num(row.volume);
        }

        if (
          existing.name === shortWallet(existing.wallet) &&
          row.user_name
        ) {
          existing.name = row.user_name;
        }
      }
    }
  }

  return [...map.values()];
}


/* ---------------------------------------------------------
   RESOLVED RECORD
--------------------------------------------------------- */

function getPeriodWindow(period) {

  const end = Math.floor(Date.now() / 1000);

  let seconds;

  if (period === "week") {
    seconds = 7 * 24 * 60 * 60;
  } else if (period === "month") {
    seconds = 30 * 24 * 60 * 60;
  } else {
    seconds = 90 * 24 * 60 * 60;
  }

  return {
    start: end - seconds,
    end
  };
}


async function getResolved(wallet, status, period) {

  const window = getPeriodWindow(period);

  let rows = [];
  let cursor = null;

  for (let page = 0; page < 10; page++) {

    let url =
      `/positions?user=${encodeURIComponent(wallet)}` +
      `&status=${status}` +
      `&limit=1000` +
      `&start=${window.start}` +
      `&end=${window.end}` +
      `&sort_by=TIMESTAMP` +
      `&sort_direction=DESC`;

    if (cursor) {
      url += `&cursor=${encodeURIComponent(cursor)}`;
    }

    const json = await fetchJSON(url);

    if (!json) break;

    const data = Array.isArray(json.data)
      ? json.data
      : Array.isArray(json)
        ? json
        : [];

    rows.push(...data);

    const next =
      json.pagination?.next_cursor ||
      json.pagination?.nextCursor ||
      null;

    if (!next) break;

    cursor = next;
  }

  return rows;
}


function marketKey(row) {

  return (
    row.condition_id ||
    row.conditionId ||
    row.market ||
    row.market_id ||
    row.token_id ||
    row.tokenId ||
    row.slug ||
    row.title
  );
}


function getRowPnl(row) {

  const fields = [
    row.realized_pnl,
    row.realizedPnl,
    row.total_pnl,
    row.totalPnl
  ];

  for (const value of fields) {

    if (
      value !== null &&
      value !== undefined &&
      Number.isFinite(Number(value))
    ) {
      return Number(value);
    }
  }

  /*
    Fallback for resolved positions if the P/L field is missing.
  */

  const avg =
    num(
      row.avg_price ??
      row.avgPrice
    );

  const size =
    num(
      row.total_size ??
      row.totalSize ??
      row.total_bought ??
      row.totalBought
    );

  const payout =
    num(
      row.cur_price ??
      row.curPrice ??
      row.current_price ??
      row.currentPrice
    );

  if (size > 0 && (payout === 0 || payout === 1)) {
    return (payout * size) - (avg * size);
  }

  return 0;
}


function calculateRecord(winners, losers) {

  const markets = new Map();

  for (const row of winners) {

    const key = marketKey(row);

    if (!key) continue;

    if (!markets.has(key)) {
      markets.set(key, []);
    }

    markets.get(key).push(row);
  }

  for (const row of losers) {

    const key = marketKey(row);

    if (!key) continue;

    if (!markets.has(key)) {
      markets.set(key, []);
    }

    markets.get(key).push(row);
  }

  let wins = 0;
  let losses = 0;
  let pnl = 0;

  for (const rows of markets.values()) {

    let marketPnl = 0;

    for (const row of rows) {
      marketPnl += getRowPnl(row);
    }

    pnl += marketPnl;

    /*
      One market = one result.

      If the trader hedged both sides, classify the market
      by the NET resolved P/L instead of counting both sides
      as separate trades.
    */

    if (marketPnl > 0.000001) {
      wins++;
    } else if (marketPnl < -0.000001) {
      losses++;
    }
  }

  const total = wins + losses;

  return {
    wins,
    losses,
    total,
    winRate: total ? (wins / total) * 100 : 0,
    resolvedPnl: pnl
  };
}


/* ---------------------------------------------------------
   ACTUAL WALLET P/L
--------------------------------------------------------- */

async function getActualPnl(wallet, period) {

  /*
    Week/month:
    Polymarket's leaderboard PNL is the wallet's actual
    window P/L rather than a sum of position rows.

    3 months:
    use cumulative PNL history and calculate the change.
  */

  if (period === "week" || period === "month") {

    const boardPeriod =
      period === "week"
        ? "week"
        : "month";

    const json = await fetchJSON(
      `/leaderboard?time_period=${boardPeriod}` +
      `&category=overall` +
      `&sort_by=PNL` +
      `&user=${encodeURIComponent(wallet)}`
    );

    if (json) {

      const row =
        json.data && !Array.isArray(json.data)
          ? json.data
          : Array.isArray(json.data)
            ? json.data[0]
            : json;

      const pnl = Number(
        row?.pnl ??
        row?.PNL
      );

      if (Number.isFinite(pnl)) {
        return pnl;
      }
    }
  }

  /*
    3-month fallback:
    use the cumulative PNL series.
  */

  const json = await fetchJSON(
    `/user-pnl?user=${encodeURIComponent(wallet)}` +
    `&interval=max&fidelity=1d`
  );

  const points =
    json?.data?.points ||
    [];

  if (!points.length) return 0;

  const { start, end } = getPeriodWindow(period);

  const metric = point => {

    const values = [
      point.economic_pnl,
      point.realized_pnl,
      point.position_pnl,
      point.trade_pnl
    ];

    for (const v of values) {
      if (
        v !== null &&
        v !== undefined &&
        Number.isFinite(Number(v))
      ) {
        return Number(v);
      }
    }

    return null;
  };

  let before = null;
  let after = null;

  for (const p of points) {

    const ts = num(p.timestamp);
    const value = metric(p);

    if (value === null) continue;

    if (ts <= start) {
      before = value;
    }

    if (ts <= end) {
      after = value;
    }
  }

  if (after !== null && before !== null) {
    return after - before;
  }

  if (after !== null) {
    return after;
  }

  return 0;
}


/* ---------------------------------------------------------
   PERIOD VOLUME FOR ROI
--------------------------------------------------------- */

async function getPeriodVolume(wallet, period) {

  const window = getPeriodWindow(period);

  const json = await fetchJSON(
    `/user-volume?user=${encodeURIComponent(wallet)}` +
    `&start=${window.start}` +
    `&end=${window.end}`
  );

  const data = json?.data || json;

  return num(
    data?.volume_usdc ??
    data?.volumeUSDC ??
    data?.volume
  );
}


/* ---------------------------------------------------------
   ACTIVE POSITIONS
--------------------------------------------------------- */

async function getActive(wallet) {

  if (activeCache.has(wallet)) {
    return activeCache.get(wallet);
  }

  let rows = [];
  let cursor = null;

  for (let page = 0; page < 20; page++) {

    let url =
      `/positions?user=${encodeURIComponent(wallet)}` +
      `&status=OPEN` +
      `&limit=1000` +
      `&filter_type=TOKENS` +
      `&filter_amount=0.1` +
      `&sort_by=CURRENT_VALUE` +
      `&sort_direction=DESC`;

    if (cursor) {
      url += `&cursor=${encodeURIComponent(cursor)}`;
    }

    const json = await fetchJSON(url);

    if (!json) break;

    const data = Array.isArray(json.data)
      ? json.data
      : Array.isArray(json)
        ? json
        : [];

    rows.push(...data);

    const next =
      json.pagination?.next_cursor ||
      json.pagination?.nextCursor ||
      null;

    if (!next) break;

    cursor = next;
  }

  /*
    OPEN includes settled-but-unredeemed winners.

    Those are NOT active markets for the purpose of this
    dashboard, so remove redeemable positions.
  */

  const active = rows.filter(row => {

    const redeemable =
      row.redeemable === true ||
      String(row.status || "").toUpperCase() === "REDEEMABLE";

    const size =
      num(
        row.current_size ??
        row.currentSize ??
        row.size ??
        row.tokens
      );

    return !redeemable && size > 0;
  });

  activeCache.set(wallet, active);

  return active;
}


/* ---------------------------------------------------------
   FIRST BUY DATES
--------------------------------------------------------- */

async function getFirstBuys(wallet, conditions) {

  const missing = conditions.filter(
    c => c && !buyCache.has(wallet + "|" + c)
  );

  if (!missing.length) {

    const result = {};

    for (const c of conditions) {
      result[c] = buyCache.get(wallet + "|" + c) || null;
    }

    return result;
  }

  /*
    Polymarket allows up to 20 condition IDs on a condition-
    filtered trades request.

    We ask for ascending trades and locate the first BUY
    for each active market.
  */

  for (let i = 0; i < missing.length; i += 20) {

    const chunk = missing.slice(i, i + 20);

    let cursor = null;
    const found = new Set();

    for (let page = 0; page < 8; page++) {

      let url =
        `/trades?user=${encodeURIComponent(wallet)}` +
        `&condition=${encodeURIComponent(chunk.join(","))}` +
        `&limit=1000` +
        `&sort_direction=ASC`;

      if (cursor) {
        url += `&cursor=${encodeURIComponent(cursor)}`;
      }

      const json = await fetchJSON(url);

      if (!json) break;

      const trades = Array.isArray(json.data)
        ? json.data
        : Array.isArray(json)
          ? json
          : [];

      for (const trade of trades) {

        const condition =
          trade.condition_id ||
          trade.conditionId ||
          trade.market;

        if (!condition) continue;

        const side =
          String(
            trade.side ||
            trade.trade_side ||
            ""
          ).toUpperCase();

        if (side !== "BUY") continue;

        const key =
          wallet + "|" + condition;

        if (!buyCache.has(key)) {

          buyCache.set(
            key,
            num(
              trade.timestamp ||
              trade.ts
            )
          );
        }

        found.add(condition);
      }

      if (found.size >= chunk.length) break;

      const next =
        json.pagination?.next_cursor ||
        json.pagination?.nextCursor ||
        null;

      if (!next) break;

      cursor = next;
    }

    /*
      If no trade record was returned, leave it as null.
      The UI will show Unknown rather than inventing a date.
    */

    for (const condition of chunk) {

      const key = wallet + "|" + condition;

      if (!buyCache.has(key)) {
        buyCache.set(key, null);
      }
    }
  }

  const result = {};

  for (const c of conditions) {
    result[c] =
      buyCache.get(wallet + "|" + c) || null;
  }

  return result;
}


/* ---------------------------------------------------------
   ACTIVE MARKET PANEL
--------------------------------------------------------- */

async function renderActiveMarkets(wallet, detailRow) {

  const panel =
    detailRow.querySelector(".active-panel");

  if (panel.dataset.loaded === "true") {
    return;
  }

  panel.dataset.loaded = "loading";

  panel.innerHTML = `
    <div class="active-title">
      Active Markets
      <span class="active-count">loading...</span>
    </div>
    <div class="loading">
      Loading current positions...
    </div>
  `;

  const active = await getActive(wallet);

  const title =
    `<div class="active-title">
      Active Markets
      <span class="active-count">${active.length} current</span>
    </div>`;

  if (!active.length) {

    panel.innerHTML =
      title +
      `<div class="empty">No active markets.</div>`;

    panel.dataset.loaded = "true";

    return;
  }

  const conditions = active
    .map(row => marketKey(row))
    .filter(Boolean);

  const firstBuys =
    await getFirstBuys(
      wallet,
      conditions
    );

  active.sort((a, b) => {

    const av =
      num(
        a.current_value ??
        a.currentValue
      );

    const bv =
      num(
        b.current_value ??
        b.currentValue
      );

    return bv - av;
  });

  const marketsHTML =
    active.map(row => {

      const condition = marketKey(row);

      const outcome =
        row.outcome ||
        row.outcome_label ||
        row.outcomeLabel ||
        "Unknown";

      const outcomeClass =
        String(outcome).toLowerCase() === "yes"
          ? "yes"
          : String(outcome).toLowerCase() === "no"
            ? "no"
            : "";

      const invested =
        num(
          row.entry_cost_usdc ??
          row.entryCostUSDC ??
          row.total_cost_usdc ??
          row.totalCostUSDC ??
          (
            num(
              row.total_size ??
              row.totalSize ??
              row.current_size ??
              row.currentSize
            ) *
            num(
              row.avg_price ??
              row.avgPrice
            )
          )
        );

      const shares =
        num(
          row.current_size ??
          row.currentSize ??
          row.size ??
          row.tokens
        );

      const avgPrice =
        num(
          row.avg_price ??
          row.avgPrice
        );

      const currentValue =
        num(
          row.current_value ??
          row.currentValue
        );

      const buyTime =
        firstBuys[condition] ||
        null;

      return `
        <div class="market">

          <div class="market-title">
            ${escapeHTML(
              row.title ||
              row.name ||
              "Unknown Market"
            )}
          </div>

          <div class="market-outcome ${outcomeClass}">
            ${escapeHTML(String(outcome))}
          </div>

          <div class="market-value">
            <span class="market-label">Invested</span>
            ${fmtMoney(invested)}
          </div>

          <div class="market-value">
            <span class="market-label">Position</span>
            ${shares.toFixed(2)} @ ${avgPrice.toFixed(3)}
          </div>

          <div class="market-value buy-date ${buyTime ? "" : "loading-date"}">
            <span class="market-label">Bought</span>
            ${buyTime ? fmtDate(buyTime) : "Unknown"}
          </div>

        </div>
      `;

    }).join("");

  panel.innerHTML =
    title +
    `<div class="market-list">${marketsHTML}</div>`;

  panel.dataset.loaded = "true";
}


/* ---------------------------------------------------------
   ESCAPE
--------------------------------------------------------- */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ---------------------------------------------------------
   SCAN ONE TRADER
--------------------------------------------------------- */

async function scanTrader(candidate, period) {

  const wallet = candidate.wallet;

  try {

    const [wins, losses] = await Promise.all([
      getResolved(wallet, "REDEEMABLE", period),
      getResolved(wallet, "REDEEMABLE_LOST", period)
    ]);

    const record =
      calculateRecord(wins, losses);

    /*
      Do not allow fake 0-0 records into the Top 100.
    */

    if (record.total <= 0) {
      return null;
    }

    const actualPnl =
      await getActualPnl(
        wallet,
        period
      );

    const volume =
      await getPeriodVolume(
        wallet,
        period
      );

    const roi =
      volume > 0
        ? (actualPnl / volume) * 100
        : 0;

    return {
      ...candidate,

      wins: record.wins,
      losses: record.losses,
      total: record.total,
      winRate: record.winRate,

      /*
        IMPORTANT:
        This is the actual wallet P/L for the selected
        period, not the old resolved-row sum.
      */
      pnl: actualPnl,

      volume,
      roi
    };

  } catch (e) {

    console.warn(
      "Trader failed:",
      wallet,
      e
    );

    return null;
  }
}


/* ---------------------------------------------------------
   SORT
--------------------------------------------------------- */

function sortTraders(rows) {

  const sort = sortEl.value;

  rows.sort((a, b) => {

    if (sort === "winrate") {

      return (
        b.winRate - a.winRate ||
        b.wins - a.wins ||
        b.total - a.total ||
        b.pnl - a.pnl
      );

    }

    if (sort === "wins") {

      return (
        b.wins - a.wins ||
        b.winRate - a.winRate ||
        b.total - a.total ||
        b.pnl - a.pnl
      );

    }

    if (sort === "pnl") {

      return (
        b.pnl - a.pnl ||
        b.winRate - a.winRate ||
        b.wins - a.wins
      );

    }

    if (sort === "roi") {

      return (
        b.roi - a.roi ||
        b.pnl - a.pnl ||
        b.winRate - a.winRate
      );

    }

    /*
      BEST RECORD

      Win rate first.
      Then number of wins.
      Then total resolved markets.
      Then actual P/L.

      This means 50-0 ranks above 1-0.
    */

    return (
      b.winRate - a.winRate ||
      b.wins - a.wins ||
      b.total - a.total ||
      b.pnl - a.pnl
    );
  });

  return rows;
}


/* ---------------------------------------------------------
   RENDER TABLE
--------------------------------------------------------- */

function render() {

  const search =
    searchEl.value
      .trim()
      .toLowerCase();

  let rows =
    traders.filter(t => {

      if (!search) return true;

      return (
        String(t.name || "")
          .toLowerCase()
          .includes(search) ||

        String(t.wallet || "")
          .toLowerCase()
          .includes(search)
      );
    });

  sortTraders(rows);

  bodyEl.innerHTML = "";

  rows.forEach((trader, index) => {

    const rowId =
      "details-" +
      index +
      "-" +
      trader.wallet.slice(2, 8);

    const pnl =
      num(trader.pnl);

    const tr = document.createElement("tr");

    tr.className = "trader-row";

    tr.innerHTML = `
      <td class="rank">
        ${index + 1}
      </td>

      <td>
        <div class="trader">
          ${escapeHTML(
            trader.name ||
            shortWallet(trader.wallet)
          )}
        </div>

        <div class="wallet">
          ${escapeHTML(
            shortWallet(trader.wallet)
          )}
        </div>
      </td>

      <td>
        <div class="record">
          ${trader.wins}-${trader.losses}
        </div>
      </td>

      <td class="winrate">
        ${fmtPercent(trader.winRate)}
      </td>

      <td class="${pnlClass(pnl)}">
        ${fmtMoney(pnl)}
      </td>

      <td class="${pnlClass(trader.roi)}">
        ${fmtPercent(trader.roi)}
      </td>

      <td>
        <button
          class="active-btn"
          data-wallet="${escapeHTML(trader.wallet)}"
          data-detail="${rowId}"
        >
          Active Markets
        </button>
      </td>
    `;

    const detail = document.createElement("tr");

    detail.id = rowId;

    detail.className = "details-row";

    detail.innerHTML = `
      <td colspan="7" class="details-cell">
        <div class="active-panel"></div>
      </td>
    `;

    bodyEl.appendChild(tr);
    bodyEl.appendChild(detail);
  });

  document
    .querySelectorAll(".active-btn")
    .forEach(button => {

      button.addEventListener("click", async () => {

        const detail =
          document.getElementById(
            button.dataset.detail
          );

        const isOpen =
          detail.classList.contains("open");

        /*
          Close this dropdown.
        */

        if (isOpen) {

          detail.classList.remove("open");

          return;
        }

        /*
          Open it.
        */

        detail.classList.add("open");

        await renderActiveMarkets(
          button.dataset.wallet,
          detail
        );
      });
    });
}


/* ---------------------------------------------------------
   MAIN SCAN
--------------------------------------------------------- */

async function scan() {

  scanBtn.disabled = true;

  bodyEl.innerHTML = "";

  activeCache.clear();

  statusEl.textContent =
    "Finding trader candidates...";

  traders = [];

  const period =
    periodEl.value;

  try {

    const candidates =
      await getCandidatePool(period);

    statusEl.textContent =
      `Found ${candidates.length.toLocaleString()} candidates. Calculating resolved records...`;

    /*
      Scan in controlled batches so the browser doesn't
      hammer the API with thousands of simultaneous calls.
    */

    const results = [];

    const batchSize = 12;

    for (
      let i = 0;
      i < candidates.length;
      i += batchSize
    ) {

      const batch =
        candidates.slice(
          i,
          i + batchSize
        );

      const batchResults =
        await Promise.all(
          batch.map(
            candidate =>
              scanTrader(
                candidate,
                period
              )
          )
        );

      for (const result of batchResults) {

        if (
          result &&
          result.total > 0
        ) {
          results.push(result);
        }
      }

      statusEl.textContent =
        `Calculating records: ${Math.min(
          i + batchSize,
          candidates.length
        ).toLocaleString()} / ${candidates.length.toLocaleString()} — ${results.length} traders with resolved records`;
    }

    /*
      Sort before taking Top 100.
    */

    traders = sortTraders(results).slice(0, 100);

    /*
      Stats.
    */

    const totalResolved =
      traders.reduce(
        (sum, t) => sum + t.total,
        0
      );

    const totalPnl =
      traders.reduce(
        (sum, t) => sum + t.pnl,
        0
      );

    statusEl.textContent =
      `Finished. ${traders.length} traders with actual resolved records.`;

    document.getElementById(
      "statTraders"
    ).textContent =
      traders.length;

    document.getElementById(
      "statResolved"
    ).textContent =
      totalResolved.toLocaleString();

    document.getElementById(
      "statPnl"
    ).textContent =
      fmtMoney(totalPnl);

    /*
      Active positions are loaded when the user opens
      each trader, so the initial scan stays much faster.
    */

    document.getElementById(
      "statPositions"
    ).textContent =
      "Click rows";

    document.getElementById(
      "statMarkets"
    ).textContent =
      "Click rows";

    render();

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "Scan failed. Try again.";

  } finally {

    scanBtn.disabled = false;
  }
}


/* ---------------------------------------------------------
   EVENTS
--------------------------------------------------------- */

scanBtn.addEventListener(
  "click",
  scan
);

periodEl.addEventListener(
  "change",
  scan
);

sortEl.addEventListener(
  "change",
  render
);

searchEl.addEventListener(
  "input",
  render
);


/*
  Initial scan.
*/

scan();

</script>
