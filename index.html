<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Polymarket Top Traders</title>

<style>

:root{
  --bg:#050505;
  --panel:#0c0c0c;
  --line:#242424;
  --text:#f4f4f4;
  --muted:#9a9a9a;
  --green:#4ade80;
  --red:#fb7185;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:1100px;
  margin:0 auto;
  padding:28px 18px 50px;
}

h1{
  font-size:25px;
  margin:0 0 18px;
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

.bar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
  flex-wrap:wrap;
}

select,
button{
  background:#101010;
  color:#fff;
  border:1px solid #303030;
  border-radius:8px;
  padding:9px 12px;
  font:inherit;
}

button{
  cursor:pointer;
}

button:hover{
  border-color:#555;
}

.status{
  color:var(--muted);
  min-height:21px;
}

.panel{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:28px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:11px 13px;
  border-bottom:1px solid #1d1d1d;
  text-align:left;
  vertical-align:middle;
}

.table th{
  font-size:12px;
  color:#8f8f8f;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.table tr:last-child td{
  border-bottom:0;
}

.trader{
  cursor:pointer;
}

.trader:hover{
  background:#111;
}

.rank{
  width:55px;
  color:#777;
}

.name{
  font-weight:650;
}

.ratio{
  font-variant-numeric:tabular-nums;
}

.profit{
  font-variant-numeric:tabular-nums;
}

.positive{
  color:var(--green);
}

.negative{
  color:var(--red);
}

.detail{
  display:none;
  border-top:1px solid #292929;
  background:#090909;
}

.detail.open{
  display:table-row;
}

.detail td{
  padding:0;
}

.active{
  padding:14px;
}

.active-title{
  font-weight:650;
  margin-bottom:8px;
}

.mini{
  width:100%;
  border-collapse:collapse;
}

.mini th,
.mini td{
  padding:8px 6px;
  border-bottom:1px solid #1a1a1a;
  text-align:left;
}

.mini th{
  font-size:11px;
  color:#777;
}

.empty{
  padding:22px;
  color:#888;
}

.shared-card{
  padding:14px;
  border-bottom:1px solid #1d1d1d;
}

.shared-card:last-child{
  border-bottom:0;
}

.market-title{
  font-weight:700;
  margin-bottom:7px;
}

.side{
  display:inline-block;
  font-weight:700;
  margin-right:10px;
}

.side.yes{
  color:var(--green);
}

.side.no{
  color:var(--red);
}

.holders{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.holder{
  border:1px solid #292929;
  border-radius:7px;
  padding:5px 7px;
  color:#ddd;
  background:#0a0a0a;
}

.sub{
  color:#777;
  font-size:12px;
}

.loading{
  padding:16px;
  color:#999;
}

.topline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid #202020;
}

.count{
  color:#777;
  font-size:12px;
}

</style>
</head>

<body>

<main>

<h1>Polymarket Top Traders</h1>

<div class="bar">

<select id="period">
  <option value="week">Week</option>
  <option value="month">Month</option>
  <option value="3months">3 Months</option>
</select>

<button id="load">
  Load
</button>

<span id="status" class="status"></span>

</div>


<section>

<h2>Top 100 Traders</h2>

<div class="panel">

<div id="topline" class="topline">
  <span>Win-loss ratio, profit</span>
  <span id="topcount" class="count"></span>
</div>

<table class="table">

<thead>

<tr>
  <th>#</th>
  <th>Name</th>
  <th>W-L</th>
  <th>Ratio</th>
  <th>Profit</th>
</tr>

</thead>

<tbody id="traders"></tbody>

</table>

</div>

</section>


<section>

<h2>Shared Active Markets — Top 1,000</h2>

<div class="bar">

<select id="threshold">

  <option value="1">
    1+ traders
  </option>

  <option value="2" selected>
    2+ traders
  </option>

  <option value="5">
    5+ traders
  </option>

  <option value="10">
    10+ traders
  </option>

</select>

<button id="sharedLoad">
  Load Shared Markets
</button>

<span id="sharedStatus" class="status"></span>

</div>

<div class="panel" id="shared"></div>

</section>

</main>


<script>

const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const $ = id =>
  document.getElementById(id);

const state = {
  leaders:[],
  ranked:[],
  period:"week"
};


function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>'"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[c])
    );

}


function money(n){

  n = Number(n || 0);

  return (
    n < 0 ? "-" : ""
  ) +
  "$" +
  Math.abs(n).toLocaleString(
    undefined,
    {
      maximumFractionDigits:2
    }
  );

}


function ratio(w,l){

  w = Number(w || 0);
  l = Number(l || 0);

  if(l === 0){

    return w > 0
      ? "∞"
      : "—";

  }

  return (
    w / l
  ).toFixed(2);

}


function fmtTime(ts){

  if(!ts)
    return "—";

  return new Date(
    Number(ts) * 1000
  ).toLocaleString(
    undefined,
    {
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


async function api(
  path,
  params={}
){

  const u =
    new URL(WORKER + path);

  Object.entries(params)
    .forEach(
      ([k,v]) => {

        if(
          v !== undefined &&
          v !== null &&
          v !== ""
        ){

          u.searchParams.set(
            k,
            v
          );

        }

      }
    );

  const r =
    await fetch(u);

  const j =
    await r.json();

  if(!r.ok){

    throw new Error(
      j.error ||
      "Request failed"
    );

  }

  return j;

}


async function loadLeaders(){

  state.period =
    $("period").value;

  $("status").textContent =
    "Loading Polymarket traders…";

  $("traders").innerHTML = "";

  $("topcount").textContent = "";

  const j =
    await api(
      "/leaderboard",
      {
        period:state.period,
        limit:1000
      }
    );

  state.leaders =
    j.data ||
    j.leaderboard ||
    [];

  if(
    !state.leaders.length
  ){

    throw new Error(
      "Polymarket returned no traders"
    );

  }


  $("status").textContent =
    "Calculating win-loss records…";


  const now =
    Math.floor(
      Date.now()/1000
    );

  const days =
    state.period === "week"
      ? 7
      : state.period === "month"
        ? 30
        : 90;

  const start =
    now -
    days * 86400;


  const results = [];

  let done = 0;

  const queue =
    [...state.leaders];

  let stop = false;


  async function worker(){

    while(
      queue.length &&
      !stop
    ){

      const t =
        queue.shift();

      try{

        const wallet =
          t.user_id ||
          t.proxy_wallet ||
          t.proxyWallet;


        const [
          wins,
          losses
        ] =
          await Promise.all([

            api(
              "/positions",
              {
                user:wallet,
                status:"REDEEMABLE",
                start,
                end:now
              }
            ),

            api(
              "/positions",
              {
                user:wallet,
                status:"REDEEMABLE_LOST",
                start,
                end:now
              }
            )

          ]);


        const w =
          (wins.data || []).length;

        const l =
          (losses.data || []).length;


        results.push({
          ...t,
          w,
          l
        });


        done++;


        if(
          done % 10 === 0
        ){

          $("status").textContent =
            `Calculating win-loss records… ${done} traders checked`;

        }


        const noLoss =
          results.filter(
            x =>
              x.l === 0 &&
              x.w > 0
          ).length;


        if(
          noLoss >= 100
        ){

          stop = true;

        }

      }catch(e){

        done++;

      }

    }

  }


  await Promise.all(
    Array.from(
      {length:18},
      worker
    )
  );


  if(!stop){

    while(
      queue.length
    ){

      await Promise.all(
        Array.from(
          {length:18},
          worker
        )
      );

    }

  }


  results.sort(
    (a,b) => {

      const ar =
        a.l === 0
          ? (
              a.w
                ? Infinity
                : 0
            )
          : a.w / a.l;

      const br =
        b.l === 0
          ? (
              b.w
                ? Infinity
                : 0
            )
          : b.w / b.l;


      return (
        br - ar
      )
      ||
      Number(b.pnl || 0) -
      Number(a.pnl || 0)
      ||
      Number(a.rank || 99999) -
      Number(b.rank || 99999);

    }
  );


  state.ranked =
    results.slice(0,100);


  /*
   * Three-month profit.
   *
   * Polymarket's public leaderboard
   * has week/month/all-time boards,
   * not a 90-day board.
   *
   * For 3 months we calculate the
   * 90-day change from the cumulative
   * user PnL series.
   */

  if(
    state.period === "3months"
  ){

    $("status").textContent =
      "Loading 3-month profit…";


    const q =
      [...state.ranked];

    let qi = 0;


    async function pnlWorker(){

      while(
        qi < q.length
      ){

        const t =
          q[qi++];

        try{

          const wallet =
            t.user_id ||
            t.proxy_wallet ||
            t.proxyWallet;


          const j =
            await api(
              "/pnl",
              {
                user:wallet,
                interval:"max",
                fidelity:"1d"
              }
            );


          const points =
            j.data?.points || [];


          const cutoff =
            Date.now()/1000 -
            90 * 86400;


          let latest = 0;

          let base = 0;


          if(points.length){

            const last =
              points[
                points.length - 1
              ];

            latest =
              Number(
                last.realized_pnl ??
                last.economic_pnl ??
                0
              );


            for(
              const point of points
            ){

              if(
                Number(point.timestamp) <=
                cutoff
              ){

                base =
                  Number(
                    point.realized_pnl ??
                    point.economic_pnl ??
                    0
                  );

              }else{

                break;

              }

            }

          }


          t.pnl =
            latest - base;

        }catch(e){

          t.pnl = 0;

        }

      }

    }


    await Promise.all(
      Array.from(
        {length:12},
        pnlWorker
      )
    );

  }


  renderTraders();


  $("status").textContent =
    `Loaded ${state.ranked.length} traders.`;

}


function renderTraders(){

  $("topcount").textContent =
    `${state.ranked.length} traders`;


  $("traders").innerHTML =
    state.ranked
      .map(
        (t,i) => {

          const wallet =
            t.user_id ||
            t.proxy_wallet ||
            t.proxyWallet;

          const p =
            Number(t.pnl || 0);


          return `

<tr
  class="trader"
  data-wallet="${esc(wallet)}"
>

<td class="rank">
  ${i+1}
</td>

<td class="name">
  ${esc(
    t.user_name ||
    t.userName ||
    "Unnamed"
  )}
</td>

<td>
  ${t.w}-${t.l}
</td>

<td class="ratio">
  ${ratio(t.w,t.l)}
</td>

<td
  class="profit ${
    p >= 0
      ? "positive"
      : "negative"
  }"
>
  ${money(p)}
</td>

</tr>


<tr
  class="detail"
  id="detail-${wallet}"
>

<td colspan="5">

<div class="active">

<div class="loading">
  Loading active markets…
</div>

</div>

</td>

</tr>

`;

        }
      )
      .join("");


  document
    .querySelectorAll(".trader")
    .forEach(
      row => {

        row.addEventListener(
          "click",
          () =>
            toggleTrader(
              row.dataset.wallet,
              row
            )
        );

      }
    );

}


async function toggleTrader(
  wallet,
  row
){

  const d =
    $("detail-" + wallet);


  if(
    d.classList.contains("open")
  ){

    d.classList.remove("open");

    return;

  }


  d.classList.add("open");


  const box =
    d.querySelector(".active");


  box.innerHTML =
    '<div class="loading">Loading active markets…</div>';


  try{

    const j =
      await api(
        "/positions",
        {
          user:wallet,
          status:"OPEN",
          sort_by:"CURRENT_VALUE",
          sort_direction:"DESC"
        }
      );


    let positions =
      j.data || [];


    positions =
      positions.filter(
        p =>
          Number(
            p.current_size ??
            p.size ??
            0
          ) > 0
      );


    if(
      !positions.length
    ){

      box.innerHTML =
        '<div class="empty">No active markets.</div>';

      return;

    }


    const ids =
      positions
        .map(
          p =>
            p.condition_id
        )
        .filter(Boolean);


    const tradeMap = {};


    /*
     * Get the trader's BUY trades
     * for the active markets.
     *
     * We use the earliest BUY as
     * "Bought" and add the BUY
     * notional to show how much
     * they put into that market.
     */

    for(
      let i=0;
      i<ids.length;
      i+=20
    ){

      const chunk =
        ids.slice(
          i,
          i+20
        );


      try{

        const tr =
          await api(
            "/trades",
            {
              user:wallet,
              condition:chunk.join(","),
              side:"BUY"
            }
          );


        for(
          const x of
          (tr.data || [])
        ){

          const id =
            x.condition_id ||
            x.conditionId;


          if(!id)
            continue;


          if(
            !tradeMap[id]
          ){

            tradeMap[id] = {
              timestamp:x.timestamp,
              volume:0
            };

          }


          if(
            Number(x.timestamp) <
            Number(
              tradeMap[id].timestamp
            )
          ){

            tradeMap[id].timestamp =
              x.timestamp;

          }


          tradeMap[id].volume +=
            Number(x.size || 0) *
            Number(x.price || 0);

        }

      }catch(e){}

    }


    box.innerHTML = `

<div class="active-title">
  Active Markets
</div>

<table class="mini">

<thead>

<tr>
  <th>Market</th>
  <th>Side</th>
  <th>Bought</th>
  <th>Volume</th>
</tr>

</thead>

<tbody>

${
  positions
    .map(
      p => {

        const id =
          p.condition_id;

        const tr =
          tradeMap[id];


        const vol =
          tr?.volume ||
          Number(
            p.entry_cost_usdc ??
            p.total_cost_usdc ??
            0
          );


        return `

<tr>

<td>
  ${esc(
    p.title ||
    p.name ||
    "Market"
  )}
</td>

<td>
  ${esc(
    p.outcome || ""
  )}
</td>

<td>
  ${fmtTime(
    tr?.timestamp
  )}
</td>

<td>
  ${money(vol)}
</td>

</tr>

`;

      }
    )
    .join("")
}

</tbody>

</table>

`;

  }catch(e){

    box.innerHTML =
      `<div class="empty">${esc(e.message)}</div>`;

  }

}


async function loadShared(){

  $("sharedStatus").textContent =
    "Loading top 1,000 traders…";

  $("shared").innerHTML =
    "";


  const period =
    $("period").value;


  const j =
    await api(
      "/leaderboard",
      {
        period,
        limit:1000
      }
    );


  const leaders =
    j.data ||
    j.leaderboard ||
    [];


  const wallets =
    leaders
      .map(
        t => ({
          wallet:
            t.user_id ||
            t.proxy_wallet ||
            t.proxyWallet,

          name:
            t.user_name ||
            t.userName ||
            "Unnamed"
        })
      )
      .filter(
        x =>
          x.wallet
      );


  const map =
    new Map();


  let done = 0;

  const queue =
    [...wallets];


  async function worker(){

    while(
      queue.length
    ){

      const t =
        queue.shift();


      try{

        const j =
          await api(
            "/positions",
            {
              user:t.wallet,
              status:"OPEN",
              sort_by:"CURRENT_VALUE",
              sort_direction:"DESC"
            }
          );


        for(
          const p of
          (j.data || [])
        ){

          const size =
            Number(
              p.current_size ??
              p.size ??
              0
            );


          if(
            size <= 0
          )
            continue;


          const id =
            p.condition_id;


          if(!id)
            continue;


          if(
            !map.has(id)
          ){

            map.set(
              id,
              {
                title:
                  p.title ||
                  p.name ||
                  "Market",

                side:
                  p.outcome ||
                  "Unknown",

                holders:[]
              }
            );

          }


          const market =
            map.get(id);


          if(
            !market.holders.some(
              h =>
                h.wallet ===
                t.wallet
            )
          ){

            market.holders.push({
              wallet:t.wallet,
              name:t.name,
              size,
              volume:
                Number(
                  p.entry_cost_usdc ??
                  p.total_cost_usdc ??
                  0
                ),
              condition:id
            });

          }

        }


        done++;


        if(
          done % 20 === 0
        ){

          $("sharedStatus").textContent =
            `Loading shared markets… ${done}/${wallets.length}`;

        }

      }catch(e){

        done++;

      }

    }

  }


  await Promise.all(
    Array.from(
      {length:18},
      worker
    )
  );


  const threshold =
    Number(
      $("threshold").value
    );


  const arr =
    [...map.values()]
      .filter(
        m =>
          m.holders.length >=
          threshold
      );


  /*
   * CRITICAL:
   *
   * If one trader is YES and
   * another trader is NO,
   * throw the market away.
   *
   * Only all-YES or all-NO
   * markets survive.
   */

  const same =
    arr
      .filter(
        m => {

          const sides =
            new Set(
              m.holders.map(
                h =>
                  String(
                    h.side
                  ).toLowerCase()
              )
            );

          return sides.size === 1;

        }
      )
      .sort(
        (a,b) =>
          b.holders.length -
          a.holders.length
          ||
          a.title.localeCompare(
            b.title
          )
      );


  if(
    !same.length
  ){

    $("shared").innerHTML =
      '<div class="empty">No all-one-side shared markets found.</div>';

    $("sharedStatus").textContent =
      "Done.";

    return;

  }


  $("shared").innerHTML =
    same
      .slice(0,250)
      .map(
        m => `

<div class="shared-card">

<div class="market-title">
  ${esc(m.title)}
</div>

<div>

<span
  class="side ${
    String(m.side).toLowerCase() ===
    "yes"
      ? "yes"
      : "no"
  }"
>
  ${esc(m.side)}
</span>

<span class="sub">
  ${m.holders.length} traders
</span>

</div>


<div class="holders">

${
  m.holders
    .map(
      h => `

<span class="holder">

  ${esc(h.name)}
  ·
  ${money(h.volume)}

</span>

`
    )
    .join("")
}

</div>

</div>

`
      )
      .join("");


  $("sharedStatus").textContent =
    `${same.length} markets found.`;

}


$("load").addEventListener(
  "click",
  () =>
    loadLeaders()
      .catch(
        e =>
          $("status").textContent =
            "Error: " +
            e.message
      )
);


$("sharedLoad").addEventListener(
  "click",
  () =>
    loadShared()
      .catch(
        e =>
          $("sharedStatus").textContent =
            "Error: " +
            e.message
      )
);


loadLeaders()
  .catch(
    e =>
      $("status").textContent =
        "Error: " +
        e.message
  );

</script>

</body>
</html>
