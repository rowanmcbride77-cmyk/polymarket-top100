<script>

/* =====================================================
   CONFIG
===================================================== */

const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";


/* =====================================================
   STATE
===================================================== */

const state = {
  traders:[],
  markets:[],
  period:"WEEK"
};


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);

function money(v){

  const n = Number(v);

  if(!Number.isFinite(n))
    return "$0.00";

  return n.toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:2
    }
  );
}

function pct(v){

  const n = Number(v);

  if(!Number.isFinite(n))
    return "—";

  return n.toFixed(1) + "%";
}

function num(v){

  const n = Number(v);

  if(!Number.isFinite(n))
    return "0";

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:2
    }
  );
}

function escapeHtml(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shortWallet(w){

  if(!w) return "";

  return (
    w.slice(0,6) +
    "..." +
    w.slice(-4)
  );
}

function showError(message){

  $("error").innerHTML =
    message
      ? `<div class="error">${escapeHtml(message)}</div>`
      : "";
}


/* =====================================================
   WORKER REQUEST
===================================================== */

async function api(path,params={}){

  const url =
    new URL(
      WORKER.replace(/\/$/,"") +
      "/" +
      path.replace(/^\//,"")
    );

  for(
    const [key,value]
    of Object.entries(params)
  ){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      url.searchParams.set(
        key,
        value
      );
    }
  }

  const r =
    await fetch(
      url.toString(),
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        }
      }
    );

  const text =
    await r.text();

  let data;

  try{
    data =
      text
        ? JSON.parse(text)
        : {};
  }catch{
    throw new Error(
      "Worker returned invalid JSON."
    );
  }

  if(!r.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      `Worker HTTP ${r.status}`
    );
  }

  return data;
}


/* =====================================================
   LEADERBOARD
===================================================== */

async function getLeaderboard(period){

  const rows = [];

  for(
    const offset of [0,50]
  ){

    const body =
      await api(
        "leaderboard",
        {
          period,
          orderBy:"PNL",
          offset
        }
      );

    const page =
      Array.isArray(body)
        ? body
        : Array.isArray(body?.data)
          ? body.data
          : [];

    rows.push(...page);
  }

  const map = new Map();

  for(const row of rows){

    const wallet =
      row.proxyWallet ||
      row.proxy_wallet ||
      row.address;

    if(
      !/^0x[a-fA-F0-9]{40}$/.test(
        wallet || ""
      )
    ){
      continue;
    }

    map.set(
      wallet.toLowerCase(),
      {
        ...row,
        wallet,
        name:
          row.userName ||
          row.user_name ||
          row.username ||
          row.name ||
          shortWallet(wallet)
      }
    );
  }

  return [...map.values()];
}


/* =====================================================
   STATS
===================================================== */

async function getStats(
  trader,
  period
){

  const data =
    await api(
      "stats",
      {
        user:trader.wallet,
        period
      }
    );

  return {
    ...trader,
    ...data
  };
}


/* =====================================================
   RANKING
===================================================== */

function rankingValue(
  trader,
  mode
){

  const s = trader;

  if(mode === "WL")
    return s.wlRatio ?? -Infinity;

  if(mode === "WINPCT")
    return s.winPct ?? -Infinity;

  if(mode === "PNL")
    return s.pnl ?? -Infinity;

  if(mode === "ROI")
    return s.roi ?? -Infinity;

  return s.volume ?? -Infinity;
}


/* =====================================================
   SORT
===================================================== */

function sortTraders(
  traders,
  mode
){

  return [...traders].sort(
    (a,b)=>
      rankingValue(b,mode) -
      rankingValue(a,mode)
  );
}


/* =====================================================
   TRADER TABLE
===================================================== */

function renderTraders(){

  const mode =
    $("ranking").value;

  const traders =
    sortTraders(
      state.traders,
      mode
    ).slice(0,100);

  $("count").textContent =
    traders.length;

  if(!traders.length){

    $("traders").innerHTML = `
      <tr>
        <td colspan="10"
            class="loading">
          No qualifying traders.
        </td>
      </tr>
    `;

    return;
  }

  $("traders").innerHTML =
    traders.map(
      (t,i)=>{

        const pnl =
          Number(t.pnl || 0);

        return `

<tr>

<td class="rank">
${i+1}
</td>

<td>

<div class="name">
${escapeHtml(t.name)}
</div>

<div class="wallet">
${escapeHtml(
  shortWallet(t.wallet)
)}
</div>

</td>

<td class="record">
${t.wins}-${t.losses}
</td>

<td>
${pct(t.winPct)}
</td>

<td>

${
  t.wlRatio === null ||
  t.wlRatio === undefined
    ? "—"
    : Number(t.wlRatio).toFixed(2)
}

</td>

<td class="${
  pnl >= 0
    ? "green"
    : "red"
}">

${money(pnl)}

</td>

<td class="${
  Number(t.roi || 0) >= 0
    ? "green"
    : "red"
}">

${pct(t.roi)}

</td>

<td>
${money(t.volume)}
</td>

<td>
${t.active?.length || 0}
</td>

<td>

<button
onclick="showTrader('${t.wallet}')">

View

</button>

</td>

</tr>

<tr
id="trader-${t.wallet}"
style="display:none"
class="details">

<td colspan="10">

<div class="details-inner">
Loading...
</div>

</td>

</tr>

`;

      }
    ).join("");
}


/* =====================================================
   TRADER DETAILS
===================================================== */

async function showTrader(wallet){

  const row =
    document.getElementById(
      "trader-" + wallet
    );

  if(!row) return;

  if(
    row.style.display ===
    "table-row"
  ){

    row.style.display =
      "none";

    return;
  }

  row.style.display =
    "table-row";

  const box =
    row.querySelector(
      ".details-inner"
    );

  box.innerHTML =
    `<div class="loading">
      Loading...
    </div>`;

  try{

    const trader =
      state.traders.find(
        x =>
          x.wallet.toLowerCase() ===
          wallet.toLowerCase()
      );

    if(!trader)
      throw new Error(
        "Trader not found."
      );

    box.innerHTML = `

<div class="stats">

<div class="stat">
<b>${trader.wins}-${trader.losses}</b>
<span>Record</span>
</div>

<div class="stat">
<b>${pct(trader.winPct)}</b>
<span>Win percentage</span>
</div>

<div class="stat">
<b>${
  trader.wlRatio == null
    ? "—"
    : Number(trader.wlRatio).toFixed(2)
}</b>
<span>Win/Loss ratio</span>
</div>

<div class="stat">
<b>${money(trader.pnl)}</b>
<span>Profit/Loss</span>
</div>

<div class="stat">
<b>${pct(trader.roi)}</b>
<span>ROI</span>
</div>

<div class="stat">
<b>${money(trader.volume)}</b>
<span>Investment volume</span>
</div>

</div>

<br>

<div class="section-title">
Active Positions
</div>

<div class="position-grid">

${
  (trader.active || [])
  .map(positionHtml)
  .join("")
  ||
  `<div class="muted">
    No currently active positions.
   </div>`
}

</div>
`;

  }catch(e){

    box.innerHTML =
      `<div class="error">
        ${escapeHtml(e.message)}
       </div>`;
  }
}


/* =====================================================
   POSITION HTML
===================================================== */

function positionHtml(p){

  const shares =
    Number(
      p.current_size ??
      p.size ??
      0
    );

  const entry =
    Number(
      p.avg_price ??
      p.avgPrice ??
      0
    );

  const current =
    Number(
      p.current_price ??
      p.curPrice ??
      0
    );

  const entryCost =
    Number(
      p.entry_cost_usdc ??
      shares * entry
    );

  const currentValue =
    Number(
      p.current_value ??
      shares * current
    );

  const pnl =
    Number(
      p.unrealized_pnl ??
      (currentValue-entryCost)
    );

  const title =
    p.title ||
    p.name ||
    "Unknown market";

  const outcome =
    p.outcome ||
    "Unknown";

  return `

<div class="position">

<div class="position-title">

${escapeHtml(title)}

</div>

<div class="badge">

${escapeHtml(outcome)}

</div>

<div class="position-meta">

Shares:
<b>${num(shares)}</b>
<br>

Entry:
<b>${money(entry)}</b>
<br>

Current:
<b>${money(current)}</b>
<br>

Investment:
<b>${money(entryCost)}</b>
<br>

Current value:
<b>${money(currentValue)}</b>
<br>

Total unrealized P&L:

<b class="${
  pnl >= 0
    ? "green"
    : "red"
}">

${money(pnl)}

</b>

<br>

Bought:
<b>
${
  p.first_entry_at
    ? new Date(
        p.first_entry_at
      ).toLocaleString()
    : p.last_event_at
      ? new Date(
          Number(p.last_event_at)*1000
        ).toLocaleString()
      : "Unavailable"
}
</b>

</div>

</div>

`;
}


/* =====================================================
   SCAN TOP 100
===================================================== */

async function scan(){

  $("scan").disabled =
    true;

  showError("");

  const period =
    $("period").value;

  state.period =
    period;

  $("status").textContent =
    "Loading leaderboard...";

  $("traders").innerHTML =
    `<tr>
      <td colspan="10"
          class="loading">
        Loading...
      </td>
    </tr>`;

  try{

    const candidates =
      await getLeaderboard(
        period
      );

    if(!candidates.length){

      throw new Error(
        "The worker returned zero leaderboard traders."
      );
    }

    const results = [];

    /*
      Process in batches so we don't hammer
      the public API.
    */

    const batchSize = 5;

    for(
      let i=0;
      i<candidates.length;
      i+=batchSize
    ){

      const batch =
        candidates.slice(
          i,
          i+batchSize
        );

      const result =
        await Promise.all(
          batch.map(
            async trader => {

              try{

                return await getStats(
                  trader,
                  period
                );

              }catch(e){

                console.warn(
                  "Trader failed",
                  trader.wallet,
                  e
                );

                return null;
              }
            }
          )
        );

      results.push(
        ...result.filter(Boolean)
      );

      $("status").textContent =
        `Calculating accurate records: ${
          Math.min(
            i+batchSize,
            candidates.length
          )
        } / ${candidates.length}`;
    }

    /*
      Remove 0-0 accounts.
    */

    state.traders =
      results.filter(
        t =>
          Number(t.resolved || 0) > 0
      );

    renderTraders();

    $("volume").textContent =
      money(
        state.traders.reduce(
          (sum,t)=>
            sum + Number(t.volume || 0),
          0
        )
      );

    $("activeCount").textContent =
      state.traders.reduce(
        (sum,t)=>
          sum +
          (t.active?.length || 0),
        0
      );

    $("status").textContent =
      `Loaded ${state.traders.length} qualifying traders.`;

  }catch(e){

    showError(e.message);

    $("status").textContent =
      "Scan failed.";

    $("traders").innerHTML =
      `<tr>
        <td colspan="10"
            class="loading">
          Scan failed.
        </td>
      </tr>`;

  }finally{

    $("scan").disabled =
      false;
  }
}


/* =====================================================
   MARKETS
===================================================== */

function marketKey(p){

  return String(
    p.condition_id ??
    p.conditionId ??
    p.event_id ??
    p.title ??
    ""
  );
}

function buildMarkets(){

  const map =
    new Map();

  for(
    const trader
    of state.traders
  ){

    for(
      const p
      of trader.active || []
    ){

      const key =
        marketKey(p);

      if(!key)
        continue;

      if(!map.has(key)){

        map.set(
          key,
          {
            key,
            title:
              p.title ||
              p.name ||
              "Unknown market",
            positions:[]
          }
        );
      }

      map.get(key)
        .positions
        .push({
          trader,
          position:p
        });
    }
  }

  return [...map.values()];
}


/* =====================================================
   MARKET RENDER
===================================================== */

function marketValue(
  market,
  mode
){

  let volume = 0;
  let pnl = 0;

  const records = [];

  for(
    const x
    of market.positions
  ){

    const p =
      x.position;

    const shares =
      Number(
        p.current_size ??
        p.size ??
        0
      );

    const entry =
      Number(
        p.avg_price ??
        p.avgPrice ??
        0
      );

    volume +=
      shares * entry;

    pnl += Number(
      p.unrealized_pnl ??
      (
        shares *
        Number(
          p.current_price ??
          0
        )
        -
        shares * entry
      )
    );

    records.push(
      x.trader
    );
  }

  const wins =
    records.reduce(
      (n,t)=>
        n + Number(t.wins || 0),
      0
    );

  const losses =
    records.reduce(
      (n,t)=>
        n + Number(t.losses || 0),
      0
    );

  const winPct =
    wins + losses
      ? wins /
        (wins+losses) *
        100
      : null;

  const wl =
    losses
      ? wins/losses
      : null;

  const roi =
    volume
      ? pnl/volume*100
      : null;

  if(mode === "WL")
    return wl ?? -Infinity;

  if(mode === "WINPCT")
    return winPct ?? -Infinity;

  if(mode === "PNL")
    return pnl;

  if(mode === "ROI")
    return roi ?? -Infinity;

  return volume;
}


function renderMarkets(){

  const mode =
    $("marketRanking").value;

  const sorted =
    [...state.markets].sort(
      (a,b)=>
        marketValue(b,mode) -
        marketValue(a,mode)
    );

  const groups = [
    ["5+ wallets",
      sorted.filter(
        m => m.positions.length >= 5
      )],

    ["3+ wallets",
      sorted.filter(
        m => m.positions.length >= 3
      )],

    ["2+ wallets",
      sorted.filter(
        m => m.positions.length >= 2
      )],

    ["1+ wallet",
      sorted.filter(
        m => m.positions.length >= 1
      )]
  ];

  $("marketList").innerHTML =
    groups.map(
      ([title,markets]) => {

        if(!markets.length)
          return "";

        return `

<div class="section-title">
${title}
</div>

${
  markets.map(
    marketHtml
  ).join("")
}

<br>

`;

      }
    ).join("");
}


function marketHtml(m){

  let yes = 0;
  let no = 0;
  let total = 0;

  for(
    const x
    of m.positions
  ){

    const outcome =
      String(
        x.position.outcome ||
        ""
      ).toLowerCase();

    if(
      outcome === "yes"
    ){
      yes++;
    }

    if(
      outcome === "no"
    ){
      no++;
    }

    total++;
  }

  const yesPct =
    total
      ? yes/total*100
      : 0;

  const noPct =
    total
      ? no/total*100
      : 0;

  const volume =
    m.positions.reduce(
      (sum,x)=>{

        const p =
          x.position;

        return sum +
          Number(
            p.current_size ??
            p.size ??
            0
          ) *
          Number(
            p.avg_price ??
            p.avgPrice ??
            0
          );

      },
      0
    );

  const id =
    "market-" +
    encodeURIComponent(
      m.key
    );

  return `

<div class="market">

<div class="market-head">

<div>

<div class="market-title">
${escapeHtml(m.title)}
</div>

<div class="market-sub">
${m.positions.length}
tracked wallets
· ${money(volume)}
volume
</div>

<div class="market-summary">

<span>
YES:
<b>${yes}</b>
(${yesPct.toFixed(0)}%)
</span>

<span>
NO:
<b>${no}</b>
(${noPct.toFixed(0)}%)
</span>

</div>

</div>

<button
onclick="toggleMarket('${id}')">

View traders

</button>

</div>

<div id="${id}" style="display:none">

<br>

${
  m.positions.map(
    x => {

      const t =
        x.trader;

      const p =
        x.position;

      const shares =
        Number(
          p.current_size ??
          p.size ??
          0
        );

      const entry =
        Number(
          p.avg_price ??
          p.avgPrice ??
          0
        );

      return `

<div class="trader-row">

<div>

<b>
${escapeHtml(t.name)}
</b>

<div class="small">

Record:
${t.wins}-${t.losses}

·

Win:
${pct(t.winPct)}

·

W/L:
${
  t.wlRatio == null
    ? "—"
    : Number(
        t.wlRatio
      ).toFixed(2)
}

</div>

</div>

<div style="text-align:right">

<div class="outcome">
${escapeHtml(
  p.outcome ||
  "Unknown"
)}
</div>

<div class="small">

${num(shares)}
shares

·

${money(
  shares * entry
)}

</div>

</div>

</div>

`;

    }
  ).join("")
}

</div>

</div>

`;
}


function toggleMarket(id){

  const el =
    document.getElementById(
      id
    );

  if(!el)
    return;

  el.style.display =
    el.style.display === "none"
      ? "block"
      : "none";
}


/* =====================================================
   ACTIVE MARKET SCAN
===================================================== */

async function scanMarkets(){

  if(!state.traders.length){

    showError(
      "Scan Top 100 first."
    );

    return;
  }

  $("marketsButton").disabled =
    true;

  showError("");

  $("marketStatus").textContent =
    "Building active markets...";

  try{

    /*
      Stats already contain active positions.
      Do NOT make another 100+ API calls.
    */

    state.markets =
      buildMarkets();

    $("marketCount").textContent =
      state.markets.length;

    $("activeCount").textContent =
      state.traders.reduce(
        (sum,t)=>
          sum +
          (t.active?.length || 0),
        0
      );

    renderMarkets();

    $("marketStatus").textContent =
      `${state.markets.length} active markets found.`;

  }catch(e){

    showError(e.message);

  }finally{

    $("marketsButton").disabled =
      false;
  }
}


/* =====================================================
   EVENTS
===================================================== */

$("scan")
  .addEventListener(
    "click",
    scan
  );

$("marketsButton")
  .addEventListener(
    "click",
    scanMarkets
  );

$("ranking")
  .addEventListener(
    "change",
    renderTraders
  );

$("marketRanking")
  .addEventListener(
    "change",
    renderMarkets
  );


/* =====================================================
   INITIAL WORKER CHECK
===================================================== */

(async()=>{

  try{

    await api("health");

    $("status").textContent =
      "Worker connected. Ready to scan.";

  }catch(e){

    $("status").textContent =
      "Worker connection failed.";

    showError(
      "Worker connection failed: " +
      e.message
    );

  }

})();

</script>
