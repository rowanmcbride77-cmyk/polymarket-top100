<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Top 100</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.container{width:min(1450px,96%);margin:auto;padding:24px 0 60px}
h1{margin:0 0 18px;font-size:30px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
button,select{background:#111;color:#fff;border:1px solid #333;border-radius:7px;padding:10px 14px;font-size:14px}
button{cursor:pointer}
button:hover{background:#1a1a1a}
button:disabled{opacity:.5;cursor:default}
.status{color:#888;margin:10px 0 18px;font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:12px 10px;border-bottom:1px solid #191919;text-align:left;vertical-align:middle}
th{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:hover{background:#080808}
.rank{color:#777;width:50px}
.name{font-weight:700}
.wallet{font:12px monospace;color:#777;margin-top:3px}
.record{font-weight:700;white-space:nowrap}
.active-yes{font-weight:700}
.active-no{color:#555}
.pnl-negative{color:#777}
details{max-width:620px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▼";color:#555;font-size:10px}
.market-list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.market{background:#0d0d0d;border:1px solid #222;border-radius:7px;padding:10px}
.market-title{font-weight:700;line-height:1.3;margin-bottom:5px}
.market-meta{color:#999;font-size:12px}
.side{font-weight:700;color:#fff}
.empty{color:#555;padding:10px 0}
.shared{margin-top:45px}
.shared h2{font-size:20px}
.shared-market{background:#080808;border:1px solid #222;border-radius:8px;padding:13px;margin-bottom:10px}
.shared-title{font-weight:700;margin-bottom:8px}
.shared-trader{color:#aaa;font-size:13px;margin:5px 0}
.small{font:11px monospace;color:#555;margin-top:2px}
</style>
</head>

<body>

<div class="container">

<h1>Polymarket Top 100</h1>

<div class="controls">
<select id="period">
<option value="WEEK">Week</option>
<option value="MONTH">Month</option>
<option value="3MONTHS">3 Months</option>
</select>

<button id="scanBtn">Scan Top 100</button>
<button id="activeBtn">Refresh Active Markets</button>

<select id="sortMode">
<option value="record">Best Record</option>
<option value="winrate">Win %</option>
<option value="pnl">P/L</option>
</select>
</div>

<div class="status" id="status">Ready.</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Trader</th>
<th>Record</th>
<th>Win %</th>
<th>P/L</th>
<th>Active</th>
<th>Active Markets</th>
</tr>
</thead>
<tbody id="traders"></tbody>
</table>
</div>

<div class="shared">
<h2>Shared Active Markets</h2>
<div id="sharedMarkets">
<div class="empty">No shared active markets yet.</div>
</div>
</div>

</div>

<script>

const WORKER="https://polymarket-proxy.rowanmcbride.workers.dev";
const DIRECT="https://data-api.polymarket.com";

let traders=[];
let scanGeneration=0;

const $=id=>document.getElementById(id);

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

async function api(path){

  try{
    const r=await fetch(WORKER+path,{cache:"no-store"});
    if(r.ok)return await r.json();
  }catch(e){}

  const r=await fetch(DIRECT+path,{cache:"no-store"});
  if(!r.ok)throw new Error(r.status);
  return await r.json();
}

async function pool(items,limit,fn){

  const out=new Array(items.length);
  let next=0;

  async function worker(){

    while(true){

      const i=next++;

      if(i>=items.length)return;

      try{
        out[i]=await fn(items[i],i);
      }catch(e){
        out[i]=null;
      }
    }
  }

  await Promise.all(
    Array.from(
      {length:Math.min(limit,items.length)},
      worker
    )
  );

  return out;
}

function esc(v){
  return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function walletOf(x){
  return x.proxyWallet||
         x.proxy_wallet||
         x.user||
         x.address||
         x.wallet||
         x.userAddress||
         "";
}

function nameOf(x){
  return x.userName||
         x.username||
         x.name||
         x.displayName||
         x.pseudonym||
         x.profile?.name||
         x.profile?.username||
         "";
}

function timestampOf(x){

  const vals=[
    x.timestamp,
    x.ts,
    x.createdAt,
    x.created_at,
    x.updatedAt,
    x.updated_at
  ];

  for(const v of vals){

    if(v==null)continue;

    if(typeof v==="number"){
      return v>100000000000?v/1000:v;
    }

    const n=Number(v);

    if(Number.isFinite(n)){
      return n>100000000000?n/1000:n;
    }

    const d=Date.parse(v);

    if(Number.isFinite(d))return d/1000;
  }

  return null;
}

function pnlOf(x){

  const vals=[
    x.realizedPnl,
    x.realized_pnl,
    x.cashPnl,
    x.cash_pnl,
    x.pnl,
    x.profit
  ];

  for(const v of vals){

    const n=Number(v);

    if(Number.isFinite(n))return n;
  }

  return null;
}

function periodStart(period){

  const now=Date.now()/1000;

  if(period==="WEEK")return now-7*86400;
  if(period==="MONTH")return now-30*86400;

  return now-90*86400;
}

function money(n){

  n=Number(n);

  if(!Number.isFinite(n))return "—";

  const a=Math.abs(n);

  if(a>=1000000)
    return (n<0?"-$":"$")+(a/1000000).toFixed(2)+"M";

  if(a>=1000)
    return (n<0?"-$":"$")+(a/1000).toFixed(1)+"K";

  return (n<0?"-$":"$")+a.toFixed(2);
}

function date(ts){

  if(!ts)return "Unknown";

  const d=new Date(ts*1000);

  if(isNaN(d.getTime()))return "Unknown";

  return d.toLocaleString([],{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}


/* ============================================================
   CANDIDATES
============================================================ */

async function candidates(){

  const map=new Map();

  const jobs=[];

  for(const order of ["PNL","VOL"]){

    for(let offset=0;offset<1000;offset+=50){

      jobs.push(
        `/v1/leaderboard?timePeriod=WEEK&category=OVERALL&orderBy=${order}&limit=50&offset=${offset}`
      );
    }
  }

  const results=await pool(
    jobs,
    12,
    async path=>{

      try{
        return await api(path);
      }catch(e){
        return [];
      }
    }
  );

  for(const data of results){

    const rows=Array.isArray(data)
      ?data
      :Array.isArray(data?.data)
        ?data.data
        :[];

    for(const row of rows){

      const wallet=walletOf(row);

      if(!wallet)continue;

      const key=wallet.toLowerCase();

      if(!map.has(key)){

        map.set(key,{
          wallet,
          name:nameOf(row)
        });
      }
    }
  }

  return [...map.values()];
}


/* ============================================================
   RESOLVED RECORD
============================================================ */

async function closedPage(wallet,offset){

  const q=
    `/v1/closed-positions`+
    `?user=${encodeURIComponent(wallet)}`+
    `&limit=50`+
    `&offset=${offset}`+
    `&sortBy=TIMESTAMP`+
    `&sortDirection=DESC`;

  try{
    const data=await api(q);

    return Array.isArray(data)
      ?data
      :Array.isArray(data?.data)
        ?data.data
        :[];

  }catch(e){
    return [];
  }
}


/*
  Fast but still captures a large recent history.

  We request the first 5 pages concurrently.
  That's 250 resolved markets per trader max,
  rather than crawling thousands of old positions.
*/

async function recordFor(wallet,period){

  const start=periodStart(period);

  const offsets=[0,50,100,150,200];

  const pages=await Promise.all(
    offsets.map(o=>closedPage(wallet,o))
  );

  let wins=0;
  let losses=0;
  let pnl=0;

  for(const rows of pages){

    for(const row of rows){

      const ts=timestampOf(row);

      if(ts && ts<start)continue;

      const p=pnlOf(row);

      if(p==null)continue;

      if(p>0){
        wins++;
        pnl+=p;
      }else if(p<0){
        losses++;
        pnl+=p;
      }
    }
  }

  const total=wins+losses;

  return{
    wins,
    losses,
    total,
    winRate:total?wins/total:0,
    pnl
  };
}


/* ============================================================
   ACTIVE POSITIONS
============================================================ */

async function activeFor(wallet){

  try{

    const q=
      `/v2/positions`+
      `?user=${encodeURIComponent(wallet)}`+
      `&status=OPEN`+
      `&limit=500`;

    const data=await api(q);

    const rows=Array.isArray(data?.data)
      ?data.data
      :[];

    return rows.filter(x=>{

      const status=
        String(x.status||"").toUpperCase();

      const size=Number(
        x.current_size ??
        x.currentSize ??
        x.size ??
        0
      );

      if(status!=="OPEN")return false;
      if(size<=0)return false;
      if(x.redeemable)return false;

      return true;
    });

  }catch(e){

    /*
      Fallback to v1 if the worker doesn't expose v2.
    */

    try{

      const q=
        `/positions`+
        `?user=${encodeURIComponent(wallet)}`+
        `&sizeThreshold=0`+
        `&limit=500`;

      const data=await api(q);

      const rows=Array.isArray(data)
        ?data
        :Array.isArray(data?.data)
          ?data.data
          :[];

      return rows.filter(x=>{

        const size=Number(
          x.size||
          x.currentSize||
          x.current_size||
          0
        );

        if(size<=0)return false;
        if(x.redeemable)return false;
        if(x.redeemed)return false;
        if(x.closed)return false;

        return true;
      });

    }catch(e){

      return [];
    }
  }
}


/* ============================================================
   ACTIVE MARKET CONVERSION
============================================================ */

function convertActive(rows){

  return rows.map(x=>{

    const condition=
      x.condition_id||
      x.conditionId||
      x.market||
      "";

    const amount=Number(
      x.initialValue ??
      x.initial_value ??
      x.entry_cost_usdc ??
      x.total_cost_usdc ??
      x.currentValue ??
      0
    );

    return{
      condition,
      title:
        x.title||
        x.question||
        x.name||
        "Unknown market",

      outcome:
        x.outcome||
        x.outcome_name||
        x.side||
        "Unknown",

      amount,

      buyTime:
        timestampOf(x),

      raw:x
    };
  });
}


/* ============================================================
   RENDER
============================================================ */

function sortTraders(){

  const mode=$("sortMode").value;

  traders.sort((a,b)=>{

    /*
      #1 ACTIVE MARKET

      This is the user's requested priority:

      25-0 + active
      beats
      50-0 + no active.
    */

    const aa=a.activeMarkets.length?1:0;
    const bb=b.activeMarkets.length?1:0;

    if(aa!==bb)return bb-aa;

    /*
      #2 RECORD
    */

    if(mode==="pnl"){

      if(b.record.pnl!==a.record.pnl)
        return b.record.pnl-a.record.pnl;

    }else{

      if(b.record.winRate!==a.record.winRate)
        return b.record.winRate-a.record.winRate;

    }

    /*
      #3 WINS
    */

    if(b.record.wins!==a.record.wins)
      return b.record.wins-a.record.wins;

    /*
      #4 TOTAL RESOLVED
    */

    if(b.record.total!==a.record.total)
      return b.record.total-a.record.total;

    /*
      #5 P/L
    */

    return b.record.pnl-a.record.pnl;
  });
}


function activeHTML(t){

  if(!t.activeMarkets.length)
    return `<div class="empty">No active markets.</div>`;

  return`
  <div class="market-list">
  ${t.activeMarkets.map(m=>`

    <div class="market">

      <div class="market-title">
        ${esc(m.title)}
      </div>

      <div class="market-meta">
        <span class="side">${esc(m.outcome)}</span>
        · ${money(m.amount)}
        · Bought ${esc(date(m.buyTime))}
      </div>

    </div>

  `).join("")}
  </div>`;
}


function render(){

  sortTraders();

  $("traders").innerHTML=traders.map((t,i)=>{

    const active=t.activeMarkets.length>0;

    return`
    <tr>

      <td class="rank">${i+1}</td>

      <td>
        <div class="name">
          ${esc(t.name||"Unknown Trader")}
        </div>
        <div class="wallet">
          ${esc(t.wallet)}
        </div>
      </td>

      <td class="record">
        ${t.record.wins}-${t.record.losses}
      </td>

      <td>
        ${(t.record.winRate*100).toFixed(1)}%
      </td>

      <td class="${t.record.pnl<0?"pnl-negative":""}">
        ${money(t.record.pnl)}
      </td>

      <td class="${active?"active-yes":"active-no"}">
        ${active?"YES":"NO"}
      </td>

      <td>

        <details
          data-wallet="${esc(t.wallet)}"
          data-loaded="${t.detailsLoaded?"1":"0"}"
        >

          <summary>
            ${active
              ?`${t.activeMarkets.length} active market${t.activeMarkets.length===1?"":"s"}`
              :"None"}
          </summary>

          ${activeHTML(t)}

        </details>

      </td>

    </tr>`;
  }).join("");

  buildShared();
}


/* ============================================================
   SHARED MARKETS
============================================================ */

function buildShared(){

  const map=new Map();

  for(const t of traders){

    for(const m of t.activeMarkets){

      if(!m.condition)continue;

      if(!map.has(m.condition)){

        map.set(m.condition,{
          title:m.title,
          traders:[]
        });
      }

      map.get(m.condition).traders.push({
        name:t.name||"Unknown Trader",
        wallet:t.wallet,
        outcome:m.outcome,
        amount:m.amount,
        buyTime:m.buyTime
      });
    }
  }

  const shared=[...map.values()]
    .filter(x=>x.traders.length>=2)
    .sort((a,b)=>b.traders.length-a.traders.length);

  if(!shared.length){

    $("sharedMarkets").innerHTML=
      `<div class="empty">No shared active markets found.</div>`;

    return;
  }

  $("sharedMarkets").innerHTML=
    shared.map(m=>`

      <div class="shared-market">

        <div class="shared-title">
          ${esc(m.title)}
        </div>

        ${m.traders.map(t=>`

          <div class="shared-trader">

            <strong>${esc(t.name)}</strong>
            · ${esc(t.outcome)}
            · ${money(t.amount)}
            · Bought ${esc(date(t.buyTime))}

            <div class="small">
              ${esc(t.wallet)}
            </div>

          </div>

        `).join("")}

      </div>

    `).join("");
}


/* ============================================================
   MAIN SCAN
============================================================ */

async function scan(){

  const generation=++scanGeneration;

  $("scanBtn").disabled=true;
  $("activeBtn").disabled=true;

  $("traders").innerHTML="";
  $("sharedMarkets").innerHTML=
    `<div class="empty">Scanning...</div>`;

  try{

    $("status").textContent=
      "Finding traders...";

    const all=await candidates();

    /*
      Keep the candidate pool manageable.
    */

    const candidates100=all.slice(0,200);

    $("status").textContent=
      `Checking ${candidates100.length} traders...`;

    const period=$("period").value;

    /*
      RECORD + ACTIVE are fetched at the same time.

      This is the big speed improvement.
    */

    const results=await pool(
      candidates100,
      25,
      async candidate=>{

        const [record,active]=await Promise.all([
          recordFor(candidate.wallet,period),
          activeFor(candidate.wallet)
        ]);

        return{
          wallet:candidate.wallet,
          name:candidate.name,
          record,
          activeMarkets:convertActive(active),
          detailsLoaded:false
        };
      }
    );

    if(generation!==scanGeneration)return;

    traders=results
      .filter(Boolean)
      .sort((a,b)=>{

        const aa=a.activeMarkets.length?1:0;
        const bb=b.activeMarkets.length?1:0;

        if(aa!==bb)return bb-aa;

        if(b.record.winRate!==a.record.winRate)
          return b.record.winRate-a.record.winRate;

        if(b.record.wins!==a.record.wins)
          return b.record.wins-a.record.wins;

        if(b.record.total!==a.record.total)
          return b.record.total-a.record.total;

        return b.record.pnl-a.record.pnl;
      })
      .slice(0,100);

    render();

    $("status").textContent=
      `Done — ${traders.length} traders loaded.`;

  }catch(e){

    console.error(e);

    $("status").textContent=
      "Scan failed.";

  }finally{

    $("scanBtn").disabled=false;
    $("activeBtn").disabled=false;
  }
}


/* ============================================================
   REFRESH ACTIVE ONLY
============================================================ */

async function refreshActive(){

  if(!traders.length){
    $("status").textContent=
      "Run a scan first.";
    return;
  }

  $("activeBtn").disabled=true;

  try{

    $("status").textContent=
      "Refreshing active markets...";

    await pool(
      traders,
      30,
      async t=>{

        const rows=await activeFor(t.wallet);

        t.activeMarkets=convertActive(rows);

        return true;
      }
    );

    render();

    $("status").textContent=
      "Active markets refreshed.";

  }finally{

    $("activeBtn").disabled=false;
  }
}


/* ============================================================
   EVENTS
============================================================ */

$("scanBtn").onclick=scan;

$("activeBtn").onclick=refreshActive;

$("sortMode").onchange=render;

$("period").onchange=()=>{

  traders=[];

  $("traders").innerHTML="";

  $("sharedMarkets").innerHTML=
    `<div class="empty">Run a new scan for this period.</div>`;

  $("status").textContent=
    "Period changed.";
};


/*
  Initial scan.
*/

scan();

</script>

</body>
</html>
