<body>

<div class="container">

Traders ranked by actual resolved-market consistency

Ready.

<script>

const API="https://data-api.polymarket.com/v2";
const OLD_API="https://data-api.polymarket.com";
const WORKER="https://polymarket-proxy.rowanmcbride77.workers.dev";

let traders=[];
let activeCache=new Map();

const periodEl=document.getElementById("period");
const sortEl=document.getElementById("sort");
const searchEl=document.getElementById("search");
const scanBtn=document.getElementById("scanBtn");
const statusEl=document.getElementById("status");
const bodyEl=document.getElementById("traderBody");


/* =========================================================
   HELPERS
========================================================= */

function num(v){
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}

function fmtMoney(v){

  v=num(v);

  const sign=v>0?"+":"";

  if(Math.abs(v)>=1000000)
    return sign+"$"+(v/1000000).toFixed(2)+"M";

  if(Math.abs(v)>=1000)
    return sign+"$"+(v/1000).toFixed(1)+"K";

  return sign+"$"+v.toFixed(0);
}

function fmtPercent(v){
  return num(v).toFixed(1)+"%";
}

function fmtDate(ts){

  if(!ts) return "Unknown";

  let d;

  if(typeof ts==="string" && ts.includes("-")){
    d=new Date(ts);
  }else{
    d=new Date(Number(ts)*1000);
  }

  if(isNaN(d.getTime()))
    return "Unknown";

  return d.toLocaleString([],{
    month:"short",
    day:"numeric",
    year:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function shortWallet(wallet){

  if(!wallet) return "";

  if(wallet.length<=18) return wallet;

  return wallet.slice(0,8)+"..."+wallet.slice(-6);
}

function pnlClass(v){

  if(v>0) return "positive";
  if(v<0) return "negative";

  return "neutral";
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   FAST FETCH
========================================================= */

async function fetchJSON(path,old=false){

  const base=old?OLD_API:API;

  try{

    const r=await fetch(base+path);

    if(r.ok){
      return await r.json();
    }

  }catch(e){}

  try{

    const r=await fetch(WORKER+path);

    if(r.ok){
      return await r.json();
    }

  }catch(e){}

  return null;
}


/* =========================================================
   PERIOD
========================================================= */

function getPeriodWindow(){

  const end=Math.floor(Date.now()/1000);

  let seconds;

  if(periodEl.value==="week")
    seconds=7*86400;

  else if(periodEl.value==="month")
    seconds=30*86400;

  else
    seconds=90*86400;

  return{
    start:end-seconds,
    end:end
  };
}


/* =========================================================
   LEADERBOARD
========================================================= */

async function getLeaderboard(period,sortBy){

  const json=await fetchJSON(
    `/leaderboard?time_period=${period}`+
    `&category=overall`+
    `&sort_by=${sortBy}`+
    `&limit=500`
  );

  if(!json) return [];

  if(Array.isArray(json))
    return json;

  if(Array.isArray(json.data))
    return json.data;

  return [];
}


/* =========================================================
   CANDIDATES

   Only two leaderboard calls.

   500 PNL + 500 volume.
========================================================= */

async function getCandidatePool(){

  let period;

  if(periodEl.value==="week")
    period="week";

  else if(periodEl.value==="month")
    period="month";

  else
    period="month";

  const [pnlRows,volumeRows]=await Promise.all([
    getLeaderboard(period,"PNL"),
    getLeaderboard(period,"VOLUME")
  ]);

  const map=new Map();

  for(const row of [...pnlRows,...volumeRows]){

    const wallet=
      row.user_id||
      row.user||
      row.proxy_wallet||
      row.proxyWallet||
      row.wallet||
      row.address;

    if(!wallet) continue;

    const key=wallet.toLowerCase();

    if(!map.has(key)){

      map.set(key,{
        wallet:wallet,
        name:
          row.user_name||
          row.username||
          row.name||
          shortWallet(wallet)
      });

    }else{

      const existing=map.get(key);

      if(
        existing.name===shortWallet(existing.wallet)&&
        row.user_name
      ){
        existing.name=row.user_name;
      }
    }
  }

  return [...map.values()];
}


/* =========================================================
   CLOSED POSITIONS

   ONE API ROUTE PER TRADER.

   This replaces:
   - REDEEMABLE request
   - REDEEMABLE_LOST request
   - PNL request
   - VOLUME request

   One dataset gives:
   record
   realized P/L
   total bought
   ROI
========================================================= */

async function getClosedPositions(wallet){

  const window=getPeriodWindow();

  let all=[];
  let offset=0;

  /*
    Current closed-position endpoint has a max of 50.
    We only need enough recent rows to get through the
    selected time window.
  */

  for(let page=0;page<20;page++){

    const json=await fetchJSON(
      `/closed-positions?user=${encodeURIComponent(wallet)}`+
      `&limit=50`+
      `&offset=${offset}`+
      `&sortBy=TIMESTAMP`+
      `&sortDirection=DESC`,
      true
    );

    if(!json) break;

    const rows=
      Array.isArray(json)
        ? json
        : Array.isArray(json.data)
          ? json.data
          : [];

    if(!rows.length)
      break;

    all.push(...rows);

    let reachedOldData=false;

    for(const row of rows){

      const ts=
        num(
          row.timestamp||
          row.closedAt||
          row.closed_at
        );

      if(ts && ts<window.start){
        reachedOldData=true;
        break;
      }
    }

    if(reachedOldData)
      break;

    if(rows.length<50)
      break;

    offset+=rows.length;
  }

  return all.filter(row=>{

    const ts=
      num(
        row.timestamp||
        row.closedAt||
        row.closed_at
      );

    /*
      If timestamp exists, enforce exact selected window.
    */

    if(ts){
      return ts>=window.start && ts<=window.end;
    }

    return true;
  });
}


/* =========================================================
   CALCULATE EVERYTHING FROM CLOSED POSITIONS
========================================================= */

function calculateTrader(rows){

  /*
    Group by conditionId.

    One resolved market = one record.

    This prevents:
      1 market with multiple position rows
    from becoming multiple wins/losses.
  */

  const markets=new Map();

  for(const row of rows){

    const key=
      row.conditionId||
      row.condition_id||
      row.market||
      row.slug||
      row.title;

    if(!key) continue;

    if(!markets.has(key))
      markets.set(key,[]);

    markets.get(key).push(row);
  }

  let wins=0;
  let losses=0;
  let pnl=0;
  let invested=0;

  for(const rowsForMarket of markets.values()){

    let marketPnl=0;
    let marketInvested=0;

    for(const row of rowsForMarket){

      marketPnl+=num(
        row.realizedPnl||
        row.realized_pnl
      );

      marketInvested+=num(
        row.totalBought||
        row.total_bought
      );
    }

    pnl+=marketPnl;
    invested+=marketInvested;

    /*
      Positive realized P/L = winning market.
      Negative realized P/L = losing market.
    */

    if(marketPnl>0.000001){

      wins++;

    }else if(marketPnl<-0.000001){

      losses++;

    }
  }

  const total=wins+losses;

  const winRate=
    total>0
      ? wins/total*100
      : 0;

  const roi=
    invested>0
      ? pnl/invested*100
      : 0;

  return{
    wins,
    losses,
    total,
    winRate,
    pnl,
    invested,
    roi
  };
}


/* =========================================================
   SCAN TRADER
========================================================= */

async function scanTrader(candidate){

  try{

    const rows=
      await getClosedPositions(candidate.wallet);

    if(!rows.length)
      return null;

    const stats=
      calculateTrader(rows);

    if(stats.total<=0)
      return null;

    return{
      ...candidate,
      ...stats
    };

  }catch(e){

    return null;
  }
}


/* =========================================================
   SORT
========================================================= */

function sortTraders(rows){

  const sort=sortEl.value;

  rows.sort((a,b)=>{

    if(sort==="winrate"){

      return(
        b.winRate-a.winRate||
        b.wins-a.wins||
        b.total-a.total||
        b.pnl-a.pnl
      );
    }

    if(sort==="wins"){

      return(
        b.wins-a.wins||
        b.winRate-a.winRate||
        b.total-a.total||
        b.pnl-a.pnl
      );
    }

    if(sort==="pnl"){

      return(
        b.pnl-a.pnl||
        b.winRate-a.winRate||
        b.wins-a.wins
      );
    }

    if(sort==="roi"){

      return(
        b.roi-a.roi||
        b.pnl-a.pnl||
        b.winRate-a.winRate
      );
    }

    /*
      BEST RECORD

      50-0 beats 1-0
      100-10 beats 5-0
      when win rate is the same, more wins wins.

      P/L is the final tie breaker.
    */

    return(
      b.winRate-a.winRate||
      b.wins-a.wins||
      b.total-a.total||
      b.pnl-a.pnl
    );

  });

  return rows;
}


/* =========================================================
   ACTIVE POSITIONS
========================================================= */

async function getActive(wallet){

  if(activeCache.has(wallet))
    return activeCache.get(wallet);

  let rows=[];
  let cursor=null;

  for(let page=0;page<10;page++){

    let url=
      `/positions?user=${encodeURIComponent(wallet)}`+
      `&status=OPEN`+
      `&limit=1000`+
      `&sort_by=CURRENT_VALUE`+
      `&sort_direction=DESC`;

    if(cursor){
      url+=`&cursor=${encodeURIComponent(cursor)}`;
    }

    const json=await fetchJSON(url);

    if(!json) break;

    const data=
      Array.isArray(json.data)
        ? json.data
        : Array.isArray(json)
          ? json
          : [];

    rows.push(...data);

    const next=
      json.pagination?.next_cursor||
      json.pagination?.nextCursor||
      null;

    if(!next)
      break;

    cursor=next;
  }

  /*
    Only actual currently-held positions.

    Redeemable/settled positions are removed.
  */

  const active=rows.filter(row=>{

    const size=num(
      row.size||
      row.current_size||
      row.currentSize||
      row.tokens
    );

    const redeemable=
      row.redeemable===true||
      String(row.status||"").toUpperCase()==="REDEEMABLE";

    return size>0&&!redeemable;
  });

  activeCache.set(wallet,active);

  return active;
}


/* =========================================================
   ACTIVE MARKET PANEL
========================================================= */

async function renderActiveMarkets(wallet,detailRow){

  const panel=
    detailRow.querySelector(".active-panel");

  if(panel.dataset.loaded==="true")
    return;

  panel.innerHTML=`
    <div class="active-title">
      Active Markets
    </div>
    <div class="loading">
      Loading current positions...
    </div>
  `;

  const active=
    await getActive(wallet);

  const title=`
    <div class="active-title">
      Active Markets
      <span class="active-count">
        ${active.length} current
      </span>
    </div>
  `;

  if(!active.length){

    panel.innerHTML=
      title+
      `<div class="empty">No active markets.</div>`;

    panel.dataset.loaded="true";

    return;
  }

  active.sort((a,b)=>{

    return num(
      b.currentValue||
      b.current_value||
      b.size
    )-
    num(
      a.currentValue||
      a.current_value||
      a.size
    );

  });

  /*
    For active positions we use the position's actual
    entry timestamp if supplied by the API.

    If it is unavailable, show the position's update/
    creation timestamp rather than inventing a buy date.
  */

  const html=active.map(row=>{

    const titleText=
      row.title||
      row.name||
      "Unknown Market";

    const outcome=
      row.outcome||
      row.outcomeLabel||
      row.outcome_label||
      "Unknown";

    const outcomeLower=
      String(outcome).toLowerCase();

    const outcomeClass=
      outcomeLower==="yes"
        ? "yes"
        : outcomeLower==="no"
          ? "no"
          : "";

    const shares=num(
      row.size||
      row.current_size||
      row.currentSize||
      row.tokens
    );

    const avgPrice=num(
      row.avgPrice||
      row.avg_price
    );

    /*
      Amount actually put into the position.
    */

    let invested=num(
      row.totalBought||
      row.total_bought||
      row.entryCost||
      row.entry_cost||
      row.entry_cost_usdc||
      row.entryCostUSDC
    );

    if(!invested&&shares&&avgPrice){
      invested=shares*avgPrice;
    }

    const currentValue=num(
      row.currentValue||
      row.current_value
    );

    const buyTime=
      row.firstEntryTimestamp||
      row.first_entry_timestamp||
      row.entryTimestamp||
      row.entry_timestamp||
      row.createdAt||
      row.created_at||
      row.updatedAt||
      row.updated_at;

    return`

      <div class="market">

        <div class="market-title">
          ${escapeHTML(titleText)}
        </div>

        <div class="market-outcome ${outcomeClass}">
          ${escapeHTML(String(outcome))}
        </div>

        <div class="market-value">

          <span class="market-label">
            Invested
          </span>

          ${fmtMoney(invested)}

        </div>

        <div class="market-value">

          <span class="market-label">
            Position
          </span>

          ${shares.toFixed(2)}
          @
          ${avgPrice.toFixed(3)}

        </div>

        <div class="market-value">

          <span class="market-label">
            Bought / Entry
          </span>

          ${fmtDate(buyTime)}

        </div>

      </div>

    `;

  }).join("");

  panel.innerHTML=
    title+
    `<div class="market-list">${html}</div>`;

  panel.dataset.loaded="true";
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const search=
    searchEl.value.trim().toLowerCase();

  let rows=
    traders.filter(t=>{

      if(!search)
        return true;

      return(
        String(t.name||"")
          .toLowerCase()
          .includes(search)||
        String(t.wallet||"")
          .toLowerCase()
          .includes(search)
      );

    });

  sortTraders(rows);

  bodyEl.innerHTML="";

  rows.forEach((trader,index)=>{

    const rowId=
      "details-"+index+"-"+trader.wallet.slice(2,8);

    const tr=document.createElement("tr");

    tr.className="trader-row";

    tr.innerHTML=`

      <td class="rank">
        ${index+1}
      </td>

      <td>

        <div class="trader">
          ${escapeHTML(
            trader.name||
            shortWallet(trader.wallet)
          )}
        </div>

        <div class="wallet">
          ${escapeHTML(
            shortWallet(trader.wallet)
          )}
        </div>

      </td>

      <td>

        <div class="record">
          ${trader.wins}-${trader.losses}
        </div>

      </td>

      <td class="winrate">
        ${fmtPercent(trader.winRate)}
      </td>

      <td class="${pnlClass(trader.pnl)}">
        ${fmtMoney(trader.pnl)}
      </td>

      <td class="${pnlClass(trader.roi)}">
        ${fmtPercent(trader.roi)}
      </td>

      <td>

        <button
          class="active-btn"
          data-wallet="${escapeHTML(trader.wallet)}"
          data-detail="${rowId}"
        >
          Active Markets
        </button>

      </td>

    `;

    const detail=document.createElement("tr");

    detail.id=rowId;
    detail.className="details-row";

    detail.innerHTML=`

      <td colspan="7" class="details-cell">

        <div class="active-panel"></div>

      </td>

    `;

    bodyEl.appendChild(tr);
    bodyEl.appendChild(detail);

  });


  document
    .querySelectorAll(".active-btn")
    .forEach(button=>{

      button.addEventListener("click",async()=>{

        const detail=
          document.getElementById(
            button.dataset.detail
          );

        if(detail.classList.contains("open")){

          detail.classList.remove("open");

          return;
        }

        detail.classList.add("open");

        await renderActiveMarkets(
          button.dataset.wallet,
          detail
        );

      });

    });
}


/* =========================================================
   MAIN SCAN
========================================================= */

async function scan(){

  scanBtn.disabled=true;

  bodyEl.innerHTML="";

  activeCache.clear();

  traders=[];

  statusEl.textContent=
    "Finding traders...";

  try{

    /*
      Only TWO leaderboard calls.
    */

    const candidates=
      await getCandidatePool();

    statusEl.textContent=
      `Found ${candidates.length.toLocaleString()} candidates. Scanning records...`;

    const results=[];

    /*
      Higher concurrency = dramatically faster scan.

      40 is enough to make the scan much faster without
      going completely crazy with requests.
    */

    const batchSize=40;

    for(
      let i=0;
      i<candidates.length;
      i+=batchSize
    ){

      const batch=
        candidates.slice(
          i,
          i+batchSize
        );

      const batchResults=
        await Promise.all(
          batch.map(scanTrader)
        );

      for(const result of batchResults){

        if(
          result&&
          result.total>0
        ){
          results.push(result);
        }

      }

      /*
        Show progress immediately.
      */

      const processed=
        Math.min(
          i+batchSize,
          candidates.length
        );

      statusEl.textContent=
        `Scanning ${processed.toLocaleString()} / ${candidates.length.toLocaleString()} — ${results.length} traders with records`;

      /*
        Show what we have while the scan continues.
      */

      traders=
        sortTraders([...results])
          .slice(0,100);

      render();
    }


    /*
      FINAL TOP 100
    */

    traders=
      sortTraders(results)
        .slice(0,100);


    const totalResolved=
      traders.reduce(
        (sum,t)=>sum+t.total,
        0
      );

    const totalPnl=
      traders.reduce(
        (sum,t)=>sum+t.pnl,
        0
      );


    document.getElementById(
      "statTraders"
    ).textContent=
      traders.length;

    document.getElementById(
      "statResolved"
    ).textContent=
      totalResolved.toLocaleString();

    document.getElementById(
      "statPnl"
    ).textContent=
      fmtMoney(totalPnl);

    document.getElementById(
      "statPositions"
    ).textContent=
      "Click rows";

    document.getElementById(
      "statMarkets"
    ).textContent=
      "Click rows";


    statusEl.textContent=
      `Finished — ${traders.length} traders with actual resolved records.`;

    render();

  }catch(e){

    console.error(e);

    statusEl.textContent=
      "Scan failed. Try again.";

  }finally{

    scanBtn.disabled=false;

  }
}


/* =========================================================
   EVENTS
========================================================= */

scanBtn.addEventListener(
  "click",
  scan
);

periodEl.addEventListener(
  "change",
  scan
);

sortEl.addEventListener(
  "change",
  render
);

searchEl.addEventListener(
  "input",
  render
);


/* =========================================================
   START
========================================================= */

scan();

</script>

</body>
</html>
