<div class="wrap">

        Active markets will appear here after the scan.

<script>

const PROXY =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const API =
  "https://data-api.polymarket.com";

let scanning=false;
let topTraders=[];


/* =========================================================
   HELPERS
========================================================= */

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}


function setStatus(text,type=""){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status "+type;
}


function setProgress(v){
  document.getElementById("progressBar").style.width=
    Math.max(0,Math.min(100,v))+"%";
}


function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function periodStart(period){

  const now=Date.now();

  if(period==="WEEK")
    return now-7*86400000;

  if(period==="MONTH")
    return now-30*86400000;

  return now-90*86400000;
}


/* =========================================================
   API
========================================================= */

async function getJSON(path,tries=4){

  const urls=[
    PROXY+path,
    API+path
  ];

  for(let attempt=0;attempt<tries;attempt++){

    for(const url of urls){

      try{

        const response=await fetch(url,{
          method:"GET",
          headers:{
            "Accept":"application/json"
          }
        });

        if(response.ok){
          return await response.json();
        }

        if(response.status===429 || response.status===503){
          await sleep(600*(attempt+1));
        }

      }catch(e){}

    }

    await sleep(500*(attempt+1));
  }

  throw new Error("API request failed");
}


function rowsFrom(data){

  if(Array.isArray(data))
    return data;

  if(Array.isArray(data?.data))
    return data.data;

  if(Array.isArray(data?.positions))
    return data.positions;

  if(Array.isArray(data?.results))
    return data.results;

  if(Array.isArray(data?.leaderboard))
    return data.leaderboard;

  return [];
}


/* =========================================================
   CANDIDATES
========================================================= */

/*
   We intentionally scan a much larger candidate pool.

   Previously the scanner could end up with only ~83 valid
   traders because it only examined a small leaderboard slice.

   Now we pull multiple leaderboard pages so the final
   Top 100 is actually selected from a large pool.
*/

async function getCandidates(period){

  const map=new Map();

  const periods=
    period==="3MONTHS"
      ? ["MONTH","WEEK"]
      : [period];

  /*
     5 pages x 100 traders x 2 leaderboard types.
     This gives us a much larger pool than 100.
  */

  const offsets=[
    0,
    100,
    200,
    300,
    400
  ];

  for(const p of periods){

    for(const order of ["PNL","VOL"]){

      for(const offset of offsets){

        try{

          const data=await getJSON(
            `/v1/leaderboard`+
            `?timePeriod=${p}`+
            `&orderBy=${order}`+
            `&category=OVERALL`+
            `&limit=100`+
            `&offset=${offset}`
          );

          const rows=rowsFrom(data);

          for(const row of rows){

            const wallet=
              row.proxyWallet ||
              row.proxy_wallet ||
              row.wallet ||
              row.address ||
              row.user;

            if(!wallet)
              continue;

            const key=String(wallet).toLowerCase();

            if(!map.has(key)){

              map.set(key,{
                wallet:String(wallet),
                name:
                  row.userName ||
                  row.username ||
                  row.name ||
                  row.user_name ||
                  String(wallet).slice(0,10)
              });

            }

          }

        }catch(e){}

        /*
           If a page returns fewer than 100,
           there is no reason to keep paging
           this particular leaderboard.
        */

      }

    }

  }

  return [...map.values()];
}


/* =========================================================
   POSITIONS
========================================================= */

async function getPositions(wallet,status){

  const base=
    `/v2/positions`+
    `?user=${encodeURIComponent(wallet)}`+
    `&status=${status}`+
    `&limit=1000`+
    `&sort_by=TIMESTAMP`;

  try{

    const data=await getJSON(base);

    return rowsFrom(data);

  }catch(e){

    try{

      const data=await getJSON(
        `/v2/positions`+
        `?user=${encodeURIComponent(wallet)}`+
        `&status=${status}`+
        `&limit=1000`
      );

      return rowsFrom(data);

    }catch(e2){

      return [];

    }

  }
}


/* =========================================================
   RECORD DATA
========================================================= */

function timestamp(row){

  const values=[
    row.last_event_at,
    row.timestamp,
    row.updated_at,
    row.created_at
  ];

  for(const v of values){

    if(v===undefined || v===null)
      continue;

    const n=Number(v);

    if(Number.isFinite(n))
      return n<100000000000 ? n*1000 : n;

    const d=Date.parse(v);

    if(Number.isFinite(d))
      return d;

  }

  return 0;
}


function condition(row){

  return(
    row.condition_id ||
    row.conditionId ||
    row.condition ||
    row.market_id ||
    row.market ||
    row.slug ||
    ""
  );
}


function pnl(row){

  const values=[
    row.realized_pnl,
    row.realizedPnl,
    row.pnl,
    row.PNL,
    row.total_pnl
  ];

  for(const v of values){

    const n=Number(v);

    if(Number.isFinite(n))
      return n;

  }

  return 0;
}


function determineOutcome(rows){

  let win=false;
  let loss=false;

  for(const row of rows){

    const s=
      String(row.status || "").toUpperCase();

    if(
      s==="REDEEMABLE" ||
      s==="WIN" ||
      s==="WON"
    ){
      win=true;
    }

    if(
      s==="REDEEMABLE_LOST" ||
      s==="LOSS" ||
      s==="LOST"
    ){
      loss=true;
    }

  }

  if(win && !loss)
    return "WIN";

  if(loss && !win)
    return "LOSS";


  let totalPnl=0;

  for(const row of rows)
    totalPnl+=pnl(row);

  if(totalPnl>0)
    return "WIN";

  if(totalPnl<0)
    return "LOSS";

  return null;
}


async function loadRecord(wallet,start){

  const [
    redeemable,
    redeemableLost,
    closed
  ]=await Promise.all([

    getPositions(wallet,"REDEEMABLE"),

    getPositions(wallet,"REDEEMABLE_LOST"),

    getPositions(wallet,"CLOSED")

  ]);


  const all=[
    ...redeemable,
    ...redeemableLost,
    ...closed
  ];


  const grouped=new Map();


  for(const row of all){

    const id=condition(row);

    if(!id)
      continue;

    const ts=timestamp(row);

    if(ts && ts<start)
      continue;

    if(!grouped.has(id))
      grouped.set(id,[]);

    grouped.get(id).push(row);

  }


  let wins=0;
  let losses=0;


  for(const rows of grouped.values()){

    const result=determineOutcome(rows);

    if(result==="WIN")
      wins++;

    if(result==="LOSS")
      losses++;

  }


  return{
    wins,
    losses,
    total:wins+losses,
    winRate:
      wins+losses
        ? wins/(wins+losses)
        : 0
  };
}


/* =========================================================
   RECORD RANKING
========================================================= */

/*
   Actual record quality first.

   A 50-0 beats 25-0.
   A 33-1 beats 2-0.
   A 518-371 is below a genuinely high-win-rate record.
   A 1015-1314 is nowhere near the top.

   Very tiny samples are prevented from dominating
   the ranking by requiring enough resolved markets
   before the pure win-rate ranking is trusted.
*/

function rankingScore(t){

  const total=t.total;

  /*
     10 resolved markets is the minimum sample
     for the main ranking.

     Below that, the score is intentionally
     discounted so tiny records don't dominate.
  */

  if(total<10){

    return (
      t.winRate *
      (total/10)
    );

  }

  return t.winRate;
}


function sortRecords(a,b){

  const sa=rankingScore(a);
  const sb=rankingScore(b);

  if(sb!==sa)
    return sb-sa;

  /*
     Same quality:
     more wins first.
  */

  if(b.wins!==a.wins)
    return b.wins-a.wins;

  /*
     Then fewer losses.
  */

  if(a.losses!==b.losses)
    return a.losses-b.losses;

  /*
     Then bigger sample.
  */

  return b.total-a.total;
}


/* =========================================================
   ACTIVE POSITIONS
========================================================= */

function activeSize(row){

  const values=[
    row.current_size,
    row.size,
    row.currentSize,
    row.total_size
  ];

  for(const v of values){

    const n=Number(v);

    if(Number.isFinite(n) && n>0)
      return n;

  }

  return 0;
}


function activeCost(row){

  const values=[
    row.entry_cost_usdc,
    row.total_cost_usdc,
    row.amount,
    row.cost
  ];

  for(const v of values){

    const n=Number(v);

    if(Number.isFinite(n) && n>0)
      return n;

  }

  return 0;
}


function marketTitle(row){

  return(
    row.title ||
    row.name ||
    row.question ||
    "Unknown market"
  );
}


function marketCondition(row){

  return(
    row.condition_id ||
    row.conditionId ||
    row.condition ||
    row.market_id ||
    row.slug ||
    ""
  );
}


function marketSide(row){

  return(
    row.outcome ||
    row.side ||
    row.outcome_name ||
    ""
  );
}


function combineActive(rows){

  const map=new Map();

  for(const row of rows){

    /*
       OPEN is the superset according to the
       current Polymarket API.

       We only want the actual row status OPEN.
       This prevents settled/redeemable positions
       from appearing as active.
    */

    const status=
      String(row.status || "").toUpperCase();

    if(status && status!=="OPEN")
      continue;

    if(row.redeemable===true)
      continue;

    if(activeSize(row)<=0)
      continue;

    const id=marketCondition(row);

    if(!id)
      continue;

    if(!map.has(id)){

      map.set(id,{
        condition:id,
        title:marketTitle(row),
        slug:row.slug || "",
        positions:[]
      });

    }

    const market=map.get(id);

    market.positions.push({
      outcome:marketSide(row),
      size:activeSize(row),
      cost:activeCost(row),
      buyTime:null,
      loaded:false
    });

  }


  /*
     Combine duplicate YES/NO rows
     belonging to the same market.
  */

  for(const market of map.values()){

    const sides=new Map();

    for(const p of market.positions){

      const side=
        String(p.outcome || "Unknown");

      if(!sides.has(side)){

        sides.set(side,{
          outcome:side,
          size:0,
          cost:0,
          buyTime:null,
          loaded:false
        });

      }

      const target=sides.get(side);

      target.size+=p.size;
      target.cost+=p.cost;

    }

    market.positions=[...sides.values()];

  }


  return [...map.values()];
}


async function loadActive(wallet){

  /*
     The current API returns up to 1000 rows on
     the first page. For normal wallets that is
     enough, and we also respect the OPEN status
     on each row.
  */

  try{

    const rows=
      await getPositions(wallet,"OPEN");

    return combineActive(rows);

  }catch(e){

    return [];

  }
}


/* =========================================================
   BUY TIME
========================================================= */

async function getBuyTime(wallet,conditionId){

  if(!conditionId)
    return null;

  try{

    const data=await getJSON(
      `/v2/trades`+
      `?user=${encodeURIComponent(wallet)}`+
      `&condition=${encodeURIComponent(conditionId)}`+
      `&limit=500`
    );

    const rows=rowsFrom(data);

    let earliest=null;

    for(const row of rows){

      const side=
        String(
          row.side ||
          row.type ||
          row.action ||
          ""
        ).toUpperCase();

      if(side && !side.includes("BUY"))
        continue;

      const values=[
        row.timestamp,
        row.created_at,
        row.time
      ];

      for(const v of values){

        if(v===undefined || v===null)
          continue;

        const n=Number(v);

        let ts=0;

        if(Number.isFinite(n))
          ts=n<100000000000 ? n*1000 : n;
        else
          ts=Date.parse(v);

        if(ts>0 && (earliest===null || ts<earliest))
          earliest=ts;

      }

    }

    return earliest;

  }catch(e){

    return null;

  }

}


function formatTime(ts){

  if(!ts)
    return "Bought —";

  return "Bought "+
    new Date(ts).toLocaleString(
      undefined,
      {
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );
}


/* =========================================================
   ACTIVE MARKET HTML
========================================================= */

function activeHTML(trader){

  const markets=trader.activeMarkets || [];

  if(!markets.length){

    return `
      <span style="color:#555">
        None
      </span>
    `;

  }


  const id=
    "active_"+trader.wallet
      .replace(/[^a-zA-Z0-9]/g,"");


  return `

    <details
      data-wallet="${escapeHTML(trader.wallet)}"
      data-active-id="${id}"
      ontoggle="toggleActive(this)"
    >

      <summary>
        <span class="activeCount">
          ${markets.length}
        </span>
        active market${markets.length===1?"":"s"}
      </summary>

      <div class="marketList">

        ${markets.map((m,index)=>`

          <div
            class="marketItem"
            data-market-index="${index}"
          >

            <div class="marketTitle">
              ${escapeHTML(m.title)}
            </div>

            <div class="marketMeta">

              ${m.positions.map(p=>`

                <span class="${
                  String(p.outcome).toLowerCase()==="yes"
                    ? "sideYes"
                    : String(p.outcome).toLowerCase()==="no"
                      ? "sideNo"
                      : ""
                }">

                  ${escapeHTML(p.outcome || "Unknown")}

                </span>

                ${p.cost>0
                  ? " · $"+Number(p.cost).toLocaleString(
                      undefined,
                      {
                        minimumFractionDigits:0,
                        maximumFractionDigits:2
                      }
                    )
                  : ""
                }

                &nbsp;

                <span class="buyTime">
                  ${formatTime(p.buyTime)}
                </span>

                <br>

              `).join("")}

            </div>

          </div>

        `).join("")}

      </div>

    </details>

  `;

}


/* =========================================================
   LAZY BUY TIME
========================================================= */

async function toggleActive(details){

  if(!details.open)
    return;

  if(details.dataset.loaded==="yes")
    return;

  details.dataset.loaded="yes";

  const wallet=
    details.dataset.wallet;

  const trader=
    topTraders.find(
      t=>t.wallet.toLowerCase()===wallet.toLowerCase()
    );

  if(!trader)
    return;

  const markets=
    trader.activeMarkets || [];

  const list=
    details.querySelector(".marketList");

  if(!list)
    return;


  list.innerHTML=`

    <div class="loading">
      Loading buy times...
    </div>

  `;


  /*
     Load only the markets the user actually opened.
     This keeps the main scan much faster.
  */

  for(const market of markets){

    const time=
      await getBuyTime(
        trader.wallet,
        market.condition
      );

    for(const position of market.positions)
      position.buyTime=time;

  }


  /*
     Re-render only this dropdown.
  */

  list.innerHTML=
    markets.map((m,index)=>`

      <div class="marketItem">

        <div class="marketTitle">
          ${escapeHTML(m.title)}
        </div>

        <div class="marketMeta">

          ${m.positions.map(p=>`

            <span class="${
              String(p.outcome).toLowerCase()==="yes"
                ? "sideYes"
                : String(p.outcome).toLowerCase()==="no"
                  ? "sideNo"
                  : ""
            }">

              ${escapeHTML(p.outcome || "Unknown")}

            </span>

            ${p.cost>0
              ? " · $"+Number(p.cost).toLocaleString(
                  undefined,
                  {
                    minimumFractionDigits:0,
                    maximumFractionDigits:2
                  }
                )
              : ""
            }

            &nbsp;

            <span class="buyTime">
              ${formatTime(p.buyTime)}
            </span>

            <br>

          `).join("")}

        </div>

      </div>

    `).join("");

}


/* =========================================================
   SHARED MARKETS
========================================================= */

function renderShared(){

  const container=
    document.getElementById("sharedMarkets");

  const markets=new Map();


  /*
     One entry per market.
     One trader per market.
     YES + NO are combined together.
  */

  for(const trader of topTraders){

    for(const market of (trader.activeMarkets || [])){

      if(!market.condition)
        continue;

      if(!markets.has(market.condition)){

        markets.set(
          market.condition,
          {
            title:market.title,
            traders:new Map()
          }
        );

      }

      const shared=
        markets.get(market.condition);


      if(!shared.traders.has(trader.wallet)){

        shared.traders.set(
          trader.wallet,
          {
            name:trader.name,
            wallet:trader.wallet,
            positions:[]
          }
        );

      }


      const traderEntry=
        shared.traders.get(trader.wallet);


      for(const p of market.positions){

        const existing=
          traderEntry.positions.find(
            x=>String(x.outcome).toLowerCase()===
               String(p.outcome).toLowerCase()
          );

        if(existing){

          existing.cost+=p.cost;

        }else{

          traderEntry.positions.push({
            outcome:p.outcome,
            cost:p.cost
          });

        }

      }

    }

  }


  /*
     Only shared markets.
  */

  const sharedMarkets=
    [...markets.values()]
      .filter(m=>m.traders.size>=2);


  if(!sharedMarkets.length){

    container.innerHTML=`
      <div class="empty">
        No shared active markets found among the Top 100.
      </div>
    `;

    return;

  }


  container.innerHTML=`

    <div class="sharedGrid">

      ${sharedMarkets.map(m=>`

        <div class="sharedMarket">

          <div class="sharedTitle">
            ${escapeHTML(m.title)}
          </div>

          <div class="sharedTraders">

            ${[...m.traders.values()].map(t=>`

              <div class="sharedTrader">

                <div class="sharedTraderName">
                  ${escapeHTML(t.name)}
                </div>

                <div class="sharedTraderWallet">
                  ${escapeHTML(t.wallet)}
                </div>

                <div class="sharedPosition">

                  ${t.positions.map(p=>{

                    const side=
                      String(p.outcome || "")
                        .toLowerCase();

                    const cls=
                      side==="yes"
                        ? "yes"
                        : side==="no"
                          ? "no"
                          : "";

                    return `

                      <span class="${cls}">
                        ${escapeHTML(p.outcome)}
                      </span>

                      ${
                        p.cost>0
                          ? " $"+Number(p.cost).toLocaleString(
                              undefined,
                              {
                                minimumFractionDigits:0,
                                maximumFractionDigits:2
                              }
                            )
                          : ""
                      }

                    `;

                  }).join(" · ")}

                </div>

              </div>

            `).join("")}

          </div>

        </div>

      `).join("")}

    </div>

  `;

}


/* =========================================================
   RENDER TOP 100
========================================================= */

function render(rows){

  const tbody=
    document.getElementById("tbody");


  if(!rows.length){

    tbody.innerHTML=`
      <tr>
        <td colspan="5" class="empty">
          No resolved records found.
        </td>
      </tr>
    `;

    return;

  }


  tbody.innerHTML=
    rows.map((t,i)=>{

      const pct=
        (t.winRate*100).toFixed(1);

      return `

        <tr>

          <td class="rank">
            #${i+1}
          </td>

          <td>

            <div class="traderName">
              ${escapeHTML(t.name)}
            </div>

            <div class="wallet">
              ${escapeHTML(t.wallet)}
            </div>

          </td>

          <td class="record ${
            t.winRate>=.55 ? "good" : ""
          }">

            ${t.wins}-${t.losses}

          </td>

          <td class="winrate">
            ${pct}%
          </td>

          <td class="activeCell">

            ${activeHTML(t)}

          </td>

        </tr>

      `;

    }).join("");


  document.getElementById("meta").textContent=
    `${rows.length} best records shown`;

}


/* =========================================================
   SCAN
========================================================= */

async function scan(){

  if(scanning)
    return;

  scanning=true;

  const button=
    document.getElementById("scanBtn");

  button.disabled=true;

  setProgress(0);

  document.getElementById("tbody").innerHTML=`

    <tr>
      <td colspan="5" class="empty">
        Scanning...
      </td>
    </tr>

  `;

  document.getElementById("sharedMarkets").innerHTML=`

    <div class="empty">
      Scanning active markets...
    </div>

  `;


  try{

    const period=
      document.getElementById("period").value;

    const start=
      periodStart(period);


    /* -----------------------------------------
       STEP 1: LARGE CANDIDATE POOL
    ----------------------------------------- */

    setStatus(
      "Finding a large pool of traders..."
    );


    const candidates=
      await getCandidates(period);


    if(!candidates.length)
      throw new Error(
        "No candidates found."
      );


    setStatus(
      `Checking ${candidates.length} traders for records...`
    );


    /* -----------------------------------------
       STEP 2: RECORDS
    ----------------------------------------- */

    const recordResults=
      await runPool(

        candidates,

        async trader=>{

          const record=
            await loadRecord(
              trader.wallet,
              start
            );

          return{
            ...trader,
            ...record
          };

        },

        12,

        (done,total)=>{

          setProgress(
            done/total*75
          );

          setStatus(
            `Checking records: ${done}/${total}`
          );

        }

      );


    /*
       Keep everyone with a real resolved record.
    */

    const valid=
      recordResults
        .filter(Boolean)
        .filter(t=>t.total>0);


    /*
       SORT THE ENTIRE LARGE POOL FIRST.
    */

    valid.sort(sortRecords);


    /*
       THEN take exactly the Top 100.
    */

    topTraders=
      valid.slice(0,100);


    /*
       If fewer than 100 genuinely have resolved
       records in the candidate pool, expand the
       candidate pool further on the next scan.
    */

    if(topTraders.length<100){

      setStatus(
        `Found ${topTraders.length} traders with resolved records. Loading active markets...`
      );

    }else{

      setStatus(
        "Top 100 records found. Loading active markets..."
      );

    }


    /* -----------------------------------------
       STEP 3: ACTIVE MARKETS FOR TOP 100 ONLY
    ----------------------------------------- */

    const withActive=
      await runPool(

        topTraders,

        async trader=>{

          trader.activeMarkets=
            await loadActive(trader.wallet);

          return trader;

        },

        12,

        (done,total)=>{

          setProgress(
            75+(done/total*25)
          );

          setStatus(
            `Loading active markets: ${done}/${total}`
          );

        }

      );


    topTraders=
      withActive.filter(Boolean);


    /*
       Re-sort by record only.
       Active markets DO NOT change record ranking.
    */

    topTraders.sort(sortRecords);


    render(topTraders);

    renderShared();


    const activeCount=
      topTraders.reduce(
        (sum,t)=>
          sum+(t.activeMarkets?.length || 0),
        0
      );


    const sharedCount=
      countSharedMarkets();


    setProgress(100);

    setStatus(
      `Finished — ${topTraders.length} best records, ${activeCount} active markets, ${sharedCount} shared markets.`,
      "good"
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Scan failed. Try again.",
      "bad"
    );

  }finally{

    scanning=false;
    button.disabled=false;

  }

}


/* =========================================================
   POOL
========================================================= */

async function runPool(
  items,
  worker,
  concurrency,
  progressCallback
){

  const results=
    new Array(items.length);

  let next=0;
  let done=0;


  async function runner(){

    while(true){

      const index=next++;

      if(index>=items.length)
        return;


      try{

        results[index]=
          await worker(items[index],index);

      }catch(e){

        results[index]=null;

      }


      done++;


      if(progressCallback)
        progressCallback(
          done,
          items.length
        );

    }

  }


  const workers=[];


  for(
    let i=0;
    i<Math.min(concurrency,items.length);
    i++
  ){

    workers.push(
      runner()
    );

  }


  await Promise.all(workers);


  return results;

}


/* =========================================================
   SHARED COUNT
========================================================= */

function countSharedMarkets(){

  const map=new Map();


  for(const trader of topTraders){

    for(const market of (trader.activeMarkets || [])){

      if(!market.condition)
        continue;

      if(!map.has(market.condition))
        map.set(
          market.condition,
          new Set()
        );

      map.get(market.condition)
        .add(trader.wallet);

    }

  }


  let count=0;


  for(const wallets of map.values()){

    if(wallets.size>=2)
      count++;

  }


  return count;

}
