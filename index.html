<script>
const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

let traders = [];
let marketMap = new Map();
let traderDetailsCache = new Map();

const statusEl = document.getElementById("status");
const tradersEl = document.getElementById("traders");
const marketsEl = document.getElementById("markets");

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function money(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "$0";

  return n.toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 2
  });
}

function number(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "0";

  return n.toLocaleString("en-US", {
    maximumFractionDigits: 2
  });
}

function price(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "—";
  return "$" + n.toFixed(3);
}

function shortWallet(wallet) {
  if (!wallet) return "";

  if (wallet.length < 15) return wallet;

  return (
    wallet.slice(0, 8) +
    "..." +
    wallet.slice(-6)
  );
}

function getWallet(trader) {
  return (
    trader.proxyWallet ||
    trader.proxy_wallet ||
    trader.wallet ||
    trader.address ||
    ""
  );
}

function getName(trader) {
  return (
    trader.userName ||
    trader.user_name ||
    trader.username ||
    trader.name ||
    shortWallet(getWallet(trader))
  );
}

function getPnl(trader) {
  return Number(
    trader.pnl ??
    trader.PNL ??
    0
  );
}

function getVolume(trader) {
  return Number(
    trader.vol ??
    trader.volume ??
    0
  );
}

function pnlClass(value) {
  const n = Number(value);

  if (n > 0) return "positive";
  if (n < 0) return "negative";

  return "neutral";
}

function formatTime(timestamp) {
  if (
    timestamp === null ||
    timestamp === undefined ||
    timestamp === ""
  ) {
    return "Unknown";
  }

  let date;

  const n = Number(timestamp);

  if (Number.isFinite(n)) {
    date = new Date(
      n < 10000000000
        ? n * 1000
        : n
    );
  } else {
    date = new Date(timestamp);
  }

  if (Number.isNaN(date.getTime())) {
    return "Unknown";
  }

  return date.toLocaleString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );
}

function formatDate(timestamp) {
  if (!timestamp) return "Unknown";

  let date;
  const n = Number(timestamp);

  if (Number.isFinite(n)) {
    date = new Date(
      n < 10000000000
        ? n * 1000
        : n
    );
  } else {
    date = new Date(timestamp);
  }

  if (Number.isNaN(date.getTime())) {
    return "Unknown";
  }

  return date.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric"
    }
  );
}

function setStatus(message, type = "") {
  statusEl.className = "status";

  if (type === "error") {
    statusEl.classList.add("error");
  }

  if (type === "success") {
    statusEl.classList.add("success");
  }

  statusEl.textContent = message;
}

async function api(path) {
  const response =
    await fetch(
      WORKER + path,
      {
        method: "GET",
        headers: {
          Accept: "application/json"
        }
      }
    );

  const text =
    await response.text();

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}: ${text}`
    );
  }

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "Worker returned invalid JSON"
    );
  }

  if (
    data &&
    data.error
  ) {
    throw new Error(
      data.message ||
      data.error
    );
  }

  return data;
}

/* =========================================================
   SCAN
========================================================= */

async function scanTop100() {
  setStatus(
    "Loading Top 100...",
    "loading"
  );

  traders = [];
  marketMap = new Map();
  traderDetailsCache = new Map();

  tradersEl.innerHTML =
    `<div class="empty">Loading traders...</div>`;

  marketsEl.innerHTML =
    `<div class="empty">Loading active markets...</div>`;

  try {
    const data =
      await api(
        "/top100?period=WEEK&orderBy=PNL"
      );

    if (!Array.isArray(data)) {
      throw new Error(
        "Worker did not return a Top 100 array."
      );
    }

    traders =
      data.slice(0, 100)
        .map((trader, index) => ({
          ...trader,
          displayRank:
            Number(trader.rank) ||
            index + 1
        }));

    if (!traders.length) {
      throw new Error(
        "No traders were returned."
      );
    }

    renderTraders();

    setStatus(
      `Loaded ${traders.length} traders. Loading active positions...`,
      "loading"
    );

    await buildActiveMarkets();

    setStatus(
      `Loaded ${traders.length} traders and active markets.`,
      "success"
    );

  } catch (error) {
    console.error(error);

    setStatus(
      "Scan failed: " +
      error.message,
      "error"
    );

    tradersEl.innerHTML =
      `<div class="status error">
        ${escapeHTML(error.message)}
      </div>`;
  }
}

/* =========================================================
   TRADER TABLE
========================================================= */

function renderTraders() {
  const search =
    document
      .getElementById("traderSearch")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    traders.filter(trader => {
      const name =
        getName(trader)
          .toLowerCase();

      const wallet =
        getWallet(trader)
          .toLowerCase();

      return (
        !search ||
        name.includes(search) ||
        wallet.includes(search)
      );
    });

  if (!filtered.length) {
    tradersEl.innerHTML =
      `<div class="empty">
        No traders found.
      </div>`;

    return;
  }

  tradersEl.innerHTML =
    filtered.map(trader => {
      const wallet =
        getWallet(trader);

      const pnl =
        getPnl(trader);

      const volume =
        getVolume(trader);

      const cached =
        traderDetailsCache.get(
          wallet.toLowerCase()
        );

      let winHTML =
        `<span class="muted">
          Loading...
        </span>`;

      if (cached) {
        const wins =
          cached.wins;

        const losses =
          cached.losses;

        const resolved =
          cached.resolved;

        const winPct =
          cached.winPct;

        if (!resolved) {
          winHTML =
            `<span class="muted">
              No resolved trades
            </span>`;
        } else {
          winHTML =
            `<span>
              ${Number(winPct).toFixed(1)}%
            </span>
            <span class="win-detail">
              ${wins}W / ${losses}L
            </span>`;
        }
      }

      return `
        <div
          class="row trader-row"
          data-wallet="${escapeHTML(wallet)}"
        >
          <div class="rank">
            #${escapeHTML(
              trader.displayRank
            )}
          </div>

          <div>
            <div class="trader-name">
              ${escapeHTML(
                getName(trader)
              )}
            </div>

            <span class="wallet">
              ${escapeHTML(
                shortWallet(wallet)
              )}
            </span>
          </div>

          <div class="${pnlClass(pnl)}">
            ${money(pnl)}
          </div>

          <div>
            ${money(volume)}
          </div>

          <div class="win-box">
            ${winHTML}
          </div>
        </div>

        <div
          class="details"
          id="${detailId(wallet)}"
        ></div>
      `;
    }).join("");

  document
    .querySelectorAll(
      ".trader-row"
    )
    .forEach(row => {
      row.addEventListener(
        "click",
        () => {
          toggleTrader(
            row.dataset.wallet
          );
        }
      );
    });
}

function detailId(wallet) {
  return (
    "details-" +
    btoa(wallet)
      .replaceAll("=", "")
      .replaceAll("/", "_")
      .replaceAll("+", "-")
  );
}

/* =========================================================
   TRADER DETAILS
========================================================= */

async function toggleTrader(wallet) {
  const details =
    document.getElementById(
      detailId(wallet)
    );

  if (!details) return;

  if (
    details.classList.contains(
      "open"
    )
  ) {
    details.classList.remove(
      "open"
    );
    return;
  }

  details.classList.add(
    "open"
  );

  if (
    details.dataset.loaded ===
    "true"
  ) {
    return;
  }

  details.innerHTML =
    `<div class="loading">
      Loading trader data...
    </div>`;

  try {
    const data =
      await api(
        `/trader?user=${encodeURIComponent(
          wallet
        )}&period=WEEK`
      );

    details.dataset.loaded =
      "true";

    const cache =
      buildStatsCache(
        data.stats
      );

    traderDetailsCache.set(
      wallet.toLowerCase(),
      cache
    );

    renderTraders();

    /*
      Re-open the details because
      renderTraders rebuilds the table.
    */
    const newDetails =
      document.getElementById(
        detailId(wallet)
      );

    if (newDetails) {
      newDetails.classList.add(
        "open"
      );

      newDetails.dataset.loaded =
        "true";

      renderTraderDetails(
        newDetails,
        data
      );
    }

  } catch (error) {
    console.error(
      "Trader detail error:",
      error
    );

    details.innerHTML =
      `<div class="status error">
        Could not load trader data:
        ${escapeHTML(
          error.message
        )}
      </div>`;
  }
}

function buildStatsCache(stats) {
  if (!stats) {
    return {
      wins: 0,
      losses: 0,
      resolved: 0,
      winPct: null
    };
  }

  return {
    wins:
      Number(stats.wins || 0),

    losses:
      Number(stats.losses || 0),

    resolved:
      Number(
        stats.resolved || 0
      ),

    winPct:
      stats.winPct === null ||
      stats.winPct === undefined
        ? null
        : Number(stats.winPct)
  };
}

function renderTraderDetails(
  container,
  data
) {
  const stats =
    data.stats || {};

  const active =
    Array.isArray(
      data.activePositions
    )
      ? data.activePositions
      : [];

  const closed =
    Array.isArray(
      data.closedPositions
    )
      ? data.closedPositions
      : [];

  const wins =
    Number(stats.wins || 0);

  const losses =
    Number(stats.losses || 0);

  const resolved =
    Number(stats.resolved || 0);

  const winPct =
    stats.winPct === null ||
    stats.winPct === undefined
      ? null
      : Number(stats.winPct);

  const activeHTML =
    renderActivePositions(
      active
    );

  const closedHTML =
    renderClosedPositions(
      closed
    );

  container.innerHTML = `
    <div class="detail-title">
      Trader Activity
    </div>

    <div class="detail-wallet">
      ${escapeHTML(
        data.user || ""
      )}
    </div>

    <div class="detail-stats">

      <div class="stat">
        <div class="stat-label">
          Wins
        </div>
        <div class="stat-value positive">
          ${wins}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Losses
        </div>
        <div class="stat-value negative">
          ${losses}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Win %
        </div>
        <div class="stat-value">
          ${
            winPct === null
              ? "—"
              : Number(
                  winPct
                ).toFixed(1) + "%"
          }
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Record
        </div>
        <div class="stat-value">
          ${wins}-${losses}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Resolved
        </div>
        <div class="stat-value">
          ${resolved}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Active
        </div>
        <div class="stat-value">
          ${active.length}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Period P&L
        </div>
        <div class="stat-value ${pnlClass(
          stats.pnl
        )}">
          ${money(stats.pnl)}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Volume
        </div>
        <div class="stat-value">
          ${money(stats.volume)}
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          ROI
        </div>
        <div class="stat-value">
          ${
            stats.roi === null ||
            stats.roi === undefined
              ? "—"
              : Number(
                  stats.roi
                ).toFixed(2) + "%"
          }
        </div>
      </div>

    </div>

    <div>
      <strong>
        Active Positions
      </strong>

      ${activeHTML}
    </div>

    <br>

    <div>
      <strong>
        Closed Positions
      </strong>

      ${closedHTML}
    </div>
  `;
}

/* =========================================================
   ACTIVE POSITIONS
========================================================= */

function renderActivePositions(
  positions
) {
  if (!positions.length) {
    return `
      <div class="empty">
        No active positions.
      </div>
    `;
  }

  return positions
    .map(position => {
      const title =
        position.title ||
        position.question ||
        position.market ||
        "Unknown market";

      const outcome =
        position.outcome ||
        position.position ||
        "Unknown";

      const shares =
        Number(
          position.shares ??
          position.current_size ??
          position.size ??
          0
        );

      const entryPrice =
        Number(
          position.entryPrice ??
          position.avg_price ??
          0
        );

      const currentPrice =
        Number(
          position.currentPrice ??
          position.current_price ??
          0
        );

      const entryCost =
        Number(
          position.entryCost ??
          position.entry_cost_usdc ??
          0
        );

      const currentValue =
        Number(
          position.currentValue ??
          position.current_value ??
          0
        );

      const unrealized =
        Number(
          position.unrealizedPnl ??
          position.unrealized_pnl ??
          (
            currentValue -
            entryCost
          )
        );

      const bought =
        position.purchaseTimestamp ||
        null;

      return `
        <div class="trade">

          <div class="trade-top">

            <div>
              <div class="trade-title">
                ${escapeHTML(title)}
              </div>

              <div class="trade-meta">
                Position:
                <strong>
                  ${escapeHTML(
                    outcome
                  )}
                </strong>
              </div>
            </div>

            <div class="small">
              Bought:
              ${formatTime(bought)}
            </div>

          </div>

          <div class="trade-meta">

            Shares:
            <strong>
              ${number(shares)}
            </strong>

            &nbsp; • &nbsp;

            Entry:
            <strong>
              ${price(entryPrice)}
            </strong>

            &nbsp; • &nbsp;

            Current:
            <strong>
              ${price(currentPrice)}
            </strong>

          </div>

          <div class="trade-meta">

            Invested:
            <strong>
              ${money(entryCost)}
            </strong>

            &nbsp; • &nbsp;

            Current value:
            <strong>
              ${money(currentValue)}
            </strong>

          </div>

          <div class="trade-meta">

            Total unrealized P&L:
            <strong
              class="${pnlClass(
                unrealized
              )}"
            >
              ${money(unrealized)}
            </strong>

          </div>

        </div>
      `;
    })
    .join("");
}

/* =========================================================
   CLOSED POSITIONS
========================================================= */

function renderClosedPositions(
  positions
) {
  if (!positions.length) {
    return `
      <div class="empty">
        No resolved positions in this period.
      </div>
    `;
  }

  return positions
    .slice(0, 100)
    .map(position => {
      const title =
        position.title ||
        position.question ||
        position.market ||
        "Unknown market";

      const outcome =
        position.outcome ||
        "Unknown";

      const pnl =
        Number(
          position.realized_pnl ??
          0
        );

      const cost =
        Number(
          position.entry_cost_usdc ??
          0
        );

      return `
        <div class="trade">

          <div class="trade-title">
            ${escapeHTML(title)}
          </div>

          <div class="trade-meta">

            Outcome:
            <strong>
              ${escapeHTML(
                outcome
              )}
            </strong>

            &nbsp; • &nbsp;

            Entry cost:
            <strong>
              ${money(cost)}
            </strong>

            &nbsp; • &nbsp;

            Realized P&L:
            <strong
              class="${pnlClass(
                pnl
              )}"
            >
              ${money(pnl)}
            </strong>

          </div>

          <div class="trade-meta">

            Closed:
            ${formatTime(
              position.last_event_at ||
              position.timestamp
            )}

          </div>

        </div>
      `;
    })
    .join("");
}

/* =========================================================
   ACTIVE MARKETS
========================================================= */

async function buildActiveMarkets() {
  marketMap =
    new Map();

  /*
    Process 10 wallets at a time.
    The Worker itself handles the v2 cursor pagination.
  */

  const batchSize = 10;

  for (
    let i = 0;
    i < traders.length;
    i += batchSize
  ) {
    const batch =
      traders.slice(
        i,
        i + batchSize
      );

    await Promise.all(
      batch.map(
        async trader => {
          const wallet =
            getWallet(trader);

          if (!wallet) return;

          try {
            const positions =
              await api(
                `/positions?user=${encodeURIComponent(
                  wallet
                )}`
              );

            if (
              !Array.isArray(
                positions
              )
            ) {
              return;
            }

            positions.forEach(
              position => {
                addPosition(
                  position,
                  trader
                );
              }
            );

          } catch (error) {
            console.warn(
              "Position error:",
              wallet,
              error
            );
          }
        }
      )
    );

    renderMarkets();

    setStatus(
      `Scanning active positions: ${
        Math.min(
          i + batchSize,
          traders.length
        )
      } / ${traders.length} wallets...`,
      "loading"
    );
  }

  renderMarkets();
}

function addPosition(
  position,
  trader
) {
  /*
    Use conditionId/tokenId as
    the market identity.
  */

  const marketId =
    position.conditionId ||
    position.condition_id ||
    position.market ||
    position.eventId ||
    position.title;

  if (!marketId) return;

  const title =
    position.title ||
    position.question ||
    position.marketTitle ||
    position.market ||
    "Unknown market";

  /*
    CRITICAL:
    Use the actual outcome.
    Do NOT convert every outcome
    into YES.
  */

  const outcome =
    position.outcome ||
    position.position ||
    position.side ||
    "Unknown";

  const key =
    String(marketId);

  if (!marketMap.has(key)) {
    marketMap.set(
      key,
      {
        id: key,
        title,
        positions: []
      }
    );
  }

  const market =
    marketMap.get(key);

  const wallet =
    getWallet(trader);

  const shares =
    Number(
      position.current_size ??
      position.size ??
      0
    );

  const entryCost =
    Number(
      position.entryCost ??
      position.entry_cost_usdc ??
      0
    );

  const currentValue =
    Number(
      position.currentValue ??
      position.current_value ??
      0
    );

  const unrealized =
    Number(
      position.unrealizedPnl ??
      position.unrealized_pnl ??
      (
        currentValue -
        entryCost
      )
    );

  /*
    Market volume here means how much
    this wallet has put into this
    specific position.
  */

  const volume =
    entryCost > 0
      ? entryCost
      : currentValue;

  market.positions.push({
    wallet,

    rank:
      Number(
        trader.displayRank ||
        trader.rank ||
        0
      ),

    trader:
      getName(trader),

    outcome,

    shares,

    volume,

    entryPrice:
      Number(
        position.entryPrice ??
        position.avg_price ??
        0
      ),

    currentPrice:
      Number(
        position.currentPrice ??
        position.current_price ??
        0
      ),

    currentValue,

    unrealizedPnl:
      unrealized,

    purchaseTimestamp:
      position.purchaseTimestamp ||
      null
  });
}

/* =========================================================
   MARKET RENDER
========================================================= */

function renderMarkets() {
  const search =
    document
      .getElementById(
        "marketSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const minWallets =
    Number(
      document
        .getElementById(
          "marketFilter"
        )
        .value
    );

  const markets =
    [...marketMap.values()]
      .filter(market => {
        const wallets =
          new Set(
            market.positions.map(
              p => p.wallet
            )
          );

        const matchesSearch =
          !search ||
          market.title
            .toLowerCase()
            .includes(search);

        return (
          wallets.size >=
            minWallets &&
          matchesSearch
        );
      })
      .sort(
        (a, b) => {
          const aCount =
            new Set(
              a.positions.map(
                p => p.wallet
              )
            ).size;

          const bCount =
            new Set(
              b.positions.map(
                p => p.wallet
              )
            ).size;

          return bCount - aCount;
        }
      );

  if (!markets.length) {
    marketsEl.innerHTML =
      `<div class="empty">
        No active markets found.
      </div>`;

    return;
  }

  marketsEl.innerHTML =
    markets
      .map(
        (market, index) => {
          const wallets =
            new Set(
              market.positions.map(
                p => p.wallet
              )
            ).size;

          const totalVolume =
            market.positions.reduce(
              (
                total,
                position
              ) =>
                total +
                Number(
                  position.volume ||
                  0
                ),
              0
            );

          /*
            For YES/NO markets we can
            show consensus.

            For sports/team markets,
            show the actual outcomes
            instead.
          */

          const outcomeGroups =
            groupOutcomes(
              market.positions
            );

          const consensusHTML =
            renderConsensus(
              outcomeGroups
            );

          return `
            <div
              class="active-market"
              data-market-index="${index}"
            >

              <div class="market-main">

                <div class="market-name">
                  ${escapeHTML(
                    market.title
                  )}
                </div>

                <div class="market-count">
                  ${wallets} wallets
                </div>

                <div class="market-consensus">
                  ${consensusHTML}
                </div>

                <div class="market-value">
                  ${money(
                    totalVolume
                  )}
                </div>

              </div>

              <div
                class="market-details"
                id="market-details-${index}"
              >
                ${renderMarketPositions(
                  market.positions
                )}
              </div>

            </div>
          `;
        }
      )
      .join("");

  document
    .querySelectorAll(
      ".active-market"
    )
    .forEach(row => {
      row.addEventListener(
        "click",
        () => {
          const index =
            row.dataset.marketIndex;

          const details =
            document.getElementById(
              `market-details-${index}`
            );

          if (details) {
            details.classList.toggle(
              "open"
            );
          }
        }
      );
    });
}

/* =========================================================
   OUTCOME GROUPING
========================================================= */

function groupOutcomes(
  positions
) {
  const groups =
    new Map();

  positions.forEach(
    position => {
      const outcome =
        String(
          position.outcome ||
          "Unknown"
        ).trim();

      const key =
        outcome.toLowerCase();

      if (!groups.has(key)) {
        groups.set(
          key,
          {
            label: outcome,
            count: 0
          }
        );
      }

      groups.get(key).count++;
    }
  );

  return [
    ...groups.values()
  ];
}

function renderConsensus(
  groups
) {
  if (!groups.length) {
    return `
      <span class="muted">
        No outcome data
      </span>
    `;
  }

  const total =
    groups.reduce(
      (sum, group) =>
        sum + group.count,
      0
    );

  return groups
    .map(group => {
      const pct =
        total > 0
          ? (
              group.count /
              total *
              100
            ).toFixed(0)
          : 0;

      const cls =
        outcomeClass(
          group.label
        );

      return `
        <span class="${cls}">
          ${escapeHTML(
            group.label
          )} ${pct}%
        </span>
      `;
    })
    .join(
      " &nbsp;/&nbsp; "
    );
}

/* =========================================================
   MARKET POSITIONS
========================================================= */

function renderMarketPositions(
  positions
) {
  if (!positions.length) {
    return `
      <div class="empty">
        No positions returned.
      </div>
    `;
  }

  return positions
    .sort(
      (a, b) =>
        a.rank - b.rank
    )
    .map(position => {
      const cache =
        traderDetailsCache.get(
          position.wallet
            .toLowerCase()
        );

      const record =
        cache &&
        cache.resolved > 0
          ? `${cache.wins}-${cache.losses}`
          : "Record unavailable";

      return `
        <div class="wallet-position">

          <div>
            #${escapeHTML(
              position.rank
            )}
          </div>

          <div>
            <strong>
              ${escapeHTML(
                position.trader
              )}
            </strong>

            <span class="wallet">
              ${escapeHTML(
                shortWallet(
                  position.wallet
                )
              )}
            </span>

            <span class="small">
              Record:
              ${escapeHTML(
                record
              )}
            </span>
          </div>

          <div class="${outcomeClass(
            position.outcome
          )}">
            ${escapeHTML(
              position.outcome ||
              "Unknown"
            )}
          </div>

          <div>
            ${number(
              position.shares
            )}
            shares
          </div>

          <div>
            ${money(
              position.volume
            )}
          </div>

        </div>

        <div
          class="trade"
          style="margin-left:20px;"
        >

          <div class="trade-meta">

            Bought:
            <strong>
              ${formatTime(
                position.purchaseTimestamp
              )}
            </strong>

            &nbsp; • &nbsp;

            Entry:
            <strong>
              ${price(
                position.entryPrice
              )}
            </strong>

            &nbsp; • &nbsp;

            Current:
            <strong>
              ${price(
                position.currentPrice
              )}
            </strong>

          </div>

          <div class="trade-meta">

            Position value:
            <strong>
              ${money(
                position.currentValue
              )}
            </strong>

            &nbsp; • &nbsp;

            Unrealized P&L:
            <strong
              class="${pnlClass(
                position.unrealizedPnl
              )}"
            >
              ${money(
                position.unrealizedPnl
              )}
            </strong>

          </div>

        </div>
      `;
    })
    .join("");
}

/* =========================================================
   TEAM / OUTCOME COLORS
========================================================= */

function outcomeClass(
  outcome
) {
  const value =
    String(
      outcome || ""
    )
      .trim()
      .toLowerCase();

  /*
    YES / NO
  */

  if (value === "yes") {
    return "team-green";
  }

  if (value === "no") {
    return "team-red";
  }

  /*
    NFL
  */

  if (
    value.includes("packers") ||
    value.includes("green bay")
  ) {
    return "team-green";
  }

  if (
    value.includes("falcons") ||
    value.includes("49ers") ||
    value.includes("chiefs") ||
    value.includes("buccaneers")
  ) {
    return "team-red";
  }

  /*
    MLB
  */

  if (
    value.includes("mariners")
  ) {
    return "team-blue";
  }

  if (
    value.includes("yankees") ||
    value.includes("dodgers")
  ) {
    return "team-blue";
  }

  /*
    NBA / NHL / general
  */

  if (
    value.includes("lakers") ||
    value.includes("celtics") ||
    value.includes("knicks") ||
    value.includes("jets") ||
    value.includes("lions") ||
    value.includes("steelers") ||
    value.includes("chargers")
  ) {
    return "team-blue";
  }

  return "team-neutral";
}
