<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: min(1400px, 94%);
  margin: 0 auto;
  padding: 28px 0 60px;
}

h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

.subtitle {
  color: #888;
  margin-bottom: 25px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

select,
button {
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
}

button {
  cursor: pointer;
}

button:hover {
  background: #1c1c1c;
}

button.primary {
  background: #fff;
  color: #000;
  border-color: #fff;
  font-weight: 700;
}

.status {
  background: #0b0b0b;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 13px 15px;
  margin-bottom: 25px;
  color: #aaa;
}

.status strong {
  color: #fff;
}

.section {
  margin-top: 30px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.section-title h2 {
  margin: 0;
  font-size: 21px;
}

.count {
  color: #777;
  font-size: 13px;
}

.table-wrap {
  overflow-x: auto;
  background: #080808;
  border: 1px solid #222;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th {
  text-align: left;
  color: #777;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 12px;
  border-bottom: 1px solid #222;
}

td {
  padding: 13px 12px;
  border-bottom: 1px solid #161616;
  font-size: 14px;
}

tr:last-child td {
  border-bottom: 0;
}

tr:hover td {
  background: #0d0d0d;
}

.rank {
  color: #777;
  width: 55px;
}

.name {
  font-weight: 700;
}

.good {
  color: #63e68b;
}

.bad {
  color: #ff6464;
}

.neutral {
  color: #bbb;
}

.ratio {
  font-weight: 700;
}

.market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 12px;
}

.market {
  background: #080808;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 16px;
}

.market-title {
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 10px;
}

.market-meta {
  color: #777;
  font-size: 12px;
  margin-bottom: 14px;
}

.side {
  display: inline-block;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 10px;
}

.holders {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.holder {
  background: #101010;
  border-radius: 7px;
  padding: 9px 10px;
  font-size: 13px;
}

.holder-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.holder-name {
  font-weight: 700;
}

.holder-record {
  color: #999;
}

.holder-bottom {
  margin-top: 5px;
  color: #777;
  font-size: 12px;
}

.empty {
  background: #080808;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 25px;
  color: #777;
  text-align: center;
}

.error {
  color: #ff6464;
}

.loading {
  color: #aaa;
}

@media(max-width:700px) {
  .container {
    width: 95%;
    padding-top: 20px;
  }

  h1 {
    font-size: 25px;
  }

  .market-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Polymarket Scanner</h1>
  <div class="subtitle">
    Top traders by win/loss performance and shared active positions
  </div>

  <div class="controls">
    <select id="period">
      <option value="week">Week</option>
      <option value="month">Month</option>
      <option value="3month">3 Months</option>
    </select>

    <select id="threshold">
      <option value="1">1+ Traders</option>
      <option value="2" selected>2+ Traders</option>
      <option value="5">5+ Traders</option>
      <option value="10">10+ Traders</option>
    </select>

    <button class="primary" id="scanBtn">Scan</button>
  </div>

  <div class="status" id="status">
    <strong>Status:</strong> Ready
  </div>

  <div class="section">

    <div class="section-title">
      <h2>Top 100 Traders</h2>
      <div class="count" id="traderCount">0 traders</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Trader</th>
            <th>Wins</th>
            <th>Losses</th>
            <th>W/L</th>
            <th>P&L</th>
          </tr>
        </thead>

        <tbody id="traderBody">
          <tr>
            <td colspan="6" class="neutral">
              Click Scan to begin.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      <h2>Shared Active Markets</h2>
      <div class="count" id="marketCount">0 markets</div>
    </div>

    <div id="markets" class="market-grid">
      <div class="empty">
        Run a scan to find active markets.
      </div>
    </div>

  </div>

</div>

<script>

const WORKER =
  "https://polymarket-proxy.rowanmcbride.workers.dev";

const $ = id => document.getElementById(id);

const statusEl = $("status");
const traderBody = $("traderBody");
const traderCount = $("traderCount");
const marketCount = $("marketCount");
const marketsEl = $("markets");
const scanBtn = $("scanBtn");

function setStatus(message, error = false) {
  statusEl.innerHTML =
    '<strong>Status:</strong> ' +
    (error ? '<span class="error">' : '') +
    escapeHtml(message) +
    (error ? '</span>' : '');
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function number(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function money(value) {
  const n = number(value);

  if (Math.abs(n) >= 1000000) {
    return "$" + (n / 1000000).toFixed(2) + "M";
  }

  if (Math.abs(n) >= 1000) {
    return "$" + (n / 1000).toFixed(1) + "K";
  }

  return "$" + n.toFixed(2);
}

function ratio(wins, losses) {
  wins = number(wins);
  losses = number(losses);

  if (losses === 0 && wins > 0) return "∞";
  if (wins === 0 && losses === 0) return "—";

  return (wins / losses).toFixed(2);
}

function recordClass(wins, losses) {
  if (number(losses) === 0) return "good";
  if (number(wins) > number(losses)) return "good";
  if (number(wins) < number(losses)) return "bad";
  return "neutral";
}

function normalizeTrader(t) {
  return {
    rank: t.rank ?? t.position ?? 0,

    name:
      t.userName ??
      t.username ??
      t.name ??
      t.displayName ??
      "Unknown Trader",

    wins:
      t.wins ??
      t.win ??
      t.wins_count ??
      t.resolvedWins ??
      0,

    losses:
      t.losses ??
      t.loss ??
      t.losses_count ??
      t.resolvedLosses ??
      0,

    pnl:
      t.pnl ??
      t.profit ??
      t.PNL ??
      t.total_pnl ??
      0,

    wallet:
      t.proxyWallet ??
      t.wallet ??
      t.address ??
      ""
  };
}

function renderTraders(data) {

  let traders = [];

  if (Array.isArray(data)) {
    traders = data;
  } else if (Array.isArray(data.traders)) {
    traders = data.traders;
  } else if (Array.isArray(data.leaderboard)) {
    traders = data.leaderboard;
  } else if (Array.isArray(data.data)) {
    traders = data.data;
  }

  traders = traders
    .map(normalizeTrader)
    .sort((a, b) => {

      const aw = number(a.wins);
      const al = number(a.losses);
      const bw = number(b.wins);
      const bl = number(b.losses);

      const ar =
        al === 0
          ? (aw > 0 ? Infinity : 0)
          : aw / al;

      const br =
        bl === 0
          ? (bw > 0 ? Infinity : 0)
          : bw / bl;

      if (br !== ar) return br - ar;

      return bw - aw;
    })
    .slice(0, 100);

  traderCount.textContent =
    traders.length + " traders";

  if (!traders.length) {
    traderBody.innerHTML = `
      <tr>
        <td colspan="6" class="neutral">
          No trader data returned.
        </td>
      </tr>
    `;
    return;
  }

  traderBody.innerHTML = traders.map((t, i) => {

    const cls = recordClass(t.wins, t.losses);

    return `
      <tr>
        <td class="rank">${i + 1}</td>

        <td class="name">
          ${escapeHtml(t.name)}
        </td>

        <td class="${cls}">
          ${number(t.wins)}
        </td>

        <td class="${number(t.losses) > 0 ? "bad" : "good"}">
          ${number(t.losses)}
        </td>

        <td class="ratio ${cls}">
          ${ratio(t.wins, t.losses)}
        </td>

        <td class="${number(t.pnl) >= 0 ? "good" : "bad"}">
          ${money(t.pnl)}
        </td>
      </tr>
    `;

  }).join("");
}

function normalizeHolder(h) {

  return {
    name:
      h.userName ??
      h.username ??
      h.name ??
      h.trader ??
      "Unknown Trader",

    side:
      h.side ??
      h.outcome ??
      h.position ??
      "Unknown",

    volume:
      h.volume ??
      h.size ??
      h.amount ??
      h.totalValue ??
      h.currentValue ??
      0,

    bought:
      h.buyTime ??
      h.boughtAt ??
      h.firstBuy ??
      h.first_seen ??
      h.timestamp ??
      h.last_event_at ??
      "",

    wins:
      h.wins ??
      h.weekWins ??
      0,

    losses:
      h.losses ??
      h.weekLosses ??
      0
  };
}

function formatTime(value) {

  if (!value) return "Unknown";

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleString();
}

function renderMarkets(data) {

  let markets = [];

  if (Array.isArray(data)) {
    markets = data;
  } else if (Array.isArray(data.markets)) {
    markets = data.markets;
  } else if (Array.isArray(data.sharedMarkets)) {
    markets = data.sharedMarkets;
  } else if (Array.isArray(data.data)) {
    markets = data.data;
  }

  marketCount.textContent =
    markets.length + " markets";

  if (!markets.length) {
    marketsEl.innerHTML = `
      <div class="empty">
        No matching shared active markets found.
      </div>
    `;
    return;
  }

  marketsEl.innerHTML = markets.map(m => {

    const title =
      m.title ??
      m.question ??
      m.market ??
      "Unknown Market";

    const side =
      m.side ??
      m.outcome ??
      "Unknown";

    let holders =
      Array.isArray(m.holders)
        ? m.holders
        : Array.isArray(m.traders)
          ? m.traders
          : [];

    holders = holders.map(normalizeHolder);

    const traderCount =
      m.traderCount ??
      m.count ??
      holders.length;

    return `
      <div class="market">

        <div class="market-title">
          ${escapeHtml(title)}
        </div>

        <div class="market-meta">
          ${traderCount} tracked trader${traderCount === 1 ? "" : "s"}
        </div>

        <div class="side">
          ${escapeHtml(side)}
        </div>

        <div class="holders">

          ${
            holders.length
              ? holders.map(h => `
                <div class="holder">

                  <div class="holder-top">

                    <span class="holder-name">
                      ${escapeHtml(h.name)}
                    </span>

                    <span class="holder-record">
                      ${number(h.wins)}-${number(h.losses)}
                    </span>

                  </div>

                  <div class="holder-bottom">
                    Bought:
                    ${escapeHtml(formatTime(h.bought))}
                    &nbsp; • &nbsp;
                    Volume:
                    ${escapeHtml(money(h.volume))}
                  </div>

                </div>
              `).join("")
              : `
                <div class="holder">
                  No holder details returned.
                </div>
              `
          }

        </div>

      </div>
    `;

  }).join("");
}

async function getJSON(url) {

  const response = await fetch(url, {
    method: "GET",
    headers: {
      "Accept": "application/json"
    },
    cache: "no-store"
  });

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "Worker returned something that is not JSON."
    );
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      `Worker HTTP ${response.status}`
    );

  }

  return data;
}

async function scan() {

  scanBtn.disabled = true;

  traderBody.innerHTML = `
    <tr>
      <td colspan="6" class="loading">
        Loading traders...
      </td>
    </tr>
  `;

  marketsEl.innerHTML = `
    <div class="empty loading">
      Finding shared active markets...
    </div>
  `;

  traderCount.textContent = "Loading...";
  marketCount.textContent = "Loading...";

  const period = $("period").value;
  const threshold = $("threshold").value;

  try {

    setStatus("Connecting to Polymarket scanner...");

    /*
      Main scan endpoint.

      The Worker should return:

      {
        traders: [...],
        markets: [...]
      }
    */

    const url =
      WORKER +
      "/scan" +
      "?period=" +
      encodeURIComponent(period) +
      "&threshold=" +
      encodeURIComponent(threshold);

    setStatus(
      "Scanning " +
      (period === "week"
        ? "weekly"
        : period === "month"
          ? "monthly"
          : "3-month") +
      " trader performance..."
    );

    const data = await getJSON(url);

    renderTraders(data);
    renderMarkets(data);

    setStatus(
      "Scan complete."
    );

  } catch (error) {

    console.error(error);

    traderBody.innerHTML = `
      <tr>
        <td colspan="6" class="error">
          ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    marketsEl.innerHTML = `
      <div class="empty error">
        ${escapeHtml(error.message)}
      </div>
    `;

    traderCount.textContent = "Error";
    marketCount.textContent = "Error";

    setStatus(
      error.message,
      true
    );

  } finally {

    scanBtn.disabled = false;

  }
}

scanBtn.addEventListener(
  "click",
  scan
);

$("period").addEventListener(
  "change",
  () => {
    if (!$("period").value) return;
  }
);

$("threshold").addEventListener(
  "change",
  () => {
    if (!$("threshold").value) return;
  }
);

</script>

</body>
</html>
