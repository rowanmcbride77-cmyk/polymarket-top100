<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Top 100</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: min(1450px, 96%);
  margin: 0 auto;
  padding: 24px 0 60px;
}

h1 {
  margin: 0 0 18px;
  font-size: 30px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button,
select {
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 14px;
}

button {
  cursor: pointer;
}

button:hover {
  background: #1a1a1a;
}

.status {
  color: #999;
  margin: 10px 0 18px;
  font-size: 14px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1050px;
}

th,
td {
  padding: 12px 10px;
  border-bottom: 1px solid #1b1b1b;
  text-align: left;
  vertical-align: middle;
}

th {
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

tr:hover {
  background: #080808;
}

.rank {
  width: 55px;
  color: #888;
}

.wallet {
  font-family: monospace;
  font-size: 12px;
  color: #aaa;
}

.name {
  font-weight: 700;
}

.record {
  font-weight: 700;
  white-space: nowrap;
}

.win {
  color: #fff;
}

.loss {
  color: #888;
}

.pnl-positive {
  color: #fff;
}

.pnl-negative {
  color: #777;
}

.active-yes {
  font-weight: 700;
}

.active-no {
  color: #555;
}

details {
  max-width: 600px;
}

summary {
  cursor: pointer;
  color: #fff;
  list-style: none;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: " ▼";
  color: #555;
  font-size: 10px;
}

.market-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.market {
  background: #0d0d0d;
  border: 1px solid #222;
  border-radius: 7px;
  padding: 10px;
}

.market-title {
  font-weight: 700;
  margin-bottom: 6px;
  line-height: 1.3;
}

.market-meta {
  color: #999;
  font-size: 12px;
  line-height: 1.5;
}

.side {
  font-weight: 700;
}

.empty {
  color: #555;
  padding: 20px 0;
}

.shared {
  margin-top: 45px;
}

.shared h2 {
  font-size: 20px;
  margin-bottom: 14px;
}

.shared-market {
  border: 1px solid #222;
  background: #080808;
  border-radius: 8px;
  margin-bottom: 10px;
  padding: 13px;
}

.shared-title {
  font-weight: 700;
  margin-bottom: 8px;
}

.shared-traders {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.shared-trader {
  color: #aaa;
  font-size: 13px;
}

.small {
  color: #666;
  font-size: 11px;
}

#loading {
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">

  <h1>Polymarket Top 100</h1>

  <div class="controls">
    <select id="period">
      <option value="WEEK">Week</option>
      <option value="MONTH">Month</option>
      <option value="3MONTHS">3 Months</option>
    </select>

    <button id="scanBtn">Scan Top 100</button>
    <button id="activeBtn">Refresh Active Markets</button>

    <select id="sortMode">
      <option value="record">Best Record</option>
      <option value="winrate">Win %</option>
      <option value="pnl">P/L</option>
    </select>
  </div>

  <div class="status" id="status">Ready.</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Trader</th>
          <th>Record</th>
          <th>Win %</th>
          <th>P/L</th>
          <th>Active</th>
          <th>Active Markets</th>
        </tr>
      </thead>

      <tbody id="traders"></tbody>
    </table>
  </div>

  <div class="shared">
    <h2>Shared Active Markets</h2>
    <div id="sharedMarkets">
      <div class="empty">No shared active markets scanned yet.</div>
    </div>
  </div>

</div>

<script>

const WORKER = "https://polymarket-proxy.rowanmcbride77.workers.dev";
const DIRECT = "https://data-api.polymarket.com";

let traders = [];
let sharedMarkets = new Map();

const periodEl = document.getElementById("period");
const sortModeEl = document.getElementById("sortMode");
const scanBtn = document.getElementById("scanBtn");
const activeBtn = document.getElementById("activeBtn");
const statusEl = document.getElementById("status");
const tradersEl = document.getElementById("traders");
const sharedEl = document.getElementById("sharedMarkets");

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function api(path) {

  const urls = [
    WORKER + path,
    DIRECT + path
  ];

  let lastError = null;

  for (const url of urls) {

    try {

      const r = await fetch(url, {
        cache: "no-store"
      });

      if (!r.ok) {
        lastError = new Error(`${r.status} ${r.statusText}`);
        continue;
      }

      const data = await r.json();
      return data;

    } catch (e) {
      lastError = e;
    }
  }

  throw lastError || new Error("API request failed");
}

function esc(v) {

  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function walletOf(row) {

  return (
    row.proxyWallet ||
    row.proxy_wallet ||
    row.user ||
    row.address ||
    row.wallet ||
    row.userAddress ||
    ""
  );
}

function nameOf(row) {

  return (
    row.userName ||
    row.username ||
    row.name ||
    row.displayName ||
    row.pseudonym ||
    row.profile?.name ||
    row.profile?.username ||
    ""
  );
}

function pnlOf(row) {

  const vals = [
    row.realizedPnl,
    row.realized_pnl,
    row.cashPnl,
    row.cash_pnl,
    row.pnl,
    row.profit
  ];

  for (const v of vals) {
    const n = Number(v);
    if (Number.isFinite(n)) return n;
  }

  return null;
}

function timestampOf(row) {

  const vals = [
    row.timestamp,
    row.ts,
    row.createdAt,
    row.created_at,
    row.updatedAt,
    row.updated_at,
    row.lastEventAt,
    row.last_event_at
  ];

  for (const v of vals) {

    if (v == null) continue;

    if (typeof v === "number") {
      return v > 100000000000 ? v / 1000 : v;
    }

    const n = Number(v);

    if (Number.isFinite(n)) {
      return n > 100000000000 ? n / 1000 : n;
    }

    const d = Date.parse(v);

    if (Number.isFinite(d)) {
      return d / 1000;
    }
  }

  return null;
}

function periodStart(period) {

  const now = Math.floor(Date.now() / 1000);

  if (period === "WEEK") {
    return now - 7 * 86400;
  }

  if (period === "MONTH") {
    return now - 30 * 86400;
  }

  return now - 90 * 86400;
}

function formatMoney(n) {

  if (!Number.isFinite(n)) return "—";

  const abs = Math.abs(n);

  if (abs >= 1000000) {
    return (n < 0 ? "-$" : "$") + (abs / 1000000).toFixed(2) + "M";
  }

  if (abs >= 1000) {
    return (n < 0 ? "-$" : "$") + (abs / 1000).toFixed(1) + "K";
  }

  return (n < 0 ? "-$" : "$") + abs.toFixed(2);
}

function formatDate(ts) {

  if (!ts) return "Unknown";

  const d = new Date(ts * 1000);

  if (Number.isNaN(d.getTime())) {
    return "Unknown";
  }

  return d.toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}


/* ============================================================
   LEADERBOARD CANDIDATES
   ============================================================ */

async function getLeaderboardCandidates() {

  const found = new Map();

  const periods = [
    "WEEK",
    "MONTH",
    "ALL"
  ];

  const orders = [
    "PNL",
    "VOL"
  ];

  for (const tp of periods) {

    for (const order of orders) {

      for (let offset = 0; offset < 1000; offset += 50) {

        const q =
          `/v1/leaderboard` +
          `?timePeriod=${tp}` +
          `&category=OVERALL` +
          `&orderBy=${order}` +
          `&limit=50` +
          `&offset=${offset}`;

        let data;

        try {
          data = await api(q);
        } catch {
          break;
        }

        const rows = Array.isArray(data)
          ? data
          : Array.isArray(data?.data)
            ? data.data
            : [];

        if (!rows.length) break;

        for (const row of rows) {

          const wallet = walletOf(row);

          if (!wallet) continue;

          const key = wallet.toLowerCase();

          if (!found.has(key)) {
            found.set(key, {
              wallet,
              name: nameOf(row),
              leaderboard: row
            });
          }
        }

        if (rows.length < 50) break;
      }
    }
  }

  return [...found.values()];
}


/* ============================================================
   CLOSED / RESOLVED RECORD
   ============================================================ */

async function getClosedPositions(wallet, period) {

  const start = periodStart(period);

  const results = [];

  let offset = 0;

  /*
    TIMESTAMP ordering is critical.

    Previously the endpoint could be traversed by P/L, which means
    a recent losing market could be buried behind older positions.

    We walk newest resolved positions first and stop once we're
    outside the requested period.
  */

  for (let page = 0; page < 100; page++) {

    const q =
      `/v1/closed-positions` +
      `?user=${encodeURIComponent(wallet)}` +
      `&limit=50` +
      `&offset=${offset}` +
      `&sortBy=TIMESTAMP` +
      `&sortDirection=DESC`;

    let data;

    try {
      data = await api(q);
    } catch {
      break;
    }

    const rows = Array.isArray(data)
      ? data
      : Array.isArray(data?.data)
        ? data.data
        : [];

    if (!rows.length) break;

    let oldEnoughToStop = false;

    for (const row of rows) {

      const ts = timestampOf(row);

      if (ts && ts < start) {
        oldEnoughToStop = true;
        continue;
      }

      if (!ts || ts >= start) {
        results.push(row);
      }
    }

    if (oldEnoughToStop) break;

    offset += rows.length;

    if (rows.length < 50) break;
  }

  return results;
}


function calculateRecord(rows) {

  let wins = 0;
  let losses = 0;
  let pnl = 0;

  for (const row of rows) {

    const p = pnlOf(row);

    if (p == null) continue;

    if (p > 0) {
      wins++;
      pnl += p;
    } else if (p < 0) {
      losses++;
      pnl += p;
    }
  }

  const total = wins + losses;

  return {
    wins,
    losses,
    total,
    winRate: total ? wins / total : 0,
    pnl
  };
}


/* ============================================================
   ACTIVE POSITIONS — V2
   ============================================================ */

async function getActivePositions(wallet) {

  const positions = [];

  let cursor = null;

  for (let page = 0; page < 20; page++) {

    let q =
      `/v2/positions` +
      `?user=${encodeURIComponent(wallet)}` +
      `&status=OPEN` +
      `&filterType=TOKENS` +
      `&filterAmount=0` +
      `&limit=1000`;

    if (cursor) {
      q += `&cursor=${encodeURIComponent(cursor)}`;
    }

    let data;

    try {
      data = await api(q);
    } catch {
      break;
    }

    const rows = Array.isArray(data?.data)
      ? data.data
      : [];

    /*
      IMPORTANT:
      v2 OPEN is a superset.

      A settled winner can still physically hold tokens and therefore
      appear in OPEN. We only keep rows whose actual row status is OPEN.
    */

    for (const row of rows) {

      const status = String(row.status || "").toUpperCase();

      const currentSize = Number(
        row.current_size ??
        row.currentSize ??
        row.size ??
        0
      );

      const redeemable = Boolean(row.redeemable);

      if (status !== "OPEN") continue;
      if (redeemable) continue;
      if (!(currentSize > 0)) continue;

      positions.push(row);
    }

    cursor =
      data?.pagination?.next_cursor ||
      data?.pagination?.nextCursor ||
      null;

    if (!cursor) break;
  }

  return positions;
}


/* ============================================================
   ACTIVE MARKET DETAILS
   ============================================================ */

async function getMarketBuyDetails(wallet, position) {

  const condition =
    position.condition_id ||
    position.conditionId ||
    position.market ||
    "";

  if (!condition) {

    return {
      amount: Number(
        position.entry_cost_usdc ??
        position.total_cost_usdc ??
        position.initialValue ??
        0
      ),
      buyTime: timestampOf(position)
    };
  }

  let trades = [];

  try {

    let cursor = null;

    for (let page = 0; page < 5; page++) {

      let q =
        `/v2/trades` +
        `?user=${encodeURIComponent(wallet)}` +
        `&condition=${encodeURIComponent(condition)}` +
        `&limit=500`;

      if (cursor) {
        q += `&cursor=${encodeURIComponent(cursor)}`;
      }

      const data = await api(q);

      const rows = Array.isArray(data?.data)
        ? data.data
        : [];

      trades.push(...rows);

      cursor =
        data?.pagination?.next_cursor ||
        data?.pagination?.nextCursor ||
        null;

      if (!cursor || rows.length === 0) break;
    }

  } catch {

    trades = [];
  }

  let amount = 0;
  let firstBuy = null;

  for (const trade of trades) {

    const side = String(
      trade.side ||
      trade.taker_side ||
      ""
    ).toUpperCase();

    if (side !== "BUY") continue;

    const usdc = Number(
      trade.usdc_size ??
      trade.usdcSize ??
      trade.amount ??
      trade.cost ??
      0
    );

    if (Number.isFinite(usdc) && usdc > 0) {
      amount += usdc;
    }

    const ts = timestampOf(trade);

    if (ts && (!firstBuy || ts < firstBuy)) {
      firstBuy = ts;
    }
  }

  if (!amount) {

    amount = Number(
      position.entry_cost_usdc ??
      position.total_cost_usdc ??
      position.initialValue ??
      0
    );
  }

  if (!firstBuy) {
    firstBuy = timestampOf(position);
  }

  return {
    amount,
    buyTime: firstBuy
  };
}


async function loadActiveForTrader(trader) {

  if (trader.activeLoaded) {
    return trader.activeMarkets || [];
  }

  trader.activeLoaded = true;

  const positions = await getActivePositions(trader.wallet);

  const markets = [];

  /*
    Keep each position separate.

    This makes the UI much easier to understand:
    market name → side → amount → buy time.
  */

  for (const position of positions) {

    const detail = await getMarketBuyDetails(
      trader.wallet,
      position
    );

    markets.push({
      condition:
        position.condition_id ||
        position.conditionId ||
        position.market ||
        "",

      title:
        position.title ||
        position.name ||
        "Unknown market",

      outcome:
        position.outcome ||
        position.outcome_name ||
        "Unknown",

      amount: detail.amount,

      buyTime: detail.buyTime,

      status:
        String(position.status || "").toUpperCase()
    });
  }

  trader.activeMarkets = markets;

  return markets;
}


/* ============================================================
   RENDER
   ============================================================ */

function renderActiveMarkets(trader) {

  const markets = trader.activeMarkets || [];

  if (!markets.length) {
    return `<div class="empty">No active markets.</div>`;
  }

  return `
    <div class="market-list">
      ${markets.map(m => `
        <div class="market">

          <div class="market-title">
            ${esc(m.title)}
          </div>

          <div class="market-meta">
            <span class="side">${esc(m.outcome)}</span>
            ·
            ${formatMoney(m.amount)}
            ·
            Bought ${esc(formatDate(m.buyTime))}
          </div>

        </div>
      `).join("")}
    </div>
  `;
}


function render() {

  const mode = sortModeEl.value;

  traders.sort((a, b) => {

    /*
      PRIMARY:
      Active market first.

      This is the new requested behavior:
      25-0 + active > 50-0 + inactive.
    */

    const aa = a.activeMarkets?.length ? 1 : 0;
    const bb = b.activeMarkets?.length ? 1 : 0;

    if (aa !== bb) {
      return bb - aa;
    }

    /*
      SECONDARY:
      Best actual record.
    */

    if (mode === "winrate") {

      if (b.record.winRate !== a.record.winRate) {
        return b.record.winRate - a.record.winRate;
      }

    } else if (mode === "pnl") {

      if (b.record.pnl !== a.record.pnl) {
        return b.record.pnl - a.record.pnl;
      }

    } else {

      /*
        Record mode:

        First compare win percentage.
        Then wins.
        Then total resolved markets.
        Then P/L.

        This means 50-0 beats 25-0 when both have
        active markets, while the active-market priority
        itself beats record quality.
      */

      if (b.record.winRate !== a.record.winRate) {
        return b.record.winRate - a.record.winRate;
      }
    }

    if (b.record.wins !== a.record.wins) {
      return b.record.wins - a.record.wins;
    }

    if (b.record.total !== a.record.total) {
      return b.record.total - a.record.total;
    }

    return b.record.pnl - a.record.pnl;
  });

  tradersEl.innerHTML = traders.map((t, i) => {

    const active = t.activeMarkets?.length > 0;

    const pnlClass =
      t.record.pnl > 0
        ? "pnl-positive"
        : t.record.pnl < 0
          ? "pnl-negative"
          : "";

    return `
      <tr>

        <td class="rank">${i + 1}</td>

        <td>
          <div class="name">
            ${esc(t.name || "Unknown Trader")}
          </div>

          <div class="wallet">
            ${esc(t.wallet)}
          </div>
        </td>

        <td class="record">
          <span class="win">${t.record.wins}</span>-<span class="loss">${t.record.losses}</span>
        </td>

        <td>
          ${(t.record.winRate * 100).toFixed(1)}%
        </td>

        <td class="${pnlClass}">
          ${formatMoney(t.record.pnl)}
        </td>

        <td class="${active ? "active-yes" : "active-no"}">
          ${active ? "YES" : "NO"}
        </td>

        <td>

          <details>
            <summary>
              ${active
                ? `${t.activeMarkets.length} active market${t.activeMarkets.length === 1 ? "" : "s"}`
                : "None"}
            </summary>

            ${renderActiveMarkets(t)}

          </details>

        </td>

      </tr>
    `;
  }).join("");
}


/* ============================================================
   SHARED ACTIVE MARKETS
   ============================================================ */

function renderSharedMarkets() {

  const groups = new Map();

  for (const trader of traders) {

    for (const market of trader.activeMarkets || []) {

      if (!market.condition) continue;

      const key = market.condition;

      if (!groups.has(key)) {
        groups.set(key, {
          title: market.title,
          traders: []
        });
      }

      groups.get(key).traders.push({
        name: trader.name || "Unknown Trader",
        wallet: trader.wallet,
        outcome: market.outcome,
        amount: market.amount,
        buyTime: market.buyTime
      });
    }
  }

  const shared = [...groups.values()]
    .filter(x => x.traders.length >= 2)
    .sort((a, b) => b.traders.length - a.traders.length);

  if (!shared.length) {

    sharedEl.innerHTML =
      `<div class="empty">No shared active markets found.</div>`;

    return;
  }

  sharedEl.innerHTML = shared.map(m => `

    <div class="shared-market">

      <div class="shared-title">
        ${esc(m.title)}
      </div>

      <div class="shared-traders">

        ${m.traders.map(t => `
          <div class="shared-trader">

            <strong>${esc(t.name)}</strong>
            · ${esc(t.outcome)}
            · ${formatMoney(t.amount)}
            · Bought ${esc(formatDate(t.buyTime))}

            <div class="small">
              ${esc(t.wallet)}
            </div>

          </div>
        `).join("")}

      </div>

    </div>

  `).join("");
}


/* ============================================================
   SCAN
   ============================================================ */

async function scan() {

  scanBtn.disabled = true;
  activeBtn.disabled = true;

  tradersEl.innerHTML = "";
  sharedEl.innerHTML =
    `<div class="empty">Active markets will appear after scanning.</div>`;

  try {

    statusEl.textContent =
      "Finding candidate traders...";

    const candidates =
      await getLeaderboardCandidates();

    statusEl.textContent =
      `Found ${candidates.length} candidate wallets. Calculating records...`;

    /*
      Calculate records concurrently but with a modest batch size
      so the API doesn't get hammered.
    */

    const period = periodEl.value;

    const results = [];

    for (let i = 0; i < candidates.length; i += 15) {

      const batch =
        candidates.slice(i, i + 15);

      const batchResults =
        await Promise.all(
          batch.map(async candidate => {

            const closed =
              await getClosedPositions(
                candidate.wallet,
                period
              );

            const record =
              calculateRecord(closed);

            return {
              ...candidate,
              record,
              activeMarkets: [],
              activeLoaded: false
            };
          })
        );

      results.push(...batchResults);

      statusEl.textContent =
        `Calculating records: ${Math.min(i + 15, candidates.length)} / ${candidates.length}`;

      /*
        Keep the browser responsive and reduce rate-limit pressure.
      */

      await sleep(75);
    }

    traders = results;

    /*
      Do NOT throw away 0-0 traders.

      We need exactly the Top 100 candidates and let the ranking
      determine their placement.
    */

    traders =
      traders
        .sort((a, b) => {

          if (b.record.winRate !== a.record.winRate) {
            return b.record.winRate - a.record.winRate;
          }

          if (b.record.wins !== a.record.wins) {
            return b.record.wins - a.record.wins;
          }

          if (b.record.total !== a.record.total) {
            return b.record.total - a.record.total;
          }

          return b.record.pnl - a.record.pnl;
        })
        .slice(0, 100);

    statusEl.textContent =
      `Loaded ${traders.length} traders. Loading active markets...`;

    /*
      Active-market status is now part of the ranking.

      We have to load it before rendering the final ranking because
      ACTIVE is the primary ranking criterion.
    */

    for (let i = 0; i < traders.length; i += 10) {

      const batch =
        traders.slice(i, i + 10);

      await Promise.all(
        batch.map(t => loadActiveForTrader(t))
      );

      statusEl.textContent =
        `Checking active markets: ${Math.min(i + 10, traders.length)} / ${traders.length}`;

      render();

      await sleep(50);
    }

    render();
    renderSharedMarkets();

    statusEl.textContent =
      `Done — ${traders.length} traders ranked by active market + record.`;

  } catch (e) {

    console.error(e);

    statusEl.textContent =
      "Scan failed. Check the browser console.";

  } finally {

    scanBtn.disabled = false;
    activeBtn.disabled = false;
  }
}


/* ============================================================
   REFRESH ACTIVE MARKETS
   ============================================================ */

async function refreshActiveMarkets() {

  activeBtn.disabled = true;

  try {

    statusEl.textContent =
      "Refreshing active markets...";

    /*
      Clear cached active data so resolved positions that changed
      status since the previous scan are removed.
    */

    for (const trader of traders) {
      trader.activeLoaded = false;
      trader.activeMarkets = [];
    }

    for (let i = 0; i < traders.length; i += 10) {

      const batch =
        traders.slice(i, i + 10);

      await Promise.all(
        batch.map(t => loadActiveForTrader(t))
      );

      render();

      statusEl.textContent =
        `Refreshing active markets: ${Math.min(i + 10, traders.length)} / ${traders.length}`;

      await sleep(50);
    }

    render();
    renderSharedMarkets();

    statusEl.textContent =
      "Active markets refreshed.";

  } catch (e) {

    console.error(e);

    statusEl.textContent =
      "Could not refresh active markets.";

  } finally {

    activeBtn.disabled = false;
  }
}


/* ============================================================
   EVENTS
   ============================================================ */

scanBtn.addEventListener("click", scan);

activeBtn.addEventListener(
  "click",
  refreshActiveMarkets
);

sortModeEl.addEventListener(
  "change",
  render
);

periodEl.addEventListener(
  "change",
  () => {
    traders = [];
    sharedMarkets.clear();
    tradersEl.innerHTML = "";
    sharedEl.innerHTML =
      `<div class="empty">Run a scan for this period.</div>`;
    statusEl.textContent =
      "Period changed. Run a new scan.";
  }
);

</script>

</body>
</html>
