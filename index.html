<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket Trader Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080a0f;
  color:#f5f7fa;
  font-family:Arial,Helvetica,sans-serif;
}

button,select{
  font:inherit;
}

button,select{
  background:#171b24;
  color:#fff;
  border:1px solid #303746;
  border-radius:8px;
  padding:9px 12px;
}

button{
  cursor:pointer;
}

button:hover{
  background:#222833;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.wrap{
  max-width:1500px;
  margin:auto;
  padding:22px;
}

h1{
  margin:0 0 5px;
  font-size:28px;
}

.sub{
  color:#8d96a6;
  margin-bottom:20px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:#11151d;
  border:1px solid #252c38;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}

.stat{
  background:#171b24;
  border-radius:9px;
  padding:12px;
}

.stat b{
  display:block;
  font-size:19px;
}

.stat span{
  font-size:12px;
  color:#8d96a6;
}

.status{
  color:#8d96a6;
  font-size:13px;
  margin:10px 0;
}

.error{
  color:#ff7c7c;
  background:#291416;
  border:1px solid #592327;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  white-space:pre-wrap;
}

.table-wrap{
  overflow:auto;
  border:1px solid #252c38;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1150px;
}

th,td{
  padding:11px 10px;
  border-bottom:1px solid #222834;
  text-align:left;
  vertical-align:top;
}

th{
  background:#151922;
  color:#aeb7c7;
  font-size:12px;
}

tr:hover td{
  background:#151a23;
}

.rank{
  color:#8d96a6;
}

.name{
  font-weight:700;
}

.wallet{
  font-size:10px;
  color:#687284;
  margin-top:3px;
}

.green{color:#5ee18a}
.red{color:#ff7373}
.yellow{color:#f1c75b}
.blue{color:#65a9ff}

.muted{
  color:#7f899a;
}

.loading{
  padding:30px;
  text-align:center;
  color:#8993a4;
}

.details{
  background:#0d1118;
}

.details-inner{
  padding:15px;
}

.position-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:10px;
}

.position{
  border:1px solid #29313d;
  border-radius:9px;
  padding:12px;
  background:#151a22;
}

.position-title{
  font-weight:700;
  margin-bottom:7px;
}

.position-meta{
  color:#8993a4;
  font-size:12px;
  line-height:1.7;
}

.market{
  border:1px solid #29313d;
  background:#141921;
  border-radius:9px;
  padding:12px;
  margin-bottom:10px;
}

.market-title{
  font-weight:800;
}

.market-sub{
  color:#8993a4;
  font-size:12px;
  margin-top:5px;
}

.market-summary{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  display:inline-block;
  background:#202631;
  border-radius:20px;
  padding:4px 9px;
  font-size:12px;
}

.market-traders{
  display:none;
  margin-top:12px;
}

.market-trader{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px;
  background:#0d1118;
  border-radius:7px;
  margin-bottom:5px;
  font-size:13px;
}

.section-title{
  font-weight:800;
  margin-bottom:10px;
}

@media(max-width:700px){
  .wrap{
    padding:12px;
  }

  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>Polymarket Trader Scanner</h1>

<div class="sub">
Consistency-first Polymarket trader research
</div>

<div class="toolbar">

<select id="period">
<option value="WEEK">Week</option>
<option value="MONTH">Month</option>
<option value="THREE_MONTHS">3 Months</option>
</select>

<select id="ranking">
<option value="PNL">Total Profit</option>
<option value="WL">Win/Loss Ratio</option>
<option value="WINPCT">Win Percentage</option>
<option value="ROI">ROI</option>
<option value="VOLUME">Investment Volume</option>
</select>

<select id="marketFilter">
<option value="5">5+ Traders</option>
<option value="3">3+ Traders</option>
<option value="2">2+ Traders</option>
<option value="1">1+ Trader</option>
</select>

<button id="scan">
Scan Top 100
</button>

<button id="markets">
Scan Active Markets
</button>

</div>

<div id="error"></div>

<div class="card">

<div class="stats">

<div class="stat">
<b id="count">0</b>
<span>Traders</span>
</div>

<div class="stat">
<b id="active">0</b>
<span>Active Positions</span>
</div>

<div class="stat">
<b id="marketCount">0</b>
<span>Active Markets</span>
</div>

<div class="stat">
<b id="volume">$0</b>
<span>Leaderboard Volume</span>
</div>

</div>

</div>

<div class="card">

<div class="section-title">
Top Traders
</div>

<div id="status" class="status">
Ready.
</div>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>#</th>
<th>Trader</th>
<th>Leaderboard P&L</th>
<th>Volume</th>
<th>ROI</th>
<th>W/L</th>
<th>Win %</th>
<th>Active</th>
<th></th>
</tr>

</thead>

<tbody id="traders">

<tr>
<td colspan="9" class="loading">
Click Scan Top 100.
</td>
</tr>

</tbody>

</table>

</div>

</div>

<div class="card">

<div class="section-title">
Active Markets
</div>

<div id="marketStatus" class="status">
Scan the traders first.
</div>

<div id="marketList"></div>

</div>

</div>

<script>

/* =========================================================
CONFIG
========================================================= */

const WORKER =
"https://polymarket-proxy.rowanmcbride77.workers.dev";


/* =========================================================
STATE
========================================================= */

const state = {
  traders:[],
  markets:[],
  period:"WEEK"
};


/* =========================================================
HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);

function money(v){
  const n=Number(v);

  if(!Number.isFinite(n))
    return "$0";

  return n.toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:2
    }
  );
}

function num(v){
  const n=Number(v);

  if(!Number.isFinite(n))
    return "0";

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:2
    }
  );
}

function percent(v){
  const n=Number(v);

  if(!Number.isFinite(n))
    return "—";

  return n.toFixed(2)+"%";
}

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shortWallet(w){
  if(!w) return "";

  return w.slice(0,6)+"..."+w.slice(-4);
}

function showError(msg){

  $("error").innerHTML =
    msg
      ? `<div class="error">${escapeHtml(msg)}</div>`
      : "";
}


/* =========================================================
REQUEST
========================================================= */

async function get(path,params={}){

  const url =
    new URL(
      WORKER.replace(/\/+$/,"")+
      path
    );

  for(const [key,value] of
      Object.entries(params)){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      url.searchParams.set(
        key,
        String(value)
      );
    }
  }

  const response =
    await fetch(
      url.toString(),
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        }
      }
    );

  const text =
    await response.text();

  let data;

  try{
    data =
      text
        ? JSON.parse(text)
        : null;
  }catch{
    throw new Error(
      "Worker returned non-JSON data."
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `Worker HTTP ${response.status}`
    );
  }

  return data;
}


/* =========================================================
ARRAY NORMALIZER
========================================================= */

function rows(data){

  if(Array.isArray(data))
    return data;

  if(Array.isArray(data?.data))
    return data.data;

  if(Array.isArray(data?.results))
    return data.results;

  return [];
}


/* =========================================================
LEADERBOARD
========================================================= */

async function getLeaderboard(period){

  const all=[];

  for(
    let offset=0;
    offset<100;
    offset+=50
  ){

    const data =
      await get(
        "/v1/leaderboard",
        {
          category:"OVERALL",
          timePeriod:period,
          orderBy:"PNL",
          limit:50,
          offset
        }
      );

    const page =
      rows(data);

    all.push(...page);

    if(page.length<50)
      break;
  }

  const map =
    new Map();

  for(const r of all){

    const wallet =
      r.proxyWallet ||
      r.proxy_wallet ||
      r.address ||
      r.wallet;

    if(!wallet)
      continue;

    map.set(
      wallet.toLowerCase(),
      {
        ...r,
        wallet,
        name:
          r.userName ||
          r.user_name ||
          r.username ||
          r.name ||
          shortWallet(wallet),

        pnl:Number(
          r.pnl ??
          0
        ),

        volume:Number(
          r.vol ??
          r.volume ??
          0
        )
      }
    );
  }

  return [...map.values()]
    .slice(0,100);
}


/* =========================================================
POSITION DATA
========================================================= */

async function positions(wallet){

  const data =
    await get(
      "/positions",
      {
        user:wallet,
        limit:500,
        sizeThreshold:0
      }
    );

  return rows(data);
}


/* =========================================================
ACTIVE FILTER
========================================================= */

function isActive(p){

  const size =
    Number(
      p.size ??
      p.current_size ??
      p.tokens ??
      0
    );

  if(!Number.isFinite(size))
    return false;

  if(size<=0)
    return false;

  if(p.redeemable===true)
    return false;

  const end =
    p.endDate ??
    p.end_date;

  if(end){

    const t =
      new Date(end).getTime();

    if(
      Number.isFinite(t) &&
      t<=Date.now()
    ){
      return false;
    }
  }

  return true;
}


/* =========================================================
ACTIVE POSITION
========================================================= */

function positionValue(p){

  const size =
    Number(
      p.size ??
      p.current_size ??
      p.tokens ??
      0
    );

  const current =
    Number(
      p.curPrice ??
      p.currentPrice ??
      0
    );

  const average =
    Number(
      p.avgPrice ??
      p.averagePrice ??
      0
    );

  const currentValue =
    Number(
      p.currentValue ??
      size*current
    );

  const initial =
    Number(
      p.initialValue ??
      size*average
    );

  const pnl =
    Number(
      p.cashPnl ??
      p.cash_pnl ??
      currentValue-initial
    );

  return {
    size,
    current,
    average,
    currentValue,
    initial,
    pnl
  };
}


/* =========================================================
TRADER ROW
========================================================= */

function traderRow(t,index){

  const leaderboardPnl =
    Number(t.pnl||0);

  const volume =
    Number(t.volume||0);

  const roi =
    volume
      ? leaderboardPnl/volume*100
      : null;

  return `

<tr>

<td>
${index+1}
</td>

<td>

<div class="name">
${escapeHtml(t.name)}
</div>

<div class="wallet">
${escapeHtml(
  shortWallet(t.wallet)
)}
</div>

</td>

<td class="${
  leaderboardPnl>=0
    ?"green"
    :"red"
}">

${money(leaderboardPnl)}

</td>

<td>
${money(volume)}
</td>

<td>
${percent(roi)}
</td>

<td>
<span class="muted">
Not estimated
</span>
</td>

<td>
<span class="muted">
Not estimated
</span>
</td>

<td>
${t.activeCount ?? 0}
</td>

<td>

<button
onclick="details('${t.wallet}')">
View
</button>

</td>

</tr>

<tr
id="detail-${t.wallet}"
style="display:none"
class="details"
>

<td colspan="9">

<div
class="details-inner"
>
Loading...
</div>

</td>

</tr>

`;
}


/* =========================================================
SCAN
========================================================= */

async function scan(){

  showError("");

  $("scan").disabled=true;

  $("status").textContent =
    "Loading official Polymarket leaderboard...";

  $("traders").innerHTML = `
<tr>
<td colspan="9" class="loading">
Loading...
</td>
</tr>
`;

  try{

    const period =
      $("period").value;

    state.period =
      period;

    const traders =
      await getLeaderboard(
        period
      );

    if(!traders.length){

      throw new Error(
        "The Worker returned zero leaderboard traders."
      );
    }

    state.traders =
      traders;

    $("count").textContent =
      traders.length;

    $("volume").textContent =
      money(
        traders.reduce(
          (sum,t)=>
            sum+
            Number(t.volume||0),
          0
        )
      );

    $("traders").innerHTML =
      traders
        .map(traderRow)
        .join("");

    $("status").textContent =
      `Loaded ${traders.length} official leaderboard traders.`;

  }catch(e){

    showError(e.message);

    $("status").textContent =
      "Scan failed.";

  }finally{

    $("scan").disabled=false;
  }
}


/* =========================================================
TRADER DETAILS
========================================================= */

async function details(wallet){

  const row =
    document.getElementById(
      "detail-"+wallet
    );

  if(!row)
    return;

  if(row.style.display!=="none"){

    row.style.display="none";

    return;
  }

  row.style.display="table-row";

  const inner =
    row.querySelector(
      ".details-inner"
    );

  inner.innerHTML =
    `<div class="loading">
      Loading active positions...
    </div>`;

  try{

    const data =
      await positions(wallet);

    const active =
      data.filter(isActive);

    const trader =
      state.traders.find(
        t =>
          t.wallet.toLowerCase()===
          wallet.toLowerCase()
      );

    if(trader){

      trader.active =
        active;

      trader.activeCount =
        active.length;

      $("active").textContent =
        state.traders.reduce(
          (sum,t)=>
            sum+
            Number(t.activeCount||0),
          0
        );
    }

    if(!active.length){

      inner.innerHTML =
        `<div class="muted">
          No currently active positions.
        </div>`;

      return;
    }

    inner.innerHTML = `

<div class="section-title">
Active positions (${active.length})
</div>

<div class="position-grid">

${active.map(p=>{

  const v =
    positionValue(p);

  return `

<div class="position">

<div class="position-title">
${escapeHtml(
  p.title ||
  p.question ||
  "Unknown market"
)}
</div>

<div class="position-meta">

Outcome:
<b>
${escapeHtml(
  p.outcome ||
  "Unknown"
)}
</b>
<br>

Shares:
<b>
${num(v.size)}
</b>
<br>

Entry:
<b>
${percent(v.average*100)}
</b>
<br>

Current:
<b>
${percent(v.current*100)}
</b>
<br>

Initial:
<b>
${money(v.initial)}
</b>
<br>

Current value:
<b>
${money(v.currentValue)}
</b>
<br>

Unrealized P&L:
<b class="${
  v.pnl>=0
    ?"green"
    :"red"
}">
${money(v.pnl)}
</b>

</div>

</div>

`;

}).join("")}

</div>
`;

  }catch(e){

    inner.innerHTML =
      `<div class="error">
        ${escapeHtml(e.message)}
      </div>`;
  }
}


/* =========================================================
ACTIVE MARKETS
========================================================= */

async function scanMarkets(){

  showError("");

  if(!state.traders.length){

    showError(
      "Scan Top 100 first."
    );

    return;
  }

  $("markets").disabled=true;

  $("marketStatus").textContent =
    "Loading active positions...";

  try{

    const marketMap =
      new Map();

    let totalActive=0;

    for(
      let i=0;
      i<state.traders.length;
      i++
    ){

      const trader =
        state.traders[i];

      try{

        const data =
          await positions(
            trader.wallet
          );

        const active =
          data.filter(
            isActive
          );

        trader.active =
          active;

        trader.activeCount =
          active.length;

        totalActive +=
          active.length;

        for(const p of active){

          const key =
            String(
              p.conditionId ??
              p.condition_id ??
              p.market ??
              p.title ??
              p.question ??
              ""
            );

          if(!key)
            continue;

          if(!marketMap.has(key)){

            marketMap.set(
              key,
              {
                key,
                title:
                  p.title ||
                  p.question ||
                  "Unknown market",
                positions:[]
              }
            );
          }

          marketMap
            .get(key)
            .positions
            .push({
              trader,
              position:p
            });
        }

      }catch(e){

        console.warn(
          "Position error",
          trader.wallet,
          e
        );
      }

      $("marketStatus").textContent =
        `Loading ${i+1} / ${state.traders.length} traders...`;
    }

    state.markets =
      [...marketMap.values()];

    $("active").textContent =
      totalActive;

    $("marketCount").textContent =
      state.markets.length;

    renderMarkets();

    $("marketStatus").textContent =
      `${state.markets.length} active markets found.`;

  }catch(e){

    showError(e.message);

  }finally{

    $("markets").disabled=false;
  }
}


/* =========================================================
MARKET RENDER
========================================================= */

function renderMarkets(){

  const minimum =
    Number(
      $("marketFilter").value
    );

  const markets =
    state.markets
      .filter(
        m =>
          m.positions.length>=minimum
      )
      .sort(
        (a,b)=>
          b.positions.length-
          a.positions.length
      );

  if(!markets.length){

    $("marketList").innerHTML =
      `<div class="muted">
        No markets meet this filter.
      </div>`;

    return;
  }

  $("marketList").innerHTML =
    markets
      .map(
        (m,i)=>
          marketCard(
            m,
            i
          )
      )
      .join("");
}


/* =========================================================
MARKET CARD
========================================================= */

function marketCard(market,index){

  let yes=0;
  let no=0;

  for(
    const item of
    market.positions
  ){

    const outcome =
      String(
        item.position.outcome ||
        ""
      ).toLowerCase();

    if(outcome==="yes")
      yes++;

    if(outcome==="no")
      no++;
  }

  const total =
    yes+no;

  const yesPct =
    total
      ? yes/total*100
      : 0;

  const noPct =
    total
      ? no/total*100
      : 0;

  const id =
    "market-"+index;

  return `

<div class="market">

<div class="market-title">

${escapeHtml(
  market.title
)}

</div>

<div class="market-sub">

${market.positions.length}
tracked traders

</div>

<div class="market-summary">

<span class="badge">
YES ${yes}
(${yesPct.toFixed(1)}%)
</span>

<span class="badge">
NO ${no}
(${noPct.toFixed(1)}%)
</span>

</div>

<br>

<button
onclick="toggleMarket('${id}')">
View traders
</button>

<div
id="${id}"
class="market-traders"
>

${market.positions.map(
  item=>{

    const t =
      item.trader;

    const p =
      item.position;

    const v =
      positionValue(p);

    return `

<div class="market-trader">

<div>

<b>
${escapeHtml(t.name)}
</b>

<div class="wallet">
${escapeHtml(
  shortWallet(t.wallet)
)}
</div>

</div>

<div style="text-align:right">

<b>
${escapeHtml(
  p.outcome ||
  "Unknown"
)}
</b>

<div class="wallet">
${num(v.size)} shares
</div>

</div>

</div>

`;

  }
).join("")}

</div>

</div>

`;
}


/* =========================================================
TOGGLE MARKET
========================================================= */

function toggleMarket(id){

  const el =
    document.getElementById(id);

  if(!el)
    return;

  el.style.display =
    el.style.display==="block"
      ? "none"
      : "block";
}


/* =========================================================
EVENTS
========================================================= */

$("scan")
  .addEventListener(
    "click",
    scan
  );

$("markets")
  .addEventListener(
    "click",
    scanMarkets
  );

$("marketFilter")
  .addEventListener(
    "change",
    renderMarkets
  );


/* =========================================================
STARTUP
========================================================= */

(async function(){

  try{

    const health =
      await get("/health");

    if(health?.ok){

      $("status").textContent =
        "Proxy connected.";
    }

  }catch(e){

    $("status").textContent =
      "Proxy connection failed.";

    console.error(e);
  }

})();

</script>

</body>
</html>
