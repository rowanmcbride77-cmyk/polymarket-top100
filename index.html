html, body {

body {

}

.container {

<script>
const WORKER = "https://polymarket-proxy.rowanmcbride77.workers.dev";
const DATA_API = "https://data-api.polymarket.com";

const MAIN_LIMIT = 100;
const ACTIVE_POOL_LIMIT = 1000;

let leaderboard = [];
let activePool = [];
let activePositions = new Map();

let sharedGroups = {
  2: [],
  5: [],
  10: []
};

let expandedTrader = null;
let expandedMarkets = new Set();

const $ = id => document.getElementById(id);

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function shortWallet(wallet) {
  if (!wallet) return "";
  return wallet.slice(0, 6) + "..." + wallet.slice(-4);
}

function money(value) {
  const n = Number(value || 0);

  if (!Number.isFinite(n)) return "$0";

  return n.toLocaleString(undefined, {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 2
  });
}

function num(value, digits = 2) {
  const n = Number(value || 0);

  if (!Number.isFinite(n)) return "0";

  return n.toLocaleString(undefined, {
    maximumFractionDigits: digits
  });
}

function timestamp(value) {
  if (!value) return null;

  let n = Number(value);

  if (!Number.isFinite(n)) {
    const parsed = Date.parse(value);
    if (!Number.isFinite(parsed)) return null;
    n = Math.floor(parsed / 1000);
  }

  if (n > 100000000000) {
    n = Math.floor(n / 1000);
  }

  return n;
}

function formatTime(value) {
  const t = timestamp(value);

  if (!t) return "Unknown";

  return new Date(t * 1000).toLocaleString([], {
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").className = error
    ? "status error"
    : "status";
}

function setProgress(done, total, text) {
  const pct = total
    ? Math.min(100, (done / total) * 100)
    : 0;

  $("progressWrap").style.display = "block";
  $("progressBar").style.width = pct + "%";
  $("progressText").textContent =
    text || `${done.toLocaleString()} / ${total.toLocaleString()}`;
}

function normalizeLeaderboardRow(row, index) {
  const wallet =
    row.proxyWallet ||
    row.proxy_wallet ||
    row.wallet ||
    row.address;

  if (!wallet) return null;

  return {
    rank: Number(row.rank || index + 1),
    wallet,
    name:
      row.userName ||
      row.username ||
      row.name ||
      shortWallet(wallet),

    pnl: Number(
      row.pnl ??
      row.profit ??
      row.PNL ??
      0
    ),

    volume: Number(
      row.vol ??
      row.volume ??
      0
    ),

    wins: Number(
      row.wins ??
      row.winCount ??
      0
    ),

    losses: Number(
      row.losses ??
      row.lossCount ??
      0
    )
  };
}

/*
  Leaderboard loader.

  We intentionally load 1,000 rows for the active-market pool.
  The main table only displays the first 100.

  Polymarket's v1 leaderboard is paged at 50 rows.
*/
async function getLeaderboard(period) {

  const result = [];
  const seen = new Set();

  const apiPeriod =
    period === "THREEMONTH"
      ? "MONTH"
      : period;

  /*
    Try worker first for endpoints it supports.
    The worker currently may not proxy /v1/leaderboard,
    so direct Data API is the primary fallback.
  */

  for (let offset = 0; offset < ACTIVE_POOL_LIMIT; offset += 50) {

    const url =
      DATA_API +
      "/v1/leaderboard?" +
      new URLSearchParams({
        category: "OVERALL",
        timePeriod: apiPeriod,
        orderBy: "PNL",
        limit: "50",
        offset: String(offset)
      });

    let response;

    try {
      response = await fetch(url, {
        cache: "no-store"
      });
    } catch (err) {
      throw new Error(
        "Could not reach Polymarket leaderboard API."
      );
    }

    if (!response.ok) {
      const body = await response.text();

      throw new Error(
        `Leaderboard HTTP ${response.status}: ${body.slice(0, 300)}`
      );
    }

    const json = await response.json();

    const rows =
      Array.isArray(json)
        ? json
        : (
            json.data ||
            json.results ||
            json.leaderboard ||
            []
          );

    if (!Array.isArray(rows) || !rows.length) {
      break;
    }

    for (const row of rows) {

      const normalized =
        normalizeLeaderboardRow(
          row,
          result.length
        );

      if (!normalized) continue;

      const key =
        normalized.wallet.toLowerCase();

      if (seen.has(key)) continue;

      seen.add(key);
      result.push(normalized);

      if (result.length >= ACTIVE_POOL_LIMIT) {
        break;
      }
    }

    setProgress(
      result.length,
      ACTIVE_POOL_LIMIT,
      `Loading weekly trader pool: ${result.length.toLocaleString()} / ${ACTIVE_POOL_LIMIT.toLocaleString()}`
    );

    if (rows.length < 50) {
      break;
    }

    await sleep(40);
  }

  if (!result.length) {
    throw new Error(
      "No leaderboard data returned."
    );
  }

  return result.slice(0, ACTIVE_POOL_LIMIT);
}

/*
  v2 positions.
  Important:
  OPEN is a superset on Polymarket and can include
  settled-but-unredeemed positions.

  We therefore inspect every returned row and remove
  resolved/redeemable positions ourselves.
*/
async function getOpenPositions(wallet) {

  const all = [];
  let cursor = null;

  for (let page = 0; page < 20; page++) {

    const params = new URLSearchParams({
      user: wallet,
      status: "OPEN",
      limit: "1000",
      sort_by: "TIMESTAMP",
      sort_direction: "DESC"
    });

    if (cursor) {
      params.set("cursor", cursor);
    }

    const url =
      DATA_API +
      "/v2/positions?" +
      params.toString();

    let response;

    try {
      response = await fetch(url, {
        cache: "no-store"
      });
    } catch {
      return all;
    }

    if (!response.ok) {
      return all;
    }

    const json = await response.json();

    const rows =
      Array.isArray(json.data)
        ? json.data
        : Array.isArray(json)
          ? json
          : [];

    all.push(...rows);

    const pagination =
      json.pagination || {};

    cursor =
      pagination.next_cursor ||
      null;

    if (!cursor || !pagination.has_more) {
      break;
    }
  }

  return all.filter(position => {

    const status =
      String(position.status || "")
        .toUpperCase();

    if (
      status === "CLOSED" ||
      status === "RESOLVED" ||
      status === "SETTLED" ||
      status === "REDEEMABLE" ||
      status === "REDEEMABLE_LOST"
    ) {
      return false;
    }

    if (position.redeemable === true) {
      return false;
    }

    const size =
      Number(
        position.current_size ??
        position.size ??
        0
      );

    if (!(size > 0)) {
      return false;
    }

    return true;
  });
}

function normalizePosition(position, trader) {

  const outcome =
    String(
      position.outcome ||
      position.side ||
      ""
    ).toUpperCase();

  const side =
    outcome === "NO"
      ? "NO"
      : outcome === "YES"
        ? "YES"
        : outcome;

  return {
    wallet: trader.wallet,
    traderName: trader.name,

    conditionId:
      position.condition_id ||
      position.conditionId ||
      position.condition ||
      "",

    tokenId:
      position.token_id ||
      position.tokenId ||
      position.asset ||
      "",

    title:
      position.title ||
      position.name ||
      "Unknown market",

    side,

    shares: Number(
      position.current_size ??
      position.size ??
      0
    ),

    value: Number(
      position.current_value ??
      0
    ),

    entryCost: Number(
      position.entry_cost_usdc ??
      position.total_cost_usdc ??
      0
    ),

    avgPrice: Number(
      position.avg_price ??
      0
    ),

    lastEvent:
      position.last_event_at ||
      position.lastEventAt ||
      null,

    status:
      position.status || "",

    redeemable:
      position.redeemable === true,

    buyTime: null
  };
}

/*
  Trade history.

  Used only when the user opens a trader/market or when
  shared-market details need a buy timestamp.
*/
async function getTrades(wallet, condition) {

  if (!wallet || !condition) {
    return [];
  }

  const all = [];
  let cursor = null;

  for (let page = 0; page < 10; page++) {

    const params = new URLSearchParams({
      user: wallet,
      condition: condition,
      limit: "500"
    });

    if (cursor) {
      params.set("cursor", cursor);
    }

    const url =
      DATA_API +
      "/v2/trades?" +
      params.toString();

    let response;

    try {
      response = await fetch(url, {
        cache: "no-store"
      });
    } catch {
      break;
    }

    if (!response.ok) {
      break;
    }

    const json = await response.json();

    const rows =
      Array.isArray(json.data)
        ? json.data
        : Array.isArray(json)
          ? json
          : [];

    all.push(...rows);

    const pagination =
      json.pagination || {};

    cursor =
      pagination.next_cursor ||
      null;

    if (!cursor || !pagination.has_more) {
      break;
    }
  }

  return all;
}

/*
  More accurate opening-time reconstruction.

  We match the position's token/asset whenever the API
  provides one, then simulate the position through time.

  The fallback is last_event_at rather than falsely
  presenting a last-event timestamp as a confirmed buy.
*/
function reconstructBuyTime(trades, position) {

  if (!Array.isArray(trades) || !trades.length) {
    return null;
  }

  let relevant = trades.slice();

  if (position.tokenId) {

    const tokenMatches =
      relevant.filter(t => {

        const asset =
          t.asset ||
          t.token_id ||
          t.tokenId ||
          t.asset_id ||
          "";

        return String(asset) ===
          String(position.tokenId);
      });

    if (tokenMatches.length) {
      relevant = tokenMatches;
    }
  }

  relevant.sort((a, b) => {

    const ta =
      timestamp(
        a.timestamp ??
        a.created_at ??
        a.createdAt ??
        a.time
      ) || 0;

    const tb =
      timestamp(
        b.timestamp ??
        b.created_at ??
        b.createdAt ??
        b.time
      ) || 0;

    return ta - tb;
  });

  let balance = 0;
  let openingTime = null;

  const target =
    Number(position.shares || 0);

  for (const trade of relevant) {

    const side =
      String(
        trade.side ||
        trade.action ||
        ""
      ).toUpperCase();

    const size =
      Number(
        trade.size ??
        trade.shares ??
        trade.amount ??
        0
      );

    if (!(size > 0)) continue;

    const time =
      timestamp(
        trade.timestamp ??
        trade.created_at ??
        trade.createdAt ??
        trade.time
      );

    if (!time) continue;

    if (
      side === "BUY" ||
      side === "BOUGHT"
    ) {

      if (balance <= 0) {
        openingTime = time;
      }

      balance += size;
    }

    else if (
      side === "SELL" ||
      side === "SOLD"
    ) {

      balance -= size;

      if (balance <= 0) {
        balance = 0;
        openingTime = null;
      }
    }
  }

  if (
    balance > 0 &&
    openingTime
  ) {
    return openingTime;
  }

  /*
    If the reconstructed balance doesn't perfectly match
    due to partial fills/API history limits, use the most
    recent BUY that plausibly contributes to the current
    position.
  */

  let running = 0;
  let fallback = null;

  for (let i = relevant.length - 1; i >= 0; i--) {

    const trade = relevant[i];

    const side =
      String(
        trade.side ||
        trade.action ||
        ""
      ).toUpperCase();

    const size =
      Number(
        trade.size ??
        trade.shares ??
        trade.amount ??
        0
      );

    const time =
      timestamp(
        trade.timestamp ??
        trade.created_at ??
        trade.createdAt ??
        trade.time
      );

    if (!(size > 0) || !time) {
      continue;
    }

    if (
      side === "SELL" ||
      side === "SOLD"
    ) {
      running += size;
    }

    if (
      side === "BUY" ||
      side === "BOUGHT"
    ) {

      if (running < target) {
        fallback = time;
        running += size;
      }
    }

    if (running >= target) {
      return fallback;
    }
  }

  return fallback;
}

async function loadBuyTime(position) {

  if (!position.conditionId) {
    return null;
  }

  const trades =
    await getTrades(
      position.wallet,
      position.conditionId
    );

  return reconstructBuyTime(
    trades,
    position
  );
}

async function loadActivePositionsForWallet(trader) {

  try {

    const rows =
      await getOpenPositions(
        trader.wallet
      );

    const positions =
      rows.map(row =>
        normalizePosition(
          row,
          trader
        )
      );

    return positions;

  } catch {
    return [];
  }
}

/*
  Main active-position scan.

  All 1,000 wallets are checked.
  Concurrency is intentionally limited so the API
  doesn't get hammered.
*/
async function buildActivePool() {

  activePositions.clear();

  const total =
    activePool.length;

  let completed = 0;

  const concurrency = 12;

  let cursor = 0;

  async function worker() {

    while (true) {

      const index = cursor++;

      if (index >= total) {
        return;
      }

      const trader =
        activePool[index];

      const positions =
        await loadActivePositionsForWallet(
          trader
        );

      if (positions.length) {

        activePositions.set(
          trader.wallet.toLowerCase(),
          positions
        );
      }

      completed++;

      if (
        completed % 10 === 0 ||
        completed === total
      ) {

        setProgress(
          completed,
          total,
          `Scanning active positions: ${completed.toLocaleString()} / ${total.toLocaleString()} wallets`
        );
      }

      /*
        Small delay helps prevent bursts.
      */
      await sleep(20);
    }
  }

  await Promise.all(
    Array.from(
      { length: concurrency },
      () => worker()
    )
  );
}

/*
  Only use the first 100 in the visible leaderboard.
*/
function renderTraders() {

  const tbody =
    $("traderTable");

  const rows =
    leaderboard.slice(0, MAIN_LIMIT);

  $("leaderboardCount").textContent =
    `${rows.length} traders`;

  if (!rows.length) {

    tbody.innerHTML =
      `<tr><td colspan="5" class="empty">No traders found.</td></tr>`;

    return;
  }

  let html = "";

  rows.forEach((trader, index) => {

    const key =
      trader.wallet.toLowerCase();

    const positions =
      activePositions.get(key) || [];

    const record =
      trader.wins || trader.losses
        ? `${trader.wins}-${trader.losses}`
        : "—";

    const pnlClass =
      trader.pnl >= 0
        ? "pnl-positive"
        : "pnl-negative";

    html += `
      <tr
        class="trader-row"
        data-wallet="${esc(trader.wallet)}"
      >
        <td class="rank">${index + 1}</td>

        <td>
          <div class="name">${esc(trader.name)}</div>
          <div class="wallet">${esc(shortWallet(trader.wallet))}</div>
        </td>

        <td class="record">${esc(record)}</td>

        <td class="${pnlClass}">
          ${money(trader.pnl)}
        </td>

        <td class="active-count">
          ${positions.length}
        </td>
      </tr>

      <tr
        class="detail-row"
        id="detail-${esc(trader.wallet)}"
      >
        <td colspan="5">
          <div class="detail-box">
            <div class="positions">
              ${renderPositionList(positions)}
            </div>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;

  tbody
    .querySelectorAll(".trader-row")
    .forEach(row => {

      row.addEventListener("click", async () => {

        const wallet =
          row.dataset.wallet;

        const detail =
          document.getElementById(
            "detail-" + wallet
          );

        const wasOpen =
          detail.classList.contains("open");

        tbody
          .querySelectorAll(".detail-row.open")
          .forEach(x =>
            x.classList.remove("open")
          );

        if (!wasOpen) {

          detail.classList.add("open");

          await ensureBuyTimesForTrader(
            wallet
          );
        }
      });
    });
}

function renderPositionList(positions) {

  if (!positions.length) {
    return `
      <div class="empty">
        No active positions.
      </div>
    `;
  }

  return positions.map((position, index) => {

    const sideClass =
      position.side === "YES"
        ? "side-yes"
        : "side-no";

    const buyText =
      position.buyTime
        ? formatTime(position.buyTime)
        : position.lastEvent
          ? `Last activity: ${formatTime(position.lastEvent)}`
          : "Buy time unavailable";

    return `
      <div
        class="position"
        data-position-index="${index}"
      >

        <div class="position-title">
          ${esc(position.title)}
        </div>

        <div class="position-meta">

          <span class="${sideClass}">
            ${esc(position.side || "UNKNOWN")}
          </span>

          <span>
            ${num(position.shares)} shares
          </span>

          <span>
            Value ${money(position.value)}
          </span>

          <span>
            Entry ${money(position.entryCost)}
          </span>

          <span>
            ${esc(buyText)}
          </span>

        </div>

      </div>
    `;

  }).join("");
}

async function ensureBuyTimesForTrader(wallet) {

  const key =
    wallet.toLowerCase();

  const positions =
    activePositions.get(key) || [];

  if (!positions.length) {
    return;
  }

  for (
    let i = 0;
    i < positions.length;
    i++
  ) {

    const position =
      positions[i];

    if (
      position.buyTime ||
      !position.conditionId
    ) {
      continue;
    }

    position.buyTime =
      await loadBuyTime(position);

    renderTraders();

    /*
      Re-open the same trader detail after
      the table re-render.
    */
    const detail =
      document.getElementById(
        "detail-" + wallet
      );

    if (detail) {
      detail.classList.add("open");
    }

    await sleep(30);
  }
}

/*
  Shared-market builder.

  IMPORTANT:
  We build separate YES and NO buckets.

  A trader is counted only once inside a given
  side/market bucket.

  Therefore:
    10 YES + 2 NO = YES bucket counts 10
    NOT 12

  And a split market never gets incorrectly treated
  as 10 traders on one side.
*/
function buildSharedMarkets() {

  const yesMarkets = new Map();
  const noMarkets = new Map();

  for (const [walletKey, positions] of activePositions) {

    for (const position of positions) {

      const side =
        String(position.side || "")
          .toUpperCase();

      if (
        side !== "YES" &&
        side !== "NO"
      ) {
        continue;
      }

      const condition =
        position.conditionId ||
        position.title;

      if (!condition) continue;

      const map =
        side === "YES"
          ? yesMarkets
          : noMarkets;

      if (!map.has(condition)) {
        map.set(condition, {
          conditionId: condition,
          title: position.title,
          side,
          traders: new Map()
        });
      }

      const market =
        map.get(condition);

      /*
        One wallet = one participant.
        If somehow multiple position rows exist
        for the same wallet/side/condition, merge
        their value/shares instead of duplicating it.
      */
      if (!market.traders.has(walletKey)) {

        market.traders.set(
          walletKey,
          {
            wallet: position.wallet,
            name: position.traderName,
            side,
            shares: 0,
            value: 0,
            entryCost: 0,
            buyTime: null,
            lastEvent: null,
            positions: []
          }
        );
      }

      const trader =
        market.traders.get(walletKey);

      trader.shares +=
        Number(position.shares || 0);

      trader.value +=
        Number(position.value || 0);

      trader.entryCost +=
        Number(position.entryCost || 0);

      if (position.buyTime) {
        trader.buyTime =
          position.buyTime;
      }

      if (position.lastEvent) {
        trader.lastEvent =
          position.lastEvent;
      }

      trader.positions.push(position);
    }
  }

  const all = [];

  for (const map of [yesMarkets, noMarkets]) {

    for (const market of map.values()) {

      const traders =
        Array.from(
          market.traders.values()
        );

      if (traders.length < 2) {
        continue;
      }

      all.push({
        ...market,
        traders
      });
    }
  }

  /*
    Largest same-side groups first.
  */
  all.sort((a, b) => {

    if (b.traders.length !== a.traders.length) {
      return b.traders.length -
        a.traders.length;
    }

    return a.title.localeCompare(
      b.title
    );
  });

  sharedGroups = {
    2: all.filter(x =>
      x.traders.length >= 2
    ),

    5: all.filter(x =>
      x.traders.length >= 5
    ),

    10: all.filter(x =>
      x.traders.length >= 10
    )
  };

  renderSharedGroups();
}

function marketKey(market) {

  return [
    market.conditionId,
    market.side
  ].join("::");
}

function renderSharedGroups() {

  const root =
    $("sharedGroups");

  const search =
    $("sharedSearch").value
      .trim()
      .toLowerCase();

  const labels = {
    2: "2+ wallets — same side",
    5: "5+ wallets — same side",
    10: "10+ wallets — same side"
  };

  let html = "";

  for (const tier of [2, 5, 10]) {

    let markets =
      sharedGroups[tier] || [];

    if (search) {

      markets =
        markets.filter(m =>
          String(m.title)
            .toLowerCase()
            .includes(search)
        );
    }

    const groupId =
      "shared-body-" + tier;

    html += `
      <div class="shared-group">

        <button
          class="shared-group-header"
          data-group="${tier}"
        >
          <strong>
            ${labels[tier]}
          </strong>

          <span>
            ${markets.length} markets
          </span>
        </button>

        <div
          class="shared-body"
          id="${groupId}"
        >
    `;

    if (!markets.length) {

      html += `
        <div class="empty">
          No matching markets found.
        </div>
      `;

    } else {

      markets.forEach(market => {

        const key =
          marketKey(market);

        const open =
          expandedMarkets.has(key);

        html += `
          <div class="shared-market">

            <button
              class="shared-market-header"
              data-market="${esc(key)}"
            >

              <div class="shared-market-title">

                <div class="shared-market-name">
                  ${esc(market.title)}
                </div>

                <div class="shared-market-sub">

                  <span class="${
                    market.side === "YES"
                      ? "side-yes"
                      : "side-no"
                  }">
                    ${esc(market.side)}
                  </span>

                  &nbsp;•&nbsp;

                  ${market.traders.length}
                  wallets on the same side

                </div>

              </div>

              <div class="shared-market-count">
                ${market.traders.length}+
              </div>

            </button>

            <div
              class="shared-details ${
                open ? "open" : ""
              }"
              data-details="${esc(key)}"
            >
              ${
                open
                  ? renderSharedTraders(market)
                  : ""
              }
            </div>

          </div>
        `;
      });
    }

    html += `
        </div>
      </div>
    `;
  }

  root.innerHTML = html;

  $("sharedCount").textContent =
    `${sharedGroups[2].length} / ${sharedGroups[5].length} / ${sharedGroups[10].length}`;

  root
    .querySelectorAll(".shared-group-header")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.group;

          const body =
            document.getElementById(
              "shared-body-" + id
            );

          body.classList.toggle("open");
        }
      );
    });

  root
    .querySelectorAll(".shared-market-header")
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const key =
            button.dataset.market;

          const details =
            root.querySelector(
              `[data-details="${CSS.escape(key)}"]`
            );

          const wasOpen =
            details.classList.contains("open");

          details.classList.toggle(
            "open",
            !wasOpen
          );

          if (!wasOpen) {

            const market =
              findSharedMarket(key);

            if (market) {

              details.innerHTML =
                renderSharedTraders(
                  market
                );

              await ensureSharedBuyTimes(
                market
              );
            }
          }
        }
      );
    });
}

function findSharedMarket(key) {

  for (const tier of [2, 5, 10]) {

    const found =
      sharedGroups[tier]
        .find(m =>
          marketKey(m) === key
        );

    if (found) {
      return found;
    }
  }

  return null;
}

function renderSharedTraders(market) {

  const traders =
    market.traders || [];

  return traders
    .map((trader, index) => {

      const buy =
        trader.buyTime
          ? formatTime(trader.buyTime)
          : trader.lastEvent
            ? `Last activity: ${formatTime(trader.lastEvent)}`
            : "Loading buy time...";

      return `
        <div class="shared-trader">

          <div>
            <div class="shared-trader-name">
              ${esc(trader.name)}
            </div>

            <div class="shared-trader-wallet">
              ${esc(shortWallet(trader.wallet))}
            </div>
          </div>

          <div class="${
            trader.side === "YES"
              ? "side-yes"
              : "side-no"
          }">
            ${esc(trader.side)}
          </div>

          <div class="shared-value">
            ${money(trader.value)}
          </div>

          <div class="shared-buy">
            ${esc(buy)}
          </div>

        </div>
      `;
    })
    .join("");
}

async function ensureSharedBuyTimes(market) {

  for (
    let i = 0;
    i < market.traders.length;
    i++
  ) {

    const trader =
      market.traders[i];

    if (
      trader.buyTime ||
      !trader.positions.length
    ) {
      continue;
    }

    /*
      There can be multiple position rows, but they
      represent the same wallet in this market.
      Use the first matching position with a token.
    */
    const position =
      trader.positions.find(
        p => p.conditionId
      );

    if (!position) {
      continue;
    }

    const buyTime =
      await loadBuyTime(position);

    trader.buyTime =
      buyTime;

    const key =
      marketKey(market);

    const details =
      document.querySelector(
        `[data-details="${CSS.escape(key)}"]`
      );

    if (details) {
      details.innerHTML =
        renderSharedTraders(market);

      details.classList.add("open");
    }

    await sleep(30);
  }
}

$("sharedSearch")
  .addEventListener(
    "input",
    renderSharedGroups
  );

$("scanBtn")
  .addEventListener(
    "click",
    runScan
  );

$("period")
  .addEventListener(
    "change",
    () => {
      /*
        Don't automatically rescan on every dropdown
        change. User can hit Scan.
      */
    }
  );

async function runScan() {

  const button =
    $("scanBtn");

  button.disabled = true;

  $("progressWrap").style.display =
    "block";

  activePositions.clear();
  sharedGroups = {
    2: [],
    5: [],
    10: []
  };

  expandedMarkets.clear();

  try {

    const period =
      $("period").value;

    setStatus(
      "Loading expanded trader pool..."
    );

    /*
      Load 1,000 traders.
    */
    activePool =
      await getLeaderboard(
        period
      );

    /*
      Main visible leaderboard:
      first 100 from that pool.
    */
    leaderboard =
      activePool.slice(
        0,
        MAIN_LIMIT
      );

    renderTraders();

    setStatus(
      `Loaded ${activePool.length.toLocaleString()} traders. Scanning active markets across the full pool...`
    );

    /*
      This is the key change:
      active positions are now checked across
      all 1,000 traders, not just the visible 100.
    */
    await buildActivePool();

    /*
      Re-render main table with active counts.
    */
    renderTraders();

    setStatus(
      `Building same-side shared markets from ${activePositions.size.toLocaleString()} active wallets...`
    );

    buildSharedMarkets();

    /*
      Automatically open the 2+ section.
    */
    const firstGroup =
      document.getElementById(
        "shared-body-2"
      );

    if (firstGroup) {
      firstGroup.classList.add("open");
    }

    setStatus(
      `Done. Main leaderboard: ${leaderboard.length}. Active-market discovery pool: ${activePool.length}.`
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Scan failed: " +
      (error.message || error),
      true
    );

  } finally {

    button.disabled = false;
    $("progressWrap").style.display =
      "none";
  }
}

/*
  Initial empty state.
*/
renderSharedGroups();

</script>
