<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Polymarket Top Traders</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: min(1450px, 96%);
  margin: 0 auto;
  padding: 28px 0 60px;
}

h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

.subtitle {
  color: #999;
  margin-bottom: 22px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

select,
button {
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 14px;
}

button {
  cursor: pointer;
  background: #fff;
  color: #000;
  border-color: #fff;
  font-weight: 700;
}

button:hover {
  opacity: .85;
}

.status {
  background: #0d0d0d;
  border: 1px solid #222;
  border-radius: 8px;
  padding: 13px;
  margin-bottom: 20px;
  color: #bbb;
}

.section {
  margin-top: 30px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.section-title h2 {
  margin: 0;
  font-size: 21px;
}

.card {
  background: #0b0b0b;
  border: 1px solid #222;
  border-radius: 10px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
  background: #111;
}

th,
td {
  padding: 12px 13px;
  border-bottom: 1px solid #1b1b1b;
}

td {
  font-size: 14px;
}

tr:last-child td {
  border-bottom: none;
}

.rank {
  color: #888;
  width: 55px;
}

.name {
  font-weight: 700;
}

.record {
  font-weight: 700;
}

.ratio {
  font-weight: 700;
}

.good {
  color: #fff;
}

.muted {
  color: #777;
}

.market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
  gap: 12px;
}

.market {
  background: #0b0b0b;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 16px;
}

.market-title {
  font-weight: 700;
  font-size: 16px;
  line-height: 1.3;
  margin-bottom: 10px;
}

.market-meta {
  color: #888;
  font-size: 12px;
  margin-bottom: 13px;
}

.side {
  display: inline-block;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 10px;
}

.holder {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
  border-top: 1px solid #1e1e1e;
  padding: 10px 0;
}

.holder-name {
  font-weight: 700;
}

.holder-detail {
  color: #888;
  font-size: 12px;
}

.holder-record {
  text-align: right;
  font-weight: 700;
}

.empty {
  padding: 35px;
  text-align: center;
  color: #777;
}

.progress {
  height: 4px;
  background: #1a1a1a;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #fff;
  transition: width .15s;
}

@media(max-width:800px) {
  th:nth-child(5),
  td:nth-child(5),
  th:nth-child(6),
  td:nth-child(6) {
    display: none;
  }

  .market-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Polymarket Top Traders</h1>
  <div class="subtitle">
    Ranked by win/loss consistency
  </div>

  <div class="controls">
    <select id="period">
      <option value="WEEK">Week</option>
      <option value="MONTH">Month</option>
      <option value="3MONTHS">3 Months</option>
    </select>

    <select id="threshold">
      <option value="1">1+ trader</option>
      <option value="2">2+ traders</option>
      <option value="5">5+ traders</option>
      <option value="10">10+ traders</option>
    </select>

    <button id="scanBtn">Scan Polymarket</button>
  </div>

  <div class="status" id="status">
    Ready.
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2>Top 100 Traders</h2>
      <span id="topCount" class="muted"></span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Trader</th>
            <th>Record</th>
            <th>W/L Ratio</th>
            <th>P&amp;L</th>
            <th>Volume</th>
          </tr>
        </thead>
        <tbody id="topBody">
          <tr>
            <td colspan="6" class="empty">Run a scan.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2>Shared Active Markets</h2>
      <span id="marketCount" class="muted"></span>
    </div>

    <div id="markets" class="market-grid">
      <div class="card empty">
        Run a scan to find active markets.
      </div>
    </div>
  </div>

</div>

<script>
const WORKER =
  "https://polymarket-proxy.rowanmcbride77.workers.dev";

const TOP_COUNT = 100;
const MARKET_TRADER_COUNT = 1000;

const $ = id => document.getElementById(id);

function setStatus(text, progress = null) {
  $("status").childNodes[0].nodeValue = text + " ";

  if (progress !== null) {
    $("progressBar").style.width =
      Math.max(0, Math.min(100, progress)) + "%";
  }
}

function money(value) {
  const n = Number(value || 0);

  if (!Number.isFinite(n)) return "$0";

  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  }).format(n);
}

function number(value) {
  const n = Number(value || 0);

  if (!Number.isFinite(n)) return "0";

  return new Intl.NumberFormat("en-US", {
    maximumFractionDigits: 2
  }).format(n);
}

function traderName(t) {
  return (
    t.userName ||
    t.username ||
    t.name ||
    t.displayName ||
    "Anonymous Trader"
  );
}

function wallet(t) {
  return (
    t.proxyWallet ||
    t.wallet ||
    t.address ||
    t.user ||
    ""
  );
}

function ratio(wins, losses) {
  if (losses === 0) {
    if (wins > 0) return Infinity;
    return 0;
  }

  return wins / losses;
}

function ratioText(r) {
  if (r === Infinity) return "∞";
  return r.toFixed(2);
}

function getTimestamp(position) {
  return (
    position.first_seen ||
    position.firstSeen ||
    position.created_at ||
    position.createdAt ||
    position.last_event_at ||
    position.lastEventAt ||
    position.timestamp ||
    null
  );
}

function formatDate(value) {
  if (!value) return "Unknown";

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    const n = Number(value);

    if (Number.isFinite(n)) {
      const d2 = new Date(
        n < 100000000000
          ? n * 1000
          : n
      );

      if (!Number.isNaN(d2.getTime())) {
        return d2.toLocaleString();
      }
    }

    return String(value);
  }

  return d.toLocaleString();
}

async function api(path) {
  const response = await fetch(WORKER + path, {
    cache: "no-store"
  });

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "Worker returned invalid JSON: " +
      text.slice(0, 300)
    );
  }

  if (!response.ok || data.ok === false) {
    throw new Error(
      data.error ||
      `Worker request failed (${response.status})`
    );
  }

  return data;
}

async function getLeaderboard(period, offset) {
  return api(
    `/leaderboard?timePeriod=${encodeURIComponent(period)}` +
    `&orderBy=PNL&limit=50&offset=${offset}`
  );
}

async function getPositions(user, status) {
  return api(
    `/positions?user=${encodeURIComponent(user)}` +
    `&status=${encodeURIComponent(status)}` +
    `&limit=1000`
  );
}

async function getOpenPositions(user) {
  return getPositions(user, "OPEN");
}

function addPeriodToRecord(record, positions, type) {
  for (const p of positions) {
    const status = String(p.status || "").toUpperCase();

    const outcome = String(
      p.outcome ||
      p.outcome_name ||
      ""
    ).toUpperCase();

    if (
      type === "WIN" &&
      (
        status.includes("REDEEMABLE") ||
        outcome === "WIN"
      )
    ) {
      record.wins++;
    }

    if (
      type === "LOSS" &&
      (
        status.includes("REDEEMABLE_LOST") ||
        outcome === "LOSS"
      )
    ) {
      record.losses++;
    }
  }
}

async function calculateRecord(user, period) {
  const record = {
    wins: 0,
    losses: 0
  };

  try {
    if (period === "WEEK") {
      const [wins, losses] = await Promise.all([
        getPositions(user, "REDEEMABLE"),
        getPositions(user, "REDEEMABLE_LOST")
      ]);

      addPeriodToRecord(record, wins.rows, "WIN");
      addPeriodToRecord(record, losses.rows, "LOSS");
    }

    else if (period === "MONTH") {
      const [wins, losses] = await Promise.all([
        getPositions(user, "REDEEMABLE"),
        getPositions(user, "REDEEMABLE_LOST")
      ]);

      const cutoff =
        Date.now() - 30 * 24 * 60 * 60 * 1000;

      for (const p of wins.rows) {
        const ts = new Date(
          getTimestamp(p)
        ).getTime();

        if (!Number.isNaN(ts) && ts >= cutoff) {
          record.wins++;
        }
      }

      for (const p of losses.rows) {
        const ts = new Date(
          getTimestamp(p)
        ).getTime();

        if (!Number.isNaN(ts) && ts >= cutoff) {
          record.losses++;
        }
      }
    }

    else {
      const [wins, losses] = await Promise.all([
        getPositions(user, "REDEEMABLE"),
        getPositions(user, "REDEEMABLE_LOST")
      ]);

      const cutoff =
        Date.now() - 90 * 24 * 60 * 60 * 1000;

      for (const p of wins.rows) {
        const ts = new Date(
          getTimestamp(p)
        ).getTime();

        if (!Number.isNaN(ts) && ts >= cutoff) {
          record.wins++;
        }
      }

      for (const p of losses.rows) {
        const ts = new Date(
          getTimestamp(p)
        ).getTime();

        if (!Number.isNaN(ts) && ts >= cutoff) {
          record.losses++;
        }
      }
    }
  } catch {
    // Keep trader in the scan even if one user's data fails.
  }

  record.ratio = ratio(
    record.wins,
    record.losses
  );

  return record;
}

async function mapLimit(items, limit, fn, progressFn) {
  const results = new Array(items.length);
  let next = 0;
  let completed = 0;

  async function worker() {
    while (true) {
      const index = next++;

      if (index >= items.length) {
        return;
      }

      try {
        results[index] = await fn(
          items[index],
          index
        );
      } catch {
        results[index] = null;
      }

      completed++;

      if (progressFn) {
        progressFn(
          completed,
          items.length
        );
      }
    }
  }

  const workers = [];

  for (
    let i = 0;
    i < Math.min(limit, items.length);
    i++
  ) {
    workers.push(worker());
  }

  await Promise.all(workers);

  return results;
}

function sortTraders(traders) {
  return traders.sort((a, b) => {
    if (a.record.ratio === Infinity &&
        b.record.ratio !== Infinity) return -1;

    if (b.record.ratio === Infinity &&
        a.record.ratio !== Infinity) return 1;

    if (b.record.ratio !== a.record.ratio) {
      return b.record.ratio - a.record.ratio;
    }

    if (b.record.wins !== a.record.wins) {
      return b.record.wins - a.record.wins;
    }

    return (
      Number(b.pnl || 0) -
      Number(a.pnl || 0)
    );
  });
}

function renderTop(traders) {
  const body = $("topBody");

  body.innerHTML = "";

  if (!traders.length) {
    body.innerHTML =
      `<tr><td colspan="6" class="empty">
        No traders found.
      </td></tr>`;

    return;
  }

  traders.slice(0, TOP_COUNT).forEach((t, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="rank">#${i + 1}</td>
      <td class="name">${escapeHtml(traderName(t))}</td>
      <td class="record">
        ${t.record.wins}-${t.record.losses}
      </td>
      <td class="ratio">
        ${ratioText(t.record.ratio)}
      </td>
      <td>${money(t.pnl)}</td>
      <td>${money(t.vol)}</td>
    `;

    body.appendChild(tr);
  });

  $("topCount").textContent =
    `${Math.min(TOP_COUNT, traders.length)} traders`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function isActivePosition(p) {
  const size = Number(
    p.current_size ??
    p.size ??
    p.balance ??
    p.quantity ??
    0
  );

  if (size <= 0) return false;

  const end =
    p.endDate ||
    p.end_date ||
    p.end_date_iso ||
    p.endDateIso;

  if (!end) return true;

  const time = new Date(end).getTime();

  return (
    Number.isNaN(time) ||
    time > Date.now()
  );
}

function marketKey(p) {
  return (
    p.conditionId ||
    p.condition_id ||
    p.market ||
    p.asset ||
    p.token_id ||
    p.tokenId ||
    p.title ||
    ""
  );
}

function marketTitle(p) {
  return (
    p.title ||
    p.question ||
    p.marketTitle ||
    p.market_title ||
    "Unknown Market"
  );
}

function marketSide(p) {
  return (
    p.outcome ||
    p.outcome_name ||
    p.side ||
    "Unknown"
  );
}

function positionVolume(p) {
  return Number(
    p.initial_value ??
    p.initialValue ??
    p.totalBought ??
    p.total_bought ??
    p.size ??
    p.current_value ??
    p.currentValue ??
    0
  );
}

async function buildMarkets(traders, threshold) {
  const top1000 = traders.slice(
    0,
    MARKET_TRADER_COUNT
  );

  const holderMap = new Map();

  let completed = 0;

  const positionResults = await mapLimit(
    top1000,
    12,
    async trader => {
      if (!wallet(trader)) return null;

      const data = await getOpenPositions(
        wallet(trader)
      );

      return {
        trader,
        positions: data.rows.filter(isActivePosition)
      };
    },
    done => {
      completed = done;

      setStatus(
        `Loading active positions: ${done}/${top1000.length}`,
        70 + (done / top1000.length) * 25
      );
    }
  );

  for (const result of positionResults) {
    if (!result) continue;

    const trader = result.trader;

    for (const p of result.positions) {
      const key = marketKey(p);

      if (!key) continue;

      if (!holderMap.has(key)) {
        holderMap.set(key, {
          title: marketTitle(p),
          side: marketSide(p),
          holders: []
        });
      }

      const market = holderMap.get(key);

      const side = marketSide(p);

      if (
        market.holders.length === 0
      ) {
        market.side = side;
      }

      market.holders.push({
        trader,
        position: p
      });
    }
  }

  const markets = [];

  for (const market of holderMap.values()) {
    if (market.holders.length < threshold) {
      continue;
    }

    const sides = new Set(
      market.holders.map(
        h => String(marketSide(h.position))
          .toUpperCase()
      )
    );

    /*
     * Only one side is allowed.
     *
     * Example:
     * YES + YES + YES = show
     *
     * YES + YES + NO = hide
     */
    if (sides.size !== 1) {
      continue;
    }

    markets.push(market);
  }

  markets.sort(
    (a, b) =>
      b.holders.length -
      a.holders.length
  );

  return markets;
}

function renderMarkets(markets) {
  const container = $("markets");

  container.innerHTML = "";

  if (!markets.length) {
    container.innerHTML =
      `<div class="card empty">
        No matching same-side active markets found.
      </div>`;

    $("marketCount").textContent = "0 markets";

    return;
  }

  $("marketCount").textContent =
    `${markets.length} markets`;

  for (const market of markets) {
    const div = document.createElement("div");

    div.className = "market";

    const holderHtml =
      market.holders
        .sort((a, b) =>
          Number(
            b.position.current_value ||
            b.position.currentValue ||
            0
          ) -
          Number(
            a.position.current_value ||
            a.position.currentValue ||
            0
          )
        )
        .map(h => {
          const t = h.trader;
          const p = h.position;

          const volume =
            positionVolume(p);

          const bought =
            getTimestamp(p);

          return `
            <div class="holder">
              <div>
                <div class="holder-name">
                  ${escapeHtml(traderName(t))}
                </div>

                <div class="holder-detail">
                  Bought: ${escapeHtml(
                    formatDate(bought)
                  )}
                </div>

                <div class="holder-detail">
                  Volume: ${escapeHtml(
                    money(volume)
                  )}
                </div>
              </div>

              <div class="holder-record">
                ${t.record.wins}-${t.record.losses}
              </div>
            </div>
          `;
        })
        .join("");

    div.innerHTML = `
      <div class="market-title">
        ${escapeHtml(market.title)}
      </div>

      <div class="side">
        ${escapeHtml(market.side)}
      </div>

      <div class="market-meta">
        ${market.holders.length} top-1000 trader(s)
        on the same side
      </div>

      ${holderHtml}
    `;

    container.appendChild(div);
  }
}

async function scan() {
  const period =
    $("period").value;

  const threshold =
    Number($("threshold").value);

  $("scanBtn").disabled = true;

  try {
    setStatus(
      "Loading Polymarket leaderboard...",
      2
    );

    /*
     * 20 requests × 50 = up to 1,000 candidates.
     */
    const pages = [];

    for (let offset = 0; offset < 1000; offset += 50) {
      pages.push(offset);
    }

    const pageResults =
      await mapLimit(
        pages,
        5,
        async offset => {
          return getLeaderboard(
            period === "3MONTHS"
              ? "MONTH"
              : period,
            offset
          );
        },
        (done, total) => {
          setStatus(
            `Loading leaderboard: ${done}/${total}`,
            5 + (done / total) * 10
          );
        }
      );

    let candidates = [];

    for (const page of pageResults) {
      if (!page?.rows) continue;

      candidates.push(...page.rows);
    }

    /*
     * Remove duplicate wallets.
     */
    const unique = new Map();

    for (const t of candidates) {
      const w = wallet(t);

      if (!w) continue;

      if (!unique.has(w)) {
        unique.set(w, t);
      }
    }

    candidates = [...unique.values()]
      .slice(0, MARKET_TRADER_COUNT);

    if (!candidates.length) {
      throw new Error(
        "Polymarket returned no leaderboard traders."
      );
    }

    setStatus(
      `Calculating win/loss records for ${candidates.length} traders...`,
      16
    );

    /*
     * Calculate W/L concurrently.
     *
     * 12 workers prevents the browser from
     * firing hundreds of requests at once.
     */
    const traders =
      await mapLimit(
        candidates,
        12,
        async trader => {
          const record =
            await calculateRecord(
              wallet(trader),
              period
            );

          return {
            ...trader,
            record
          };
        },
        (done, total) => {
          setStatus(
            `Calculating records: ${done}/${total}`,
            15 + (done / total) * 50
          );
        }
      );

    const validTraders =
      traders.filter(Boolean);

    sortTraders(validTraders);

    /*
     * Top 100
     */
    renderTop(validTraders);

    setStatus(
      "Finding shared active markets...",
      68
    );

    const markets =
      await buildMarkets(
        validTraders,
        threshold
      );

    renderMarkets(markets);

    setStatus(
      `Complete — ${validTraders.length} traders scanned, ${markets.length} matching markets found.`,
      100
    );

  } catch (error) {
    console.error(error);

    setStatus(
      "Scan failed: " +
      (error.message || String(error)),
      0
    );
  } finally {
    $("scanBtn").disabled = false;
  }
}

$("scanBtn").addEventListener(
  "click",
  scan
);

/*
 * Verify the Worker before doing a large scan.
 */
(async function startup() {
  try {
    const result =
      await api("/health");

    if (result.ok) {
      setStatus(
        "Worker connected. Ready to scan.",
        0
      );
    }
  } catch (error) {
    setStatus(
      "Worker connection failed: " +
      error.message,
      0
    );
  }
})();
</script>

</body>
</html>
